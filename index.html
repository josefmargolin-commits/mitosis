  world.classList.add("slide"); world.classList.add("moving");
  world.style.transform = to==="wiz" ? "translateY(0%)" : "translateY(-50%)";
  document.documentElement.style.setProperty("--chrome-b",
    to==="wiz" ? (document.getElementById("wizChrome").offsetHeight+"px") : "var(--dock-h)");
  lastChromeH=0;
  if(to==="wiz"){ layoutWizards(); syncWizGrid(); syncWizPanel(true); }
  Sn.budget=22;
  const up=to==="wiz";
  for(let i=0;i<4;i++)
    pop(up?(196*Math.pow(2,i/3)):(392/Math.pow(2,i/4)),{vol:.05,wet:.3,delay:i*.04});
  noiseHit(.5,{vol:.07,cut:up?1100:2600,to:up?3.4:.25,wet:.28});
  haptic(12);
}

/* ---------------------------------------------------------------- sim */
function clampIn(b){
  if(b.r*2>=W) b.x=W/2;
  else b.x=clamp(b.x,b.r,W-b.r);
  b.y=clamp(b.y,AR.y0+b.r,Math.max(AR.y0+b.r,AR.y1-b.r));
}
function areaSum(){ let a=0; for(const b of balls) a+=b.r*b.r*Math.PI; return a; }
function dockFull(){
  const v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dock-h"));
  return isFinite(v)&&v>0?v:152;
}
function arenaArea(){
  const floor=Math.min(AR.y1, H-dockFull());   // the shelf-open floor
  return W*Math.max(1, floor-AR.y0);
}
/* The dish is full at just under half covered. BALL_LIMIT is not a rule, it
   is a frame-rate guard: measured here, 200 balls cost 4.7ms a frame, 500
   cost 10 and 800 cost 16, which is the whole budget. A phone has perhaps a
   third of the speed, so it stops well short. */
const BALL_SOFT=300;
const ballCeil=()=>app.classList.contains("lowfx")?260:BALL_SOFT;
const DISH_MAX=0.80;
/* each icon costs its own rectangle plus a working margin, because the strip
   right beside one is ground no ball of any size can settle in */
let blockedA=0, blockedFor=-1;
function blockedArea(){
  if(blockedFor===OBS.length && blockedA) return blockedA;
  let a=0;
  for(const o of OBS) a+=(o.w+20)*(o.h+20);
  blockedFor=OBS.length;
  return blockedA=Math.min(a, arenaArea()*0.34);
}
const usableArea=()=>Math.max(1, arenaArea()-blockedArea());
const dishFill=()=>Math.max(areaSum()/(usableArea()*DISH_MAX), balls.length/ballCeil());
/* room for one more of this size, not merely room for one more */
const roomFor=r=>balls.length<ballCeil() &&
  areaSum()+Math.PI*r*r <= usableArea()*DISH_MAX;
const dishFull=()=>dishFill()>=1;

/* ---- the chrome is solid ------------------------------------------------
   Balls used to drift in behind the rails and sit there, out of reach and out
   of sight. Every button on top of the dish is measured once into arena
   coordinates and treated as something to bounce off. Measured on layout, not
   per frame — reading a rect per ball per frame is what would actually cost. */
let OBS=[], obsDirty=true;
function obsChanged(){ obsDirty=true; }
function measureObstacles(){
  obsDirty=false; blockedA=0; blockedFor=-1;
  OBS.length=0;
  const a=roomArena.getBoundingClientRect();
  if(!a.width) return;
  // anything the player can press is something a ball must not hide behind,
  // so both rails are measured whole rather than by a list of class names
  for(const e2 of document.querySelectorAll(
      "#railL > .orb, #railL > .pw, #railR > .pw, #railR > .prof")){
    const r=e2.getBoundingClientRect();
    if(!r.width||!r.height) continue;
    OBS.push({x:r.left-a.left, y:r.top-a.top, w:r.width, h:r.height});
  }
}
function bounceChrome(b){
  for(let i=0;i<OBS.length;i++){
    const o=OBS[i];
    // cheap reject before the maths
    if(b.x+b.r<o.x||b.x-b.r>o.x+o.w||b.y+b.r<o.y||b.y-b.r>o.y+o.h) continue;
    const cx=clamp(b.x,o.x,o.x+o.w), cy=clamp(b.y,o.y,o.y+o.h);
    const dx=b.x-cx, dy=b.y-cy, d=Math.hypot(dx,dy);
    if(d>b.r) continue;
    if(d<0.001){
      // centre already inside: leave by the nearest edge
      const L=b.x-o.x, R=o.x+o.w-b.x, T=b.y-o.y, B=o.y+o.h-b.y;
      const m=Math.min(L,R,T,B);
      if(m===L){ b.x=o.x-b.r; b.vx=-Math.abs(b.vx)*.9; }
      else if(m===R){ b.x=o.x+o.w+b.r; b.vx=Math.abs(b.vx)*.9; }
      else if(m===T){ b.y=o.y-b.r; b.vy=-Math.abs(b.vy)*.9; }
      else { b.y=o.y+o.h+b.r; b.vy=Math.abs(b.vy)*.9; }
    } else {
      const nx=dx/d, ny=dy/d;
      b.x=cx+nx*b.r; b.y=cy+ny*b.r;
      const vn=b.vx*nx+b.vy*ny;
      if(vn<0){ b.vx-=2*vn*nx*.9; b.vy-=2*vn*ny*.9; }
    }
    // The rails are pressed against the walls, so beside an icon there is a
    // strip only a few pixels wide. A ball wider than that strip was pushed
    // out sideways and then clamped straight back in by the wall, and it sat
    // there. If the resolution leaves it outside the dish it goes round the
    // icon on the inward side instead, which is the only side with room.
    if(b.x<b.r-.01||b.x>W-b.r+.01){
      const inward=(o.x+o.w*.5)<W*.5 ? 1 : -1;
      b.x = inward>0 ? o.x+o.w+b.r : o.x-b.r;
      b.vx = Math.abs(b.vx)*inward*.9;
    }
    if(b.y<AR.y0+b.r-.01){ b.y=o.y+o.h+b.r; b.vy=Math.abs(b.vy)*.9; }
    else if(b.y>AR.y1-b.r+.01){ b.y=o.y-b.r; b.vy=-Math.abs(b.vy)*.9; }
    b.wob=Math.max(b.wob,.12);
  }
}
function step(dt){
  el+=dt;
  VENT.t-=dt;
  if(VENT.t<=0){ VENT.t = ventBall() ? rnd(9,11) : rnd(3,5); VENT.max=VENT.t; } G.stat.play+=dt;
  if(obsDirty) measureObstacles();
  if(zoomPhase){ stepZoom(dt); return; }

  for(const p of POWERS){ const s=pwState(p); if(s.cd>0) s.cd=Math.max(0,s.cd-dt); }
  for(const b of BOOSTS){ const s=G.boost[b.id]; if(s&&s.cd>0) s.cd=Math.max(0,s.cd-dt); }
  if(timers.chain>0) timers.chain-=dt;
  if(timers.storm>0){
    timers.storm-=dt; timers.stormT-=dt;
    if(timers.stormT<=0&&balls.length){
      timers.stormT=1/9;
      fuses.push({b:balls[(Math.random()*balls.length)|0],t:0,d:999});
    }
  }

  for(let i=fuses.length-1;i>=0;i--){
    const f=fuses[i]; f.t-=dt;
    if(f.t<=0){ fuses.splice(i,1); if(!f.b.gone) strike(f.b,f.d,null,true); }
  }

  stepWizards(dt);

  // the black hole drifts, drags, and swallows on contact
  bhStep(dt);

  // motion
  const mag=val("magnet")*S;
  for(const b of balls){
    if(ptrDown&&mag>0){
      const dx=ptrX-b.x, dy=ptrY-b.y, d=Math.hypot(dx,dy);
      if(d<mag&&d>1){ const f=(1-d/mag)*260*dt; b.vx+=dx/d*f; b.vy+=dy/d*f; }
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    const k=Math.pow(.42,dt); b.vx*=k; b.vy*=k;
    const t=TIER[b.tier].spd*S*curScale().spd, sp=Math.hypot(b.vx,b.vy);
    if(sp<t*.5){
      const a=sp<1?rnd(0,TAU):Math.atan2(b.vy,b.vx);
      b.vx+=Math.cos(a)*t*dt*1.6; b.vy+=Math.sin(a)*t*dt*1.6;
    }
    if(b.x<b.r){ b.x=b.r; b.vx=Math.abs(b.vx)*.92; b.wob=Math.max(b.wob,.1); }
    if(b.x>W-b.r){ b.x=W-b.r; b.vx=-Math.abs(b.vx)*.92; b.wob=Math.max(b.wob,.1); }
    if(b.y<AR.y0+b.r){ b.y=AR.y0+b.r; b.vy=Math.abs(b.vy)*.92; b.wob=Math.max(b.wob,.1); }
    bounceChrome(b);
    if(b.y>AR.y1-b.r){
      // a rising floor should nudge, not fling — only bounce a ball that was
      // actually travelling into it
      const into=b.vy>0;
      b.y=AR.y1-b.r;
      if(into){ b.vy=-Math.abs(b.vy)*.92; b.wob=Math.max(b.wob,.1); }
      else b.vy=Math.min(b.vy,0);
    }
    b.wob=.019+(b.wob-.019)*Math.pow(.02,dt);
    b.sq*=Math.pow(.0009,dt); b.hit*=Math.pow(.004,dt);
    b.wp+=dt*b.ws*(1+b.wob*10); b.pulse+=dt*3.2;
  }

  // one pass for both jobs: same-colour balls reach for each other and fuse,
  // everything else just bumps
  const seek=190*S, seek2=seek*seek;   // fixed: this was the Seek card
  TCOUNT.fill(0);
  for(const b of balls) if(b.kind==="plain") TCOUNT[b.tier]++;
  const dense=dishFill()>.55;
  // sweep and prune on x: with a dish full of small balls the old all-pairs
  // loop was the frame budget. sorted order also means we can stop early.
  balls.sort((p,q)=>(p.x-p.r)-(q.x-q.r));
  for(let i=0;i<balls.length;i++){
    const a=balls[i];
    const reach=a.x+a.r+seek;
    for(let j=i+1;j<balls.length;j++){
      const b=balls[j];
      if(b.x-b.r>reach) break;
      const dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy, rr=a.r+b.r;
      const same=canFuse(a,b);

      if(same && d2<seek2 && d2>1){
        const d=Math.sqrt(d2), f=(1-d/seek)*(46+16*Math.max(0,a.tier-3))*dt;
        a.vx+=dx/d*f; a.vy+=dy/d*f;
        b.vx-=dx/d*f; b.vy-=dy/d*f;
      }
      if(d2>=rr*rr||d2===0) continue;
      const d=Math.sqrt(d2), nx=dx/d, ny=dy/d, ov=rr-d;

      if(same && (!a.mate||a.mate===b) && (!b.mate||b.mate===a)
         && (a.mate===b || (TCOUNT[a.tier]>=fuseCost(a,b) && fuseCrew(a,b)))){
        // locked together — let them sink into one another instead of bouncing
        a.mate=b; b.mate=a;
        const pull=(120+26*Math.max(0,a.tier-3))*dt;
        a.vx+=nx*pull; a.vy+=ny*pull;
        b.vx-=nx*pull; b.vy-=ny*pull;
        // bleed the relative velocity so the pair drifts as one; without this
        // a fast small pair separates past the tolerance before it can fuse
        const dm=(1-Math.pow(a.tier>=4?4e-6:0.02,dt))*.5;
        const rvx=(b.vx-a.vx)*dm, rvy=(b.vy-a.vy)*dm;
        a.vx+=rvx; a.vy+=rvy; b.vx-=rvx; b.vy-=rvy;
        a.wob=Math.max(a.wob,.05); b.wob=Math.max(b.wob,.05);
        continue;
      }

      const ma=a.r*a.r, mb=b.r*b.r, mt=ma+mb;
      a.x-=nx*ov*(mb/mt); a.y-=ny*ov*(mb/mt);
      b.x+=nx*ov*(ma/mt); b.y+=ny*ov*(ma/mt);
      const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(vn<0){
        const imp=-1.7*vn/mt;
        a.vx-=imp*mb*nx; a.vy-=imp*mb*ny;
        b.vx+=imp*ma*nx; b.vy+=imp*ma*ny;
        const j2=Math.min(Math.abs(vn)/500,.09);
        a.wob=Math.max(a.wob,j2); b.wob=Math.max(b.wob,j2);
      }
    }
  }

  // the dish is squeezed, so settle it again and then put the walls back
  if(dense){
    for(let i=0;i<balls.length;i++){
      const a=balls[i], reach=a.x+a.r;
      for(let j=i+1;j<balls.length;j++){
        const b=balls[j];
        if(b.x-b.r>reach) break;
        const dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy, rr=a.r+b.r;
        if(d2>=rr*rr||d2===0) continue;
        if(a.mate===b) continue;                 // a locked pair wants to sink
        const d=Math.sqrt(d2), ov=(rr-d)*.5;     // half, so the pass is gentle
        const nx=dx/d, ny=dy/d, ma=a.r*a.r, mb=b.r*b.r, mt=ma+mb;
        a.x-=nx*ov*(mb/mt); a.y-=ny*ov*(mb/mt);
        b.x+=nx*ov*(ma/mt); b.y+=ny*ov*(ma/mt);
      }
    }
  }
  for(const b of balls){ bounceChrome(b); clampIn(b); }

  // resolve the locks: hold contact long enough and they become one
  const locks=balls.slice();
  for(let i=locks.length-1;i>=0;i--){
    const a=locks[i];
    if(!a||a.gone) continue;
    const b=a.mate;
    if(!b) continue;
    if(b.gone||b.mate!==a){ unmate(a); continue; }
    const gap=Math.hypot(b.x-a.x,b.y-a.y)-(a.r+b.r);
    if(gap>Math.max(Math.min(a.r,b.r)*0.34, 9*S)){ unmate(a); continue; }
    if(a.id>b.id) continue;             // only one of the pair drives the clock
    a.fuseT+=dt; b.fuseT=a.fuseT;
    if(a.fuseT>=fuseTime(a.tier)*1.2){
      const crew=fuseCrew(a,b);
      if(crew) fuse(crew);
      else a.fuseT=fuseTime(a.tier);      // hold at the line until two more come
    }
  }

  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=dt;
    if(p.t>=p.life){ parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    const k=Math.pow(p.drag,dt*60); p.vx*=k; p.vy*=k;
    if(!p.goo) p.vy+=320*S*dt;
  }
  for(let i=rings.length-1;i>=0;i--){ const r=rings[i]; r.t+=dt; if(r.t>=r.life) rings.splice(i,1); }
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i]; p.t+=dt;   // the rise is computed from t at draw time
    if(p.t>=p.life) pops.splice(i,1);
  }
  for(let i=trail.length-1;i>=0;i--){ trail[i].t+=dt; if(trail[i].t>.34) trail.splice(i,1); }

  if(comboT>0){ comboT-=dt; if(comboT<=0){ combo=0; document.getElementById("combo").classList.remove("on"); } }
  if(luckUntil && luckUntil<=el){ luckUntil=0; setFrenzy(false); toast("Frenzy over"); }
  if(luckUntil){
    const t=$("fzTag");
    if(t){ const left=Math.ceil(luckUntil-el);
      if(t.dataset.s!==String(left)){ t.dataset.s=String(left);
        t.querySelector(".s").textContent=left+"s"; } }
  }
  shake*=Math.pow(.02,dt); flash*=Math.pow(.004,dt);
}

/* ------------------------------------------------------------ celebration
   Claiming something should feel like being paid. Reward spills out of the
   button, arcs, then a handful of it flies up and lands in the counter,
   which pops when each piece arrives.                                     */
let cele=[], pipPop=0;
const CONF=["#3DDC84","#22C55E","#16A34A","#5BE59B","#12924A"];
function rrect(x,l,t,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  x.beginPath();
  x.moveTo(l+r,t); x.lineTo(l+w-r,t); x.quadraticCurveTo(l+w,t,l+w,t+r);
  x.lineTo(l+w,t+h-r); x.quadraticCurveTo(l+w,t+h,l+w-r,t+h);
  x.lineTo(l+r,t+h); x.quadraticCurveTo(l,t+h,l,t+h-r);
  x.lineTo(l,t+r); x.quadraticCurveTo(l,t,l+r,t);
  x.closePath();
}
function appPt(el){
  const a=app.getBoundingClientRect(), r=el.getBoundingClientRect();
  return {x:r.left-a.left+r.width/2, y:r.top-a.top+r.height/2};
}
/* the green chip the reference pops over the row you just claimed */
function rewardPill(srcEl,txt){
  const p=document.getElementById("rwPill"); if(!p) return;
  const r=srcEl.getBoundingClientRect(), a=app.getBoundingClientRect();
  p.innerHTML=txt;      // the reward carries its currency mark, so this is markup
  p.style.left=(r.left-a.left+r.width/2)+"px";
  p.style.top=(r.top-a.top+r.height/2)+"px";
  p.animate([
    {opacity:0,transform:"translate(-50%,-50%) scale(.42)"},
    {opacity:1,transform:"translate(-50%,-58%) scale(1.18)",offset:.26},
    {opacity:1,transform:"translate(-50%,-62%) scale(1)",offset:.66},
    {opacity:0,transform:"translate(-50%,-108%) scale(.98)"}
  ],{duration:1600,easing:"cubic-bezier(.2,.9,.3,1)"});
}
const MANA_COL=["#8FD3FF","#5AA8FF","#2F6BFF","#B6E4FF","#1F4FD8"];
function celebrate(src,n,col,homeEl,asMana){
  const p=appPt(src);
  // paying into the mana counter means the reward is mana
  const mana = asMana!==undefined ? !!asMana
             : !!(homeEl && homeEl.closest && homeEl.closest("#sporeWrap"));
  const PAL2 = mana?MANA_COL:CONF;
  const home=homeEl?appPt(homeEl):null;
  // coins: discs spun edge-on, which is what makes a flat circle read as money
  const notes=Math.max(8,Math.round(n*(mana?.85:.42)));
  for(let i=0;i<notes;i++){
    // a wide flat spray, not a fountain — the reference keeps it near the row
    const a=-Math.PI/2+rnd(-1.35,1.35), sp=rnd(170,470);
    const d=rnd(9,13.5);
    cele.push({
      kind:mana?"orb":"cash",
      x:p.x+rnd(-10,10), y:p.y+rnd(-4,4),
      vx:Math.cos(a)*sp*(mana?2.1:1.5), vy:Math.sin(a)*sp*(mana?1.35:1),
      w:mana?d*.78:d, h:mana?d*.78:d*.6,
      t:0, life:rnd(.62,1.0),
      col:PAL2[(Math.random()*PAL2.length)|0],
      ang:rnd(0,TAU), spin:rnd(-7,7),
      flip:rnd(0,TAU), flipV:rnd(9,17),
      drag:rnd(.90,.95),
    });
  }
  // the reward itself: sparkles that arc, then fly home to the counter
  const homers=(home&&!mana)?Math.min(9,Math.max(4,Math.round(n*.3))):0;
  for(let i=0;i<homers;i++){
    const a=-Math.PI/2+rnd(-.7,.7), sp=rnd(300,560);
    cele.push({
      kind:"spark",
      x:p.x, y:p.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      r:rnd(7,10), t:0, life:2.4,
      col:col||(mana?"#2F6BFF":"#22C55E"),
      ang:rnd(0,TAU), spin:rnd(-4,4),
      home, hop:0, wait:.16+i*.055, trail:[],
    });
  }
  rings.push({x:p.x,y:p.y,r:6,R:62,t:0,life:.34,col:col||(mana?"#2F6BFF":"#22C55E"),w:2.2});
}
function stepCele(dt){
  for(let i=cele.length-1;i>=0;i--){
    const c=cele[i];
    c.t+=dt; c.ang+=c.spin*dt;
    if(c.t>=c.life){ cele.splice(i,1); continue; }
    if(c.kind==="orb"){
      c.x+=c.vx*dt; c.y+=c.vy*dt;
      c.vy+=1100*dt;
      const k=Math.pow(c.drag,dt*60); c.vx*=k; c.vy*=k;
      continue;
    }
    if(c.kind==="cash"){
      c.flip+=c.flipV*dt;
      c.x+=c.vx*dt; c.y+=c.vy*dt;
      c.vy+=900*dt;                       // paper falls slower than metal
      const k=Math.pow(c.drag,dt*60); c.vx*=k; c.vy*=k;
      c.vx+=Math.sin(c.t*5.4+c.flip)*52*dt;   // and it sways on the way
      continue;
    }
    // spark
    if(c.home&&c.t>c.wait){
      c.hop=Math.min(1,c.hop+dt*1.5);
      const k=easeOut(c.hop)*.30;
      c.x+=(c.home.x-c.x)*k; c.y+=(c.home.y-c.y)*k;
      c.trail.push({x:c.x,y:c.y}); if(c.trail.length>7) c.trail.shift();
      if(Math.hypot(c.home.x-c.x,c.home.y-c.y)<10){
        cele.splice(i,1); pipPop=1;
        tick(720+Math.random()*260,.075);
        continue;
      }
    } else {
      c.x+=c.vx*dt; c.y+=c.vy*dt; c.vy+=900*dt;
      const k=Math.pow(.9,dt*60); c.vx*=k; c.vy*=k;
    }
  }
  if(pipPop>0){
    pipPop-=dt*4;
    const pip=document.querySelector("#sporeWrap .pip");
    if(pip&&!pip._busy){
      pip._busy=1;
      pip.animate([{transform:"scale(1)"},{transform:"scale(1.5)"},{transform:"scale(1)"}],
        {duration:250,easing:"cubic-bezier(.2,1.6,.4,1)"}).onfinish=()=>{pip._busy=0;};
    }
  }
}
function drawCele(){
  xBu.setTransform(DPR,0,0,DPR,0,0);
  xBu.clearRect(0,0,W,H);
  if(!cele.length) return;
  for(const c of cele){
    const k=1-c.t/c.life, fade=Math.min(1,k*3.2);
    if(c.kind==="orb"){
      xBu.save();
      xBu.globalAlpha=fade;
      const r2=c.w*.5;
      const g2=xBu.createRadialGradient(c.x-r2*.34,c.y-r2*.34,r2*.15,c.x,c.y,r2);
      g2.addColorStop(0,"#FFFFFF"); g2.addColorStop(.42,c.col);
      g2.addColorStop(1,shade(c.col,-.28));
      xBu.fillStyle=g2;
      xBu.beginPath(); xBu.arc(c.x,c.y,r2,0,TAU); xBu.fill();
      xBu.restore();
      continue;
    }
    if(c.kind==="cash"){
      // the note narrows as it turns edge-on, which is what sells the tumble
      const wf=Math.abs(Math.cos(c.flip));
      const w=Math.max(1.1,c.w*wf), h=c.h;
      xBu.save();
      xBu.globalAlpha=fade;
      xBu.translate(c.x,c.y); xBu.rotate(c.ang);
      xBu.fillStyle=wf<.36?shade(c.col,-.32):c.col;    // edge on, it darkens
      rrect(xBu,-w*.5,-h*.5,w,h,Math.min(2.2,h*.34)); xBu.fill();
      if(wf>.52){                                      // the face, front on
        xBu.strokeStyle="rgba(255,255,255,.42)"; xBu.lineWidth=.9;
        rrect(xBu,-w*.5+1.3,-h*.5+1.3,w-2.6,h-2.6,1.2); xBu.stroke();
        xBu.fillStyle="rgba(255,255,255,.8)";
        xBu.beginPath();
        xBu.ellipse(0,0,Math.min(w*.19,h*.3),h*.3,0,0,TAU);
        xBu.fill();
      }
      xBu.restore();
    } else {
      xBu.save();
      xBu.globalAlpha=fade*.5;
      xBu.strokeStyle=c.col; xBu.lineWidth=3; xBu.lineCap="round";
      if(c.trail.length>1){
        xBu.beginPath(); xBu.moveTo(c.trail[0].x,c.trail[0].y);
        for(const p of c.trail) xBu.lineTo(p.x,p.y);
        xBu.stroke();
      }
      xBu.globalAlpha=fade;
      xBu.translate(c.x,c.y); xBu.rotate(c.ang);
      const r=c.r*(1+c.hop*.35);
      xBu.fillStyle=c.col;
      xBu.beginPath();                               // four-point sparkle
      xBu.moveTo(0,-r);
      xBu.quadraticCurveTo(r*.16,-r*.16,r,0);
      xBu.quadraticCurveTo(r*.16,r*.16,0,r);
      xBu.quadraticCurveTo(-r*.16,r*.16,-r,0);
      xBu.quadraticCurveTo(-r*.16,-r*.16,0,-r);
      xBu.fill();
      xBu.restore();
    }
  }
}
/* ---------------------------------------------------------------- render */
function shade(hex,amt){
  let r,g,b;
  if(hex[0]==="#"){ const n=parseInt(hex.slice(1),16); r=(n>>16)&255; g=(n>>8)&255; b=n&255; }
  else { const m=hex.match(/[0-9.]+/g)||[0,0,0]; r=+m[0]; g=+m[1]; b=+m[2]; }
  if(amt>0){ r+=(255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt; }
  else { r*=1+amt; g*=1+amt; b*=1+amt; }
  return "rgb("+(r|0)+","+(g|0)+","+(b|0)+")";
}
const easeOut=k=>1-Math.pow(1-k,2.6);
function ballXform(x,b){
  x.translate(b.x,b.y);
  // a vented ball leaves the nozzle as a bead: small and drawn out along the
  // way it is travelling, filling to round over the first fifth of a second
  if(b.bead){
    const k=clamp((el-b.bead)/0.22,0,1);
    if(k>=1) b.bead=0;
    else { const e=easeOut(k); x.scale(.34+.66*e, .34+1.02*(1-e)*.5+.66*e); }
  }
  x.rotate(b.sqA); x.scale(1-b.sq*.5,1+b.sq*.45); x.rotate(-b.sqA);
  if(FORM.oval!==1){ x.rotate(b.rot); x.scale(1,1/FORM.oval); }
}

/* the agar membrane: many points, a slow low-amplitude undulation */
let MSEG=44;
function membrane(x,b,r){
  x.beginPath();
  const L=FORM.lobes;
  const amp0=(b.wob+FORM.rough)*clamp(r/(26*S),.25,1);
  // a nearly round ball reads the same at half the segments
  const N=Math.max(14, Math.round(MSEG*(amp0<.05?.45:amp0<.12?.7:1)));
  const amp=amp0;
  for(let i=0;i<=N;i++){
    const a=i/N*TAU;
    const w=1+amp*(Math.sin(a*L+b.wp)*.46+Math.sin(a*(L*2+1)-b.wp*1.3)*.27+Math.sin(a*(L*3+2)+b.wp*.6)*.15);
    const rr=r*w, px=Math.cos(a)*rr, py=Math.sin(a)*rr;
    i?x.lineTo(px,py):x.moveTo(px,py);
  }
  x.closePath();
}
/* Eight ball designs. Each paints inside the membrane clip, in tints of the
   ball's own colour so the size ladder still reads at a glance. */
/* One paint routine per scale. Each stays inside a flat rim band so a neck
   between two fusing balls always blends into the colour around it. */
function scalePaint(x,r,col,rot,b){
  const l1=shade(col,.20), l2=shade(col,.42), l3=shade(col,.66);
  const d1=shade(col,-.16), d2=shade(col,-.32), d3=shade(col,-.48);
  const A=x.globalAlpha;
  x.save(); x.rotate(rot||0);
  switch(FORM.paint){

    case "core":{                        // a particle: hard bright centre
      const g=x.createRadialGradient(0,0,r*.02,0,0,r*.95);
      g.addColorStop(0,"#fff"); g.addColorStop(.22,l3);
      g.addColorStop(.55,l1); g.addColorStop(1,col);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.globalAlpha=A*.5; x.lineWidth=r*.045; x.strokeStyle=l3;
      x.beginPath(); x.arc(0,0,r*.62,0,TAU); x.stroke();
      x.globalAlpha=A;
      break; }

    case "shell":{                       // a molecule: bonded lobes
      const g=x.createRadialGradient(-r*.3,-r*.34,r*.04,0,0,r*1.1);
      g.addColorStop(0,l3); g.addColorStop(.4,l1); g.addColorStop(1,col);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.fillStyle=d2; x.globalAlpha=A*.55;
      for(let i=0;i<3;i++){
        const a=i/3*TAU+.4;
        x.beginPath(); x.arc(Math.cos(a)*r*.44,Math.sin(a)*r*.44,r*.17,0,TAU); x.fill();
      }
      x.globalAlpha=A;
      break; }

    case "nucleus":{                     // a cell: nucleus and vacuoles
      const g=x.createRadialGradient(-r*.26,-r*.3,r*.05,0,0,r*1.05);
      g.addColorStop(0,l2); g.addColorStop(.6,col); g.addColorStop(1,d1);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.fillStyle=d2; x.globalAlpha=A*.7;
      x.beginPath(); x.ellipse(-r*.08,-r*.05,r*.32,r*.27,.4,0,TAU); x.fill();
      x.globalAlpha=A*.4; x.fillStyle=l3;
      x.beginPath(); x.arc(r*.34,r*.24,r*.13,0,TAU); x.fill();
      x.beginPath(); x.arc(r*.16,-r*.40,r*.09,0,TAU); x.fill();
      x.globalAlpha=A;
      break; }

    case "grain":{                       // sand: flecked and matte
      x.fillStyle=d1; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      const g=x.createLinearGradient(-r,-r,r*.4,r);
      g.addColorStop(0,l2); g.addColorStop(.5,col); g.addColorStop(1,d2);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.globalAlpha=A*.5;
      for(let i=0;i<9;i++){
        const a=i*2.399, rr=r*.72*Math.sqrt(i/9);
        x.fillStyle=i%2?d3:l3;
        x.beginPath(); x.arc(Math.cos(a)*rr,Math.sin(a)*rr,r*.075,0,TAU); x.fill();
      }
      x.globalAlpha=A;
      break; }

    case "rock":{                        // a boulder: hard facets
      const g=x.createLinearGradient(-r*.8,-r*.8,r*.6,r*.9);
      g.addColorStop(0,l2); g.addColorStop(.45,col); g.addColorStop(1,d3);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.globalAlpha=A*.55; x.fillStyle=l3;
      x.beginPath();
      x.moveTo(-r*.7,-r*.15); x.lineTo(-r*.1,-r*.72); x.lineTo(r*.22,-r*.2);
      x.lineTo(-r*.3,r*.2); x.closePath(); x.fill();
      x.fillStyle=d3; x.globalAlpha=A*.5;
      x.beginPath();
      x.moveTo(r*.14,r*.05); x.lineTo(r*.78,r*.2); x.lineTo(r*.3,r*.78); x.closePath(); x.fill();
      x.globalAlpha=A;
      break; }

    case "planet":{                      // a moon: lit limb and a shadow
      const g=x.createRadialGradient(-r*.36,-r*.38,r*.05,0,0,r*1.12);
      g.addColorStop(0,l3); g.addColorStop(.34,l1); g.addColorStop(.8,col); g.addColorStop(1,d2);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.globalAlpha=A*.42; x.fillStyle=d3;
      x.beginPath(); x.arc(r*.62,r*.42,r*1.02,0,TAU); x.fill();
      x.globalAlpha=A*.35; x.fillStyle=d2;
      x.beginPath(); x.ellipse(0,-r*.34,r*.72,r*.14,0,0,TAU); x.fill();
      x.beginPath(); x.ellipse(0,r*.30,r*.60,r*.11,0,0,TAU); x.fill();
      x.globalAlpha=A;
      break; }

    case "star":{                        // a sun: white core, corona
      const g=x.createRadialGradient(0,0,r*.03,0,0,r*1.0);
      g.addColorStop(0,"#fff"); g.addColorStop(.28,l3);
      g.addColorStop(.62,l1); g.addColorStop(1,col);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.globalAlpha=A*.55; x.strokeStyle=l3; x.lineWidth=r*.05; x.lineCap="round";
      for(let i=0;i<12;i++){
        const a=i/12*TAU+(b?b.wp*.3:0), o=(i%2?.62:.74);
        x.beginPath();
        x.moveTo(Math.cos(a)*r*o,Math.sin(a)*r*o);
        x.lineTo(Math.cos(a)*r*.86,Math.sin(a)*r*.86);
        x.stroke();
      }
      x.globalAlpha=A;
      break; }

    case "spiral":{                       // a galaxy: bar and arms
      const g=x.createRadialGradient(0,0,r*.04,0,0,r*1.0);
      g.addColorStop(0,l3); g.addColorStop(.3,l1); g.addColorStop(1,col);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.globalAlpha=A*.6; x.strokeStyle=l3;
      for(let k=0;k<2;k++){
        x.lineWidth=r*.16; x.lineCap="round";
        x.beginPath();
        for(let i=0;i<=16;i++){
          const t=i/16, a=k*Math.PI+t*2.5, rr=r*(.12+t*.72);
          const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
          i?x.lineTo(px,py):x.moveTo(px,py);
        }
        x.stroke();
      }
      x.globalAlpha=A; x.fillStyle="#fff";
      x.beginPath(); x.arc(0,0,r*.13,0,TAU); x.fill();
      break; }

    case "halo":{                         // the widest view: luminous shells
      const g=x.createRadialGradient(0,0,r*.04,0,0,r*1.05);
      g.addColorStop(0,"#fff"); g.addColorStop(.18,l3);
      g.addColorStop(.55,l1); g.addColorStop(1,col);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.globalAlpha=A*.4; x.strokeStyle=l3;
      for(let i=1;i<=3;i++){
        x.lineWidth=r*(.10-i*.018);
        x.beginPath(); x.arc(0,0,r*.24*i,0,TAU); x.stroke();
      }
      x.globalAlpha=A;
      break; }
  }
  x.restore();
}/* A tapered ribbon, not a stack of round-capped segments. A blade is widest
   just behind the finger and comes to a point at the tail — that taper is what
   makes a swipe read as a slash rather than a drawn line. Built as a filled
   polygon offset along the path normal, with a soft outer pass and a thin
   white core for the edge highlight. */
function drawTrail(x,widthMul,alpha){
  const n=trail.length; if(n<3) return;
  const col=trailCol(), wid=(val("reach")*S+4)*widthMul*1.5;

  // raw pointer samples are jagged at speed; one smoothing pass settles them
  const p=new Array(n);
  for(let i=0;i<n;i++){
    if(i===0||i===n-1){ p[i]={x:trail[i].x,y:trail[i].y,t:trail[i].t}; continue; }
    p[i]={x:(trail[i-1].x+trail[i].x*2+trail[i+1].x)*.25,
          y:(trail[i-1].y+trail[i].y*2+trail[i+1].y)*.25,
          t:trail[i].t};
  }
  const m=n, last=m-1;
  const half=(i,mul)=>{
    const u=i/last;                              // 0 at the tail, 1 at the finger
    const age=1-clamp(p[i].t/.34,0,1);
    return wid*.5*mul*Math.pow(u,.72)*(.3+.7*age);
  };
  const ribbon=(mul)=>{
    const L=[],R=[];
    for(let i=0;i<m;i++){
      const a=p[i>0?i-1:0], b=p[i<last?i+1:last];
      const tx=b.x-a.x, ty=b.y-a.y, len=Math.hypot(tx,ty)||1, h=half(i,mul);
      const nx=-ty/len*h, ny=tx/len*h;
      L.push(p[i].x+nx, p[i].y+ny); R.push(p[i].x-nx, p[i].y-ny);
    }
    x.beginPath(); x.moveTo(L[0],L[1]);
    for(let i=2;i<L.length;i+=2) x.lineTo(L[i],L[i+1]);
    for(let i=R.length-2;i>=0;i-=2) x.lineTo(R[i],R[i+1]);
    x.closePath();
  };

  x.save();
  x.lineJoin="round";
  // source-over throughout: the goo layer thresholds alpha, and an additive
  // pass there would blow straight through it
  x.fillStyle=col;
  x.globalAlpha=alpha*.22; ribbon(1.9); x.fill();
  x.globalAlpha=alpha*.95; ribbon(1);   x.fill();
  x.fillStyle="#fff";
  x.globalAlpha=alpha*.85; ribbon(.32); x.fill();
  x.restore();
}

function draw(){
  const sh=(G.opt.shake&&!REDUCED)?shake:0;
  const ox=sh?rnd(-sh,sh):0, oy=sh?rnd(-sh,sh):0;
  const pal=PAL();
  const lean=app.classList.contains("lowfx");
  MSEG=lean?22:44;
  const packed=lean||balls.length>84||dishFill()>.72;

  /* goo layer — the magnetised silhouette */
  xGoo.setTransform(GS,0,0,GS,0,0);
  xGoo.clearRect(0,0,W,H);
  xGoo.translate(ox,oy);
  if(zoom!==1){ const cy=(AR.y0+AR.y1)/2; xGoo.translate(W/2,cy); xGoo.scale(zoom,zoom); xGoo.translate(-W/2,-cy); }
  for(const b of balls){
    xGoo.save();
    ballXform(xGoo,b);
    const gc=b.kind==="golden"?rbIdx(b,0):(b.kind==="unstable"?"#FF9A3D":pal[b.tier]);
    // a floor on the goo radius: below it the blur spreads a small ball so
    // thin that the alpha threshold drops it, and it flickers
    const gr=Math.max(b.r,11*S);
    if(!lean){
      membrane(xGoo,b,gr*1.02);
      xGoo.fillStyle=RIM(gc); xGoo.fill();
    }
    membrane(xGoo,b,gr*.90);
    xGoo.fillStyle=gc; xGoo.fill();
    xGoo.restore();
  }
  for(const p of parts){
    if(!p.goo) continue;
    const k=1-p.t/p.life;
    xGoo.beginPath(); xGoo.arc(p.x,p.y,p.r*(.4+k*.9),0,TAU);
    xGoo.fillStyle=p.col; xGoo.fill();
  }
  drawTrail(xGoo,.55,.9);

  /* fx layer — crisp agar bodies, labels, particles */
  xFx.setTransform(DPR,0,0,DPR,0,0);
  xFx.clearRect(0,0,W,H);
  xFx.translate(ox,oy);

  if(zoom!==1){ const cy=(AR.y0+AR.y1)/2; xFx.translate(W/2,cy); xFx.scale(zoom,zoom); xFx.translate(-W/2,-cy); }

  for(const b of balls){
    const r=b.r;
    const col=b.kind==="golden"?rbIdx(b,0):(b.kind==="unstable"?"#FFE9A8":pal[b.tier]);
    xFx.save();
    ballXform(xFx,b);
    membrane(xFx,b,r);
    xFx.fillStyle=b.kind==="golden"?rbGrad(xFx,b,r):col; xFx.fill();
    // the design stops short of the rim, leaving a flat band of the ball's own
    // colour — that band is what a neck is made of, so merges read seamlessly.
    // While a pair is locked the design dissolves so they finish as one shape.
    const lock=b.mate?clamp(b.fuseT/fuseTime(b.tier),0,1):0;
    const grow=b.skinFade===undefined?1:clamp((el-b.skinFade)/.34,0,1);
    const skinA=(1-lock)*grow;
    if(skinA>.01 && !packed){
      xFx.save();
      xFx.beginPath(); xFx.arc(0,0,r*.87,0,TAU); xFx.clip();
      xFx.globalAlpha=skinA;
      scalePaint(xFx,r,col,b.rot*.5+b.wp*.10,b);
      xFx.restore();
    }
    membrane(xFx,b,r);
    xFx.lineWidth=Math.max(1.4,r*.075);
    xFx.globalAlpha=1-lock*.85;
    xFx.strokeStyle=RIM(col);
    xFx.stroke();
    xFx.globalAlpha=1;
    if(b.hit>.02){
      xFx.lineWidth=Math.max(1.4,r*.075);
      xFx.strokeStyle="rgba(255,255,255,"+(b.hit*.8)+")";
      xFx.stroke();
    }
    if(b.kind==="unstable"){
      const p=.5+.5*Math.sin(b.pulse*2.6);
      xFx.lineWidth=Math.max(1,r*.05);
      xFx.strokeStyle="rgba(255,120,60,"+(.35+p*.5)+")";
      for(let i=0;i<10;i++){
        const a=i/10*TAU+b.pulse*.2;
        xFx.beginPath();
        xFx.moveTo(Math.cos(a)*r*.78,Math.sin(a)*r*.78);
        xFx.lineTo(Math.cos(a)*r*(1.02+p*.07),Math.sin(a)*r*(1.02+p*.07));
        xFx.stroke();
      }
    }
    if(b.kind==="golden") rbShine(xFx,b,r);
    xFx.restore();

    // toughness, read as pips around the rim — one segment per remaining hit
    if(b.maxHp>1 && r>10*S){
      const segs=Math.min(b.maxHp,14);
      const left=Math.ceil(b.hp/b.maxHp*segs);
      const arc=TAU/segs, gap=Math.min(arc*.34,.30);
      xFx.save();
      xFx.lineWidth=Math.max(1.6,r*.055); xFx.lineCap="butt";
      for(let i=0;i<segs;i++){
        const a0=-Math.PI/2+i*arc+gap/2, a1=a0+arc-gap;
        xFx.strokeStyle=i<left?RIM(col):(curScale().dark?"rgba(255,255,255,.14)":"rgba(15,23,32,.08)");
        xFx.beginPath(); xFx.arc(b.x,b.y,r*1.13,a0,a1); xFx.stroke();
      }
      xFx.restore();
    }

    // the fusion lock: a closing bracket while two of a colour pull together
    if(b.mate && b.id<b.mate.id){
      const m=b.mate, k=clamp(b.fuseT/fuseTime(b.tier),0,1);
      const mx=(b.x+m.x)/2, my=(b.y+m.y)/2;
      xFx.save();
      xFx.globalAlpha=.35+k*.65;
      xFx.strokeStyle=col; xFx.lineWidth=Math.max(2,r*.10); xFx.lineCap="round";
      xFx.beginPath(); xFx.arc(mx,my,Math.max(b.r,m.r)*(1.5-k*.72),0,TAU*k); xFx.stroke();
      xFx.restore();
    }
  }

  drawBH(xFx);          // over the balls it is eating, under the cleave
  drawTrail(xFx,1,.72);

  xFx.save();
  for(const p of parts){
    if(p.goo) continue;
    const k=1-p.t/p.life;
    xFx.globalAlpha=k*.9;
    xFx.beginPath(); xFx.arc(p.x,p.y,p.r*k,0,TAU);
    xFx.fillStyle=p.col; xFx.fill();
  }
  for(const r of rings){
    const k=r.t/r.life;
    xFx.globalAlpha=(1-k)*.6;
    xFx.lineWidth=r.w*(1-k)+.4; xFx.strokeStyle=r.col;
    xFx.beginPath(); xFx.arc(r.x,r.y,r.r+(r.R-r.r)*easeOut(k),0,TAU); xFx.stroke();
  }
  xFx.restore();

  for(const p of pops){
    const k=clamp(p.t/p.life,0,1);
    // 85% -> 115% -> 100%, then hold
    const sc = k<.16 ? .85+(k/.16)*.30
             : k<.34 ? 1.15-((k-.16)/.18)*.15
             : 1;
    const rise = 35*S*(1-Math.pow(1-k,2.2));      // ~35px, easing out
    const a = k<.06 ? k/.06 : (k<.58 ? 1 : 1-(k-.58)/.42);
    const size=clamp(Math.round(15*S+13),17,24);
    xFx.save();
    xFx.globalAlpha=Math.max(0,a);
    xFx.translate(p.x, p.y-rise);
    xFx.scale(sc,sc);
    xFx.font="700 "+size+"px Poppins,system-ui,sans-serif";
    xFx.textAlign="center"; xFx.textBaseline="middle";
    // one soft shadow, carried by the outline pass so the fill does not double it
    xFx.shadowColor="rgba(30,58,22,.25)";
    xFx.shadowBlur=5; xFx.shadowOffsetY=2;
    xFx.lineWidth=Math.max(2,Math.round(3*Math.max(.8,S)));
    xFx.lineJoin="round"; xFx.miterLimit=2;
    xFx.strokeStyle="#67B82F";
    xFx.strokeText(p.txt,0,0);
    xFx.shadowColor="transparent"; xFx.shadowBlur=0; xFx.shadowOffsetY=0;
    xFx.fillStyle="#F7FFD9";
    xFx.fillText(p.txt,0,0);
    xFx.restore();
  }

  xFx.setTransform(DPR,0,0,DPR,0,0);

  // the ascent overlay: distance rings, and the name of where you are going
  if(zoomPhase){
    const cy=(AR.y0+AR.y1)/2, sc=curScale();
    xFx.save();
    xFx.beginPath(); xFx.rect(0,AR.y0,W,AR.y1-AR.y0); xFx.clip();
    const t=zoomPhase===1?zoomT/2.6:zoomT/1.35;
    for(let i=0;i<6;i++){
      const p=((t*1.35)+i/6)%1;
      xFx.globalAlpha=Math.sin(p*Math.PI)*(sc.dark?.30:.20);
      xFx.lineWidth=1+p*2.2;
      xFx.strokeStyle=sc.dark?"#9FB6DA":"#5C6979";
      xFx.beginPath(); xFx.arc(W/2,cy,26+p*Math.max(W,H)*0.85,0,TAU); xFx.stroke();
    }
    if(zoomFade>.01){
      xFx.globalAlpha=zoomFade;
      xFx.fillStyle=sc.bg[0]; xFx.fillRect(0,AR.y0,W,AR.y1-AR.y0);
    }
    xFx.restore();

    const show=zoomPhase===2 && zoomT<1.05;
    if(show){
      const a=Math.min(1,Math.min(zoomT/.22,(1.05-zoomT)/.3));
      xFx.save();
      xFx.globalAlpha=clamp(a,0,1);
      xFx.textAlign="center"; xFx.textBaseline="middle"; xFx.lineJoin="round";
      const halo=sc.dark?"rgba(3,5,12,.85)":"rgba(255,255,255,.92)";
      xFx.font="600 "+Math.round(9+2*S)+"px Poppins,system-ui,sans-serif";
      xFx.lineWidth=6; xFx.strokeStyle=halo;
      xFx.strokeText("ONE BALL IS NOW "+sc.ball.toUpperCase(),W/2,cy+Math.round(30+16*S));
      xFx.fillStyle=sc.dark?"#93A7C4":"#5C6979";
      xFx.fillText("ONE BALL IS NOW "+sc.ball.toUpperCase(),W/2,cy+Math.round(30+16*S));
      xFx.restore();
    }
  }

  if(flash>.01){
    // it used to fill the dish rect only, so a kill left a hard line across the
    // screen at the dish's top edge. Full height, easing off at both ends, so
    // the light carries all the way up with nothing to cut against.
    const a=flash*.13;
    const g=xFx.createLinearGradient(0,0,0,H);
    const top=clamp(AR.y0*0.45/H,0.001,0.4);
    const bot=clamp((AR.y1+(H-AR.y1)*0.55)/H,0.6,0.999);
    g.addColorStop(0,"rgba(255,196,64,0)");
    g.addColorStop(top,"rgba(255,196,64,"+(a*0.72).toFixed(4)+")");
    g.addColorStop(clamp(AR.y0/H,0.002,0.5),"rgba(255,196,64,"+a.toFixed(4)+")");
    g.addColorStop(clamp(AR.y1/H,0.5,0.998),"rgba(255,196,64,"+a.toFixed(4)+")");
    g.addColorStop(bot,"rgba(255,196,64,"+(a*0.72).toFixed(4)+")");
    g.addColorStop(1,"rgba(255,196,64,0)");
    xFx.save(); xFx.fillStyle=g; xFx.fillRect(0,0,W,H); xFx.restore();
  }
  const fill=dishFill();
  if(fill>.88){
    // a two-stop ramp over 90px banded badly and left a seam where the rect
    // began. Taller, and eased across eight stops so it dies out long before
    // its own edge.
    const H2=Math.min(210,(AR.y1-AR.y0)*.42), peak=(fill-.88)/.12*.16;
    const g=xFx.createLinearGradient(0,AR.y1,0,AR.y1-H2);
    for(let i=0;i<=8;i++){
      const u=i/8;
      g.addColorStop(u,"rgba(255,72,90,"+(peak*Math.pow(1-u,2.4)).toFixed(4)+")");
    }
    xFx.fillStyle=g; xFx.fillRect(0,AR.y1-H2,W,H2);
  }
}

/* ---------------------------------------------------------------- loop */
let last=0,slowN=0,fastN=0;
function frame(t){
  requestAnimationFrame(frame);
  if(!last){ last=t; return; }
  let dt=(t-last)/1000; last=t;
  if(dt>.05) dt=.05;
  if(G.opt.goo){
    const lean=app.classList.contains("lowfx");
    if(dt>.034){                      // worse than about thirty a second
      fastN=0;
      if(!lean && ++slowN>60){ app.classList.add("lowfx"); slowN=0; }
    } else {
      if(slowN>0) slowN--;
      if(lean && ++fastN>180){ app.classList.remove("lowfx"); fastN=0; }
    }
  }
  stepCele(dt); drawCele();
  const showArena = room==="arena" || camBusy>0;
  if(freeze>0){ freeze-=dt; if(showArena) draw(); drawWizards(); return; }
  step(dt);
  if(showArena) draw();
  drawWizards();
}

function toast(msg){
  const t=$("toast"); t.textContent=msg;
  t.classList.add("on"); clearTimeout(t._h);
  t._h=setTimeout(()=>t.classList.remove("on"),1900);
}
function banner(txt){
  const b=$("banner"); b.textContent=txt;
  b.animate([
    {opacity:0,transform:"translate(-50%,-50%) scale(.72)"},
    {opacity:1,transform:"translate(-50%,-50%) scale(1)",offset:.22},
    {opacity:1,transform:"translate(-50%,-50%) scale(1.02)",offset:.7},
    {opacity:0,transform:"translate(-50%,-50%) scale(1.14)"}],
    {duration:1200,easing:"cubic-bezier(.2,.9,.3,1)"});
}
function alertOrb(id,on){ const o=$("orb-"+id); if(o) o.classList.toggle("alert",on); }

const RANKS=["Recruit","Cadet","Ensign","Pilot","Captain","Major","Colonel","Commander","Admiral","Legend"];
function playerLevel(){
  const e=Math.max(0,G.totalEarned);
  return Math.max(1,Math.floor(Math.log10(e+1)*3.2)+1);
}
function levelProgress(){
  const l=playerLevel();
  const at=n=>Math.pow(10,(n-1)/3.2)-1;
  const a=at(l), b=at(l+1);
  return clamp((G.totalEarned-a)/Math.max(1,b-a),0,1);
}
function buildRails(){
  const L=$("railL"); L.innerHTML="";
  for(const it of [
    {id:"set", svg:ICONS.gear,   fn:sheetSettings,     c:"#232B39", ic:"#FFFFFF"},
    {id:"stat",svg:ICONS.chart,  fn:sheetStats,        c:"#FFFFFF", ic:"#3A4A5E"},
    {id:"ach", svg:ICONS.podium, fn:sheetBoard,        c:"#F7B500", ic:"#5A3B00"},
    {id:"shop",svg:ICONS.bag,    fn:()=>{G.stTab="shop"; sheetShop();}, c:"#22C55E", ic:"#FFFFFF"},
    {id:"mis", svg:ICONS.target, fn:sheetMissions,     c:"#F97316", ic:"#FFFFFF"},
  ]){
    const b=document.createElement("button");
    b.className="orb"; b.id="orb-"+it.id;
    b.style.setProperty("--c",it.c); b.style.setProperty("--ic",it.ic);
    b.innerHTML='<svg viewBox="0 0 24 24">'+it.svg+'</svg><span class="dot"></span>'+
                 '<span class="pill"></span>';
    b.onclick=it.fn; L.appendChild(b);
  }
  obsChanged();
  const R=$("railR"); R.innerHTML="";
  const pr=document.createElement("div");
  pr.className="prof"; pr.id="profCard";
  pr.innerHTML='<div class="hi">Hey</div><div class="lv"></div>'+
    '<div class="rk"></div><div class="bar"><i></i></div>';
  pr.onclick=()=>{ if(ready) sheetAchievements(); };
  R.appendChild(pr);
  const add=(p,isBoost)=>{
    const b=document.createElement("button");
    b.className="pw"; b.id=(isBoost?"bo-":"pw-")+p.id;
    b.innerHTML='<span class="g">'+p.g+'</span><span class="l">'+p.nm+'</span>'+
                 '<span class="cd"></span><span class="adb">\u25B6</span>';
    b.onclick=()=>isBoost?fireBoost(p):firePower(p);
    b.oncontextmenu=e=>{e.preventDefault(); toast(p.nm+" — "+p.d);};
    R.appendChild(b);
  };
  // Scatter is the one everybody has; everything else is earned
  add(POWERS[0],false);
  const bought=POWERS.filter(p=>p.cost>0&&pwState(p).owned)
    .concat(BOOSTS.filter(b2=>boState(b2).owned));
  const adp=POWERS.filter(p=>p.cost>0 && !pwState(p).owned);
  for(const p of bought) add(p,!("cost" in p && p.dur!==undefined) && !POWERS.includes(p));
  // the ones you have not bought sit below, playable for a watch
  for(const p of adp){
    const b=document.createElement("button");
    b.className="pw adpw"; b.id="ad-"+p.id;
    b.innerHTML='<span class="g">'+p.g+'</span><span class="l">'+p.nm+'</span>'+
                '<span class="cd"></span><span class="adb">▶</span>';
    b.onclick=()=>watchPower(p);
    b.oncontextmenu=e=>{e.preventDefault(); toast(p.nm+" — "+p.d+" Watch an ad to use it.");};
    R.appendChild(b);
  }
  obsChanged();
}
/* The shop badge alternates between the two rarities actually on the shelf,
   so both get seen rather than one sitting there forever. */
let pillT=-99, pillOn=0;
function syncShopPill(){
  const o=document.getElementById("orb-shop"); if(!o) return;
  if(el-pillT>4.5){ pillT=el; pillOn^=1; }
  const kind=pillOn?"deal":"epic";
  o.classList.toggle("pill-epic",kind==="epic");
  o.classList.toggle("pill-deal",kind==="deal");
  const p=o.querySelector(".pill");
  if(p) p.textContent=kind==="epic"?"EPIC":"DEAL";
}
function syncRails(){
  syncShopPill();
  // any power sitting on a cooldown can be watched back to ready
  for(const p of POWERS.concat(BOOSTS)){
    const isB=!("cost" in p);
    const b=document.getElementById((isB?"bo-":"pw-")+p.id); if(!b) continue;
    const st=isB?(G.boost[p.id]||{cd:0}):pwState(p);
    const on=st.cd>0 && (!("cost" in p) || st.owned) && adReady("pw_"+p.id);
    b.classList.toggle("adReady",on);
    const ab=b.querySelector(".adb");
    if(ab && !ab.dataset.w){
      ab.dataset.w="1";
      ab.onclick=e=>{
        e.stopPropagation();
        const t=isB?(G.boost[p.id]||(G.boost[p.id]={cd:0})):pwState(p);
        if(t.cd<=0) return;
        t.cd=0; G.ad["pw_"+p.id]=el+180;
        toast(p.nm+" ready"); save(); syncRails();
      };
    }
  }
  for(const p of POWERS){
    const b=document.getElementById("ad-"+p.id); if(!b) continue;
    const k="adpw_"+p.id, ok=adReady(k);
    const cd=b.querySelector(".cd"), lab=b.querySelector(".l");
    b.classList.toggle("ready",ok);
    b.classList.toggle("locked",!ok);
    if(ok){ cd.style.display="none"; lab.textContent=p.nm; }
    else  { cd.style.display="grid"; cd.textContent=adWait(k); lab.textContent=p.nm; }
  }
  const pc=document.getElementById("profCard");
  if(pc){
    const l=playerLevel();
    pc.querySelector(".lv").textContent="Lv."+l;
    pc.querySelector(".rk").textContent=RANKS[Math.min(RANKS.length-1,Math.floor((l-1)/3))];
    pc.querySelector(".bar i").style.width=(levelProgress()*100).toFixed(0)+"%";
  }
  for(const p of POWERS){
    const s=pwState(p), b=$("pw-"+p.id); if(!b) continue;
    const cd=b.querySelector(".cd"), lab=b.querySelector(".l");
    b.classList.toggle("locked",!s.owned);
    b.classList.toggle("ready",s.owned&&s.cd<=0);
    b.classList.toggle("active",(p.id==="chain"&&timers.chain>0)||(p.id==="storm"&&timers.storm>0));
    if(!s.owned){ cd.style.display="none"; lab.innerHTML=ICO_SPORE+p.cost; }
    else if(s.cd>0){ cd.style.display="grid"; cd.textContent=Math.ceil(s.cd); lab.textContent=p.nm; }
    else { cd.style.display="none"; lab.textContent=p.nm; }
  }
  for(const bo of BOOSTS){
    const s=G.boost[bo.id]||{cd:0}, b=$("bo-"+bo.id); if(!b) continue;
    const cd=b.querySelector(".cd");
    b.classList.toggle("ready",s.cd<=0);
    if(s.cd>0){ cd.style.display="grid"; cd.textContent=Math.ceil(s.cd); }
    else cd.style.display="none";
  }
  alertOrb("ach",false);
  alertOrb("mis",achAny()||!!(G.obj&&G.obj.some(o=>o.done&&!o.claimed)));
}

    b.style.setProperty("--accent",t.accent);
    b.innerHTML='<span class="g">'+t.g+'</span>'+t.lbl;

    holdBuy(b,k);

const RINGC=2*Math.PI*17;   // the ring path length, for dash maths
function syncCards(){
  const c=$("cards");
  for(const b of c.children){
    const k=b.dataset.k;
    if(k){
      const u=UP[k], m=maxed(k), af=!m&&G.bio>=cost(k);
      b.classList.toggle("afford",af); b.classList.toggle("maxed",m);
      b.querySelector(".lv").textContent=m?"MAX":"Lv "+lv(k);
      b.querySelector(".ef").textContent=u.fmt(lv(k));
      b.querySelector(".ct").innerHTML=m?"MAXED":"$"+fmt(cost(k));
      // the reference offers an ad on a card you cannot reach yet
      const canAd=!m && !af && adReady("up_"+k);
      b.classList.toggle("canAd",canAd);
      if(canAd) b.querySelector(".alt").textContent="or $"+fmt(cost(k));
      // every purchase closes the ring a little further; it completes at max
      const ring=b.querySelector(".rfg");
      if(ring) ring.style.strokeDashoffset=(RINGC*(1-(u.max?clamp(lv(k)/u.max,0,1):0))).toFixed(2);
    }
  }
}
/* Press and it buys; keep pressing and it keeps buying, faster and a note
   higher each time, until the money runs out or the track maxes. The first
   buy lands on the press so a single tap still feels instant. */
let buyRun=0;
function holdBuy(b,k){
  holdRepeat(b,()=>{
    // the ad half takes the level for a watch instead of the cash
    if(b.classList.contains("canAd") && G.bio<cost(k)){
      G.ad["up_"+k]=el+180;
      G.up[k]=(G.up[k]|0)+1;
      toast(UP[k].nm+" +1");
      rewardPill(b,"+1"); save(); buildCards(); syncCards(); syncRails();
      return false;                       // one level per watch, never a run
    }
    if(maxed(k)||G.bio<cost(k)){ buy(k); return false; }
    buy(k); syncRails();
    return true;
  });
}
/* Press and it acts once; keep pressing and it keeps going, faster and a
   note higher each time, until the callback says it cannot any more. */
function holdRepeat(b,once){
  let timer=null, held=0, sx=0, sy=0, live=false;
  const stop=()=>{
    if(timer) clearTimeout(timer);
    timer=null; live=false; holding=false; buyRun=0;
    b.classList.remove("held"); b.style.removeProperty("--sh");
    // a run that got going lands on the octave rather than just stopping
    if(held>3) chime(330*semi(LADDER[Math.min(held,LADDER.length-1)])*2,
                     {vol:.06,len:.5,wet:.5});
    held=0;
  };
  const repeat=()=>{
    if(!live) return;
    holding=true;
    const ok=once();
    holding=false;
    if(!ok){ stop(); return; }
    held++; buyRun=held;
    b.classList.add("held");
    b.style.setProperty("--sh", Math.min(1, held/8).toFixed(2));
    // a run walks up the same ladder the combo does, so a long hold resolves
    // instead of hammering one note, and settles once it runs out of rungs
    const n=LADDER[Math.min(held,LADDER.length-1)];
    chime(330*semi(n),{vol:.05,len:.20,wet:.34});
    if(held%4===0) pop(150,{vol:.045,wet:.22});
    haptic(4);
    // 340ms down to 70ms over about a second and a half of holding
    const gap=Math.max(70, 340*Math.pow(.86,held));
    timer=setTimeout(repeat,gap);
  };
  b.addEventListener("pointerdown",e=>{
    if(e.button) return;
    e.preventDefault();
    sx=e.clientX; sy=e.clientY; live=true; held=0;
    if(!once()){ stop(); return; }
    timer=setTimeout(repeat,380);
    try{ b.setPointerCapture(e.pointerId); }catch(err){}
  },{passive:false});
  // a drag is someone scrolling the shelf, not someone buying
  b.addEventListener("pointermove",e=>{
    if(live&&Math.hypot(e.clientX-sx,e.clientY-sy)>10) stop();
  },{passive:true});
  for(const ev of ["pointerup","pointercancel","pointerleave"])
    b.addEventListener(ev,stop,{passive:true});
}
function cashBurst(srcEl,n){
  if(!srcEl||!app) return;
  const p=appPt(srcEl);
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+rnd(-1.15,1.15), sp=rnd(210,450), d=rnd(9,13);
    cele.push({kind:"cash", x:p.x+rnd(-9,9), y:p.y+rnd(-5,5),
      vx:Math.cos(a)*sp*1.25, vy:Math.sin(a)*sp,
      w:d, h:d*.6, t:0, life:rnd(.5,.82),
      col:CONF[(Math.random()*CONF.length)|0],
      ang:rnd(0,TAU), spin:rnd(-8,8), flip:rnd(0,TAU), flipV:rnd(10,18),
      drag:rnd(.90,.95)});
  }
}
/* a click, the coin's own note a step up the ladder, a shimmer over it and
   a little body underneath — a till rather than a switch */
function buySound(l){
  tick(520+l*9,.085);
  chime(660*semi(LADDER[Math.min(l,LADDER.length-1)]),{vol:.075,len:.3,wet:.34});
  chime(1320,{vol:.035,len:.24,delay:.05,wet:.45});
  thud(124,{vol:.09,len:.15});
}
function buyFx(b){
  if(!b||!b.animate) return;
  const lv=b.querySelector(".lv"), ring=b.querySelector(".rfg");
  if(lv&&lv.animate) lv.animate([
    {transform:"scale(1)"},{transform:"scale(1.55)",offset:.28},{transform:"scale(1)"}
  ],{duration:260,easing:"cubic-bezier(.2,1.7,.35,1)"});
  if(ring&&ring.animate) ring.animate([

  ],{duration:300,easing:"ease-out"});

function buy(k){
  if(maxed(k)){ toast(UP[k].nm+" is fully developed"); return; }
  const c=cost(k);
  if(G.bio<c){ toast("Needs "+fmt(c)+" cash"); return; }
  G.bio-=c; G.up[k]++;
  buySound(lv(k));
  haptic(9); save(); syncCards();
  const card=document.querySelector('#cards .card[data-k="'+k+'"]');
  buyFx(card);
  cashBurst(card, buyRun>0 ? (buyRun%3===0?4:0) : 7);
  if(k==="pulse"&&lv(k)===1) toast("Idle hits are on — they keep going while you are away");
}
let PC=null;   // refs into the scale card, so it updates without rebuilding
/* A preview of what a ball looks like at another scale: swap FORM for the
   render and put it straight back, so the arena is never affected. */
function scaleBallPreview(idx, size){
  const sc = SCALES[Math.min(idx, SCALES.length - 1)];
  const c = document.createElement("canvas");
  const d = Math.min(devicePixelRatio || 1, 2);
  c.width = size * d; c.height = size * d;
  c.style.width = size + "px"; c.style.height = size + "px";
  const x = c.getContext("2d");
  x.scale(d, d);

  const keep = FORM;
  FORM = sc.form;
  try {
    const col = PAL()[sc.form.paint === "core" ? 5 : 3];
    const r = size * 0.36;
    const fake = { wob: 0.02, wp: 1.1, sq: 0, sqA: 0, rot: 0.5 };
    x.save();
    x.translate(size / 2, size / 2);
    if (FORM.oval !== 1) { x.rotate(0.4); x.scale(1, 1 / FORM.oval); }
    membrane(x, fake, r);
    x.fillStyle = col; x.fill();
    x.save();
    x.beginPath(); x.arc(0, 0, r * 0.87, 0, TAU); x.clip();
    scalePaint(x, r, col, -0.35, null);
    x.restore();
    membrane(x, fake, r);
    x.lineWidth = Math.max(1.2, r * 0.075);
    x.strokeStyle = sc.dark ? shade(col, 0.46) : shade(col, -0.34);
    x.stroke();
    x.restore();
  } finally { FORM = keep; }
  return c;
}

function buildStrainCard(c){

      k:d.querySelector(".k"), t:d.querySelector(".t"), m:d.querySelector(".m"),

function syncStrainCard(){
  if(!PC||!PC.card.isConnected) return;
  const cur=curScale(), at=G.strain>=SCALES.length-1;
  const nxi=Math.min(G.strain+1,SCALES.length-1), nx=SCALES[nxi];
  const need=nextScaleCost(), ok=canPrestige();
  const pct=at?1:clamp(G.earned/need,0,1);

  if(PC.shown!==nxi){                     // only redraw the ball when it changes
    PC.shown=nxi;
    PC.prev.innerHTML="";
    PC.prev.appendChild(scaleBallPreview(at?G.strain:nxi,46));
  }
  PC.k.textContent=at?"Widest view":"Go up to";
  PC.t.textContent=at?cur.n:nx.n;
  PC.m.innerHTML=at
    ? "One ball is "+cur.ball+". Nothing further out."
    : "One ball becomes <b>"+nx.ball+"</b> · yield <b>×"+fmt(nx.mult)+"</b>";
  PC.bar.style.width=(pct*100).toFixed(1)+"%";
  PC.num.textContent=at?"complete":(fmt(Math.min(G.earned,need))+" / "+fmt(need));
  PC.card.classList.toggle("ready",ok);
  PC.btn.className="pbtn"+(ok?"":" no");
  PC.btn.innerHTML=at ? "Complete"
    : (ok ? "Go up<small>ready</small>" : "Go up<small>"+ICO_MASS+" "+fmt(need)+"</small>");
}

/* syncTop runs every frame, so only touch the DOM when the string changes */
const CURC=Object.create(null);
const CURSPLIT=/^(-?[\d.]+)([A-Za-z]+)$/;
function setCur(id,v){
  const str=fmt(v);
  if(CURC[id]===str) return;
  CURC[id]=str;
  const m=CURSPLIT.exec(str);
  const pre = id==="bioN" ? "$" : "";
  const e=$(id);
  e.innerHTML = m ? pre+m[1]+'<span class="u">'+m[2]+'</span>' : pre+str;
  if(id==="bioN"){
    const w=e.parentElement, n=str.length;
    w.classList.toggle("l4",n===4);
    w.classList.toggle("l5",n===5);
    w.classList.toggle("l6",n>=6);
  }
}

/* ---- command center ------------------------------------------------------
   The hero number is a made-up composite, exactly as the reference's "IQ" is:
   it reads efficiency, how far you have zoomed out, and how much you have
   banked, and lands somewhere in the 60-140 range. */
function playerIQ(){
  const s2=G.stat;
  const eff=Math.min(1,(s2.merges||0)/Math.max(1,(s2.splits||0)*0.35));
  const reach=Math.min(1,(G.strain||0)/5);
  const bank=Math.min(1,Math.log10(Math.max(10,G.totalEarned))/12);
  return Math.round(62+eff*26+reach*28+bank*24);
}

/* First-Last-Invert-Play. Measure every card, let the list rebuild in its new
   order, then start each one from where it used to be and let it slide home —
   which is how the reference shows a claimed mission sinking past the others. */
function flipMissions(rerender){
  const body=document.getElementById("sheetBody");
  const was=new Map();
  for(const c of body.querySelectorAll(".ms")) was.set(c.dataset.k, c.getBoundingClientRect().top);
  rerender();
  for(const c of body.querySelectorAll(".ms")){
    const from=was.get(c.dataset.k);
    if(from===undefined) continue;
    const d=from-c.getBoundingClientRect().top;
    if(Math.abs(d)<1) continue;
    c.animate([{transform:"translateY("+d.toFixed(1)+"px)"},{transform:"translateY(0)"}],
      {duration:430,easing:"cubic-bezier(.2,.85,.25,1)"});
  }
}
function claimObj(o,btn,mult){
  if(!o.done) return;
  if(o.claimed) return;
  const sp=o.sp*mult;
  G.spore+=sp; G.bio+=180*yieldMul()*(1+G.objDone*0.6);
  G.objDone++; o.claimed=true;
  // the burst comes off the card, and the chip lands in the middle of it
  const card=btn.closest(".ms")||btn;
  celebrate(btn, 46+sp*5, "#F5B301", document.querySelector("#sporeWrap .pip"));
  rewardPill(card, ICO_SPORE+"+"+sp);
  chime(523,{vol:.16,len:.9,wet:.5});
  chime(659,{vol:.13,len:.85,delay:.07,wet:.5});
  chime(784,{vol:.11,len:.9,delay:.14,wet:.55});
  noiseHit(.4,{vol:.09,cut:6000,type:"highpass",to:.4,wet:.4});
  thud(78,{vol:.2,len:.26});
  haptic([14,26,14,40]);
  save(); syncTop();
  if(sheetSync) flipMissions(sheetSync);
  alertOrb("mis",!!(G.obj&&G.obj.some(x=>x.done&&!x.claimed)));
}
const DAY_MS=24*3600*1000;
function missionsLeft(){
  const t0=G.objT||(G.objT=Date.now());
  return Math.max(0, DAY_MS-(Date.now()-t0));
}
function rollDaily(){
  G.objT=Date.now();
  G.obj=null; rollObjectives();
  G.obj.forEach(o=>o.claimed=false);
  save();
}
function fmtClock(ms){
  const s2=Math.floor(ms/1000), h=Math.floor(s2/3600),
        m=Math.floor(s2%3600/60), q=s2%60;
  return h+":"+String(m).padStart(2,"0")+":"+String(q).padStart(2,"0");
}
function sheetMissions(){
  if(!G.obj) rollObjectives();
  // a save rolled before the count changed comes up short; top it up
  while(G.obj.length<4){
    const tier=Math.min(4,Math.floor(G.objDone/6));
    const used=G.obj.map(x=>x.k);
    const pool=OBJPOOL.filter(p=>!used.includes(p.k));
    if(!pool.length) break;
    const p=pool[(Math.random()*pool.length)|0];
    G.obj.push({k:p.k,goal:p.goals[tier],prog:0,sp:p.sp+tier,done:false,claimed:false});
  }
  if(!G.objT) G.objT=Date.now();
  if(missionsLeft()<=0) rollDaily();
  openSheet('<svg viewBox="0 0 24 24" style="width:17px;height:17px;display:block;color:#F97316">'+ICONS.target+'</svg>',
    "Daily Missions","Resets in "+fmtClock(missionsLeft()),b=>{
    const done=G.obj.filter(o=>o.done).length;
    const top=document.createElement("div");
    top.className="msTop";
    top.innerHTML='<span class="k">Progress</span>'+
      '<div class="msBar"><i style="width:'+(done/G.obj.length*100).toFixed(0)+'%"></i></div>'+
      '<span class="n">'+done+"/"+G.obj.length+'</span>';
    b.appendChild(top);
    // claimed sink to the bottom, which is the move the reorder animates
    const ordered=[...G.obj].sort((a,c)=>(a.claimed?1:0)-(c.claimed?1:0));
    for(const o of ordered) b.appendChild(msCard(o));

  });
}

function boardRows(){
  const mine=Math.max(1,Math.floor(G.totalEarned));
  let seed=1337, rr=()=>((seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff);
  const rows=BOARD_NAMES.map((n,i)=>({n, v:Math.floor(mine*(2.6-i*0.17)*(0.72+rr()*0.6))}));
  rows.push({n:"You", v:mine, me:true});
  rows.sort((a,b)=>b.v-a.v);
  return rows.slice(0,12);
}

        const t=document.createElement("div");
        t.className="acTier"+(got?" got":"");
        t.innerHTML='<span class="tick">'+(got?"\u2713":"\u25CB")+'</span>'+
          '<span class="n">'+a.t(goal)+'</span>'+
          '<span class="rw">'+rwText(a.rw[i])+'</span>';
        if(ready){
          const cl=document.createElement("button");
          cl.className="msBtn claim"; cl.textContent="Claim";
          cl.onclick=e=>{
            e.stopPropagation();
            G.achv[a.k]=done+1;
            const got2=achGive(a.rw[i]);
            celebrate(cl,44,"#F5B301",document.querySelector("#sporeWrap .pip"));
            rewardPill(cl,"+");
            toast(a.nm+" \u2014 "+got2);
            save(); syncTop(); sheetSync&&sheetSync();
          };
          t.appendChild(cl);
        }
        wrap.appendChild(t);
      });
      b.appendChild(wrap);
    }
  });
}
function achRows(b){
    for(const a of ACHV){
      const done=achDone(a), all=done>=a.tiers.length;
      const goal=all?a.tiers[a.tiers.length-1]:a.tiers[done];
      const have=a.src(), ready=!all&&have>=goal;
      const r=all?null:a.rw[done];
      b.appendChild(row({
        ic:a.ic,
        t:a.nm+(all?" \u2713":" "+(done+1)+"/"+a.tiers.length),
        s:all ? "Every tier claimed."
              : a.t(goal)+" \u2014 "+rwText(r),
        bar:all?1:clamp(have/goal,0,1),
        btn:all?null:(ready?"Claim":(a.k==="play"?fmtTime(Math.max(0,goal-have)):fmt(Math.max(0,goal-have))+" to go")),
        btnOn:ready,
        fn:ready?function(){
          G.achv[a.k]=done+1;
          const got=achGive(r);
          toast(a.nm+" \u2014 "+got);
          save(); syncTop(); buildCards();
          alertOrb("ach",false);
  alertOrb("mis",achAny()||!!(G.obj&&G.obj.some(o=>o.done&&!o.claimed)));
        }:null
      }));
    }
}
function sheetCustomise(){
  openSheet("◑","Your Balls","Cleave colour and powers",b=>{
    b.appendChild(lbl("Chompy"));
    for(const p of PETS){
      const own=G.ownPet.includes(p.id), sel=G.pet===p.id;
      b.appendChild(row({
        swatch:p.arc, t:p.nm, s:p.d, sel,
        btn:sel?"Equipped":(own?"Equip":ICO_SPORE+p.cost), btnOn:!sel,
        fn:()=>{
          if(sel) return;
          if(own){ G.pet=p.id; save(); }
          else if(G.spore>=p.cost){ G.spore-=p.cost; G.ownPet.push(p.id); G.pet=p.id;
                                    toast(p.nm+" unlocked"); save(); }
          else toast("Needs "+p.cost+" mana");
        }
      }));
    }

    b.appendChild(lbl("Cleave colour"));
    for(const t of TRAILS){
      const own=G.ownTrail.includes(t.id), sel=G.trail===t.id;
      b.appendChild(row({
        swatch:t.c, t:t.nm, s:t.d, sel,
        btn:sel?"Equipped":(own?"Equip":ICO_SPORE+t.cost), btnOn:!sel,
        fn:()=>{
          if(sel) return;
          if(own){ G.trail=t.id; save(); }
          else if(G.spore>=t.cost){ G.spore-=t.cost; G.ownTrail.push(t.id); G.trail=t.id; toast(t.nm+" unlocked"); save(); }
          else toast("Needs "+t.cost+" mana");
        }
      }));
    }

    b.appendChild(row({ic:ICO_MASS,t:"Watch an ad for gold",
      s:"A lump scaled to what you are earning now.",
      btn:adReady("gold")?"Watch":adWait("gold"), btnOn:adReady("gold"),
      fn:adReady("gold")?function(){
        const v=Math.max(500,passiveRate()*240+throughput()*120);
        G.bio+=v; G.earned+=v; G.totalEarned+=v; G.ad.gold=el+300;
        toast("+"+fmt(v)+" cash"); save(); syncTop(); sheetSync&&sheetSync();
      }:null}));
    b.appendChild(row({ic:ICO_SPORE,t:"Watch an ad for shards",
      s:"Three mana. Once every five minutes.",
      btn:adReady("sp")?"Watch":adWait("sp"), btnOn:adReady("sp"),
      fn:adReady("sp")?function(){
        G.spore+=3; G.ad.sp=el+300;
        toast("+3 mana"); save(); syncTop(); sheetSync&&sheetSync();
      }:null}));

    b.appendChild(lbl("Powers"));
    for(const p of POWERS){
      const s=pwState(p);
      b.appendChild(row({ic:p.g,t:p.nm,s:p.d,
        btn:s.owned?"Owned":ICO_SPORE+p.cost, btnOn:!s.owned,
        fn:()=>{ if(!s.owned) firePower(p); }}));
    }
  });
}
/* the offline payout is the first thing you see coming back, so it gets a
   screen rather than a row in a list. The cash is held back until Collect,
   which is what makes pressing it worth anything. */
let wbPending=0;
function sheetWelcome(secs,gain){
  wbPending=gain;
  G.bio-=gain; G.earned-=gain; G.totalEarned-=gain;   // handed over on Collect
  $("wbRank").textContent=RANKS[Math.min(RANKS.length-1,Math.floor((playerLevel()-1)/3))];
  $("wbAway").innerHTML="Chompy and your wizards worked for <b>"+fmtTime(secs)+"</b>";
  $("wbVal").innerHTML=ICO_MASS+"+$"+fmt(gain);
  $("wb").classList.add("on");
}
function wbCollect(btn){
  const g=wbPending; wbPending=0;
  G.bio+=g; G.earned+=g; G.totalEarned+=g;
  $("wb").classList.remove("on");
  // the payout flies to the counter it just joined
  celebrate(btn, 70, "#34D77C", document.querySelector("#bioWrap .pip"));
  rewardPill(btn,"+$"+fmt(g));
  banner("+$"+fmt(g));
  chime(523,{vol:.18,len:.9,wet:.5});
  chime(784,{vol:.13,len:.85,delay:.08,wet:.5});
  noiseHit(.42,{vol:.1,cut:6000,type:"highpass",to:.4,wet:.4});
  thud(70,{vol:.24,len:.34});
  haptic([16,30,16,44]);
  save(); syncTop();
}
function passiveRate(){ return throughput()*0.55; }
function passiveRateOld(){
  const rate=val("pulse"); if(rate<=0) return 0;
  const cls=bestBall();
  return rate*cls.mass*0.34*yieldMul();
}

/* ---------------------------------------------------------------- boot */
function tickUI(dt){
  uiT-=dt;
  if(uiT<=0){
    uiT=0.1;
    if(G.opt.sandbox){
      if(G.bio<1e9) G.bio=1e12;
      if(G.spore<60) G.spore=60;
      const nd=nextScaleCost(); if(G.earned<nd) G.earned=nd;
    }
    syncTop(); syncCards(); syncRails();
    const vb=$("vBar");
    if(vb){
      const k=clamp(1-VENT.t/Math.max(.001,VENT.max),0,1);
      vb.firstElementChild.style.width=(k*100).toFixed(0)+"%";
      vb.classList.toggle("full",k>=.999);
    }
    if(room==="wiz"){ syncWizGrid(); syncWizPanel(); }
    else { const up=$("goUp"); if(up) up.classList.toggle("alert",(G.bio>=summonCost()&&wizCount()<PLAY)||anyMerge()); }
    if(G.tab==="strain"){
      if(!PC||!PC.card.isConnected){ const cc=$("cards"); cc.innerHTML=""; buildStrainCard(cc); }
      else syncStrainCard();
    }
    const t=$("tabs").children[5]; if(t) t.classList.toggle("hot",canPrestige());

  }
}
let saveT=0;
(function uiLoop(){
  requestAnimationFrame(uiLoop);
  const t=now(), dt=(t-(uiLoop.l||t))/1000; uiLoop.l=t;
  if(!G) return;
  tickUI(dt);
  saveT+=dt; if(ready&&saveT>5){ saveT=0; save(); }
})();

function offlineCatchUp(){
  if(!G.t) return;
  const secs=clamp((Date.now()-G.t)/1000,0,8*3600);
  if(secs<90) return;
  const gain=passiveRate()*secs*OFFLINE_RATE;
  if(gain<1) return;
  G.bio+=gain; G.earned+=gain; G.totalEarned+=gain;
  setTimeout(()=>sheetWelcome(secs,gain),700);
}
function begin(){
  ready=true;
  $("intro").classList.add("hide");
  actx();
  if(!G.seen){
    G.seen=true;
    setTimeout(()=>banner("TAP TO SPLIT"),400);
    setTimeout(()=>toast("Swipe across balls to cleave a whole line"),2600);
    setTimeout(()=>toast("Tap the arrow up top — your wizards live up there"),6400);
  }
  unlockAudio();
  setTimeout(()=>{
    if(!G.opt.sound) return;
    const c=Sn.ctx;
    if(!c||c.state!=="running"||Sn.dead)
      toast("No sound? Tap once more — and check the side switch is not on silent");
  },1500);
  offlineCatchUp();
  save();
}

G=load();
if(!G.obj) rollObjectives();
if(!TABS.some(t=>t.id===G.tab)) G.tab="balls";
G.strain=clamp(G.strain|0,0,SCALES.length-1);
FORM=curScale().form;
if(G.opt.sandbox===undefined) G.opt.sandbox=true;
app.classList.toggle("lowfx",!G.opt.goo);
resize();
if(!G.wiz.some(Boolean)) G.wiz[5]={id:++G.wizSeq, rank:0};
buildWizGrid(); syncWZ();
/* ---- the board's input: tap to select, tap a target to merge or move,
        or drag from one cell to another. Both routes do the same thing. ---- */
function cellFromPoint(x,y){
  const el=document.elementFromPoint(x,y);
  const c=el&&el.closest&&el.closest(".wcell");
  return c?+c.dataset.i:-1;
}
function clearDragHint(){
  for(const el of wgridEl.children) el.classList.remove("over","overbad","drag","tgt","move");
}
function paintDragHint(from){
  clearDragHint();
  const a=wiz(from); if(!a) return;
  const src=wgridEl.children[from]; if(src) src.classList.add("drag");
  if(dragOver<0||dragOver===from) return;
  const el=wgridEl.children[dragOver]; if(!el) return;
  const b=wiz(dragOver);
  const ok=b ? (b.rank===a.rank&&a.rank<TOPRANK) : true;
  el.classList.add(ok?"over":"overbad");
}
function actOn(from,to){
  if(from<0||to<0||from===to) return;
  const A=wiz(from), B=wiz(to);
  if(!A) return;
  if(!B){ moveWiz(from,to); return; }
  if(A.rank>=TOPRANK){
    toast(WRANK[A.rank].nm+" is already the highest rank");
  } else if(B.rank!==A.rank){
    toast("Two "+WRANK[A.rank].nm+"s merge — that one is "+WRANK[B.rank].nm);
  } else { mergeWiz(from,to); return; }
  wizSel=from; syncWizGrid(); syncWizPanel();
}
(function wizInput(){
  let down=-1, sx=0, sy=0, moved=false, id=null;
  wgridEl.addEventListener("pointerdown",e=>{
    if(camBusy>0) return;
    const c=e.target.closest(".wcell"); if(!c) return;
    e.preventDefault();
    down=+c.dataset.i; sx=e.clientX; sy=e.clientY; moved=false; id=e.pointerId;
    dragOver=-1; toStage(e);
    try{ wgridEl.setPointerCapture(e.pointerId); }catch(err){}
  },{passive:false});
  const toStage=e=>{
    const st=document.getElementById("wizStage").getBoundingClientRect();
    dragX=e.clientX-st.left; dragY=e.clientY-st.top;
  };
  wgridEl.addEventListener("pointermove",e=>{
    if(down<0||e.pointerId!==id) return;
    if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)>7){ moved=true; wizDrag=wiz(down)?down:-1; }
    if(!moved) return;
    toStage(e);
    const over=cellFromPoint(e.clientX,e.clientY);
    if(over!==dragOver){ dragOver=over; paintDragHint(down); }
  },{passive:false});
  const end=e=>{
    if(down<0||e.pointerId!==id) return;
    const from=down; down=-1; id=null; wizDrag=-1; dragOver=-1; clearDragHint();
    if(moved){
      const to=cellFromPoint(e.clientX,e.clientY);
      if(to>=0&&to!==from&&wiz(from)) actOn(from,to);
      else { syncWizGrid(); syncWizPanel(); }
      return;
    }
    if(from===CHEST){ openCase(); return; }
    // a plain tap only ever selects — merging is a drag, so the two never fight
    if(wiz(from)){
      if(wizSel===from){                     // tap your selection again to force a cast
        const z=WZ[from];
        if(z.t>0.02&&!z.held){ z.t=0; tick(680,.08); haptic(7); }
      }
      wizSel=from; syncWizGrid(); syncWizPanel();
    }
    else { wizSel=-1; syncWizGrid(); syncWizPanel(); }
  };
  wgridEl.addEventListener("pointerup",end);
  wgridEl.addEventListener("pointercancel",()=>{ down=-1; id=null; wizDrag=-1; dragOver=-1; clearDragHint(); syncWizGrid(); });
})();

/* The handle sits on the dish floor, so tapping it kicks whatever has settled
   down there back up into play. Purely a shove — no mass changes hands. */
function slingshot(){
  const ox=W*.5, oy=AR.y1, R=Math.min(W*.62, 270*S);
  let n=0;
  for(const o of balls){
    const dx=o.x-ox, dy=o.y-oy, d=Math.hypot(dx,dy);
    if(d>R+o.r) continue;
    const f=1-clamp(d/(R+o.r),0,1);
    o.vy-=(250+540*f)*S;
    o.vx+=(dx/(d||1))*170*S*f;
    o.wob=Math.max(o.wob,.20);
    n++;
  }
  if(!n) return;
  rings.push({x:ox,y:oy,r:14*S,R:R*.92,t:0,life:.44,col:"#9FB6D6",w:3});
  for(let i=0;i<12;i++) spark(ox+rnd(-R*.55,R*.55), oy-rnd(0,10*S), "#CFE0F4");
  noiseHit(.34,{vol:.15,cut:900,to:3.2,wet:.26});
  pop(150,{vol:.09,wet:.3});
  pop(300,{vol:.07,wet:.3,delay:.05});
  haptic(16);
}

let dockTracking=false;
function setDockMin(min,quiet){
  const dock=$("dock");
  if(!!G.opt.dockMin===!!min && !quiet) return;
  G.opt.dockMin=!!min;
  dock.classList.toggle("min",!!min);
  save(); obsChanged();
  if(!quiet){ tick(min?420:560,.07); slingshot(); }
  // Only the dish floor moves. resize() would reallocate and clear every
  // canvas on each frame, which is what made this stutter and made the
  // balls look like they were being reset.
  if(dockTracking) return;
  dockTracking=true;
  const t0=now();
  const track=()=>{
    AR.y1=H-dock.offsetHeight;
    if(now()-t0<430) requestAnimationFrame(track);
    else { dockTracking=false; AR.y1=H-dock.offsetHeight; }
  };
  requestAnimationFrame(track);
}
(function dockToggle(){
  $("dock").classList.toggle("min",!!G.opt.dockMin);
  $("dockHandle").onclick=()=>setDockMin(!G.opt.dockMin);
})();
document.getElementById("goUp").onclick=()=>goRoom("wiz");
document.getElementById("goDown").onclick=()=>goRoom("arena");
/* swipe down works in the wizard room; the arena keeps swipe for cleaving */
(function wizSwipe(){
  let y0=0,act=false;
  roomWiz.addEventListener("pointerdown",e=>{
    // only a drag on bare room counts; tapping a wizard must not arm the swipe
    act=!e.target.closest(".wcell,button,#wizChrome");
    y0=e.clientY;
  });
  roomWiz.addEventListener("pointerup",e=>{
    if(act&&e.clientY-y0>70) goRoom("arena");
    act=false;
  });
})();

buildRails(); buildTabs(); syncTop(); syncRails();
$("introHint").textContent = G.totalEarned>0
  ? "Banked "+fmt(G.totalEarned)+" · Strain "+ROMAN[G.strain] : "";
/* ---------------------------------------------------------------- tutorial
   Opt-in only: nothing here runs unless the player asks for it. Each beat
   parks the camera in the room it talks about and drops the ball it needs. */
function tutBall(kind,tier){
  const cls=WRANK[0], rr=tierRadius(tier,cls);
  balls.push(makeBall(tier, clamp(W*.5,rr+2,W-rr-2), AR.y0+(AR.y1-AR.y0)*.34,
                      rnd(-14,14)*S, 40*S, cls, undefined, kind));
}
const TUT=[
  {room:"arena", t:"Tap a ball, it splits",
   s:"Here is one. Every tap breaks it into two smaller ones — and the smallest rung is the one that actually pays out cash. Swipe across several to cleave a whole line at once.",
   go(){ tutBall("plain",0); }},
  {room:"wiz",   t:"Wizards do the dropping",
   s:"Each one casts a ball on its own timer, so the dish fills while you are away. A wizard’s column decides which lane its balls fall down — line them up and their balls meet and fuse, spread them out and they will not.",
   go(){}},
  {room:"arena", t:"Meet Chompy",
   s:"This is Chompy. He drifts around the dish on his own, pulling balls together so they merge, and swallowing the small ones whole. Feed him Size and he can take on bigger ones. You can change how he looks in the Store, under Cosmetics.",
   go(){
     // make sure there is one to look at, even on a fresh run
     if(!bhOn()) G.up.pulse=Math.max(1,G.up.pulse|0);
     BH.init=false;
     tutBall("plain",6); tutBall("plain",6);
   }},
  {room:"arena", t:"Some of them are unstable",
   s:"A pale ball ringed with pulsing spokes is unstable. It will not fuse with anything, and tapping it does not split it — it detonates, and takes whatever is nearby with it. Useful on a crowded dish, expensive on a tidy one.",
   go(){ tutBall("unstable",2); }},
];
let tutI=-1;
function tutShow(){
  const st=TUT[tutI], moving=(room!==st.room);
  if(moving) goRoom(st.room);
  $("tutStep").textContent="Step "+(tutI+1)+" of "+TUT.length;
  $("tutT").textContent=st.t;
  $("tutS").textContent=st.s;
  $("tutNext").textContent=(tutI===TUT.length-1)?"Got it":"Next";
  setTimeout(()=>{ if(tutI>=0 && st.go) st.go(); }, moving?470:80);
  $("tut").classList.add("on");
}
function tutStart(){ if(!ready) begin(); tutI=0; tutShow(); }
function tutNext(){ if(++tutI>=TUT.length) return tutEnd(); tutShow(); }
function tutEnd(){ tutI=-1; $("tut").classList.remove("on"); }

$("tutSkip").onclick=tutEnd;
$("howto").onclick=tutStart;

if(G.totalEarned>0) $("begin").textContent="Resume";
$("sporeWrap").onclick=()=>{ if(!ready) return; G.stTab="cos"; sheetShop(); };
$("wizUpBtn").onclick=sheetWizards;
$("case").onclick=e=>{ if(e.target.id==="case"&&!caseBusy) $("case").classList.remove("on"); };
holdRepeat($("summonBtn"),function(){
