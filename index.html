<meta charset="utf-8">
<title>Mitosis</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,minimum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mitosis">
<meta name="description" content="Split balls for cash, let matching colours fuse, and send your wizards to work.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">

<style>
:root{
  --ground:#FFFFFF;
  --shell:#E7ECF3;
  --surface:#F4F7FA;
  --panel:#FFFFFF;
  --ink:#0F1720;
  --ink-2:#5C6979;
  --ink-3:#95A2B2;
  --edge:rgba(15,23,32,.10);
  --edge-2:rgba(15,23,32,.20);
  --blue:#2F6BFF;
  --purple:#9B3DFF;
  --red:#FF3B57;
  --yellow:#E8A200;
  --mint:#0FB981;
  --orange:#FF6B2C;
  --shadow:0 1px 2px rgba(15,23,32,.05), 0 4px 14px rgba(15,23,32,.07);
  --shadow-up:0 -2px 10px rgba(15,23,32,.05), 0 -16px 44px rgba(15,23,32,.09);
  --dock-h:152px;
  --top-h:calc(58px + env(safe-area-inset-top));
  --sym:"Segoe UI Symbol","Apple Symbols";
  /* one family, five weights: 800 page titles, 700 section titles and numbers,
     600 buttons and names, 500 small labels, 400 body */
  --font:"Poppins",system-ui,-apple-system,var(--sym),sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{
  height:100%;width:100%;overflow:hidden;position:fixed;
  overscroll-behavior:none;touch-action:none;-webkit-text-size-adjust:100%;
}
body{
  background:var(--shell);
  color:var(--ink);
  font-weight:400;
  font-family:var(--font);
  font-size:13px;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  touch-action:none;overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input{font:inherit;color:inherit}
.mono-n{font-variant-numeric:tabular-nums}

/* ============ frame ============ */
#app{
  position:fixed;top:0;bottom:0;left:0;right:0;margin-inline:auto;
  width:min(100vw,560px);overflow:hidden;
  background:var(--ground);
  box-shadow:0 0 60px rgba(15,23,32,.14);
}
#bg,#goo,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
.skin canvas,.bcard canvas{position:static;display:block}
#bg{z-index:1}
/* true metaballs: blur, then threshold ALPHA so touching balls fuse and
   pull a neck between them — the magnetised look */
#goo{z-index:2;filter:url(#gooF)}
#app.lowfx #goo{filter:none;opacity:.9}
#fx{z-index:3}
#burst{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:26;pointer-events:none}

/* ============ the camera ============ */
#world{
  position:absolute;left:0;right:0;top:0;height:200%;
  transform:translateY(-50%);
}
#world.slide{transition:transform .38s cubic-bezier(.32,.72,.24,1)}
#world.moving{will-change:transform}
.room{position:absolute;left:0;right:0;height:50%;overflow:hidden}
#roomWiz{top:0}
#roomArena{top:50%}
/* ============ room arrows ============ */
#goUp,#goDown{
  position:absolute;left:0;right:0;margin-inline:auto;width:max-content;z-index:6;
  display:flex;align-items:center;gap:6px;
  padding:7px 15px 7px 12px;border-radius:999px;
  background:var(--panel);border:1px solid var(--edge);box-shadow:var(--shadow);
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);
  white-space:nowrap;
}
#goUp{top:calc(var(--top-h) + 6px)}
/* back to the dish is the way out of the tower, so it earns its size */
#goDown{
  position:relative;left:auto;transform:none;margin:0 auto;
  width:auto;flex:1 1 auto;max-width:220px;
  padding:11px 16px;border-radius:13px;border:0;justify-content:center;
  background:linear-gradient(180deg,#4C8DFF,#2563EB);color:#fff;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.34),0 3px 0 #1A47A8,0 6px 14px rgba(37,99,235,.34);
  font-size:11px;letter-spacing:.12em;font-weight:600;
}
#goDown svg{width:15px!important;height:15px!important;stroke:#fff!important}
#goDown:active{transform:translateY(3px);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.34),0 0 0 #1A47A8,0 2px 6px rgba(37,99,235,.34)}
#goUp svg,#goDown svg{width:14px;height:14px;flex:none;stroke:var(--ink);fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#goUp:active{transform:scale(.94)}
#goDown:active{transform:scale(.94)}
#goUp .dot{
  position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;
  background:var(--red);border:2px solid var(--panel);display:none;
}
#goUp.alert .dot{display:block}

/* ============ wizard stage ============ */
#wizStage{
  position:absolute;left:0;right:0;
  top:calc(var(--top-h) + 2px);bottom:calc(178px + env(safe-area-inset-bottom));
  display:grid;place-items:center;padding:6px 10px;z-index:2;
}
#wgrid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:5px;
  width:100%;max-width:min(100%, calc((var(--cellH,84px) + 5px) * 4));
}
#wfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

/* ============ the tower ============ */
/* White, like the rest of the game. The castle is the brickwork the wizards
   stand on, drawn on the canvas so it can have real courses and crenels. */
#roomWiz{background:var(--wizBg,#FFFFFF)}
#roomWiz::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:16px;
  background:linear-gradient(180deg,rgba(16,22,37,0),rgba(16,22,37,.10));
  pointer-events:none;z-index:3;
}

/* the cell is mostly an invisible hit target — the brick does the work */
.wcell{
  aspect-ratio:1/1;
  border-radius:14px;border:0;background:transparent;
  position:relative;display:block;overflow:visible;padding:0;
  transition:transform .12s, box-shadow .16s;
}
.wcell.sel{box-shadow:inset 0 0 0 2.5px #E8B21B, 0 0 0 3px rgba(232,178,27,.22);background:rgba(232,178,27,.06)}
.wcell.tgt{box-shadow:inset 0 0 0 2.5px var(--mint), 0 0 0 3px rgba(15,185,129,.20);background:rgba(15,185,129,.07)}
.wcell.move{box-shadow:inset 0 0 0 2px rgba(16,22,37,.22)}
.wcell.held{box-shadow:inset 0 0 0 2px rgba(217,130,28,.42)}
.wcell.drag{box-shadow:inset 0 0 0 2px rgba(16,22,37,.16)}
.wcell.over{box-shadow:inset 0 0 0 3px var(--mint), 0 0 0 4px rgba(15,185,129,.24);background:rgba(15,185,129,.10)}
.wcell.overbad{box-shadow:inset 0 0 0 2.5px rgba(224,59,84,.5);background:rgba(224,59,84,.07)}
.wcell:active{transform:scale(.97)}

.wcell .plus{
  position:absolute;left:0;right:0;top:16%;height:46%;
  display:grid;place-items:center;
  font-size:21px;color:rgba(16,22,37,.20);line-height:1;pointer-events:none;
}
.wcell .pips{position:absolute;top:5px;left:6px;display:flex;gap:2.5px;pointer-events:none;z-index:2}
.wcell .pips i{width:4px;height:4px;border-radius:50%;display:block;background:currentColor;opacity:.28}
.wcell .pips i.on{opacity:1}
.wcell .lv{
  position:absolute;top:4px;right:5px;pointer-events:none;z-index:2;
  font-family:var(--font);
  font-size:8.5px;font-weight:800;line-height:1;padding:3.5px 7px;border-radius:99px;
  background:linear-gradient(180deg,#FFE79A 0%,#F5C53A 42%,#D99B0E 100%);
  color:#3B2A02;letter-spacing:.02em;
  border:1px solid #A9760A;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),
             inset 0 -1px 0 rgba(120,84,6,.35),
             0 1px 2px rgba(16,22,37,.28);
  font-variant-numeric:tabular-nums;
  text-shadow:0 1px 0 rgba(255,255,255,.45);
}

#wizChrome{
  position:absolute;left:0;right:0;bottom:0;
  height:calc(178px + env(safe-area-inset-bottom));
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;
  background:var(--panel);border-top:1px solid var(--edge);box-shadow:var(--shadow-up);
}
#arenaStrip{display:flex;align-items:center;gap:9px;font-size:9px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
#apBar{flex:1;height:5px;border-radius:99px;background:#E4E9F1;overflow:hidden}
#apBar i{display:block;height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,var(--mint),var(--yellow));transition:width .2s}
#apBar.hot i{background:linear-gradient(90deg,var(--orange),var(--red))}
#arenaStrip .v{font-variant-numeric:tabular-nums;color:var(--ink-2);letter-spacing:0}

#wizPanel{display:flex;flex-direction:column;gap:7px;height:104px;justify-content:center}
.wpRow{height:44px}
.wpHint{min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.wpSummon{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:14px 16px;border-radius:15px;border:0;
  background:linear-gradient(180deg,#FFDE7A,#F5B301 46%,#DC9A05);color:#3D2B02;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(120,84,6,.28),
             0 3.5px 0 #A9760A,0 6px 14px rgba(180,120,0,.3);
  font-size:14px;letter-spacing:.05em;
  font-family:var(--font);font-weight:800;font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;
}
.wpSummon small{font-weight:600;font-size:11px;opacity:.8;letter-spacing:.02em;text-transform:none}
.wpSummon.no{background:linear-gradient(180deg,#F4F7FA,#E6ECF3);color:var(--ink-3);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),0 3px 0 #CBD5E1,0 5px 11px rgba(16,22,37,.14)}
.wpSummon:active{transform:translateY(3.5px);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 0 0 #A9760A,0 2px 6px rgba(180,120,0,.3)}
.wpHint{font-size:10.5px;color:var(--ink-3);line-height:1.5;text-align:center;padding:2px 6px 1px}
.wpHint b{color:var(--ink-2);font-weight:600}
.wpEmpty{font-size:11px;color:var(--ink-3);text-align:center;line-height:1.6}
.wpRow{display:flex;align-items:center;gap:11px}
.wpRow .portrait{
  width:44px!important;height:44px!important;flex:none;display:block;
  position:static;border-radius:11px;background:var(--surface);
}
.wpRow .l{flex:1;min-width:0}
.wpRow .t{font-family:var(--font);font-weight:700;font-size:14px;line-height:1.15}
.wpRow .s{font-size:9.5px;color:var(--ink-3);line-height:1.5;margin-top:1px}
.wpBtn{
  padding:10px 14px;border-radius:11px;background:var(--ink);color:#fff;flex:none;
  font-family:var(--font);font-weight:700;font-size:11px;
  letter-spacing:.05em;text-transform:uppercase;text-align:center;line-height:1.25;
}
.wpBtn.no{background:var(--surface);color:var(--ink-3)}
.wpBtn small{display:block;font-size:9px;font-weight:500;opacity:.78;letter-spacing:.02em;text-transform:none}
.wpBtn:active{transform:scale(.96)}

/* ============ top bar ============ */
#top{
  position:absolute;z-index:8;top:0;left:0;right:0;height:var(--top-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:env(safe-area-inset-top) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));
  gap:10px;pointer-events:none;
  background:linear-gradient(180deg,var(--dishTop,#fff) 0%,var(--dishTop,#fff) 46%,transparent 100%);
  color:var(--topInk,#0F1720);
}
.cur{display:flex;align-items:center;gap:7px;pointer-events:auto}
.pip{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none;color:#fff}
/* the money reads as money: a banknote on pale green, the amount in deep
   green and set much larger than anything else on the bar */
.pip.bio{background:#DCFCE7;border-radius:9px;width:32px;height:25px}
.pip.bio svg{fill:#16A34A;width:20px;height:20px}
#bioWrap .n{color:#16A34A;font-size:36px;font-weight:800;letter-spacing:-.035em;
  transition:font-size .18s ease}
#bioWrap.l4 .n{font-size:33px}
#bioWrap.l5 .n{font-size:30px}
#bioWrap.l6 .n{font-size:26px}
#bioWrap .n .u{opacity:.62;font-size:.5em}
.pip.spore{background:linear-gradient(140deg,#6FC3FF,#2F6BFF)}
.cur .n{font-family:var(--font);font-weight:800;font-size:23px;line-height:1;
  letter-spacing:-.032em;font-variant-numeric:tabular-nums lining-nums;
  font-feature-settings:"tnum" 1,"lnum" 1;
  display:inline-flex;align-items:baseline}
/* the magnitude is not part of the number — set it down a step */
.cur .n .u{font-size:.56em;font-weight:700;letter-spacing:.03em;opacity:.48;
  margin-left:.13em;font-variant-numeric:normal}
/* the mana chip: pressable, and it says where it goes */
.gemBtn{
  border:0;padding:4px 5px 4px 4px;border-radius:999px;
  background:linear-gradient(180deg,#5AA8FF,#2563EB);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),0 2.5px 0 #1A47A8,0 4px 10px rgba(16,22,37,.22);
  display:flex;align-items:center;gap:6px;
  transition:transform .1s ease, box-shadow .1s ease;
}
.gemBtn:active{transform:translateY(2.5px);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),0 0 0 #1A47A8,0 2px 5px rgba(16,22,37,.22)}
.gemBtn .pip.spore{background:transparent;width:20px;height:20px}
.gemBtn .pip.spore svg{fill:#fff;width:15px;height:15px}
#sporeWrap .n{font-size:16px;letter-spacing:-.01em;color:#fff}
.gemBtn .plus{
  width:19px;height:19px;border-radius:50%;background:rgba(255,255,255,.24);color:#fff;
  display:grid;place-items:center;font-size:13px;line-height:1;font-weight:700;flex:none;
}
.pip svg{width:13px;height:13px;display:block;fill:#fff}
#sporeWrap .pip svg{width:12px;height:12px}

/* ============ rails ============ */
.rail{position:absolute;z-index:5;display:flex;flex-direction:column;gap:12px}
#railL{left:calc(10px + env(safe-area-inset-left));top:calc(var(--top-h) + 8px)}
/* everything on the right sits on one centre line: the profile card is the
   widest thing there, so the column is its width and the rest centres in it */
#railR{right:calc(10px + env(safe-area-inset-right));top:calc(var(--top-h) + 8px);
  align-items:center;width:68px}
/* each button carries its own colour in --c and its glyph colour in --ic; the
   lip and sheen are derived so one variable sets the whole button */
.orb{
  --c:#232B39; --ic:#fff;
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;
  border:0;padding:0;color:var(--ic);
  background:var(--c);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--c) 84%, white) 0%,
    var(--c) 46%,
    color-mix(in srgb, var(--c) 88%, black) 100%);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.34),
    inset 0 -2px 0 rgba(0,0,0,.13),
    0 3px 0 rgba(0,0,0,.34),
    0 5px 11px rgba(16,22,37,.22);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.34),
    inset 0 -2px 0 rgba(0,0,0,.13),
    0 3px 0 color-mix(in srgb, var(--c) 66%, black),
    0 5px 11px rgba(16,22,37,.22);
  transition:transform .1s ease, box-shadow .1s ease;
}
/* it travels down onto its own lip rather than shrinking */
.orb:active{
  transform:translateY(3px);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.30),
    inset 0 -2px 0 rgba(0,0,0,.13),
    0 0 0 rgba(0,0,0,.34),
    0 2px 5px rgba(16,22,37,.22);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.30),
    inset 0 -2px 0 rgba(0,0,0,.13),
    0 0 0 color-mix(in srgb, var(--c) 66%, black),
    0 2px 5px rgba(16,22,37,.22);
}
.orb svg{width:21px;height:21px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.orb .dot{position:absolute;top:-1px;right:-1px;width:12px;height:12px;border-radius:50%;
  background:#FF3B47;box-shadow:0 1px 2px rgba(16,22,37,.3);display:none}
/* the shop shouts about whatever is on the shelf, the way the reference does */
.orb .pill{position:absolute;top:-9px;right:-8px;display:none;border:1.5px solid var(--panel);
  font-family:var(--font);font-weight:700;
  font-size:7px;letter-spacing:.1em;padding:2.5px 6px;border-radius:99px;color:#fff;
  box-shadow:0 1.5px 4px rgba(16,22,37,.35)}
.orb.pill-epic .pill{display:block;background:linear-gradient(180deg,#F472B6,#DB2777)}
.orb.pill-deal .pill{display:block;background:linear-gradient(180deg,#38BDF8,#0284C7)}
.orb.alert .dot{display:block}
.pw{
  --c:#FFFFFF;
  width:46px;height:46px;border-radius:15px;position:relative;
  border:0;padding:0;
  background:linear-gradient(180deg,#FFFFFF 0%,#F7FAFD 48%,#E9EFF6 100%);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.9),
    0 3px 0 #C9D4E2,
    0 5px 11px rgba(16,22,37,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:transform .1s ease, box-shadow .1s ease;
}
.pw:active{transform:translateY(3px);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 0 0 #C9D4E2,0 2px 5px rgba(16,22,37,.18)}
.pw .g{font-size:15px;line-height:1;color:var(--ink)}
.pw .l{font-size:7px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
/* the cooldown covers the face rather than printing over the label, and it
   has to carry the button's own radius now that the button no longer clips */
.pw .cd{position:absolute;inset:0;border-radius:15px;display:grid;place-items:center;
  background:rgba(238,243,249,.94);
  font-family:var(--font);font-weight:600;
  font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pw.ready{background:linear-gradient(180deg,#FFF6DE 0%,#FFEFC4 48%,#FFE39A 100%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 3px 0 #D9A518,0 5px 11px rgba(180,120,0,.24)}
.pw.ready .l{color:var(--yellow)}
.pw.active{background:linear-gradient(180deg,#E6FCF3 0%,#CFF7E6 48%,#A9EDD2 100%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 3px 0 #0FB981,0 5px 11px rgba(15,185,129,.26)}
.pw.locked{opacity:.7}
.pw.locked .l{color:var(--yellow);font-size:8px;letter-spacing:.02em}
.pw.locked .g{opacity:.4}
.railSep{display:block;width:22px;height:1px;background:var(--edge-2);margin:1px auto;flex:none}
/* the left rail's powers cost a watch rather than mana, so the badge is not
   a hint that appears on a cooldown — it is the price, and it always shows */
.adpw .adb{display:grid!important;opacity:1}
.adpw.locked{opacity:.5}
.adpw.locked .adb{opacity:.35}
.adpw .cd{background:rgba(238,243,249,.94)}
/* the right rail is six deep now, and on a short screen that ran it into
   the dock. It gives up size before it gives up a button. */
@media (max-height:700px){
  .rail{gap:7px}
  .orb{width:38px;height:38px}
  .orb svg{width:18px;height:18px}
  #railR{width:58px}
  #railR .pw{width:38px;height:38px;border-radius:12px}
  .prof{width:58px;padding:6px 5px 7px}
  .prof .lv{font-size:14px}
  #railR .pw .g{font-size:13px}
  #railR .pw .l{font-size:6px}
  #railR .pw .cd{border-radius:12px;font-size:11px}
}
@media (max-height:610px){
  .rail{gap:5px}
  .orb{width:35px;height:35px}
  .orb svg{width:17px;height:17px}
  #railR .pw{width:35px;height:35px;border-radius:11px}
  #railR .pw .l{display:none}
  #railR .pw .cd{border-radius:11px;font-size:10px}
}

/* ============ hud text ============ */
#combo{
  position:absolute;z-index:5;left:50%;top:calc(var(--top-h) + 62px);
  transform:translateX(-50%) scale(.8);
  font-family:var(--font);font-weight:700;
  font-size:34px;letter-spacing:-.01em;
  color:var(--cg,#E8A200);opacity:0;pointer-events:none;
  transition:opacity 1.5s ease;
  font-variant-numeric:tabular-nums;
  -webkit-text-stroke:2.5px rgba(255,255,255,.92);paint-order:stroke fill;
  text-shadow:0 3px 0 rgba(255,255,255,.75), 0 0 22px var(--cg,#E8A200);
}
/* overshoot, drift up, settle — a flat scale-in read as a number changing
   rather than something being won */
#combo.on{opacity:1;animation:comboPop .54s cubic-bezier(.22,1.5,.34,1) forwards}
@keyframes comboPop{
  0%  {opacity:0;transform:translateX(-50%) translateY(14px) scale(.58)}
  34% {opacity:1;transform:translateX(-50%) translateY(-7px) scale(1.26)}
  62% {opacity:1;transform:translateX(-50%) translateY(-1px) scale(.96)}
  100%{opacity:1;transform:translateX(-50%) translateY(-3px) scale(1)}
}
#combo.max{animation:comboPop .54s cubic-bezier(.22,1.5,.34,1) forwards,
                     comboMaxed 1.1s ease-in-out .54s infinite}
@keyframes comboMaxed{50%{text-shadow:0 3px 0 rgba(255,255,255,.75), 0 0 34px var(--cg,#E8A200)}}
#banner{
  position:absolute;z-index:6;left:50%;top:38%;transform:translate(-50%,-50%);
  font-family:var(--font);font-weight:800;font-size:clamp(26px,8vw,44px);
  opacity:0;pointer-events:none;white-space:nowrap;text-align:center;color:var(--topInk,#0F1720);
  text-shadow:0 3px 22px rgba(255,255,255,.95);
}
#toast{
  position:absolute;z-index:9;left:50%;bottom:calc(var(--chrome-b,152px) + 14px);
  transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:999px;font-size:11px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ dock ============ */
#dockHandle{
  position:absolute;top:-52px;left:0;right:0;margin-inline:auto;
  width:40px;height:40px;border-radius:50%;padding:0;
  background:var(--panel);border:1px solid var(--edge);
  box-shadow:var(--shadow);
  display:grid;place-items:center;z-index:6;
  animation:handleBob 3.6s ease-in-out infinite;
  transition:transform .12s cubic-bezier(.2,1.7,.4,1);
}
@keyframes handleBob{50%{translate:0 -4px}}
#dockHandle .ah{display:grid;place-items:center;line-height:0}
/* how long until the next one is loaded. It fills as the chamber does and
   drains the instant it fires. */
#vBar{
  position:absolute;left:50%;transform:translateX(-50%);bottom:-8px;
  transition:bottom .26s cubic-bezier(.3,.8,.3,1), top .26s cubic-bezier(.3,.8,.3,1);
  width:24px;height:3px;border-radius:99px;overflow:hidden;
  background:rgba(15,23,32,.11);
}
#vBar b{display:block;height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,#7CB2FF,#2F6BFF);
  transition:width .1s linear}
#vBar.full b{background:linear-gradient(90deg,#8FE3FF,#2F6BFF)}
#dockHandle svg{width:19px;height:19px;stroke:var(--ink-2);fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .26s cubic-bezier(.3,.8,.3,1)}
#dock.min #dockHandle svg{transform:rotate(180deg)}
#dock.min #vBar{bottom:auto;top:-8px}
#dockHandle:active{transform:scale(.9)}
#dock{
  position:absolute;z-index:5;left:0;right:0;bottom:0;
  height:calc(var(--dock-h) + env(safe-area-inset-bottom));
  transition:height .26s cubic-bezier(.3,.8,.3,1);
  background:var(--panel);border-top:1px solid var(--edge);box-shadow:var(--shadow-up);
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);
}
#tabs{display:flex;height:var(--tab-h,38px);flex:none;border-bottom:1px solid var(--edge);
  overflow-x:auto;scrollbar-width:none;
  transition:opacity .26s ease,visibility .26s}
/* collapsed leaves the tabs standing, so the upgrades fold into the tab
   they belong to rather than the whole shelf disappearing */
#dock.min{height:calc(var(--tab-h,38px) + env(safe-area-inset-bottom))}
#dock.min #cards{opacity:0;visibility:hidden;pointer-events:none}
#cards{transition:opacity .26s ease,visibility .26s}
#tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 auto;min-width:0;padding:0 8px;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:4px;
  font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap;
}
.tab .g{font-size:11px;opacity:.7}
.tab.on{color:var(--ink);border-bottom-color:var(--accent,var(--blue))}
.tab.on .g{opacity:1}
.tab.hot{color:var(--yellow)}
#cards{flex:1;display:flex;gap:8px;padding:9px 10px;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;align-items:stretch}
#cards::-webkit-scrollbar{display:none}
.card{
  flex:0 0 84px;border-radius:13px;padding:8px 6px 7px;
  background:var(--panel);border:1px solid var(--edge);box-shadow:0 1px 2px rgba(15,23,32,.05);
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;
  transition:transform .1s,border-color .15s,background .15s;text-align:center;
}
.card:active{transform:scale(.95)}
.card.held{border-color:rgba(34,197,94,.6);
  box-shadow:0 0 0 2px rgba(34,197,94,.16),0 1px 2px rgba(15,23,32,.05)}
/* --sh climbs from 0 to 1 over the first eight buys, so the shake builds
   with the run instead of arriving at full strength */
.held{animation:buyShake .15s linear infinite}
@keyframes buyShake{
  0%  {transform:translate(0,0) scale(.955) rotate(0deg)}
  25% {transform:translate(calc(var(--sh,0) * -1.7px), calc(var(--sh,0) * .5px))
                scale(.955) rotate(calc(var(--sh,0) * -.75deg))}
  50% {transform:translate(0, calc(var(--sh,0) * 1.3px)) scale(.95) rotate(0deg)}
  75% {transform:translate(calc(var(--sh,0) * 1.7px), calc(var(--sh,0) * .5px))
                scale(.955) rotate(calc(var(--sh,0) * .75deg))}
  100%{transform:translate(0,0) scale(.955) rotate(0deg)}
}
/* the reference keeps a card you can afford plain — white face, black price.
   Green is reserved for the one offering an ad, so it stands out. */
.card.afford{border-color:var(--edge-2);background:var(--panel)}
.card.maxed{border-color:rgba(15,185,129,.5);background:#F0FCF8}
.card .lv{position:absolute;top:5px;right:7px;font-size:9.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;font-weight:500}
.card .g{font-size:15px;line-height:1;color:var(--ink)}
.card .g svg,.pw .g svg,.tab .g svg{width:1.15em;height:1.15em;display:block}
/* the level ring: progressive, so a card shows how far along it is at a glance */
.card .gw{position:relative;width:30px;height:30px;display:grid;place-items:center;
  margin-top:1px;flex:none}
.card .ring{position:absolute;inset:0;width:100%;height:100%;
  transform:rotate(-90deg);overflow:visible}
.card .ring circle{fill:none;stroke-width:3}
.card .rbg{stroke:var(--edge)}
.card .rfg{stroke:var(--yellow);stroke-linecap:round;
  stroke-dasharray:106.81;stroke-dashoffset:106.81;
  transition:stroke-dashoffset .5s cubic-bezier(.2,.9,.25,1),stroke .3s}
.card.maxed .rfg{stroke:var(--mint)}
.card.afford .rfg{stroke:var(--ink-2)}
/* name reads first, price second, level last — the reference's order */
.card .nm{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);
  line-height:1.2;font-weight:600}
.card .ef{font-size:9.5px;font-weight:500;color:var(--ink-2);line-height:1.2;
  font-variant-numeric:tabular-nums}
.card .ct{margin-top:auto;font-size:13px;font-weight:700;color:var(--ink);
  font-family:var(--font);
  font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px}
.card.afford .ct{color:var(--ink)}
.card.maxed .ct{color:var(--mint)}
.card .ct i{width:7px;height:7px;border-radius:50%;background:#D99B0E;display:block;font-style:normal}
/* the two currency marks, same shapes as the HUD pips, at text size */
.cico{width:1em;height:1em;display:inline-block;vertical-align:-.13em;fill:currentColor;flex:none}

/* ball-shop cards */
.bcard{flex:0 0 96px}
.bcard .orbimg{width:30px!important;height:30px!important;margin:3px auto 1px;align-self:center;flex:none;display:block}
.bcard .taps{position:absolute;top:5px;left:6px;font-size:8px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bcard.dropping{border-color:rgba(15,185,129,.6);background:#F0FCF8}
.bcard.locked .orbimg{filter:grayscale(1) opacity(.4)}

/* prestige card */
.pcard{
  flex:1 1 auto;border-radius:15px;padding:11px 13px;
  background:linear-gradient(125deg,#F4F6FF 0%,#FBF3FF 55%,#FFF6F2 100%);
  border:1px solid rgba(47,107,255,.22);
  box-shadow:0 1px 2px rgba(16,22,37,.05);
  display:flex;align-items:center;gap:12px;text-align:left;min-width:0;
  transition:box-shadow .25s,border-color .25s;
}
.pcard.ready{
  border-color:rgba(232,178,27,.55);
  box-shadow:0 0 0 2px rgba(232,178,27,.16), 0 2px 10px rgba(232,178,27,.16);
  animation:readyGlow 2.2s ease-in-out infinite;
}
@keyframes readyGlow{50%{box-shadow:0 0 0 4px rgba(232,178,27,.10), 0 2px 14px rgba(232,178,27,.24)}}
.pcard .prev{
  flex:none;width:46px;height:46px;border-radius:13px;
  display:grid;place-items:center;
  background:rgba(255,255,255,.72);border:1px solid rgba(16,22,37,.07);
}
.pcard .prev canvas{position:static;display:block}
.pcard .l{flex:1;min-width:0}
.pcard .k{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.pcard .t{font-family:var(--font);font-weight:800;font-size:20px;
  line-height:1.1;letter-spacing:-.02em;margin-top:1px}
.pcard .m{font-size:9.5px;color:var(--ink-2);line-height:1.45;margin-top:2px}
.pcard .m b{color:var(--orange);font-weight:400}
.pcard .pgw{display:flex;align-items:center;gap:8px;margin-top:6px}
.pcard .pg{flex:1;height:5px;border-radius:99px;background:rgba(16,22,37,.09);overflow:hidden;min-width:0}
.pcard .pg i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .3s}
.pcard.ready .pg i{background:linear-gradient(90deg,#F5C53A,#E8901B)}
.pcard .pgn{font-size:8.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
  white-space:nowrap;letter-spacing:.02em}
.pbtn{flex:none;padding:9px 16px;border-radius:11px;background:var(--ink);color:#fff;
  font-family:var(--font);font-weight:800;font-size:12px;
  letter-spacing:.05em;text-transform:uppercase;text-align:center;line-height:1.25}
.pbtn small{display:block;font-size:9.5px;font-weight:600;opacity:.82;letter-spacing:.02em;text-transform:none}
.pbtn.no{background:var(--surface);color:var(--ink-3)}

/* ============ sheet ============ */
#scrim{position:absolute;inset:0;z-index:20;background:rgba(15,23,32,.34);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .22s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:absolute;z-index:21;left:0;right:0;bottom:0;max-height:88%;
  display:flex;flex-direction:column;background:var(--panel);
  border-radius:22px 22px 0 0;box-shadow:var(--shadow-up);
  transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.9,.25,1);
  padding-bottom:env(safe-area-inset-bottom);
}
#sheet.on{transform:translateY(0)}
#sheetHead{display:flex;align-items:center;gap:11px;padding:16px 16px 12px;flex:none;
  border-bottom:1px solid var(--edge)}
#sheetHead .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:var(--surface);font-size:15px;flex:none}
#sheetHead .tx{flex:1;min-width:0}
#sheetTitle{font-family:var(--font);font-weight:800;font-size:22px;line-height:1.15;
  letter-spacing:-.015em}
#sheetSub{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-top:3px}
#sheetClose{width:30px;height:30px;border-radius:50%;background:var(--surface);
  display:grid;place-items:center;flex:none;font-size:14px;color:var(--ink-2)}
#sheetBody::-webkit-scrollbar{width:4px}
#sheetBody::-webkit-scrollbar-thumb{background:rgba(15,23,32,.16);border-radius:9px}
#sheetBody::-webkit-scrollbar-track{background:transparent}
#sheetBody{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(15,23,32,.16) transparent;
  padding:14px 16px 22px;display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch}

#sheetBody > *{flex:0 0 auto}
.row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:13px;
  background:var(--panel);border:1px solid var(--edge);box-shadow:0 1px 2px rgba(15,23,32,.04)}
.row .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;
  background:var(--surface);flex:none}
.row .l{flex:1;min-width:0}
.row .t{font-size:12px;line-height:1.35}
.row .s{font-size:9.5px;color:var(--ink-3);line-height:1.45;margin-top:2px}
.row .v{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;flex:none}
.sw{width:42px;height:24px;border-radius:99px;background:#DCE3EC;position:relative;
  flex:none;transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(15,23,32,.25);transition:transform .18s}
.sw.on{background:#16C98D}
.sw.on::after{transform:translateX(18px)}
.pbar{height:5px;border-radius:99px;background:#E6EBF2;overflow:hidden;margin-top:7px}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .25s}
.claim{padding:8px 13px;border-radius:9px;background:#F5B301;color:#231A00;
  font-family:var(--font);font-weight:700;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;flex:none}
.claim.no{background:var(--surface);color:var(--ink-3)}
.secLbl{font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-3);margin:10px 2px 1px}
.row.sel{border-color:var(--mint);background:#F0FCF8}
.dangerBtn{padding:12px;border-radius:12px;border:1px solid rgba(255,59,87,.4);color:var(--red);
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:center;background:#FFF5F6}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:7px 11px;border-radius:9px;border:1px solid var(--edge);background:var(--panel);
  font-size:10px;letter-spacing:.06em;display:flex;align-items:center;gap:7px;
}
.chip.sel{border-color:var(--mint);background:#F0FCF8}
.chip .sw4{display:flex;gap:2px}
.chip .sw4 i{width:8px;height:8px;border-radius:50%;display:block}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.skin{
  border-radius:12px;border:1px solid var(--edge);background:var(--panel);
  padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:5px;
}
.skin.sel{border-color:var(--mint);background:#F0FCF8}
.skin canvas{width:44px;height:44px;display:block}
.skin .n{font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.skin .c{font-size:9px;color:var(--yellow);font-variant-numeric:tabular-nums}
.skin.own .c{color:var(--ink-3)}

/* ============ intro ============ */
#intro{
  position:absolute;inset:0;z-index:30;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  justify-content:safe center;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:26px 22px;
  background:
    radial-gradient(120% 70% at 50% 0%,rgba(124,58,237,.13),rgba(124,58,237,0) 60%),
    radial-gradient(110% 70% at 50% 100%,rgba(34,197,94,.13),rgba(34,197,94,0) 60%),
    rgba(247,249,252,.97);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  transition:opacity .4s;
}
/* opacity alone still swallows taps, so the faded intro was eating them */
#intro.hide{opacity:0;pointer-events:none}
#intro.hide .panel{pointer-events:none}
/* one card, so the title and the rules read as a single object rather than
   three things floating in the middle of the dish */
#intro .panel{
  pointer-events:auto;width:100%;max-width:330px;
  background:var(--panel);border:1px solid var(--edge);border-radius:24px;
  padding:26px 22px 22px;text-align:center;
  box-shadow:0 2px 4px rgba(15,23,32,.04),0 18px 44px rgba(15,23,32,.14);
  display:flex;flex-direction:column;align-items:center;gap:16px;
}
#intro .eb{font-size:8.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-3)}
#intro h1{
  font-family:var(--font);font-weight:800;
  font-size:clamp(44px,13vw,62px);line-height:.86;letter-spacing:-.045em;margin-top:-4px;
  background:linear-gradient(96deg,var(--blue),var(--purple) 38%,var(--red) 68%,#F5B301);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
#intro .rules{list-style:none;width:100%;display:flex;flex-direction:column;gap:9px}
#intro .rules li{
  display:flex;align-items:center;gap:11px;text-align:left;
  background:var(--surface);border-radius:13px;padding:10px 12px;
  font-size:12px;line-height:1.35;color:var(--ink-2);
}
#intro .rules b{color:var(--ink);font-weight:600}
#intro .rules .k{
  width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
  font-size:14px;flex:none;
}
#begin{
  pointer-events:auto;width:100%;padding:15px;border-radius:15px;border:0;
  background:linear-gradient(180deg,#3B4657,#1B2431);color:#fff;
  font-family:var(--font);font-weight:600;
  font-size:15px;letter-spacing:.1em;text-transform:uppercase;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.18),0 3.5px 0 #0E1620,0 7px 16px rgba(15,23,32,.28);
  transition:transform .1s ease, box-shadow .1s ease;
}
#begin:active{transform:translateY(3.5px);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.18),0 0 0 #0E1620,0 2px 6px rgba(15,23,32,.28)}
#intro > *{flex:0 0 auto}
/* short windows: landscape phones, small browser panes */
@media (max-height:600px){
  #intro{padding:14px}
  #intro .panel{padding:18px 16px 16px;gap:11px}
  #intro h1{font-size:clamp(32px,11vw,44px)}
  #intro .rules li{padding:8px 10px;font-size:11px}
  #begin{padding:12px;font-size:14px}
}
@media (max-height:420px){
  #intro .eb,#introHint{display:none}
  #intro .panel{gap:8px}
  #intro h1{font-size:clamp(26px,9vw,34px)}
  #intro .rules li{padding:7px 9px;font-size:10.5px}
}

@media (prefers-reduced-motion:reduce){ *{animation:none!important} }
@media (max-height:680px){
  :root{--dock-h:146px}
  .card{flex-basis:78px;padding:7px 5px 6px;gap:2px}
  .card .gw{width:27px;height:27px}
  .card .nm{font-size:9.5px}
  .card .ef{font-size:9px}
  .card .ct{font-size:12px}
}
/* short windows still need a playable dish, so the dock gives ground */
@media (max-height:540px){
  :root{--dock-h:122px}
  :root{--tab-h:32px}
  .tab{font-size:10.5px;padding:0 5px}
  .card{flex-basis:70px;padding:5px 4px 5px;gap:1px}
  .card .gw{width:23px;height:23px}
  .card .g{font-size:13px}
  .card .nm{font-size:8.5px}
  .card .ef{font-size:8px}
  .card .ct{font-size:10.5px}
  .card .lv{font-size:8.5px;top:3px;right:5px}
  #wizChrome{padding:6px 12px calc(6px + env(safe-area-inset-bottom));gap:6px}
  #wizPanel{min-height:62px}
}
/* ---- the tutorial coach ---- */
#tut{
  position:absolute;z-index:24;left:0;right:0;bottom:0;
  background:var(--panel);border-top:1px solid var(--edge);
  border-radius:22px 22px 0 0;box-shadow:var(--shadow-up);
  padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.9,.25,1);
}
#tut.on{transform:translateY(0)}
.tutTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#tutStep{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
#tutSkip{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  background:none;border:0;padding:4px 2px}
#tutT{font-family:var(--font);font-weight:800;font-size:17px;line-height:1.15}
#tutS{font-size:11.5px;line-height:1.6;color:var(--ink-2);margin:5px 0 12px}
#tutNext{
  width:100%;padding:12px;border-radius:13px;border:0;
  background:var(--ink);color:var(--ground);
  font-family:var(--font);font-weight:800;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
}
#tutNext:active{transform:scale(.98)}
#howto{
  margin-top:11px;background:none;border:0;padding:8px 12px;
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);text-decoration:underline;text-underline-offset:4px;
}
/* the screen edge used to catch fire on a long combo. The number says it. */
/* ---- daily missions, laid out like the reference ---- */
.msTop{display:flex;align-items:center;gap:9px;margin:2px 2px -2px}
.msTop .k{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.msTop .n{font-size:10px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-left:auto}
.msBar{height:7px;border-radius:99px;background:#E6EBF2;overflow:hidden;flex:1;max-width:100%}
.msBar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#F5A623,#F5C53A);transition:width .3s}
.ms{border-radius:14px;border:1.5px solid var(--edge);background:var(--panel);
  padding:11px 12px 10px;display:flex;flex-direction:column;gap:7px;position:relative}
.ms.ready{border-color:rgba(34,197,94,.55);background:#F3FDF7}
.ms.prog{border-color:rgba(245,166,35,.42);background:#FFFCF4}
.ms.done{border-color:var(--edge);background:var(--surface)}
.ms .top{display:flex;align-items:flex-start;gap:9px}
.ms .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--surface);font-size:12px;color:var(--ink-2)}
.ms.ready .ic{background:#DCFCE7;color:#15803D}
.ms.done .ic{background:#22C55E;color:#fff}
.ms .nm{flex:1;min-width:0;font-size:12.5px;font-weight:600;line-height:1.3}
.ms.done .nm{text-decoration:line-through;color:var(--ink-3)}
.ms .stars{flex:none;font-size:10px;letter-spacing:1.5px;color:#F5A623}
.ms .stars i{opacity:.26;font-style:normal}
.ms .stars i.on{opacity:1}
.ms .met{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.ms .foot{display:flex;align-items:center;gap:7px}
.ms .rw{flex:1;min-width:0;font-size:10.5px;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.ms .status{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.ms.done .status{color:#16A34A}
.msBtn{padding:7px 13px;border-radius:9px;border:0;flex:none;color:#fff;
  font-family:var(--font);font-weight:600;font-size:10.5px;
  transition:transform .1s ease, box-shadow .1s ease}
.msBtn.claim{background:linear-gradient(180deg,#3BDD7F,#16A34A);box-shadow:0 2.5px 0 #12833B}
.msBtn.x2{background:linear-gradient(180deg,#FB923C,#EA580C);box-shadow:0 2.5px 0 #C2410C}
.msBtn:active{transform:translateY(2.5px);box-shadow:none}
.msAll{border:1.5px dashed var(--edge-2);border-radius:14px;padding:11px 12px;
  display:flex;align-items:center;gap:10px;background:transparent}
.msAll .l{flex:1;min-width:0}
.msAll .t{font-size:11.5px;font-weight:600}
.msAll .s{font-size:9.5px;color:var(--ink-3);margin-top:1px}

/* the reward that pops out of the row you just claimed */
#rwPill{
  position:absolute;z-index:26;pointer-events:none;opacity:0;left:0;top:0;
  transform:translate(-50%,-50%);
  padding:7px 16px;border-radius:999px;white-space:nowrap;
  background:linear-gradient(180deg,#43E489,#16A34A);color:#fff;
  font-family:var(--font);font-weight:700;font-size:17px;
  box-shadow:0 5px 16px rgba(22,163,74,.44), inset 0 1px 0 rgba(255,255,255,.42);
}

/* ---- the board ---- */
.bd{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;
  background:var(--panel);border:1px solid var(--edge)}
.bd.me{border-color:rgba(124,58,237,.5);background:#F8F5FF}
.bd .pos{width:26px;text-align:center;font-family:var(--font);
  font-weight:700;font-size:14px;color:var(--ink-3);flex:none}
.bd.g1 .pos{color:#E8A200}.bd.g2 .pos{color:#94A3B8}.bd.g3 .pos{color:#B87333}
.bd .who{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd .sc{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
/* ================= the store, from the screenshots ================= */
#sheetBody.store{gap:10px}

/* header tabs */
.stTabs{display:flex;border-bottom:1px solid var(--edge);margin:-6px -16px 2px;padding:0 16px}
.stTab{flex:1;padding:11px 4px 9px;background:none;border:0;border-bottom:2.5px solid transparent;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px}
.stTab svg{width:15px;height:15px;display:block;fill:currentColor}
.stTab.on{color:#16A34A;border-bottom-color:#16A34A}
.stTab.on.gem{color:#2563EB;border-bottom-color:#2563EB}

/* section headings are real headings here, not small caps labels */
.stH{display:flex;align-items:center;gap:9px;margin:6px 2px 0}
.stH .t{font-size:15px;font-weight:700;flex:1}
.stH .chip{font-size:11px;color:#2563EB;background:#E5EEFF;padding:4px 11px;border-radius:99px;
  display:flex;align-items:center;gap:5px}
.stH .sq{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
.pillLbl{display:inline-flex;align-items:center;font-size:10px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:#2563EB;background:#DBEAFE;padding:5px 11px;border-radius:99px;
  align-self:flex-start;margin:6px 2px 0}

/* gift + streak */
.stCard{border-radius:16px;border:1.5px solid var(--edge);background:var(--panel);
  padding:13px 14px;display:flex;flex-direction:column;gap:9px;position:relative}
.stCard.gift{border-color:rgba(245,166,35,.5);background:#FFFBF0}
.stCard.locked{background:#F8FAFC;border-color:var(--edge)}
.stCard.streak{border-color:#D8B4FE;background:linear-gradient(135deg,#FBF7FF,#F6F0FF)}
.stHead{display:flex;align-items:center;gap:9px}
.stHead .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;
  color:#fff;font-size:14px}
.stHead .ic.mute{background:#E9EEF4;color:#94A3B8}
.stHead .t{font-size:14px;font-weight:700;flex:1;min-width:0}
.stHead .s{font-size:12px;color:var(--ink-3)}
.tag{font-size:9px;letter-spacing:.04em;padding:3.5px 9px;border-radius:99px;font-weight:700;flex:none}
.tag.day{background:#7C3AED;color:#fff}
.tag.ok{background:#DCFCE7;color:#15803D}
.stSub{font-size:12px;color:var(--ink-3);text-align:center}
.stRow{display:flex;gap:8px}
.stBtn{flex:1;padding:10px;border-radius:11px;border:0;color:#fff;
  font-family:var(--font);font-weight:600;font-size:12px;
  transition:transform .1s ease, box-shadow .1s ease}
.stBtn:active{transform:translateY(2.5px);box-shadow:none!important}
.stBtn.amber{background:linear-gradient(180deg,#F7CE55,#E0A81A);box-shadow:0 2.5px 0 #B98A10}
.stBtn.violet{background:linear-gradient(180deg,#9B6BFF,#7C3AED);box-shadow:0 2.5px 0 #5B23BE}
.stBtn.orange{background:linear-gradient(180deg,#FB923C,#EA580C);box-shadow:0 2.5px 0 #C2410C}

.days{display:flex;gap:5px}
.dchip{flex:1;border-radius:10px;border:1.5px solid var(--edge);background:var(--panel);
  padding:6px 2px 5px;text-align:center;min-width:0;position:relative}
.dchip .d{font-size:7.5px;letter-spacing:.04em;color:var(--ink-3);display:block}
.dchip .m{font-size:13px;font-weight:700;color:var(--ink-3);display:block;margin-top:2px}
.dchip .tk{font-size:9px;color:#16A34A;display:block;line-height:1}
.dchip.past{background:#F0FDF4;border-color:#86EFAC}
.dchip.past .m{color:#15803D}
.dchip.now{background:#F0FDF4;border-color:#22C55E}
.dchip.now .m{color:#15803D}

/* the priced packs: a colour bar down the left, badges in the corners */
.pk{border-radius:16px;border:1.5px solid var(--edge);background:var(--panel);
  padding:14px 14px 14px 20px;display:flex;align-items:center;gap:12px;position:relative;
  overflow:hidden}
.pk::before{content:"";position:absolute;left:9px;top:14px;bottom:14px;width:4px;border-radius:99px}
.pk .l{flex:1;min-width:0}
.pk .t{font-size:15px;font-weight:700}
.pk .s{font-size:11.5px;color:var(--ink-3);line-height:1.4;margin-top:2px}
.pk .b{font-size:12px;font-weight:700;margin-top:5px}
.pk .p{flex:none;padding:11px 15px;border-radius:12px;color:#fff;font-weight:700;font-size:15px;
  font-family:var(--font)}
.pk .off{position:absolute;top:0;right:0;font-size:9px;font-weight:700;
  padding:4px 10px;border-bottom-left-radius:11px;color:#fff}
.pk .rar{position:absolute;top:0;left:0;font-size:9px;font-weight:700;letter-spacing:.05em;
  padding:4px 10px;border-bottom-right-radius:11px;color:#fff}
.pk.blue{background:#EFF4FF;border-color:#C7D7FE}
.pk.blue::before{background:#4F46E5} .pk.blue .p{background:#4F46E5} .pk.blue .b{color:#4F46E5}
.pk.blue .off{background:#4F46E5}
.pk.violet{background:#F8F5FF;border-color:#DDD1FE}
.pk.violet::before{background:#7C3AED} .pk.violet .p{background:#7C3AED} .pk.violet .b{color:#7C3AED}
.pk.violet .off{background:#9333EA}
.pk.orange{background:#FFFBEB;border-color:#FDE68A}
.pk.orange::before{background:#F97316} .pk.orange .p{background:#F97316} .pk.orange .b{color:#EA580C}
.pk.orange .off{background:#F59E0B}
.pk.teal{background:#F0FDF4;border-color:#A7F3D0}
.pk.teal::before{background:#10B981} .pk.teal .p{background:#10B981} .pk.teal .b{color:#059669}
.pk.teal .off{background:#10B981}
.pk .rar.epic{background:#D946EF}
.pk .rar.deal{background:#F97316}

/* cash and mana grids */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiles.g3{grid-template-columns:repeat(3,1fr);gap:9px}
.tile{border-radius:13px;border:1.5px solid var(--edge);background:var(--panel);
  padding:12px 4px 10px;text-align:center;position:relative}
.tile .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .p{margin-top:3px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tile.best{border-color:#F59E0B;background:#FFFBEB}
.tile.best .v{color:#B45309} .tile.best .p{color:#B45309;font-weight:600}
.tile .bb{position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  font-size:8px;font-weight:700;letter-spacing:.05em;padding:2.5px 8px;border-radius:99px;
  background:#F59E0B;color:#fff}
.tile.gem{padding:13px 6px 11px}
.tile.gem .dia{color:#2563EB;font-size:17px;line-height:1}
.tile.gem .v{color:#2563EB;margin-top:4px}
.tile.gem .n{font-size:9.5px;color:var(--ink-3);margin-top:1px}
.tile.gem .buy{margin-top:8px;display:block;width:100%;padding:7px;border-radius:9px;border:0;
  background:#7C3AED;color:#fff;font-weight:700;font-size:12px;
  font-family:var(--font)}
.tile.gem.best{border-color:#2563EB;background:#F1F6FF}
.tile.gem .bb2{position:absolute;top:0;right:0;font-size:8px;font-weight:700;padding:3px 8px;
  border-bottom-left-radius:9px;background:#7C3AED;color:#fff}

.dashBtn{width:100%;padding:13px;border-radius:14px;border:1.5px dashed #C4B5FD;
  background:#FBF9FF;color:#7C3AED;font-size:12.5px;font-weight:600;display:flex;
  align-items:center;justify-content:center;gap:7px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pair.g3{grid-template-columns:repeat(3,1fr)}
.mini{border-radius:14px;border:1.5px solid var(--edge);background:var(--panel);padding:12px 10px;
  display:flex;flex-direction:column;gap:5px;text-align:center;position:relative}
.mini.vip{border-color:#F59E0B;background:#FFFBEB}
.mini .t{font-size:13px;font-weight:700}
.mini .s{font-size:10.5px;color:var(--ink-3);line-height:1.35;flex:1}
.mini .p{font-size:16px;font-weight:700;color:#DC2626;margin-top:3px;
  font-family:var(--font)}
.mini .star{position:absolute;top:8px;right:9px;color:#F59E0B;font-size:12px}
.restore{width:100%;padding:15px;background:none;border:0;color:var(--ink-2);font-size:13px;
  display:flex;align-items:center;justify-content:center;gap:8px}

/* cosmetics tab */
.cosHead{display:flex;align-items:center;gap:10px;padding:2px 0}
.cosHead .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:#7C3AED;color:#fff}
.cosHead .ic svg{width:18px;height:18px;display:block}
.cosHead .t{flex:1;font-size:15px;font-weight:700}
.cosSubs{display:flex;gap:4px;background:#F1F3F7;padding:4px;border-radius:13px}
.cosSub{flex:1;padding:9px 4px;border:0;border-radius:10px;background:transparent;
  font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;gap:5px}
.cosSub.on{background:var(--panel);color:#7C3AED;font-weight:600;
  box-shadow:0 1px 3px rgba(15,23,32,.14)}
.cosGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cos{border-radius:14px;border:1.5px solid var(--edge);background:var(--panel);
  padding:13px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left}
.cos.sel{border-color:#2563EB;background:#F2F7FF}
.cos .csw{width:44px;height:44px;border-radius:13px;display:block;margin-bottom:6px;
  box-shadow:0 2px 5px rgba(16,22,37,.13)}
.cos .nm{font-size:13.5px;font-weight:700}
.cos .d{font-size:10.5px;color:var(--ink-3);line-height:1.4;flex:1}
.cos .c{font-size:12px;color:#2563EB;font-weight:600;display:flex;align-items:center;gap:5px;margin-top:5px}
/* ---- settings, as the reference draws it: a toggle that is on tints its
        whole card in the hue of its own icon ---- */
.stg{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:15px;
  border:1.5px solid var(--edge);background:var(--panel)}
.stg .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.stg .ic svg{width:19px;height:19px;display:block}
.stg .t{flex:1;min-width:0;font-size:14px;font-weight:500}
.stg.off .t{color:var(--ink-3)}
.stg .go{color:var(--ink-3);font-size:15px;flex:none}
.stg .val{font-size:12.5px;color:var(--ink-2);flex:none;display:flex;align-items:center;gap:6px}
.stg.on-blue{background:#EFF6FF;border-color:#93C5FD}
.stg.on-violet{background:#FAF5FF;border-color:#D8B4FE}
.stg.on-orange{background:#FFF7ED;border-color:#FDBA74}
.tog{width:52px;height:30px;border-radius:99px;background:#D8DEE7;position:relative;flex:none;
  transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(15,23,32,.3);transition:transform .2s}
.tog.on{background:#22C55E}
.tog.on::after{transform:translateX(22px)}
.saveId{border-radius:15px;border:1.5px solid var(--edge);background:var(--panel);padding:13px 14px;
  position:relative}
.saveId .k{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.saveId .v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;margin-top:5px;
  word-break:break-all;line-height:1.4}
.saveId .s{font-size:10px;color:var(--ink-3);margin-top:5px}
.saveId .cp{position:absolute;top:12px;right:12px;color:var(--ink-3);font-size:15px;
  background:none;border:0}

/* ---- command center ---- */
.iqCard{border-radius:18px;padding:18px 18px 20px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#7C3AED 0%,#6D3BEF 45%,#4F46E5 100%);color:#fff;
  display:flex;align-items:center;gap:15px}
.iqCard .brain{width:56px;height:56px;border-radius:16px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.18)}
.iqCard .brain svg{width:30px;height:30px;display:block;fill:#fff}
.iqCard .l{flex:1;min-width:0;position:relative;z-index:2}
.iqCard .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.iqCard .n{font-family:var(--font);font-weight:700;
  font-size:44px;line-height:1;margin:2px 0 4px}
.iqCard .s{font-size:11px;opacity:.82;line-height:1.4}
.iqCard .wm{position:absolute;right:-16px;top:50%;transform:translateY(-50%);
  width:150px;height:150px;opacity:.13;pointer-events:none}
.iqCard .wm svg{width:100%;height:100%;fill:#fff}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{border-radius:14px;border:1.5px solid var(--edge);background:var(--panel);padding:11px 12px}
.stat .h{display:flex;align-items:center;gap:7px}
.stat .ic{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;flex:none;
  font-size:13px}
.stat .k{font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  line-height:1.25}
.stat .v{font-family:var(--font);font-weight:700;font-size:22px;
  margin-top:5px;font-variant-numeric:tabular-nums}
.ddCard{border-radius:14px;background:var(--surface);border:1.5px solid var(--edge);padding:13px 14px}
.ddCard .h{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-bottom:11px}
.dd{margin-bottom:10px}
.dd:last-child{margin-bottom:0}
.dd .r{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:5px}
.dd .r .n{flex:1}
.dd .r .p{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.dd .b{height:9px;border-radius:99px;background:#E2E8F0;overflow:hidden}
.dd .b i{display:block;height:100%;border-radius:99px}
.ccFoot{display:flex;justify-content:space-between;gap:10px;padding:11px 2px 0;
  border-top:1px solid var(--edge);font-family:var(--font);
  font-size:10.5px;color:var(--ink-3)}
.cosHead{display:flex;align-items:center;gap:9px;padding:2px 0 2px}
.cosHead .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:#2563EB;color:#fff}
.cosHead .ic svg{width:17px;height:17px;display:block}
/* the mark beside the name is the currency it is priced in, so it is the dot */
.cosHead .ic.mana{border-radius:50%;background:linear-gradient(140deg,#6FC3FF,#2F6BFF)}
.cosHead .ic.mana svg{width:13px;height:13px;fill:#fff}
.cosHead .t{flex:1;font-size:13px;font-weight:600}
.cosHead .cnt{font-size:11px;color:#2563EB;background:#E5EEFF;padding:4px 10px;border-radius:99px;
  display:flex;align-items:center;gap:4px}
.cosSubs{display:flex;gap:5px;background:var(--surface);padding:4px;border-radius:12px}
.cosSub{flex:1;padding:8px 4px;border:0;border-radius:9px;background:transparent;
  font-size:10px;letter-spacing:.08em;color:var(--ink-3)}
.cosSub.on{background:var(--panel);color:#7C3AED;font-weight:600;
  box-shadow:0 1px 3px rgba(15,23,32,.12)}
.cosGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cos{border-radius:14px;border:1.5px solid var(--edge);background:var(--panel);
  padding:11px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
.cos.sel{border-color:#2563EB;background:#F2F7FF}
.cos .csw{width:38px;height:38px;border-radius:11px;display:block;margin-bottom:3px;
  box-shadow:0 2px 5px rgba(16,22,37,.13)}
.cos .nm{font-size:12.5px;font-weight:600}
.cos .d{font-size:9.5px;color:var(--ink-3);line-height:1.4;flex:1}
.cos .c{font-size:10.5px;color:#2563EB;display:flex;align-items:center;gap:4px;margin-top:3px}
.dchip{position:relative}
.dchip .tk{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);
  font-size:8px;color:#16A34A;line-height:1}
/* the card the reference draws: level in the corner, the name in caps, the
   price carrying the card, and an ad offered when you cannot afford it */
.card .ad{display:none;font-size:10px;font-weight:600;color:#16A34A;
  align-items:center;gap:3px;margin-top:1px}
.card.canAd .ad{display:flex}
.card.canAd{border-color:rgba(34,197,94,.5);background:#F6FDF8}
.card .alt{display:none;font-size:9px;font-weight:500;color:var(--yellow);margin-top:1px}
.card.canAd .alt{display:block}
.card.locked{border-style:dashed;background:transparent;opacity:.5}
.card.locked .ct{color:var(--ink-3);font-size:9px;font-weight:500}

/* the profile card at the head of the power rail */
.prof{width:68px;border-radius:14px;background:var(--panel);border:1px solid var(--edge);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 3px 0 #C9D4E2,0 5px 11px rgba(16,22,37,.18);
  padding:8px 7px 9px;text-align:center;flex:none}
.prof .hi{font-size:7.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3)}
.prof .lv{font-family:var(--font);font-weight:800;
  font-size:16px;line-height:1.05;margin-top:2px;letter-spacing:-.02em}
.prof .rk{font-size:8px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof .bar{height:4px;border-radius:99px;background:#E4E9F1;overflow:hidden;margin-top:6px}
.prof .bar i{display:block;height:100%;border-radius:99px;background:#2F6BFF;transition:width .3s}

/* a power you can watch an ad to fire early */
.pw .adb{position:absolute;top:-7px;right:-7px;width:16px;height:16px;border-radius:50%;
  background:linear-gradient(180deg,#A78BFA,#7C3AED);color:#fff;display:none;
  align-items:center;justify-content:center;font-size:7.5px;
  border:1.5px solid var(--panel);
  box-shadow:0 1.5px 4px rgba(16,22,37,.28)}
.pw.adReady .adb{display:flex}
/* ---- achievements, from the shot: a level banner then a list you open ---- */
.lvlCard{
  border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(120deg,#7C3AED 0%,#6D3BEF 46%,#4F46E5 100%);
}
.lvlCard .hey{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  opacity:.85}
.lvlCard .row{display:flex;align-items:flex-end;gap:12px;margin-top:4px}
.lvlCard .big{font-family:var(--font);font-weight:800;
  font-size:32px;line-height:1;flex:1;letter-spacing:-.02em}
.lvlCard .rk{font-size:14px;font-weight:600;text-align:right;line-height:1.2}
.lvlCard .xp{font-size:11.5px;font-weight:500;opacity:.7;text-align:right;
  font-variant-numeric:tabular-nums;margin-top:2px}
.lvlCard .bar{height:9px;border-radius:99px;background:rgba(255,255,255,.26);overflow:hidden;
  margin-top:13px;position:relative;z-index:2}
.lvlCard .bar i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .4s}
.lvlCard .wm{position:absolute;right:-10px;top:-14px;width:132px;height:132px;opacity:.14;
  pointer-events:none}
.lvlCard .wm svg{width:100%;height:100%;fill:#fff}

.acRow{border-radius:15px;background:var(--panel);border:1px solid var(--edge);
  padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.acRow .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  font-size:15px;color:var(--ink)}
.acRow .l{flex:1;min-width:0}
.acRow .t{font-size:15px;font-weight:600;line-height:1.2;color:var(--ink)}
.acRow .s{font-size:12px;font-weight:400;color:var(--ink-3);margin-top:3px}
.acRow .mini{width:62px;height:7px;border-radius:99px;background:#E4E9F1;overflow:hidden;flex:none}
.acRow .mini i{display:block;height:100%;border-radius:99px;background:#2F6BFF;transition:width .3s}
.acRow .chev{color:var(--ink-3);font-size:13px;flex:none;transition:transform .2s}
.acRow.open .chev{transform:rotate(180deg)}
.acTiers{display:flex;flex-direction:column;gap:7px;padding:2px 4px 4px}
.acTier{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;
  background:var(--surface);font-size:11.5px}
.acTier .n{flex:1;min-width:0;color:var(--ink-2)}
.acTier .rw{font-size:11px;color:#7C3AED;display:flex;align-items:center;gap:4px;flex:none}
.acTier.got{background:#F0FDF4;color:#15803D}
.acTier .tick{color:#16A34A;flex:none}
/* ---- welcome back: its own dark screen, not a sheet row ---- */
#wb{
  position:absolute;inset:0;z-index:34;display:none;align-items:center;justify-content:center;
  padding:26px 22px;background:rgba(8,12,22,.82);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
#wb.on{display:flex}
#wb .panel{
  width:100%;max-width:330px;border-radius:26px;padding:26px 22px 22px;text-align:center;
  background:linear-gradient(180deg,#151C2B,#111726);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 22px 60px rgba(0,0,0,.55);
  display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;
}
#wb .tile{
  width:72px;height:72px;border-radius:21px;display:grid;place-items:center;margin-bottom:9px;
  background:linear-gradient(180deg,#3B82F6,#2563EB);
  box-shadow:0 10px 26px rgba(37,99,235,.5);
}
#wb .tile svg{width:38px;height:38px;display:block;stroke:#fff;fill:none;stroke-width:2}
#wb h2{font-family:var(--font);font-weight:800;
  font-size:26px;letter-spacing:.09em;text-transform:uppercase}
#wb .sub{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.62)}
#wb .away{font-size:13px;color:rgba(255,255,255,.72);margin-top:10px}
#wb .away b{color:#fff;font-weight:600}
#wb .box{
  width:100%;margin-top:14px;border-radius:16px;padding:15px 14px;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);
}
#wb .box .k{font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.55)}
#wb .box .v{
  display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;
  font-family:var(--font);font-weight:700;font-size:29px;color:#34D77C;
}
#wb .box .v svg{width:24px;height:24px;fill:#34D77C;display:block}
#wb .go{
  width:100%;margin-top:18px;padding:16px;border-radius:15px;border:0;
  background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;
  font-family:var(--font);font-weight:600;font-size:16px;letter-spacing:.01em;
  box-shadow:0 4px 0 #1D4ED8,0 10px 22px rgba(37,99,235,.42);
  transition:transform .1s ease, box-shadow .1s ease;
}
#wb .go:active{transform:translateY(4px);box-shadow:0 0 0 #1D4ED8,0 3px 8px rgba(37,99,235,.42)}

/* money: while it climbs the digits deepen and lift, and the chip rings */
#bioWrap .n{transition:color .34s ease, transform .34s ease}
.pip.bio{transition:background .34s ease, box-shadow .34s ease}
/* on instantly, off over a third of a second — a fade-in this short reads
   as lag rather than as a response */
#bioWrap.rising .n{transition:none;color:#12924A;transform:translateY(-1px)}
#bioWrap.rising .pip.bio{transition:none;background:#BBF7D0;
  box-shadow:0 0 0 3px rgba(34,197,94,.18)}
/* ---- the wizard upgrade page ---- */
.wzRow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:15px;
  background:var(--panel);border:1.5px solid var(--edge)}
.wzRow.have{border-color:rgba(232,178,27,.45);background:#FFFDF5}
.wzRow.none{opacity:.5}
.wzRow .portrait{width:46px!important;height:46px!important;flex:none;display:block;
  position:static;border-radius:12px;background:var(--surface)}
.wzRow .l{flex:1;min-width:0}
.wzRow .t{font-size:14px;font-weight:700;line-height:1.15}
.wzRow .s{font-size:10.5px;color:var(--ink-3);line-height:1.45;margin-top:2px}
.wzRow .n{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.wzBtn{flex:none;padding:10px 13px;border-radius:12px;border:0;text-align:center;
  font-family:var(--font);font-weight:600;font-size:11.5px;
  line-height:1.2;color:#3D2B02;
  background:linear-gradient(180deg,#FFDE7A,#F5B301 46%,#DC9A05);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 3px 0 #A9760A;
  transition:transform .1s ease, box-shadow .1s ease}
.wzBtn small{display:block;font-size:9.5px;font-weight:500;opacity:.8}
.wzBtn:active{transform:translateY(3px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 0 0 #A9760A}
.wzBtn.no{background:linear-gradient(180deg,#F4F7FA,#E6ECF3);color:var(--ink-3);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),0 3px 0 #CBD5E1}
.wzOpen{width:100%;padding:11px;border-radius:13px;border:0;margin-bottom:2px;
  background:linear-gradient(180deg,#FFFFFF,#EDF2F8);color:var(--ink-2);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 3px 0 #C9D4E2;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.wzOpen:active{transform:translateY(3px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 0 0 #C9D4E2}
/* ---- the tower's chrome ------------------------------------------------
   The bottom used to carry a hint, an upgrade button, summon and the way
   out, four deep. Summon sits in the top bar between the two currencies,
   upgrades are a dot beside the board, and the bottom is the way out. */
#summonBtn{
  position:absolute;left:50%;top:-38px;transform:translateX(-50%);z-index:7;
  width:78px;height:78px;border-radius:50%;border:0;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:linear-gradient(180deg,#FFE283,#F5B301 46%,#DC9A05);color:#3D2B02;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.62),inset 0 -3px 0 rgba(120,84,6,.3),
             0 4px 0 #A9760A,0 8px 18px rgba(180,120,0,.34);
  transition:transform .1s ease, box-shadow .1s ease;
}
#summonBtn .hat{display:block;line-height:0;margin-top:-1px}
#summonBtn .hat svg{width:26px;height:26px;display:block;fill:#3D2B02;opacity:.86}
#summonBtn .t{font-family:var(--font);font-weight:800;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
#summonBtn .c{display:flex;align-items:center;gap:3px;font-weight:700;font-size:11px;
  font-variant-numeric:tabular-nums;opacity:.9;line-height:1.1}
#summonBtn .c .cico{width:.85em;height:.85em}
#summonBtn:active{transform:translateX(-50%) translateY(4px);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.62),0 0 0 #A9760A,0 3px 8px rgba(180,120,0,.34)}
#summonBtn.no{background:linear-gradient(180deg,#F7FAFD,#E6ECF3);color:var(--ink-3);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.85),0 4px 0 #CBD5E1,0 8px 16px rgba(16,22,37,.16)}
#summonBtn.no .hat svg{fill:var(--ink-3);opacity:.75}
/* the button hangs over the lip, so the strip beneath it gets out of the way */
#arenaStrip{padding-top:2px}

/* the way into the upgrades sits in the middle of the board, where the eye
   already is, and looks like something the wizards would cast */
/* The way into the upgrades sits in the middle of the board, where the eye
   already is. A lava orb read as something dropped in from another game, so
   it keeps the shape language of every other control here — pale face, hard
   shadow underneath — and carries the fire in the glyph instead. */
#wizRow{display:flex;align-items:stretch;gap:10px}
#wizUpBtn{
  flex:0 1 auto;min-width:0;
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 14px;border-radius:13px;border:0;white-space:nowrap;
  background:linear-gradient(180deg,#FFFFFF,#EDF2F8);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 3px 0 #C9D4E2,0 6px 14px rgba(16,22,37,.16);
  font-size:11px;letter-spacing:.08em;font-weight:600;text-transform:uppercase;
  color:var(--ink-2);
  transition:transform .1s ease, box-shadow .1s ease;
}
#wizUpBtn svg{width:15px;height:15px;flex:none;display:block;
  stroke:var(--ink-2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#wizUpBtn:active{transform:translateY(3px);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 0 0 #C9D4E2,0 2px 6px rgba(16,22,37,.16)}

/* the tower's footer is one button tall now */
#wizChrome{height:calc(96px + env(safe-area-inset-bottom))}
#wizStage{bottom:calc(96px + env(safe-area-inset-bottom))}
@media (max-height:540px){
  #wizChrome{height:calc(84px + env(safe-area-inset-bottom))}
  #wizStage{bottom:calc(84px + env(safe-area-inset-bottom))}
}
/* On a 320 phone the tower's top bar carries money, summon and mana, and at
   full size the mana falls off the right edge. Everything gives a little. */
@media (max-width:360px){
  #top{gap:6px;padding:0 8px}
  #bioWrap{gap:5px}
  #bioWrap .n{font-size:27px}
  #bioWrap.l4 .n{font-size:25px}
  #bioWrap.l5 .n{font-size:23px}
  #bioWrap.l6 .n{font-size:20px}
  .pip.bio{width:27px;height:22px}
  .pip.bio svg{width:17px;height:17px}
  #summonBtn{width:66px;height:66px;top:-32px}
  #summonBtn .hat svg{width:22px;height:22px}
  #summonBtn .t{font-size:8.5px}
  #summonBtn .c{font-size:10px}
  .tab{font-size:11px}
}
/* ---- the chest, and the case it opens ---------------------------------- */
.wcell.chest{display:grid;place-items:center}
.chestArt{display:block;line-height:0;width:64%;max-width:52px}
.chestArt svg{width:100%;height:auto;display:block}
.chestArt svg{overflow:visible}
.chestArt .seam,.chestArt .band{fill:none;stroke-linecap:round}
.wcell.chest .adb{
  position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:50%;
  background:linear-gradient(180deg,#A78BFA,#7C3AED);color:#fff;
  display:grid;place-items:center;font-size:8px;
  border:1.5px solid var(--panel);box-shadow:0 1.5px 4px rgba(16,22,37,.28);
}
.wcell.chest .cd{
  position:absolute;inset:14%;border-radius:12px;display:none;place-items:center;
  background:rgba(238,243,249,.93);font-weight:600;font-size:11px;color:var(--ink-2);
}
/* the eye is the whole point of it, so the eye is the thing that moves */
.wcell.chest.ready .chestArt{animation:chestBob 3s ease-in-out infinite}
.wcell.chest.ready .chestArt svg{filter:drop-shadow(0 0 5px rgba(79,233,208,.55))}
.wcell.chest.ready .chestArt .eye{animation:ecEye 2.2s ease-in-out infinite;
  transform-origin:12px 11px}
@keyframes chestBob{50%{transform:translateY(-3px)}}
@keyframes ecEye{50%{opacity:.72;transform:scale(1.14)}}
/* a ring of its own light under it, so the corner reads as the good square */
.wcell.chest.ready::after{
  content:"";position:absolute;left:50%;top:50%;width:80%;height:80%;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(79,233,208,.30),rgba(79,233,208,0) 68%);
  animation:ecHalo 2.8s ease-in-out infinite;
}
.wcell.chest .chestArt,.wcell.chest .adb,.wcell.chest .cd{position:relative;z-index:1}
@keyframes ecHalo{50%{opacity:.5;transform:translate(-50%,-50%) scale(1.16)}}
.wcell.chest:not(.ready) .chestArt{filter:grayscale(.85) opacity(.5)}

#case{position:absolute;inset:0;z-index:28;display:none;align-items:center;justify-content:center;
  background:rgba(9,13,22,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:18px}
#case.on{display:flex}
#case .cbox{width:100%;max-width:340px;background:var(--panel);border-radius:20px;
  padding:16px 14px 14px;box-shadow:0 20px 50px rgba(9,13,22,.4);text-align:center}
#case .chead .ct{display:block;font-family:var(--font);font-weight:800;font-size:20px}
#case .chead .cs{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-top:2px}
#case .creel{position:relative;height:96px;margin:13px 0 0;border-radius:14px;
  background:var(--surface);overflow:hidden;border:1px solid var(--edge)}
#case .creel::before,#case .creel::after{content:"";position:absolute;top:0;bottom:0;width:44px;z-index:2;
  pointer-events:none}
#case .creel::before{left:0;background:linear-gradient(90deg,var(--surface),rgba(244,247,250,0))}
#case .creel::after{right:0;background:linear-gradient(270deg,var(--surface),rgba(244,247,250,0))}
#case .marker{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;z-index:3;
  background:linear-gradient(180deg,#FF3B57,#B4122A);border-radius:2px;
  box-shadow:0 0 10px rgba(255,59,87,.7)}
#case .cstrip{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;gap:6px;
  padding:0 6px;will-change:transform}
#case .ctile{width:74px;height:82px;flex:none;border-radius:11px;background:var(--panel);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;
  padding-bottom:7px;position:relative;overflow:hidden;border:1px solid var(--edge)}
#case .ctile::before{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--rc)}
#case .ctile .g{position:absolute;inset:0;background:
  radial-gradient(120% 80% at 50% 108%, var(--rc), rgba(255,255,255,0) 68%);opacity:.30}
#case .ctile canvas{position:static;display:block;width:42px;height:42px;margin-top:8px}
#case .ctile .n{font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-2);position:relative}
#case .cwon{min-height:40px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;margin-top:10px}
#case .cwon .r{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--rc)}
#case .cwon .n{font-family:var(--font);font-weight:800;font-size:19px;line-height:1.1}
#case .cwon .s{font-size:10.5px;color:var(--ink-3)}
#case .cgo{width:100%;margin-top:10px;padding:14px;border-radius:14px;border:0;
  background:linear-gradient(180deg,#9B6BFF,#7C3AED);color:#fff;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),0 3px 0 #5B23BE;
  font-family:var(--font);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
#case .cgo:active{transform:translateY(3px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),0 0 0 #5B23BE}
#case .cgo.done{background:linear-gradient(180deg,#3B4657,#1B2431);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.18),0 3px 0 #0E1620}
@media (max-height:640px){
  #case .creel{height:80px} #case .ctile{height:68px;width:64px}
  #case .ctile canvas{width:34px;height:34px}
}
/* ---- frenzy, which is what a rainbow buys you --------------------------
   The edge used to catch fire on a long streak, which was noise. This only
   ever means one thing: the rainbow window is open. */
#frenzy{
  position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;
  transition:opacity .45s ease;will-change:opacity;
}
#frenzy::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(150% 118% at 50% 50%,
      rgba(255,255,255,0) 40%,
      rgba(124,92,255,.05) 58%,
      rgba(34,184,255,.10) 70%,
      rgba(60,208,112,.14) 80%,
      rgba(255,212,0,.17) 89%,
      rgba(255,59,87,.21) 100%);
}
#frenzy.on{opacity:1}
#frenzy.on::after{animation:fzSpin 6s linear infinite}
@keyframes fzSpin{to{transform:rotate(360deg) scale(1.02)}}
#fzTag{
  position:absolute;z-index:10;left:50%;transform:translateX(-50%) translateY(10px);
  bottom:calc(var(--chrome-b,152px) + 62px);
  display:none;align-items:center;gap:7px;pointer-events:none;
  padding:6px 14px 6px 11px;border-radius:999px;
  background:rgba(15,23,32,.86);color:#fff;
  font-family:var(--font);font-weight:800;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;
  box-shadow:0 6px 18px rgba(15,23,32,.32);
  opacity:0;transition:opacity .3s ease, transform .3s cubic-bezier(.2,1.5,.4,1);
}
#fzTag.on{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
#fzTag{transition:opacity .3s ease, transform .3s cubic-bezier(.2,1.5,.4,1), bottom .26s cubic-bezier(.3,.8,.3,1)}
#fzTag .d{width:9px;height:9px;border-radius:50%;flex:none;
  animation:fzDot 1.1s linear infinite}
@keyframes fzDot{
  0%{background:#FF3B57}   17%{background:#FF7A1A} 34%{background:#FFD400}
  50%{background:#3CD070}  67%{background:#22B8FF} 84%{background:#7A5CFF}
  100%{background:#FF3B57}
}

   ball splits it DOWN the ladder, while two balls of the same size that stay
   in contact fuse UP it — 2048, played against your own splitting. */

  {r:88,spd:16,hp:3.4},   // 0 — three fusions above the drop
  {r:72,spd:20,hp:2.3},

  {r:46,spd:30,hp:1.0},   // 3 — the drop size
  {r:31,spd:40,hp:.62},
  {r:20,spd:52,hp:.40},
  {r:13,spd:66,hp:.26},
  {r:9, spd:76,hp:.20},   // 7 — the smallest, where wizards start
];
const LAST=TIER.length-1;
const DROPT=4;
const NOTE=[92,118,150,190,240,300,380,470];
/* two of a kind for a ball that has never merged, three once it has */
const fuseCost=(a,b)=>(a.mg||b.mg)?3:2;
const fuseTime=(tier)=>{
  const base=val("fusion");
  // small balls move 4.75x faster than big ones, so a flat hold time is a
  // much harder ask down the ladder — scale it back to match
  return tier===undefined ? base : base*clamp(1-0.125*(tier-3),.5,1);
};

/* the balls you buy. taps = hits to break the whole ball at its top size;
   lower tiers need proportionally fewer. mass = total yield of the lineage. */
/* The producers. A rank is cls-shaped on purpose — taps / mass / size are
   exactly what makeBall() already reads, so a wizard drops straight into the

function achGive(r){
  const bits=[];
  if(r.g){ G.bio+=r.g; G.earned+=r.g; G.totalEarned+=r.g; bits.push(fmt(r.g)+" cash"); }
  if(r.sp){ G.spore+=r.sp; bits.push(r.sp+" mana"); }

    G.ownSkin.push(r.skin); bits.push((SKINS.find(x=>x.id===r.skin)||{}).nm+" skin"); }

    G.ownTrail.push(r.trail); bits.push((TRAILS.find(x=>x.id===r.trail)||{}).nm+" cleave"); }

  const b=[];
  if(r.g) b.push(ICO_MASS+" "+fmt(r.g));
  if(r.sp) b.push(ICO_SPORE+r.sp);

  if(r.trail) b.push((TRAILS.find(x=>x.id===r.trail)||{}).nm);

const SUF=["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc","Ud","Dd"];
function fmt(n){
  if(!isFinite(n)) return "∞";
  if(n<0) return "-"+fmt(-n);
  if(n<1000) return n<10?(Math.round(n*10)/10+"").replace(/\.0$/,""):Math.floor(n)+"";
  let i=0; while(n>=1000&&i<SUF.length-1){ n/=1000; i++; }
  return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n)+"")+SUF[i];
}
function fmtTime(s){
  s=Math.floor(s);
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  if(h) return h+"h "+m+"m";
  if(m) return m+"m "+(s%60)+"s";
  return s+"s";
}
