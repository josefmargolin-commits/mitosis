  // ball 32px across and the smallest 9 — barely half what the same dish
  // shows on a desktop, and under the 44px Apple asks of anything you have

/* The sky is just a gradient, and stars once it gets dark. No fussy texture —
   the ball forms carry the identity of a scale, the sky only has to say how
   far out you are. */
function srnd(seed){ let x=seed>>>0; return ()=>{ x=(x*1664525+1013904223)>>>0; return x/4294967296; }; }
function paintSky(x,sc,alpha){
  x.save();
  if(alpha!==undefined) x.globalAlpha=alpha;
  const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,sc.bg[0]); g.addColorStop(1,sc.bg[1]);
  x.fillStyle=g; x.fillRect(0,0,W,H);
  const R=srnd(4517+SCALES.indexOf(sc)*7919);
  if(sc.neb){
    for(let i=0;i<6;i++){
      const px=R()*W, py=R()*H, r=90+R()*200;
      const hue=["124,96,224","220,96,168","96,152,224"][(R()*3)|0];
      const ng=x.createRadialGradient(px,py,0,px,py,r);
      ng.addColorStop(0,"rgba("+hue+",.20)"); ng.addColorStop(1,"rgba("+hue+",0)");
      x.fillStyle=ng; x.beginPath(); x.arc(px,py,r,0,TAU); x.fill();
    }
  }
  for(let i=0;i<sc.stars;i++){
    const b=R();
    x.globalAlpha=(alpha===undefined?1:alpha)*(.18+b*.8);
    x.fillStyle=b>.92?"#DCE7FF":"#FFFFFF";
    const sz=b>.965?2.2:1.15;
    x.fillRect(R()*W,R()*H,sz,sz);
  }
  x.restore();
}
function drawBg(){
  const sc=curScale();

  const root=document.documentElement;
  root.style.setProperty("--dishTop",sc.bg[0]);
  root.style.setProperty("--topInk",sc.dark?"#EAF1FA":"#0F1720");
  // the wizard room sits just above the sky, so it borrows its tone
  // the brickwork is tinted by the world it stands in

  BRICK=sc.dark?{a:"#4A5468",b:"#39415270",m:"#2B3140",t:"#5D6880"}
               :{a:"#EFE6D8",b:"#E3D7C4",m:"#C9B99F",t:"#F7F1E7"};
}
/* crossfade one sky into the next while the camera pulls back */
function blendBg(from,to,t){
  xBg.clearRect(0,0,W,H);
  paintSky(xBg,to);
  if(t<1) paintSky(xBg,from,1-t);
  const root=document.documentElement;
  root.style.setProperty("--dishTop",t>.5?to.bg[0]:from.bg[0]);
  root.style.setProperty("--topInk",(t>.5?to.dark:from.dark)?"#EAF1FA":"#0F1720");
}
/* ---------------------------------------------------------------- audio */
/* ---------------------------------------------------------------- audio
   Every sound is layered: a transient click so it lands, a pitched body
   that sweeps UPWARD (a falling pitch reads as deflating, a rising one
   reads as a pop), and a short tail into a shared plate. Everything is
   panned to where it happened and rides a limiter, so a fifty-ball
   cascade stays punchy instead of turning to mush.                     */
const Sn={ctx:null,master:null,verb:null,noise:null,budget:26,dead:false,pan:true};
function makeIR(c,dur,decay){
  const n=Math.max(1,Math.floor(c.sampleRate*dur));
  const b=c.createBuffer(2,n,c.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch);
    for(let i=0;i<n;i++){
      const t=i/n;
      d[i]=(Math.random()*2-1)*Math.pow(1-t,decay)*(1-t*0.2);
    }
  }
  return b;
}
function actx(){
  if(!Sn.ctx){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    const c=Sn.ctx=new AC();

    const comp=c.createDynamicsCompressor();
    comp.threshold.value=-13; comp.knee.value=24; comp.ratio.value=8;
    comp.attack.value=0.003; comp.release.value=0.16;
    comp.connect(c.destination);

    Sn.master=c.createGain(); Sn.master.gain.value=0.5;
    Sn.master.connect(comp);

    try{
      const cv=c.createConvolver(); cv.buffer=makeIR(c,0.9,3.4);
      const vg=c.createGain(); vg.gain.value=0.85;
      const damp=c.createBiquadFilter(); damp.type="highpass"; damp.frequency.value=380;
      cv.connect(damp); damp.connect(vg); vg.connect(comp);
      Sn.verb=cv;
    }catch(e){ Sn.verb=null; }

    const len=Math.floor(c.sampleRate*0.5), b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    Sn.noise=b;
    Sn.pan=typeof c.createStereoPanner==="function";
  }
  if(Sn.ctx.state==="suspended") Sn.ctx.resume();
  return Sn.ctx;
}
/* an output bus for one sound: panned, with its own send into the plate */
function bus(c,pan,wet){
  const out=c.createGain(); out.gain.value=1;
  let tail=out;
  if(Sn.pan){
    const p=c.createStereoPanner();
    p.pan.value=clamp(pan||0,-.85,.85);
    out.connect(p); tail=p;
  }
  tail.connect(Sn.master);
  if(Sn.verb&&wet>0){
    const s=c.createGain(); s.gain.value=wet;
    tail.connect(s); s.connect(Sn.verb);
  }
  return out;
}
const panAt=x=>W?clamp((x/W)*2-1,-1,1)*0.8:0;
function audioOK(){ return G.opt.sound&&!Sn.dead&&Sn.budget>0; }

/* the core pop — a bubble surfacing */
function pop(f,o){ try{
  o=o||{}; if(!audioOK()) return;
  const c=actx(); if(!c) return;
  const t=c.currentTime+(o.delay||0), vol=o.vol===undefined?.24:o.vol;
  const out=bus(c,o.pan,o.wet===undefined?.13:o.wet);

  const o1=c.createOscillator(); o1.type="sine";
  o1.frequency.setValueAtTime(f*.40,t);
  o1.frequency.exponentialRampToValueAtTime(f*1.55,t+.055);
  const g1=c.createGain();
  g1.gain.setValueAtTime(.0001,t);
  g1.gain.exponentialRampToValueAtTime(vol,t+.006);
  g1.gain.exponentialRampToValueAtTime(.0001,t+.17);
  o1.connect(g1); g1.connect(out); o1.start(t); o1.stop(t+.2);

  const o2=c.createOscillator(); o2.type="triangle";
  o2.frequency.setValueAtTime(f*1.05,t);
  o2.frequency.exponentialRampToValueAtTime(f*2.7,t+.045);
  const g2=c.createGain();
  g2.gain.setValueAtTime(.0001,t);
  g2.gain.exponentialRampToValueAtTime(vol*.3,t+.004);
  g2.gain.exponentialRampToValueAtTime(.0001,t+.075);
  o2.connect(g2); g2.connect(out); o2.start(t); o2.stop(t+.11);

  const s=c.createBufferSource(); s.buffer=Sn.noise;
  s.playbackRate.value=rnd(.9,1.15);
  const bp=c.createBiquadFilter(); bp.type="bandpass";
  bp.frequency.value=clamp(f*3.4,200,9000); bp.Q.value=1.1;
  const g3=c.createGain();
  g3.gain.setValueAtTime(vol*.42,t);
  g3.gain.exponentialRampToValueAtTime(.0001,t+.02);
  s.connect(bp); bp.connect(g3); g3.connect(out); s.start(t); s.stop(t+.05);

  Sn.budget--;
}catch(e){ Sn.dead=true; } }

/* fusion — an FM bell that rings out over the plate */
function chime(f,o){ try{
  o=o||{}; if(!audioOK()) return;
  const c=actx(); if(!c) return;
  const t=c.currentTime+(o.delay||0), vol=o.vol===undefined?.2:o.vol;
  const out=bus(c,o.pan,o.wet===undefined?.42:o.wet);

  const car=c.createOscillator(); car.type="sine"; car.frequency.setValueAtTime(f,t);
  const mod=c.createOscillator(); mod.type="sine"; mod.frequency.setValueAtTime(f*2.01,t);
  const mg=c.createGain();
  mg.gain.setValueAtTime(f*3.4,t);
  mg.gain.exponentialRampToValueAtTime(f*.12,t+.34);
  mod.connect(mg); mg.connect(car.frequency);
  const g=c.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+(o.len||.85));
  car.connect(g); g.connect(out);
  mod.start(t); car.start(t);
  mod.stop(t+(o.len||.85)+.05); car.stop(t+(o.len||.85)+.05);

  const s=c.createBufferSource(); s.buffer=Sn.noise;
  const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=clamp(f*4,300,11000); bp.Q.value=2;
  const g3=c.createGain();
  g3.gain.setValueAtTime(vol*.3,t);
  g3.gain.exponentialRampToValueAtTime(.0001,t+.03);
  s.connect(bp); bp.connect(g3); g3.connect(out); s.start(t); s.stop(t+.06);

  Sn.budget--;
}catch(e){ Sn.dead=true; } }

/* weight under the big events */
function thud(f,o){ try{
  o=o||{}; if(!audioOK()) return;
  const c=actx(); if(!c) return;
  const t=c.currentTime+(o.delay||0), vol=o.vol===undefined?.3:o.vol;
  const out=bus(c,o.pan,.05);
  const osc=c.createOscillator(); osc.type="sine";
  osc.frequency.setValueAtTime(f||64,t);
  osc.frequency.exponentialRampToValueAtTime((f||64)*.45,t+(o.len||.22));
  const g=c.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+.005);
  g.gain.exponentialRampToValueAtTime(.0001,t+(o.len||.22));
  osc.connect(g); g.connect(out); osc.start(t); osc.stop(t+(o.len||.22)+.03);
  Sn.budget--;
}catch(e){ Sn.dead=true; } }

/* filtered noise: splashes, bursts, mechanism */
function noiseHit(dur,o){ try{
  o=o||{}; if(!audioOK()) return;
  const c=actx(); if(!c) return;
  const t=c.currentTime+(o.delay||0), cut=o.cut===undefined?1800:o.cut;
  const out=bus(c,o.pan,o.wet===undefined?.10:o.wet);
  const s=c.createBufferSource(); s.buffer=Sn.noise;
  s.playbackRate.value=rnd(.85,1.2);
  const f=c.createBiquadFilter(); f.type=o.type||"lowpass"; f.Q.value=o.q===undefined?1:o.q;
  f.frequency.setValueAtTime(cut,t);
  f.frequency.exponentialRampToValueAtTime(Math.max(70,cut*(o.to===undefined?.15:o.to)),t+dur);
  const g=c.createGain();
  g.gain.setValueAtTime(o.vol===undefined?.12:o.vol,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t+dur+.02);
  Sn.budget--;
}catch(e){ Sn.dead=true; } }

/* the pump: a pneumatic chunk with a click on the front */
function pumpSound(pan){ try{
  if(!audioOK()) return;
  const c=actx(); if(!c) return;
  const t=c.currentTime;
  const out=bus(c,pan,.10);
  const s=c.createBufferSource(); s.buffer=Sn.noise;
  const f=c.createBiquadFilter(); f.type="lowpass"; f.Q.value=6;
  f.frequency.setValueAtTime(2400,t);
  f.frequency.exponentialRampToValueAtTime(190,t+.07);
  const g=c.createGain();
  g.gain.setValueAtTime(.16,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+.09);
  s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t+.12);
  const o1=c.createOscillator(); o1.type="sine";
  o1.frequency.setValueAtTime(150,t);
  o1.frequency.exponentialRampToValueAtTime(58,t+.09);
  const g1=c.createGain();
  g1.gain.setValueAtTime(.0001,t);
  g1.gain.exponentialRampToValueAtTime(.14,t+.004);
  g1.gain.exponentialRampToValueAtTime(.0001,t+.11);
  o1.connect(g1); g1.connect(out); o1.start(t); o1.stop(t+.14);
  Sn.budget--;
}catch(e){ Sn.dead=true; } }

/* a dry tick for the interface */
function tick(f,vol){ try{
  if(!audioOK()) return;
  const c=actx(); if(!c) return;
  const t=c.currentTime;
  const out=bus(c,0,.04);
  const o1=c.createOscillator(); o1.type="triangle";
  o1.frequency.setValueAtTime(f||620,t);
  o1.frequency.exponentialRampToValueAtTime((f||620)*1.5,t+.03);
  const g=c.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||.09,t+.003);
  g.gain.exponentialRampToValueAtTime(.0001,t+.06);
  o1.connect(g); g.connect(out); o1.start(t); o1.stop(t+.08);
  Sn.budget--;
}catch(e){ Sn.dead=true; } }

/* every voice lands on a pentatonic step, so a cascade plays a run */
let audioPrimed=false;
function unlockAudio(){
  const c=actx(); if(!c) return;
  if(c.state!=="running"){ try{ c.resume(); }catch(e){} }
  if(!audioPrimed){
    // iOS only really wakes up once a buffer has actually been played
    try{
      const b=c.createBuffer(1,1,22050);
      const src=c.createBufferSource();
      src.buffer=b; src.connect(Sn.master||c.destination); src.start(0);
      audioPrimed=true;
    }catch(e){}
  }
}
addEventListener("pointerdown",unlockAudio,{passive:true,capture:true});
addEventListener("touchstart",unlockAudio,{passive:true,capture:true});
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) unlockAudio(); });

const LADDER=[0,2,4,7,9,12,14,16,19,21,24,26,28,31,33,36];
const semi=n=>Math.pow(2,n/12);
const noteStep=()=>LADDER[Math.min(combo,LADDER.length-1)];
function haptic(p){ if(G.opt.haptic&&navigator.vibrate){ try{navigator.vibrate(p);}catch(e){} } }

/* ---------------------------------------------------------------- world */
let balls=[],parts=[],rings=[],pops=[],fuses=[];
let combo=0,comboT=0,shake=0,freeze=0,flash=0,el=0,pulseT=0,seq=0;
let trail=[],ptrDown=false,ptrX=0,ptrY=0,ptrId=null,ready=false;
let zoom=1,zoomPhase=0,zoomT=0,zoomFade=0;
const timers={chain:0,storm:0,stormT:0};


const RBOW=["#FF3B57","#FF7A1A","#FFD400","#3CD070","#22B8FF","#7A5CFF","#FF4FD0"];
/* the same seven as components, because a canvas gradient wants numbers */
const RBOW_RGB=["255,59,87","255,122,26","255,212,0","60,208,112","34,184,255","122,92,255","255,79,208"];
const rbBand=(off)=>{ const i=Math.floor(el*6+(off||0)); return ((i%RBOW.length)+RBOW.length)%RBOW.length; };
/* the band each ball sits in walks forward about six a second, and each ball
   starts somewhere else in the ring, so a dishful never marches in step */
function rbIdx(b,off){
  const i=Math.floor(el*6 + (b.id||0)*1.7 + (off||0));
  return RBOW[((i%RBOW.length)+RBOW.length)%RBOW.length];
}
function rbGrad(x,b,r){
  const a=el*2.2 + (b.id||0);
  const g=x.createLinearGradient(-Math.cos(a)*r,-Math.sin(a)*r,Math.cos(a)*r,Math.sin(a)*r);
  // nine stops rather than five: the bands meet instead of smearing
  for(let i=0;i<=8;i++) g.addColorStop(i/8, rbIdx(b,i*0.9));
  return g;
}
/* what makes it read as a prism rather than a coloured ball: a bright band
   crossing the face, a lit rim, and three sparks going round */
function rbShine(x,b,r){
  const a=el*2.2+(b.id||0), t=(el*1.35+(b.id||0)*.37)%1;
  x.save();
  x.beginPath(); x.arc(0,0,r*.97,0,TAU); x.clip();
  x.rotate(a+Math.PI/2);
  const band=x.createLinearGradient(0,-r,0,r);
  const c=(-1+t*2)*r;
  band.addColorStop(clamp((c-r*.34+r)/(2*r),0,1),"rgba(255,255,255,0)");
  band.addColorStop(clamp((c+r)/(2*r),0,1),"rgba(255,255,255,.62)");
  band.addColorStop(clamp((c+r*.34+r)/(2*r),0,1),"rgba(255,255,255,0)");
  x.fillStyle=band; x.fillRect(-r,-r,r*2,r*2);
  x.restore();
  // a lit rim on the side the sweep is coming from
  x.save();
  x.strokeStyle="rgba(255,255,255,.85)"; x.lineWidth=Math.max(1.2,r*.075);
  x.lineCap="round";
  x.beginPath(); x.arc(0,0,r*.9,a-1.05,a+0.35); x.stroke();
  x.globalAlpha=.5; x.strokeStyle=rbIdx(b,4);
  x.beginPath(); x.arc(0,0,r*.9,a+Math.PI-.8,a+Math.PI+.5); x.stroke();
  x.restore();
  // and three sparks in orbit
  for(let i=0;i<3;i++){
    const ang=a*1.7+i*TAU/3, rr=r*(1.08+.07*Math.sin(el*3+i*2));
    const sx=Math.cos(ang)*rr, sy=Math.sin(ang)*rr;
    const sz=Math.max(1,r*.09)*(.7+.3*Math.sin(el*5+i));
    x.fillStyle=rbIdx(b,i*2);
    x.beginPath(); x.arc(sx,sy,sz*1.9,0,TAU); x.globalAlpha=.35; x.fill();
    x.fillStyle="#fff"; x.globalAlpha=.95;
    x.beginPath(); x.arc(sx,sy,sz,0,TAU); x.fill();
    x.globalAlpha=1;
  }
}
function tierRadius(tier,cls){ return TIER[tier].r*S*cls.size; }
function makeBall(tier,x,y,vx,vy,cls,mass,kind){
  const maxHp=Math.max(1,Math.round(cls.taps*TIER[tier].hp));
  return {id:++seq,tier,cls,kind:kind||"plain",
    x,y,vx,vy,r:tierRadius(tier,cls),
    mass:mass===undefined?cls.mass:mass,
    hp:maxHp,maxHp,mate:null,fuseT:0,born:el,bead:0,luck:false,mg:0,rot:rnd(0,TAU),
    wob:.019,wp:rnd(0,TAU),ws:rnd(.5,.9),sq:0,sqA:0,hit:0,pulse:rnd(0,TAU),lastHit:0};
}
function dropKind(bonus){
  const p=val("purity")+(bonus||0);
  const r=Math.random();
  if(r<p) return "golden";
  if(r<p+0.06) return "unstable";
  return "plain";
}
const VENT_LUCKY=0.012;
function bumpCombo(){
  combo++; comboT=1.55;   // Streak used to stretch this
  if(combo>G.stat.bestCombo) G.stat.bestCombo=combo;
  objProg("combo",0,combo);
  const c=document.getElementById("combo"), m=totalMul(), cap=comboCap()*(x2On()?2:1);
  const k=(m-1)/(cap-1);
  c.textContent="×"+m.toFixed(2);
  c.classList.toggle("max", m>=cap-1e-9);
  // it warms as it climbs, so the number is not the only thing telling you
  c.style.setProperty("--cg", k<.34?"#E8A200":k<.68?"#FF6B2C":"#FF3B57");
  c.classList.remove("on"); void c.offsetWidth; c.classList.add("on");
}
function earn(base,x,y,col){
  const v=base*yieldMul()*comboMul();
  G.bio+=v; G.earned+=v; G.totalEarned+=v;
  objProg("earn",v);
  if(v>=0.5) pushPop(x,y,"+"+fmt(v));
}
/* A number was drawn in the colour of the ball that produced it, with a white
   outline, on a white dish — lime and yellow simply vanished. One fixed
   scheme now: cream fill, green outline, so every amount reads the same
   wherever it lands. And a busy dish used to stack them into one illegible
   pile, so a new pop steps off anything already sitting where it wants to be. */
if(document.fonts&&document.fonts.load){ document.fonts.load("700 26px Poppins").catch(()=>{}); }
function pushPop(x,y,txt){
  let px=x, py=y;
  // walk a ladder rather than guessing: alternate sides and climb, so eight
  // simultaneous breaks read as eight numbers instead of one smear
  for(let pass=1;pass<=8;pass++){
    let clash=false;
    for(const p of pops){
      if(p.t>.30) continue;
      if(Math.abs(p.x-px)<38*S && Math.abs(p.y-py)<20*S){ clash=true; break; }
    }
    if(!clash) break;
    px = x + (pass%2?1:-1)*(12+pass*8)*S + rnd(-3,3)*S;
    py = y - pass*15*S;
  }
  pops.push({x:px, y:py, t:0, life:.85, txt});
}
function goo(x,y,r,c,life,vx,vy){ parts.push({x,y,vx,vy,r,col:c,t:0,life,goo:true,drag:.9}); }
function spark(x,y,c){
  const a=rnd(0,TAU),s=rnd(80,400)*S;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rnd(1.1,3)*S,col:c,t:0,life:rnd(.28,.55),goo:false,drag:.86});
}
function remove(b){ const i=balls.indexOf(b); if(i>=0) balls.splice(i,1); b.gone=true; unmate(b); }
function unmate(b){ if(b.mate){ b.mate.mate=null; b.mate.fuseT=0; b.mate=null; } b.fuseT=0; }
function nearest(x,y,rad,skip){
  let best=null,bd=rad;
  for(const o of balls){
    if(o===skip||o.gone) continue;
    const d=Math.hypot(o.x-x,o.y-y);
    if(d<bd){ bd=d; best=o; }
  }
  return best;
}

/* ---- fusion: 2048, played upward ------------------------------------ */
const TCOUNT=new Array(TIER.length).fill(0);
function canFuse(a,b){
  return a.tier===b.tier && a.tier>0 && !a.gone && !b.gone
      && a.kind==="plain" && b.kind==="plain"
      && el-a.born>0.25 && el-b.born>0.25;
}
/* the pair, plus the two nearest of the same rung that are not already
   spoken for. Null if there are not four, which is the whole point. */
function fuseCrew(a,b){
  const crew=[a,b];
  if(fuseCost(a,b)<=2) return crew;
  // near enough to be touching one of the two, not merely in the area
  const R=(a.r+b.r)*1.6, cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
  const pool=[];
  for(const o of balls){
    if(o===a||o===b||o.gone) continue;
    if(o.tier!==a.tier||o.kind!=="plain") continue;
    // a ball locked to someone else is still fair game: the price is the
    // price, and removing it unmates it on the way out
    if(el-o.born<=0.25) continue;
    const d=Math.hypot(o.x-cx,o.y-cy);
    if(d<=R) pool.push({o,d});
  }
  // the untouched ones first, since a ball that has merged before raises
  // what the whole group has to pay
  pool.sort((p,q)=>((p.o.mg|0)-(q.o.mg|0))||(p.d-q.d));
  let need=fuseCost(a,b), i=0;
  while(crew.length<need){
    if(i>=pool.length) return null;
    const o=pool[i++].o;
    crew.push(o);
    if(o.mg) need=3;                    // it may have just got dearer
  }
  return crew;
}
function fuse(crew){
  const a=crew[0], b=crew[1];
  const nt=a.tier-1;
  let cls=a.cls, x=0, y=0, vx=0, vy=0, mass=0;
  for(const o of crew){
    if(o.cls.i>cls.i) cls=o.cls;
    x+=o.x; y+=o.y; vx+=o.vx; vy+=o.vy; mass+=o.mass;
  }
  x/=crew.length; y/=crew.length; vx/=crew.length; vy/=crew.length;
  const col=PAL()[nt];
  for(const o of crew) remove(o);
  const n=makeBall(nt,x,y,vx,vy,cls,mass,"plain");
  n.mg=1;                             // it has been through one, so it costs three now
  n.wob=.20; n.sq=.26; n.sqA=Math.atan2(b.y-a.y,b.x-a.x)+Math.PI/2; n.born=el-0.2; n.skinFade=el;
  clampIn(n);
  balls.push(n);

  G.stat.merges++; objProg("merge",1);
  // one puff from each of the four, so you can see what it cost
  for(const o of crew){
    for(let i=0;i<5;i++){
      const ang=Math.atan2(y-o.y,x-o.x)+rnd(-.9,.9), s2=rnd(40,170)*S;
      goo(o.x,o.y,rnd(2,4.6)*S,col,rnd(.2,.4),Math.cos(ang)*s2,Math.sin(ang)*s2);
    }
    for(let i=0;i<3;i++) spark(o.x,o.y,"#fff");
  }
  rings.push({x,y,r:n.r*1.5,R:n.r*.6,t:0,life:.34,col:"#fff",w:2.6});
  rings.push({x,y,r:n.r*.5,R:n.r*1.9,t:0,life:.42,col,w:2});
  pushPop(x,y-n.r*.7,"+"+fmt(n.mass));
  shake=Math.max(shake,2.2+(DROPT-nt)*1.6);
  flash=Math.max(flash,.10+(DROPT-nt)*.06);
  if(nt<=1) freeze=Math.max(freeze,.045);
  // pitch climbs as the ladder does
  const fp=panAt(x);
  chime(NOTE[nt]*3,{pan:fp,vol:.20,len:.55+(DROPT-nt)*.28});
  chime(NOTE[nt]*4.5,{pan:fp,vol:.09,len:.45,delay:.045});
  noiseHit(.14,{pan:fp,vol:.07,cut:1400,q:4,wet:.2});
  if(nt<=DROPT-1) thud(72,{pan:fp,vol:.22,len:.26});
  haptic(nt<=1?26:14);
}

/* ---- damage & division ---------------------------------------------- */
function strike(b,dmg,src,forced){
  if(!b||b.gone) return;
  if(!forced && el-b.lastHit<0.07) return;
  b.lastHit=el;
  b.sqA=src?Math.atan2(b.y-src.y,b.x-src.x):rnd(0,TAU);
  b.sq=.30; b.wob=.16; b.hit=1;

  if(b.kind==="unstable"){ detonate(b,0); return; }

  b.hp-=(dmg===undefined?val("force"):dmg);
  if(b.hp>0){
    // a glancing hit: the membrane snaps back but the ball holds
    shake=Math.max(shake,1.5);
    rings.push({x:b.x,y:b.y,r:b.r*.72,R:b.r*1.22,t:0,life:.24,col:b.col||PAL()[b.tier],w:2});
    for(let i=0;i<4;i++) spark(b.x,b.y,PAL()[b.tier]);
    const hp2=panAt(b.x);
    pop(NOTE[b.tier]*2.6*semi(noteStep()),{pan:hp2,vol:.07,wet:.05});
    noiseHit(.05,{pan:hp2,vol:.05,cut:3200,type:"highpass",to:.5,wet:.03});
    haptic(7);
    return;
  }
  divide(b);
}

function divide(b){
  if(b.luck){ b.luck=false; luckWindow(b.x,b.y); }
  remove(b);
  const col=b.kind==="golden"?rbIdx(b,0):PAL()[b.tier];
  const base=NOTE[b.tier];
  G.stat.splits++; objProg("split",1);

  // a rainbow does not have halves. It goes all at once.
  if(b.tier>=LAST||b.kind==="golden"){ finish(b,col); return; }

  const hard=ballCeil();
  const ct=b.tier+1, cr=tierRadius(ct,b.cls);
  const ax=rnd(0,TAU), kick=52+b.r*2.0;
  const kids=[];
  for(let i=0;i<2;i++){
    if(balls.length>=hard) break;
    const a=ax+i*Math.PI+rnd(-.14,.14), off=(b.r-cr)*.55;
    const nb=makeBall(ct,b.x+Math.cos(a)*off,b.y+Math.sin(a)*off,
      b.vx*.55+Math.cos(a)*kick, b.vy*.55+Math.sin(a)*kick,
      b.cls, b.mass/2, "plain");
    nb.wob=.24; nb.sq=.20; nb.sqA=a; nb.lastHit=el;
    clampIn(nb);
    balls.push(nb); kids.push(nb);
  }

  for(let i=0;i<7+b.tier*2;i++){
    const a=ax+Math.PI/2+(Math.random()<.5?0:Math.PI)+rnd(-.5,.5), s=rnd(45,230)*S;
    goo(b.x,b.y,rnd(2,5.2)*S,col,rnd(.22,.42),Math.cos(a)*s,Math.sin(a)*s);
  }
  for(let i=0;i<5;i++) spark(b.x,b.y,col);
  rings.push({x:b.x,y:b.y,r:b.r*.4,R:b.r*2.1,t:0,life:.32,col,w:2.3});

  shake=Math.max(shake,1.8+(LAST-b.tier)*1.3);
  flash=Math.max(flash,.12+(LAST-b.tier)*.04);
  if(b.tier===0) freeze=Math.max(freeze,.03);
  bumpCombo();
  earn(b.mass*0.06*(b.kind==="golden"?25:1),b.x,b.y,col);

  const sp=panAt(b.x);
  pop(base*2*semi(noteStep()),{pan:sp,vol:.2});
  noiseHit(.09,{pan:sp,vol:.06,cut:2400,q:3});
  if(b.tier<=1) thud(58,{pan:sp,vol:.16,len:.18});
  haptic(b.tier===0?16:10);

  const casc=val("cascade");
  for(const k of kids){
    if(Math.random()<casc) fuses.push({b:k,t:.05+Math.random()*.04,d:999});
    else if(timers.chain>0){                 // now only the Chain power does this
      const n=nearest(k.x,k.y,b.r*3.4,k);
      if(n) fuses.push({b:n,t:.06+Math.random()*.06,d:999});
    }
  }
}

/* the smallest size does not divide — it goes, and pays out */
function finish(b,col){
  G.stat.pops++; objProg("pop",1);
  if(b.kind==="golden"){ G.stat.gold++; objProg("gold",1); }
  if(b.luck){ b.luck=false; luckWindow(b.x,b.y); }
  for(let i=0;i<11;i++){
    const a=rnd(0,TAU),s=rnd(35,180)*S;
    goo(b.x,b.y,rnd(2.4,6)*S,col,rnd(.26,.48),Math.cos(a)*s,Math.sin(a)*s);
  }
  for(let i=0;i<9;i++) spark(b.x,b.y,col);
  rings.push({x:b.x,y:b.y,r:b.r*.5,R:b.r*3,t:0,life:.4,col,w:2});
  shake=Math.max(shake,2.8);
  bumpCombo();
  earn(b.mass*(b.kind==="golden"?25:1),b.x,b.y,col);
  const fp2=panAt(b.x);
  pop(NOTE[LAST]*2.4*semi(noteStep()),{pan:fp2,vol:.22,wet:.2});
  noiseHit(.07,{pan:fp2,vol:.05,cut:6000,type:"highpass",to:.6,wet:.12});
  haptic(10);
}

/* rupture: take the whole lineage in one hit */
function burstWhole(b){
  if(b.luck){ b.luck=false; luckWindow(b.x,b.y); }
  remove(b);
  const col=PAL()[b.tier];
  const n=Math.pow(2,LAST-b.tier);
  G.stat.pops+=n; objProg("pop",n);
  if(b.kind==="golden"){ G.stat.gold++; objProg("gold",1); }
  for(let i=0;i<20;i++){
    const a=rnd(0,TAU),s=rnd(50,320)*S;
    goo(b.x,b.y,rnd(2,6.5)*S,col,rnd(.3,.55),Math.cos(a)*s,Math.sin(a)*s);
  }
  for(let i=0;i<16;i++) spark(b.x,b.y,Math.random()<.4?"#fff":col);
  rings.push({x:b.x,y:b.y,r:b.r*.3,R:b.r*4,t:0,life:.5,col:"#fff",w:3});
  shake=Math.max(shake,7); flash=Math.max(flash,.32); freeze=Math.max(freeze,.045);
  bumpCombo();
  earn(b.mass*(b.kind==="golden"?25:1),b.x,b.y,"#FFFFFF");
  pushPop(b.x,b.y-24,"INSTANT");
  const rp=panAt(b.x);
  chime(NOTE[b.tier]*4,{pan:rp,vol:.17,len:.7});
  pop(NOTE[b.tier]*3*semi(noteStep()),{pan:rp,vol:.2,wet:.28});
  noiseHit(.3,{pan:rp,vol:.12,cut:5200,to:.08,wet:.3});
  thud(80,{pan:rp,vol:.24,len:.3});
  haptic(24);
}

function detonate(b,depth){
  remove(b);
  G.stat.bursts++; objProg("burst",1);
  const HOT="#FFE9A8", R=b.r*4.3;
  rings.push({x:b.x,y:b.y,r:b.r*.4,R:R*1.1,t:0,life:.48,col:HOT,w:4});
  rings.push({x:b.x,y:b.y,r:b.r*.2,R:R*.6,t:0,life:.26,col:"#fff",w:2});
  for(let i=0;i<24;i++){
    const a=rnd(0,TAU),s=rnd(110,520)*S;
    goo(b.x,b.y,rnd(2,6.8)*S,HOT,rnd(.3,.55),Math.cos(a)*s,Math.sin(a)*s);
  }
  for(let i=0;i<20;i++) spark(b.x,b.y,Math.random()<.4?"#fff":HOT);
  shake=Math.max(shake,11); flash=Math.max(flash,.48); freeze=Math.max(freeze,.06);
  bumpCombo(); earn(b.mass*0.5,b.x,b.y,HOT); haptic(28);
  const dp=panAt(b.x);
  thud(96,{pan:dp,vol:.34,len:.4});
  noiseHit(.42,{pan:dp,vol:.22,cut:1100,q:.8,to:.06,wet:.34});
  noiseHit(.1,{pan:dp,vol:.1,cut:7000,type:"highpass",to:.5,wet:.2});

  const caught=[];
  for(const o of balls){
    const dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy);
    if(d<R+o.r){
      const f=1-clamp(d/(R+o.r),0,1);
      o.vx+=(dx/(d||1))*360*S*f; o.vy+=(dy/(d||1))*360*S*f;
      o.wob=Math.max(o.wob,.22);
      caught.push({o,d});
    }
  }
  if(depth<5){
    caught.sort((p,q)=>p.d-q.d);
    for(const c of caught) fuses.push({b:c.o,t:.03+c.d/(R*7),d:999,depth:depth+1});
  }
}

/* ---------------------------------------------------------------- input */
function hitAt(px,py){
  let f=null,bd=Infinity;
  for(const b of balls){
    if(b.gone) continue;
    const d=Math.hypot(b.x-px,b.y-py);
    const grace=b.r+(b.r<26*S?15:5);
    if(d<grace&&d<bd){ bd=d; f=b; }
  }
  return f;
}
function touchAt(px,py){
  Sn.budget=18;
  const b=hitAt(px,py);
  if(b){ G.stat.taps++; strike(b,undefined,{x:px,y:py}); }
  else rings.push({x:px,y:py,r:2,R:30*S,t:0,life:.28,col:trailCol(),w:1.4});
}
function sweep(x0,y0,x1,y1){
  const rad=val("reach")*S+4;
  for(const b of balls){
    if(b.gone||el-b.lastHit<0.09) continue;
    if(segDist(x0,y0,x1,y1,b.x,b.y)<rad+b.r*.85) strike(b,undefined,{x:x0,y:y0});
  }
}
function segDist(x0,y0,x1,y1,px,py){
  const dx=x1-x0,dy=y1-y0,L=dx*dx+dy*dy;
  let t=L?((px-x0)*dx+(py-y0)*dy)/L:0; t=clamp(t,0,1);
  return Math.hypot(px-(x0+dx*t),py-(y0+dy*t));
}
function trailCol(){ return (TRAILS.find(t=>t.id===G.trail)||TRAILS[0]).c; }
function localPt(e){ const r=roomArena.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }

roomArena.addEventListener("pointerdown",e=>{
  if(zoomPhase||room!=="arena") return;
  if(e.target.closest("button,input,#dock,#sheet,#scrim,.rail,.cur")) return;
  e.preventDefault(); actx();
  const p=localPt(e);
  ptrDown=true; ptrId=e.pointerId; ptrX=p.x; ptrY=p.y;
  trail.push({x:p.x,y:p.y,t:0});
  touchAt(p.x,p.y);
  try{ roomArena.setPointerCapture(e.pointerId); }catch(err){}
},{passive:false});
roomArena.addEventListener("pointermove",e=>{
  if(!ptrDown||e.pointerId!==ptrId) return;
  e.preventDefault();
  const p=localPt(e);
  if(Math.hypot(p.x-ptrX,p.y-ptrY)>2){
    sweep(ptrX,ptrY,p.x,p.y);
    trail.push({x:p.x,y:p.y,t:0});
    ptrX=p.x; ptrY=p.y;
  }
},{passive:false});
const endPtr=e=>{ if(e.pointerId===ptrId){ ptrDown=false; ptrId=null; } };
roomArena.addEventListener("pointerup",endPtr);
roomArena.addEventListener("pointercancel",endPtr);

/* ---------------------------------------------------------------- prestige */
function canPrestige(){ return G.strain<SCALES.length-1 && G.earned>=nextScaleCost(); }
/* The ascent, in two beats.
   1. COLLAPSE — every ball in the dish is drawn into one, which swells as it
      swallows them. The metaball layer does the melting for free.
   2. PULL BACK — that one ball shrinks to ordinary size while the sky
      crossfades, and a few of its new neighbours fade in around it. What you
      spent the whole scale building is now a single object in a bigger room. */
let core=null;
function doPrestige(){
  if(!canPrestige()||zoomPhase) return;
  zoomPhase=1; zoomT=0;
  ptrDown=false; ptrId=null;
  fuses.length=0; cele.length=0;
  const cx=W/2, cy=(AR.y0+AR.y1)/2;
  // the biggest ball on the table becomes the seed everything else falls into
  let seed=balls[0];
  for(const b of balls) if(!seed||b.r>seed.r) seed=b;
  if(!seed){ seed=makeBall(DROPT,cx,cy,0,0,bestBall(),undefined,"plain"); balls.push(seed); }
  seed.x=cx; seed.y=cy; seed.vx=seed.vy=0; seed.mate=null; seed.maxHp=1; seed.hp=1;
  core=seed; core.area=core.r*core.r;
  for(const b of balls){ b.mate=null; b.fuseT=0; }
  banner("COLLAPSE");
  thud(58,{vol:.26,len:.5});
  noiseHit(1.1,{vol:.10,cut:900,to:.25,wet:.45});
  haptic([18,30,18]);
}
function stepZoom(dt){
  zoomT+=dt;
  const cx=W/2, cy=(AR.y0+AR.y1)/2;

  if(zoomPhase===1){
    if(core){ core.x=cx; core.y=cy; core.vx=core.vy=0; core.mate=null; }
    // pull everything in, and eat what arrives
    for(let i=balls.length-1;i>=0;i--){
      const b=balls[i];
      if(b===core) continue;
      b.mate=null; b.fuseT=0;
      const dx=cx-b.x, dy=cy-b.y, d=Math.hypot(dx,dy)||1;
      const pull=(680+zoomT*1500)*dt;
      b.vx+=dx/d*pull; b.vy+=dy/d*pull;
      b.vx*=Math.pow(.25,dt); b.vy*=Math.pow(.25,dt);
      b.x+=b.vx*dt; b.y+=b.vy*dt;
      b.wob=Math.max(b.wob,.10);
      if(d<core.r*.62){
        core.area+=b.r*b.r;
        core.r=Math.sqrt(core.area);
        core.wob=Math.max(core.wob,.16); core.sq=.16; core.sqA=Math.atan2(dy,dx);
        balls.splice(i,1); b.gone=true;
        for(let k=0;k<5;k++) goo(b.x,b.y,rnd(2,5)*S,PAL()[b.tier],rnd(.2,.4),rnd(-90,90)*S,rnd(-90,90)*S);
        pop(NOTE[b.tier]*2,{pan:panAt(b.x),vol:.11,wet:.22});
        shake=Math.max(shake,2.2);
      }
    }
    zoomFade=clamp((zoomT-0.35)/0.9,0,1)*0.35;
    if(balls.length<=1&&zoomT>0.55||zoomT>2.6){
      zoomPhase=2; zoomT=0;
      coreFrom=core?core.r:80*S;
      fromScale=curScale();
      applyAscent();
      coreTo=0;
    }
    return;
  }

  // pull back
  const k=clamp(zoomT/1.35,0,1), e=easeOut(k);
  if(core){
    core.x=cx; core.y=cy; core.vx=core.vy=0;
    core.r=coreFrom+(coreTo-coreFrom)*e;
  }
  blendBg(fromScale,curScale(),clamp(k*1.5,0,1));
  zoomFade=(1-k)*0.35;
  if(k>=1){
    zoomPhase=0; zoomFade=0;
    if(core){ bhBirth(core.x,core.y); remove(core); }
    core=null;
    drawBg();
    for(let i=0;i<SLOTS;i++) if(wiz(i)) WZ[i].t=Math.min(WZ[i].t,.25+i*.14);
  }
}
let coreFrom=0, coreTo=0, fromScale=null;

/* the state reset happens the instant the collapse finishes, so the pull-back
   is already showing the new scale */
function applyAscent(){
  G.strain++; G.stat.strains++;
  G.bio=0; G.earned=0;
  // every track genuinely starts at zero; both of these read fine at level 0
  const up={}; for(const k of UPK) up[k]=0;
  G.up=up;
  parts.length=0; fuses.length=0; rings.length=0; pops.length=0;
  G.wiz=Array(SLOTS).fill(null); G.wlvl=[0,0,0,0,0,0]; G.summons=0;
  G.wiz[5]={id:++G.wizSeq, rank:0};
  WZ=[]; syncWZ(); wizSel=-1;
  combo=0;
  G.spore+=3+G.strain*2;
  const sc=SCALES[G.strain];
  FORM=sc.form;
  banner(sc.n.toUpperCase());
  setTimeout(()=>toast("One ball is now "+sc.ball+" · yield ×"+fmt(sc.mult)),1100);
  thud(42,{vol:.34,len:1.2});
  for(let i=0;i<4;i++) chime(261*semi(LADDER[i]),{vol:.13,len:1.9,delay:i*.11,wet:.66});
  save(); buildTabs();
}

let CELLS=[];                  // cached cell rects, stage-relative
let WZ=[];                     // runtime per-slot: timer, cast anim, bob

const wiz=i=>G.wiz&&G.wiz[i];
const wrank=i=>WRANK[wiz(i).rank];
const rlvl=r=>(G.wlvl&&G.wlvl[r])|0;
const rDelay=r=>WRANK[r].delay*Math.pow(0.94,rlvl(r));
const rUpCost=r=>Math.ceil(WRANK[r].upBase*Math.pow(1.34,rlvl(r))*scaleMul());
const rCapped=r=>rDelay(r)<=WRANK[r].delay*0.301;

const wUpCost=i=>rUpCost(wiz(i).rank);

const castX=i=>((i%WCOLS)+0.5)/WCOLS*W;
const wizCount=()=>{ let n=0; for(let i=0;i<PLAY;i++) if(G.wiz[i]) n++; return n; };

function throughput(){
  let t=0;
  for(let i=0;i<SLOTS;i++) if(wiz(i)) t+=wrank(i).mass/wDelay(i);
  return t*yieldMul();
}
function anyMerge(){
  const seen={};
  for(let i=0;i<SLOTS;i++){
    const w=wiz(i); if(!w||w.rank>=TOPRANK) continue;
    if(seen[w.rank]) return true;
    seen[w.rank]=1;
  }
  return false;
}
function syncWZ(){

function layoutWizards(){
  if(!wgridEl||!wgridEl.children.length||camBusy>0) return;

  root.style.setProperty("--cellH",cell+"px");
  // the canvas backing store must track the stage, or everything it draws is
  // scaled by the mismatch and drifts further the lower down the board it is
  const nw=Math.max(1,Math.round(sr.width)), nh=Math.max(1,Math.round(sr.height));
  if(nw!==WSW||nh!==WSH){
    WSW=nw; WSH=nh;

/* ---- the loop: every wizard runs whether or not you are watching ---- */
function stepWizards(dt){
  for(let i=0;i<SLOTS;i++){
    const z=WZ[i]; if(!z) continue;
    z.bob+=dt*1.6;
    if(z.cast>0) z.cast=Math.max(0,z.cast-dt*3.4);
    if(!wiz(i)){ z.t=0; z.held=false; continue; }
    if(z.t>0) z.t-=dt;
    if(z.t<=0){
      // it holds the cast until the ball it is about to throw actually fits
      if(!roomFor(tierRadius(wrank(i).tier,wrank(i)))){ z.held=true; continue; }
      z.held=false; z.t=wDelay(i); z.cast=1;
      castBall(i);
    }
  }
  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i];
    b.t+=dt;
    if(b.spark){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.vy+=900*dt; if(b.t>.7) bolts.splice(i,1); }
    else { b.y+=b.v*dt; b.v+=2400*dt; if(b.y>WSH+60) bolts.splice(i,1); }
  }
}
/* A fresh save has no balls, no wizards, and no way to earn the 120 the
   first wizard costs: measured over a simulated minute it made exactly
   nothing. The vent under the handle coughs one up every five to ten
   seconds. It is a floor, not a source — its mass is fixed at eight and
   never follows your rank, so by the time wizards are working it is noise. */
const VENT={t:3.5, max:3.5, mass:26, n:0};
/* What the vent rolls: cyan is the floor and yellow is the prize, four rungs
   up the ladder. Rarer has to be worth more or the colour is just a colour,
   so the mass climbs 1.6x a rung — a yellow one carries eight times a cyan
   one and takes three taps to open rather than one. Across the whole table
   that is 14.9 mass a drop against the flat 8 it used to be, which matters
   for about the first minute and is noise next to a wizard after that. */
const VENT_ROLL=[
  {tier:5, p:.20},   // cyan
  {tier:4, p:.30},   // blue
  {tier:3, p:.20},   // purple
  {tier:2, p:.15},   // red
  {tier:1, p:.10},   // orange
  {tier:0, p:.05},   // yellow
];
/* refreshes rather than stacks: a second rainbow inside the window buys you
   two more minutes, not ten times the money */
function luckWindow(x,y){
  const fresh=!luckOn();
  luckUntil=el+LUCK_SECS;
  setFrenzy(true);
  banner(fresh?"FRENZY ×5":"FRENZY EXTENDED");
  for(let i=0;i<26;i++){
    const a=rnd(0,TAU), sp=rnd(80,420)*S;
    goo(x,y,rnd(2.5,6)*S,RBOW[i%RBOW.length],rnd(.3,.6),Math.cos(a)*sp,Math.sin(a)*sp);
  }
  for(let i=0;i<7;i++)
    rings.push({x,y,r:8*S,R:(70+i*26)*S,t:-0,life:.5+i*.05,col:RBOW[i%RBOW.length],w:2.4});
  shake=Math.max(shake,7); flash=Math.max(flash,.22);
  for(let i=0;i<5;i++) chime(392*semi(LADDER[i*2]),{vol:.13,len:1.5,delay:i*.07,wet:.6});
  haptic([14,40,14,40,22]);
}
/* ---- opening a case ------------------------------------------------------
   Forty tiles roll past a marker and slow into the one that was already
   decided: the roll happens first, the animation only shows it. */
let caseBusy=false;
function caseTile(c){
  const e=document.createElement("div");
  e.className="ctile"; e.style.setProperty("--rc",c.c);
  e.innerHTML='<span class="g"></span>';
  e.appendChild(wizPortrait(c.rank,42));
  const n=document.createElement("span"); n.className="n";
  n.textContent=WRANK[c.rank].nm; e.appendChild(n);
  return e;
}
function openCase(){
  if(caseBusy) return;
  if(!adReady("chest")){ toast("Another case in "+adWait("chest")); return; }
  const box=$("case"); box.classList.add("on");
  const strip=box.querySelector(".cstrip"), won=box.querySelector(".cwon"),
        go=box.querySelector(".cgo");
  won.innerHTML=""; go.innerHTML="Watch \u25B6 Open"; go.className="cgo";
  strip.style.transition="none"; strip.style.transform="translateX(0)";
  strip.innerHTML="";
  for(let i=0;i<14;i++) strip.appendChild(caseTile(caseRoll()));
  go.onclick=()=>{
    if(caseBusy) return;
    if(go.classList.contains("done")){ box.classList.remove("on"); return; }
    caseBusy=true; G.ad.chest=el+180; save();
    const prize=caseRoll(), N=40, LAND=N-9, TILE=80;
    strip.innerHTML="";
    for(let i=0;i<N;i++) strip.appendChild(caseTile(i===LAND?prize:caseRoll()));
    const mid=box.querySelector(".creel").clientWidth/2;
    const target=-(LAND*TILE + TILE/2 + 6 - mid) + rnd(-16,16);
    strip.style.transition="none"; strip.style.transform="translateX(0)";
    void strip.offsetWidth;
    strip.style.transition="transform 5.4s cubic-bezier(.11,.72,.12,1)";
    strip.style.transform="translateX("+target+"px)";
    go.textContent="Opening\u2026";
    // the ticks thin out as it slows, which is the whole sound of a case
    let t=0;
    for(let k=26;k<540;k=Math.round(k*1.17)){ t+=k;
      setTimeout(()=>{ tick(1500-Math.min(700,t*0.13),.05); haptic(3); },t); }
    setTimeout(()=>{
      caseBusy=false;
      const slot=G.wiz.findIndex((w,i)=>i<PLAY&&!w);
      let msg;
      if(slot>=0){
        G.wiz[slot]={id:++G.wizSeq,rank:prize.rank};
        if(WZ[slot]){ WZ[slot].ph=Math.random(); WZ[slot].t=wDelay(slot)*.4; WZ[slot].popT=el; }
        msg="Placed on the board";
      } else {
        const c2=Math.ceil(WRANK[prize.rank].mass*40*scaleMul());
        G.bio+=c2; G.earned+=c2; G.totalEarned+=c2;
        msg="Board full \u2014 sold for $"+fmt(c2);
      }
      won.innerHTML='<span class="r" style="--rc:'+prize.c+'">'+prize.nm+'</span>'+
        '<span class="n">'+WRANK[prize.rank].nm+'</span><span class="s">'+msg+'</span>';
      go.textContent="Take it"; go.className="cgo done";
      celebrate(box.querySelector(".marker"), prize.rank>=3?70:40, prize.c, null, false);
      chime(392,{vol:.16,len:1.1,wet:.55});
      chime(588,{vol:.11,len:1,delay:.07,wet:.55});
      if(prize.rank>=3){ chime(784,{vol:.12,len:1.4,delay:.15,wet:.6}); haptic([18,40,18,40,26]); }
      else haptic(16);
      save(); syncWizGrid(); syncWizPanel(true);
    },5500);
  };
}
function setFrenzy(on){
  const f=$("frenzy"), t=$("fzTag");
  if(f) f.classList.toggle("on",!!on);
  if(t){ t.classList.toggle("on",!!on); if(!on) t.dataset.s=""; }
}
function ventRoll(){
  let r=Math.random();
  for(const v of VENT_ROLL){ r-=v.p; if(r<=0) return v.tier; }
  return VENT_ROLL[0].tier;
}
function ventBall(){
  if(!ready||W<10) return false;
  const cls=WRANK[0], kind=dropKind(VENT_LUCKY);
  const t=ventRoll();
  const up=DROPT-t;                                   // rungs above the drop
  const rr=tierRadius(t,cls);
  if(!roomFor(rr)) return false;               // it has to fit, not just fit in
  const x=clamp(W*.5+rnd(-30,30)*S, rr+2, Math.max(rr+3,W-rr-2));
  const y=AR.y1-rr*1.05;
  // the heavy ones leave slower, or a yellow would be off the top of the dish
  const kick=clamp(1-up*.075,.66,1.12);
  const b=makeBall(t, x, y, rnd(-20,20)*S, -rnd(380,470)*S*kick, cls,
                   VENT.mass*Math.pow(1.6,up), kind);
  b.wob=.26; b.sq=.30; b.sqA=Math.PI/2; b.bead=el; b.luck=kind==="golden";
  balls.push(b);
  const col=b.kind==="golden"?rbIdx(b,0):(b.kind==="unstable"?"#FF9A3D":PAL()[t]);
  // the nozzle: a tight ring at the lip, and a wider one a beat later as the
  // bead clears it — two rings read as something letting go, one reads as a hit
  const big=1+up*.34;
  rings.push({x, y:AR.y1-1, r:3*S,  R:17*S*big, t:0, life:.20+up*.02, col, w:2.6});
  rings.push({x, y:AR.y1-1, r:11*S, R:42*S*big, t:0, life:.36+up*.03, col, w:1.5});
  // the squeeze throws a little of itself sideways along the floor
  for(let k=0;k<10+up*3;k++){
    const a=-Math.PI/2+rnd(-1.25,1.25), sp=rnd(90,250)*S*big;
    parts.push({x, y:AR.y1-3, vx:Math.cos(a)*sp*1.3, vy:Math.sin(a)*sp*.42,
      r:rnd(1.2,2.8)*S, col, t:0, life:rnd(.16,.34), goo:false, drag:.83});
  }
  // and a thread of goo still attached, which snaps as the ball climbs
  for(let k=0;k<4;k++)
    goo(x+rnd(-2,2)*S, AR.y1-2-k*3*S, (2.6-k*.45)*S, col, .20+k*.04,
        rnd(-16,16)*S, -rnd(40,120)*S);
  pop(NOTE[t]*1.35,{pan:panAt(x),vol:.11,wet:.18});
  pop(NOTE[t]*2.02,{pan:panAt(x),vol:.06,wet:.26,delay:.05});
  noiseHit(.07,{pan:panAt(x),vol:.05,cut:2600,q:3});
  if(up>=2){                                   // red, orange, yellow
    chime(196*semi(LADDER[Math.min(up+1,LADDER.length-1)]),
          {vol:.08+up*.015,len:.5+up*.12,wet:.5,delay:.06});
    shake=Math.max(shake,1.4+up*.9);
    haptic(6+up*4);
  }
  VENT.n++;
  const h=document.getElementById("dockHandle");
  if(h&&h.animate){
    const dir=document.getElementById("dock").classList.contains("min")?-1:1;
    h.animate([
      {transform:"translateY(0) scale(1,1)"},
      {transform:"translateY("+(3*dir)+"px) scale(1.16,.80)",offset:.22},   // squeeze
      {transform:"translateY("+(-5*dir)+"px) scale(.86,1.20)",offset:.52},  // release
      {transform:"translateY("+(1*dir)+"px) scale(1.05,.95)",offset:.78},
      {transform:"translateY(0) scale(1,1)"}
    ],{duration:520,easing:"cubic-bezier(.3,1.2,.4,1)"});
    const ah=h.querySelector(".ah");
    const d=document.getElementById("dock").classList.contains("min")?-1:1;
    if(ah&&ah.animate) ah.animate([
      {transform:"translateY(0) scale(1)",             opacity:1},
      {transform:"translateY("+(3*d)+"px) scale(.86,1.14)",opacity:1,offset:.16}, // loads
      {transform:"translateY("+(-9*d)+"px) scale(1.1,.8)",opacity:0, offset:.42}, // fires
      {transform:"translateY("+(7*d)+"px) scale(1)",   opacity:0,    offset:.44}, // returns
      {transform:"translateY(0) scale(1)",             opacity:1}
    ],{duration:540,easing:"cubic-bezier(.3,1.15,.4,1)"});
  }
  return true;
}
function castBall(i){
  const cls=WRANK[wiz(i).rank], t=cls.tier;
  // rainbows are the arrow's business; a wizard casts plain and unstable
  const kind=dropKind()==="unstable"?"unstable":"plain";
  const rr=tierRadius(t,cls);
  const x=clamp(castX(i)+rnd(-9,9), rr+2, Math.max(rr+3,W-rr-2));
  const b=makeBall(t, x, AR.y0+rr*0.9, rnd(-22,22)*S, rnd(190,260)*S, cls, undefined, kind);
  balls.push(b);
  const col=b.kind==="unstable"?"#FF9A3D":PAL()[t];
  for(let k=0;k<6;k++){
    const a=Math.PI/2+rnd(-1.1,1.1), sp=rnd(60,190)*S;
    parts.push({x:b.x,y:AR.y0+4,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*.5,
      r:rnd(1.3,3)*S,col,t:0,life:rnd(.16,.32),goo:false,drag:.84});
  }
  rings.push({x:b.x,y:AR.y0+6,r:6,R:44*S,t:0,life:.24,col,w:2});
  pop(NOTE[t]*2,{pan:panAt(b.x),vol:.09,wet:.14});
  const c=CELLS[i];
  if(c) bolts.push({x:c.cx, y:c.cy+8, v:210, t:0, col, r:Math.max(4,6+wiz(i).rank*1.2)});
}

/* ---- the board's actions ----
   One gesture, one transaction. Duplicated pointer sequences (and human
   double-taps) must never buy or merge twice. */
let lastAct=0;
let holding=false;
const actGate=()=>{
  if(holding) return true;      // a hold is deliberate, not a double tap
  const t=now();
  if(t-lastAct<260) return false;
  lastAct=t; return true;
};
function summonAt(i){
  if(i>=PLAY||wiz(i)||!actGate()) return;
  const c=summonCost();
  if(G.bio<c){ toast("Needs "+fmt(c)+" cash"); return; }
  G.bio-=c; G.summons=(G.summons|0)+1;
  G.wiz[i]={id:++G.wizSeq, rank:0};
  WZ[i].ph=Math.random();
  WZ[i].t=wDelay(i)*(0.1+WZ[i].ph*0.85); WZ[i].cast=0; WZ[i].held=false;
  wizSel=i; WZ[i].popT=el;
  chime(392,{vol:.14,len:.6,wet:.4}); pop(520,{vol:.12});
  haptic(16); save(); syncWizGrid(); syncWizPanel(true);
}
function upgradeWiz(i){
  const w=wiz(i); if(!w||!actGate()) return;
  const r=w.rank;
  if(rCapped(r)){ toast(WRANK[r].nm+" is already at full speed"); return; }
  const c=rUpCost(r);
  if(G.bio<c){ toast("Needs "+fmt(c)+" cash"); return; }
  G.bio-=c; G.wlvl[r]=rlvl(r)+1;
  toast("Every "+WRANK[r].nm+" now casts every "+rDelay(r).toFixed(2)+"s");
  tick(560+rlvl(r)*8,.1); haptic(9);
  save(); syncWizGrid(); syncWizPanel(true);
}
function mergeWiz(from,to){
  const a=wiz(from), b=wiz(to);
  if(!a||!b||a.rank!==b.rank||a.rank>=TOPRANK) return false;
  if(!actGate()) return false;
  const nr=a.rank+1;
  G.wiz[to]={id:++G.wizSeq, rank:nr};
  G.wiz[from]=null;
  WZ[to].ph=Math.random();
  WZ[to].t=wDelay(to)*(0.1+WZ[to].ph*0.7); WZ[to].cast=0; WZ[to].held=false;
  WZ[from].t=0; WZ[from].cast=0; WZ[from].held=false;
  wizSel=to; WZ[to].popT=el;
  const c=CELLS[to], col=PAL()[WRANK[nr].tier];
  if(c) for(let k=0;k<18;k++){
    const ang=rnd(0,TAU), sp=rnd(70,300);
    bolts.push({x:c.cx,y:c.cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,t:0,col,r:rnd(2,5),spark:true});
  }
  if(nr===TOPRANK) banner(WRANK[nr].nm.toUpperCase());
  const n=NOTE[Math.max(0,Math.min(NOTE.length-1,WRANK[nr].tier))];
  chime(n*3,{vol:.2,len:.9,wet:.5});
  chime(n*4.5,{vol:.1,len:.7,delay:.06,wet:.5});
  thud(70,{vol:.24,len:.3});
  haptic([16,28,16]); save(); syncWizGrid(); syncWizPanel(true);
  return true;
}
function moveWiz(from,to){
  if(wiz(to)||!wiz(from)||!actGate()) return false;
  G.wiz[to]=G.wiz[from]; G.wiz[from]=null;
  const a=WZ[from], b=WZ[to];
  b.t=a.t; b.cast=0; b.held=a.held; a.t=0; a.held=false;
  wizSel=to; tick(420,.07); haptic(8);
  save(); syncWizGrid(); syncWizPanel(true);
  return true;
}

/* ---- the panel under the board: what the selected wizard is and how to make
        it faster, with the buy button always available underneath so you can
        keep stacking Apprentices to merge ---- */
let panelSig="";
/* every rank on one page: what it drops, how often, and what the next level
   of speed costs. The panel below the board only ever showed the one you had
   selected, which made the ladder impossible to plan against. */
function sheetWizards(){
  openSheet('<svg viewBox="0 0 24 24" style="width:19px;height:19px;display:block;color:#E8A200">'+ICONS.trophy+'</svg>',
    "Wizards","Every rank on the board",b=>{
    WRANK.forEach((r,rk)=>{
      const many=G.wiz.filter(x=>x&&x.rank===rk).length;
      const L=rlvl(rk), capped=rCapped(rk), c=rUpCost(rk), can=G.bio>=c;
      const d=document.createElement("div");
      d.className="wzRow "+(many?"have":"none");
      const p=wizPortrait(rk,46); p.className="portrait";
      d.appendChild(p);
      const l=document.createElement("div"); l.className="l";
      l.innerHTML='<div class="t">'+r.nm+(L?" \u00B7 Lv "+L:"")+'</div>'+
        '<div class="s">Every '+rDelay(rk).toFixed(2)+'s \u00B7 $'+fmt(r.mass)+' a ball \u00B7 '+
        r.taps+' tap'+(r.taps>1?"s":"")+'</div>'+
        '<div class="n">'+(many?many+" on the board":"none yet")+'</div>';
      d.appendChild(l);
      const btn=document.createElement("button");
      btn.className="wzBtn"+((can&&!capped&&many)?"":" no");
      btn.innerHTML=capped ? "Maxed<small>fastest it goes</small>"
        : !many ? "Locked<small>merge up to it</small>"
        : "Faster<small>$"+fmt(c)+"</small>";
      holdRepeat(btn,()=>{
        if(rCapped(rk)) return false;
        const many2=G.wiz.filter(x=>x&&x.rank===rk).length;
        if(!many2 || G.bio<rUpCost(rk)) return false;
        const i=G.wiz.findIndex(x=>x&&x.rank===rk);
        if(i<0) return false;
        upgradeWiz(i); sheetSync&&sheetSync();
        return true;
      });
      d.appendChild(btn);
      b.appendChild(d);
    });
  });
}
function syncWizPanel(force){
  // the panel is gone; summon lives in the top bar now
  const st=document.getElementById("summonBtn");
  if(st){
    const cost=summonCost(), can=G.bio>=cost, full=wizCount()>=PLAY;
    st.className=(can&&!full)?"":"no";
    st.querySelector(".t").textContent=full?"Full":"Summon";
    st.querySelector(".c").innerHTML=full?"—":(ICO_MASS+fmt(cost));
  }
  const p=document.getElementById("wizPanel"); if(!p) return;
  const i=wizSel, w=wiz(i);
  const sig=[i,w?w.rank+"/"+rlvl(w.rank):"-",wizCount(),summonCost(),
             G.bio>=summonCost(),w?(G.bio>=wUpCost(i)?1:0):0].join("|");
  if(!force&&sig===panelSig) return;
  panelSig=sig;
  p.innerHTML="";

  if(w){
    const r=WRANK[w.rank], rk=w.rank, L=rlvl(rk);
    const c=rUpCost(rk), can=G.bio>=c;
    const nd=r.delay*Math.pow(0.94,L+1);
    const capped=rCapped(rk);
    const many=G.wiz.filter(x=>x&&x.rank===rk).length;
    const row=document.createElement("div"); row.className="wpRow";
    const sw=wizPortrait(w.rank,44);
    sw.className="portrait";
    row.appendChild(sw);
    const l=document.createElement("div"); l.className="l";
    l.innerHTML='<div class="t">'+r.nm+(L?" · Lv "+L:"")+'</div>'+
      '<div class="s">Every '+rDelay(rk).toFixed(2)+'s · '+fmt(r.mass)+' cash · '+
      r.taps+' tap'+(r.taps>1?"s":"")+(many>1?" · "+many+" on the board":"")+'</div>';
    row.appendChild(l);
    const b=document.createElement("button");
    b.className="wpBtn"+(can&&!capped?"":" no");
    b.innerHTML=capped ? "Maxed<small>fastest it goes</small>"
                       : "Faster<small>"+ICO_MASS+" "+fmt(c)+" → "+nd.toFixed(2)+"s · all "+r.nm+"s</small>";
    b.onclick=()=>{ if(!capped) upgradeWiz(i); };
    row.appendChild(b);
    p.appendChild(row);
  } else {
    const h=document.createElement("div"); h.className="wpHint";
    h.innerHTML=wizCount()
      ? "<span><b>Tap</b> a wizard to speed up every wizard of its rank</span>"+
        "<span><b>Drag</b> one onto another of the same rank to merge them</span>"
      : "<span>Summon your first wizard to start producing.</span>";
    p.appendChild(h);
  }

  const opn=document.createElement("button");
  opn.className="wzOpen"; opn.textContent="All wizard upgrades";
  opn.onclick=sheetWizards;
  p.appendChild(opn);

  // always buyable: this is how you get a second of something to merge
  const cost=summonCost(), can=G.bio>=cost, full=wizCount()>=PLAY;
  const sb=document.createElement("button");
  sb.className="wpSummon"+(can&&!full?"":" no");
  sb.innerHTML=full ? "Board full — merge to make room"
                    : "Summon "+WRANK[0].nm+" <small>"+ICO_MASS+" "+fmt(cost)+"</small>";
  sb.onclick=()=>{
    if(full){ toast("Merge two of a kind to free a slot"); return; }
    const e=G.wiz.indexOf(null);
    if(e>=0) summonAt(e);
  };
  p.appendChild(sb);
}

let lastChromeH=0;
function fitBoard(){

  if(!ch) return;
  const h=Math.round(ch.offsetHeight);
  if(h===lastChromeH) return;
  lastChromeH=h;

/* the castle: each slot is a length of battlement, drawn course by course so
   a row of them reads as one wall the wizards are standing along */
function drawBattlement(x,c){
  const h=c.h*0.30, top=c.y+c.h-h;
  const w=c.w, L=c.x, R=c.x+w;
  const cren=h*0.34, notch=w*0.19;
  const outline=()=>{
    x.beginPath();
    x.moveTo(L,top+cren);
    x.lineTo(L,top);            x.lineTo(L+notch,top);
    x.lineTo(L+notch,top+cren); x.lineTo(R-notch,top+cren);
    x.lineTo(R-notch,top);      x.lineTo(R,top);
    x.lineTo(R,c.y+c.h);        x.lineTo(L,c.y+c.h);
    x.closePath();
  };
  x.save();
  outline(); x.fillStyle=BRICK.a; x.fill();

  x.save(); outline(); x.clip();
  const ch=h*0.30;
  for(let row=0,y=top;y<c.y+c.h+ch;row++,y+=ch){
    if(row%2){ x.fillStyle=BRICK.b; x.fillRect(L,y,w,ch*0.55); }
    x.strokeStyle=BRICK.m; x.lineWidth=1;
    x.beginPath(); x.moveTo(L,Math.round(y)+.5); x.lineTo(R,Math.round(y)+.5); x.stroke();
    const off=(row%2)?w*0.16:w*-0.06;
    for(let bx=L+off;bx<R;bx+=w*0.32){
      if(bx<=L+1) continue;
      x.beginPath(); x.moveTo(Math.round(bx)+.5,y); x.lineTo(Math.round(bx)+.5,y+ch); x.stroke();
    }
  }
  // the lip you stand on catches the light
  x.fillStyle=BRICK.t;
  x.fillRect(L,top+cren,w,Math.max(1.5,h*0.08));
  x.fillRect(L,top,notch,Math.max(1.5,h*0.07));
  x.fillRect(R-notch,top,notch,Math.max(1.5,h*0.07));
  x.restore();

  outline();
  x.lineJoin="miter"; x.lineWidth=1.6; x.strokeStyle="rgba(16,22,37,.32)"; x.stroke();
  x.restore();
}

/* ---- drawing the room ----------------------------------------------------
   Chunky proportions, one light source at the upper left, a hard shadow side
   and a heavy outline on every part — the shorthand that makes flat vector
   characters read as crafted rather than assembled from primitives.        */
/* how long a rank change reads for */
const POPT=0.55;
/* one arc up and back: 1 at both ends, half again as big in the middle */
function popScale(i){
  const z=WZ[i]; if(!z||!z.popT) return 1;
  const k=(el-z.popT)/POPT;
  if(k<0||k>1){ if(k>1) z.popT=0; return 1; }
  return 1+0.5*Math.sin(k*Math.PI);
}
function drawWizards(){
  xWz.setTransform(DPR,0,0,DPR,0,0);
  xWz.clearRect(0,0,WSW,WSH);
  for(let i=0;i<SLOTS;i++){ const c=CELLS[i]; if(c) drawBattlement(xWz,c); }
  // a ring off any cell that just changed rank, under the figures
  for(let i=0;i<SLOTS;i++){
    const c=CELLS[i], z=WZ[i];
    if(!c||!z||!z.popT) continue;
    const k=(el-z.popT)/POPT;
    if(k<0||k>1) continue;
    const rr=Math.min(c.w,c.h);
    xWz.save();
    xWz.globalAlpha=(1-k)*(1-k)*.85;
    xWz.strokeStyle=PAL()[WRANK[wiz(i)?wiz(i).rank:0].tier];
    xWz.lineWidth=Math.max(1.6,rr*.05)*(1-k*.6);
    xWz.beginPath();
    xWz.arc(c.cx, c.y+c.h*0.62, rr*(.18+easeOut(k)*.62), 0, TAU);
    xWz.stroke();
    xWz.restore();
  }
  for(let i=0;i<SLOTS;i++){
    const c=CELLS[i];
    if(!wiz(i)||!c||i===wizDrag) continue;
    drawWizardFigure(i, c.cx, c.y+c.h*0.775, Math.min(c.w,c.h)*0.243*popScale(i), 1);
  }
  // the one in your hand rides above everything, lifted and a little bigger
  if(wizDrag>=0&&wiz(wizDrag)){
    const c=CELLS[wizDrag]||CELLS[0];
    const sz=Math.min(c.w,c.h)*0.243;
    xWz.save();
    xWz.globalAlpha=.22; xWz.fillStyle="#0F1720";
    xWz.beginPath(); xWz.ellipse(dragX,dragY+sz*.55,sz*.72,sz*.20,0,0,TAU); xWz.fill();
    xWz.restore();
    drawWizardFigure(wizDrag, dragX, dragY-sz*.30, sz*1.16, .96);
  }
  drawBolts();
}
function drawWizardFigure(i,ax,ay,s,alpha){
  {
    const w=wiz(i), pal=PAL();
    const z=WZ[i], r=WRANK[w.rank], col=pal[r.tier];
    const prog=1-clamp(z.t/wDelay(i),0,1);
    const charge=Math.max(0,(prog-0.70)/0.30);
    const kick=z.cast;
    const bob=Math.sin(z.bob)*1.3;
    xWz.globalAlpha=alpha===undefined?1:alpha;

    const lit=shade(col,.26), dim=shade(col,-.24), deep=shade(col,-.42);
    const ink=shade(col,-.62);
    const lw=Math.max(1.3,s*.105);
    xWz.lineJoin="round"; xWz.lineCap="round";

    xWz.save();
    xWz.translate(ax, ay+bob*0.4);

    /* the summoning circle on the flagstones, filling toward the cast */
    xWz.save();
    xWz.scale(1,.34);
    xWz.lineWidth=Math.max(1.6,s*.10);
    xWz.strokeStyle="rgba(16,22,37,.10)";
    xWz.beginPath(); xWz.arc(0,0,s*.92,0,TAU); xWz.stroke();
    xWz.strokeStyle=z.held?"#D9821C":col;
    xWz.globalAlpha=z.held?.85:1;
    xWz.beginPath(); xWz.arc(0,0,s*.92,-Math.PI/2,-Math.PI/2+TAU*Math.max(prog,.001)); xWz.stroke();
    if(charge>0){
      xWz.globalAlpha=charge*.5;
      xWz.lineWidth=Math.max(1,s*.05);
      xWz.beginPath(); xWz.arc(0,0,s*.66,0,TAU); xWz.stroke();
    }
    xWz.restore();

    /* contact shadow */
    xWz.globalAlpha=.16; xWz.fillStyle="#0F1720";
    xWz.beginPath(); xWz.ellipse(s*.06,-s*.02,s*.66,s*.19,0,0,TAU); xWz.fill();
    xWz.globalAlpha=1;

    xWz.translate(0,bob*0.9+kick*s*.12);

    /* ---- robe ---- */
    const robe=()=>{
      xWz.beginPath();
      xWz.moveTo(-s*.76,-s*.05);
      xWz.quadraticCurveTo(-s*.70,-s*.62,-s*.36,-s*1.00);
      xWz.quadraticCurveTo(0,-s*1.22,s*.36,-s*1.00);
      xWz.quadraticCurveTo(s*.70,-s*.62,s*.76,-s*.05);
      xWz.quadraticCurveTo(0,s*.16,-s*.76,-s*.05);
      xWz.closePath();
    };
    robe(); xWz.fillStyle=col; xWz.fill();
    xWz.save(); robe(); xWz.clip();                    // hard shadow side
    xWz.fillStyle=dim; xWz.fillRect(s*.18,-s*1.4,s*1.2,s*1.7);
    xWz.fillStyle=lit; xWz.fillRect(-s*1.2,-s*1.4,s*.52,s*1.7);
    xWz.fillStyle=deep;                                 // hem band
    xWz.fillRect(-s*.9,-s*.20,s*1.8,s*.40);
    xWz.restore();
    robe(); xWz.lineWidth=lw; xWz.strokeStyle=ink; xWz.stroke();

    /* ---- belt + buckle ---- */
    xWz.fillStyle=deep;
    xWz.beginPath();
    xWz.moveTo(-s*.50,-s*.60); xWz.lineTo(s*.50,-s*.60);
    xWz.lineTo(s*.54,-s*.42); xWz.lineTo(-s*.54,-s*.42); xWz.closePath();
    xWz.fill(); xWz.lineWidth=lw*.7; xWz.strokeStyle=ink; xWz.stroke();
    xWz.fillStyle="#E8B21B";
    xWz.beginPath(); xWz.rect(-s*.11,-s*.585,s*.22,s*.15); xWz.fill();
    xWz.lineWidth=lw*.55; xWz.strokeStyle="#7A5A08"; xWz.stroke();

    /* ---- sleeves ---- */
    for(const sx of [-1,1]){
      xWz.beginPath();
      xWz.ellipse(sx*s*.60,-s*.72,s*.17,s*.24,sx*0.22,0,TAU);
      xWz.fillStyle=sx<0?lit:dim; xWz.fill();
      xWz.lineWidth=lw*.8; xWz.strokeStyle=ink; xWz.stroke();
    }

    /* ---- staff, planted, with a gem that wakes as the cast builds ---- */
    const gl=charge*.85+kick;
    xWz.lineWidth=Math.max(1.6,s*.13);
    xWz.strokeStyle="#8A6440";
    xWz.beginPath(); xWz.moveTo(s*.80,s*.02); xWz.lineTo(s*.66,-s*1.72); xWz.stroke();
    xWz.lineWidth=Math.max(1,s*.05); xWz.strokeStyle="#5E4227";
    xWz.beginPath(); xWz.moveTo(s*.80,s*.02); xWz.lineTo(s*.66,-s*1.72); xWz.stroke();
    if(gl>.04){
      xWz.globalAlpha=gl*.42; xWz.fillStyle=col;
      xWz.beginPath(); xWz.arc(s*.65,-s*1.80,s*(.30+gl*.22),0,TAU); xWz.fill();
      xWz.globalAlpha=1;
    }
    xWz.beginPath(); xWz.arc(s*.65,-s*1.80,s*.155,0,TAU);
    xWz.fillStyle=lit; xWz.fill();
    xWz.lineWidth=lw*.7; xWz.strokeStyle=ink; xWz.stroke();
    xWz.beginPath(); xWz.arc(s*.61,-s*1.845,s*.055,0,TAU);
    xWz.fillStyle="rgba(255,255,255,"+(.55+gl*.45)+")"; xWz.fill();

    /* ---- head ---- */
    xWz.beginPath(); xWz.arc(0,-s*1.36,s*.36,0,TAU);
    xWz.fillStyle="#F3DFC6"; xWz.fill();
    xWz.save(); xWz.beginPath(); xWz.arc(0,-s*1.36,s*.36,0,TAU); xWz.clip();
    xWz.fillStyle="#DCC0A0"; xWz.fillRect(s*.10,-s*1.9,s*.7,s*1.1);
    xWz.restore();
    xWz.lineWidth=lw; xWz.strokeStyle=ink; xWz.stroke();

    /* eyes sit low, which is what makes the forehead read as a big hat brim */
    xWz.fillStyle="#2A2118";
    xWz.beginPath(); xWz.ellipse(-s*.13,-s*1.30,s*.052,s*.068,0,0,TAU); xWz.fill();
    xWz.beginPath(); xWz.ellipse(s*.13,-s*1.30,s*.052,s*.068,0,0,TAU); xWz.fill();

    /* ---- beard ---- */
    xWz.beginPath();
    xWz.moveTo(-s*.30,-s*1.26);
    xWz.quadraticCurveTo(-s*.34,-s*.86,-s*.13,-s*.72);
    xWz.quadraticCurveTo(0,-s*.62,s*.13,-s*.72);
    xWz.quadraticCurveTo(s*.34,-s*.86,s*.30,-s*1.26);
    xWz.quadraticCurveTo(0,-s*1.08,-s*.30,-s*1.26);
    xWz.closePath();
    xWz.fillStyle="#F7F3EC"; xWz.fill();
    xWz.save(); xWz.clip();
    xWz.fillStyle="#DAD3C8"; xWz.fillRect(s*.06,-s*1.4,s*.6,s*.9);
    xWz.restore();
    xWz.lineWidth=lw*.8; xWz.strokeStyle=ink; xWz.stroke();

    /* ---- hat ---- */
    xWz.beginPath();
    xWz.moveTo(-s*.46,-s*1.62);
    xWz.quadraticCurveTo(-s*.30,-s*2.30,s*.16,-s*2.72);
    xWz.quadraticCurveTo(s*.20,-s*2.10,s*.46,-s*1.62);
    xWz.closePath();
    xWz.fillStyle=col; xWz.fill();
    xWz.save(); xWz.clip();
    xWz.fillStyle=dim; xWz.fillRect(s*.06,-s*2.9,s*.9,s*1.5);
    xWz.fillStyle=lit; xWz.fillRect(-s*.9,-s*2.9,s*.30,s*1.5);
    xWz.restore();
    xWz.lineWidth=lw; xWz.strokeStyle=ink; xWz.stroke();

    /* brim */
    xWz.beginPath(); xWz.ellipse(0,-s*1.60,s*.70,s*.17,0,0,TAU);
    xWz.fillStyle=col; xWz.fill();
    xWz.save(); xWz.beginPath(); xWz.ellipse(0,-s*1.60,s*.70,s*.17,0,0,TAU); xWz.clip();
    xWz.fillStyle=dim; xWz.fillRect(s*.06,-s*1.9,s*1,s*.7);
    xWz.restore();
    xWz.lineWidth=lw; xWz.strokeStyle=ink; xWz.stroke();

    /* hat band + a small gold star, the bit that reads as "made" */
    xWz.beginPath();
    xWz.moveTo(-s*.455,-s*1.68);
    xWz.quadraticCurveTo(0,-s*1.60,s*.455,-s*1.68);
    xWz.lineTo(s*.42,-s*1.86);
    xWz.quadraticCurveTo(0,-s*1.78,-s*.42,-s*1.86);
    xWz.closePath();
    xWz.fillStyle="#E8B21B"; xWz.fill();
    xWz.lineWidth=lw*.6; xWz.strokeStyle="#7A5A08"; xWz.stroke();
    star(xWz,s*.06,-s*2.16,s*.15,"#FFE9A8","#7A5A08",lw*.5);

    xWz.restore();
  }
  xWz.globalAlpha=1;
}
function drawBolts(){
  for(const b of bolts){
    xWz.save();
    xWz.globalAlpha=b.spark?Math.max(0,1-b.t*1.5):.95;
    if(!b.spark){
      xWz.globalAlpha=.26; xWz.fillStyle=b.col;
      xWz.beginPath(); xWz.ellipse(b.x,b.y-b.r*2.5,b.r*.72,b.r*2.7,0,0,TAU); xWz.fill();
      xWz.globalAlpha=.95;
    }
    xWz.fillStyle=b.col;
    xWz.beginPath(); xWz.arc(b.x,b.y,b.r,0,TAU); xWz.fill();
    if(!b.spark){
      xWz.fillStyle="rgba(255,255,255,.75)";
      xWz.beginPath(); xWz.arc(b.x-b.r*.28,b.y-b.r*.28,b.r*.34,0,TAU); xWz.fill();
    }
    xWz.restore();
  }
}
function star(x,cx,cy,r,fill,line,lw){
  x.beginPath();
  for(let k=0;k<10;k++){
    const a=-Math.PI/2+k*Math.PI/5, rr=k%2?r*.44:r;
    const px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr;
    k?x.lineTo(px,py):x.moveTo(px,py);
  }
  x.closePath();
  x.fillStyle=fill; x.fill();
  x.lineWidth=lw; x.strokeStyle=line; x.stroke();
}

function wizPortrait(rank,size){
  const c=document.createElement("canvas");
  const d=Math.min(devicePixelRatio||1,2);
  c.width=size*d; c.height=size*d;
  c.style.width=size+"px"; c.style.height=size+"px";
  const x=c.getContext("2d"); x.scale(d,d);
  const col=PAL()[WRANK[rank].tier];
  const lit=shade(col,.26), dim=shade(col,-.24), ink=shade(col,-.62);
  const s=size*0.21, lw=Math.max(1,s*.11);
  x.save(); x.translate(size/2, size*0.80);
  x.lineJoin="round"; x.lineCap="round";
  // robe
  x.beginPath();
  x.moveTo(-s*.76,-s*.05);
  x.quadraticCurveTo(-s*.70,-s*.62,-s*.36,-s*1.00);
  x.quadraticCurveTo(0,-s*1.22,s*.36,-s*1.00);
  x.quadraticCurveTo(s*.70,-s*.62,s*.76,-s*.05);
  x.quadraticCurveTo(0,s*.16,-s*.76,-s*.05);
  x.closePath();
  x.fillStyle=col; x.fill();
  x.save(); x.clip(); x.fillStyle=dim; x.fillRect(s*.18,-s*1.4,s*1.2,s*1.7);
  x.fillStyle=lit; x.fillRect(-s*1.2,-s*1.4,s*.5,s*1.7); x.restore();
  x.lineWidth=lw; x.strokeStyle=ink; x.stroke();
  // face
  x.beginPath(); x.arc(0,-s*1.36,s*.36,0,TAU);
  x.fillStyle="#F3DFC6"; x.fill(); x.lineWidth=lw; x.strokeStyle=ink; x.stroke();
  x.fillStyle="#2A2118";
  x.beginPath(); x.ellipse(-s*.13,-s*1.30,s*.05,s*.065,0,0,TAU); x.fill();
  x.beginPath(); x.ellipse(s*.13,-s*1.30,s*.05,s*.065,0,0,TAU); x.fill();
  // beard
  x.beginPath();
  x.moveTo(-s*.30,-s*1.26);
  x.quadraticCurveTo(-s*.34,-s*.86,0,-s*.66);
  x.quadraticCurveTo(s*.34,-s*.86,s*.30,-s*1.26);
  x.quadraticCurveTo(0,-s*1.08,-s*.30,-s*1.26);
  x.closePath();
  x.fillStyle="#F7F3EC"; x.fill(); x.lineWidth=lw*.8; x.strokeStyle=ink; x.stroke();
  // hat
  x.beginPath();
  x.moveTo(-s*.46,-s*1.62);
  x.quadraticCurveTo(-s*.30,-s*2.30,s*.16,-s*2.72);
  x.quadraticCurveTo(s*.20,-s*2.10,s*.46,-s*1.62);
  x.closePath();
  x.fillStyle=col; x.fill();
  x.save(); x.clip(); x.fillStyle=dim; x.fillRect(s*.06,-s*2.9,s*.9,s*1.5); x.restore();
  x.lineWidth=lw; x.strokeStyle=ink; x.stroke();
  x.beginPath(); x.ellipse(0,-s*1.60,s*.70,s*.17,0,0,TAU);
  x.fillStyle=col; x.fill(); x.lineWidth=lw; x.strokeStyle=ink; x.stroke();
  x.beginPath();
  x.moveTo(-s*.455,-s*1.68); x.quadraticCurveTo(0,-s*1.60,s*.455,-s*1.68);
  x.lineTo(s*.42,-s*1.86); x.quadraticCurveTo(0,-s*1.78,-s*.42,-s*1.86);
  x.closePath();
  x.fillStyle="#E8B21B"; x.fill(); x.lineWidth=lw*.6; x.strokeStyle="#7A5A08"; x.stroke();
  x.restore();
  return c;
}

/* ---- the black hole ----------------------------------------------------
   The idle hitter used to be invisible: a timer that struck the smallest
   balls wherever they happened to be. Now it is a thing in the dish that you
   can watch. It wanders, drags what is near it inward, and eats whatever ends
   up inside. Buying the first level of Speed is what brings it into being. */
const BH={x:0,y:0,vx:0,vy:0,ph:0,eatT:0,init:false,fed:0,bornT:0};
function bhOn(){ return val("pulse")>0; }
// tier indices run big-to-small, so LAST is the lime rung it starts on and
// every Size level lets it reach one rung further up the ladder
function bhTier(){ return Math.max(0, LAST - val("size")); }
function bhR(){ return tierRadius(bhTier(), WRANK[0])*0.92; }
function bhPull(){ return val("pull")*S; }
/* everything you built collapsed to a point; that point is Chompy now */
function bhBirth(x,y){
  // if you had not bought one yet, this is how you get it
  if(val("pulse")<=0) G.up.pulse=1;
  BH.x=x; BH.y=y; BH.init=true; BH.bornT=el; BH.fed=1.4;
  const P=pet();
  rings.push({x,y,r:3*S,R:bhR()*8,t:0,life:.72,col:P.arc,w:3});
  rings.push({x,y,r:2*S,R:bhR()*4,t:0,life:.42,col:"#fff",w:2});
  for(let i=0;i<16;i++){
    const a=rnd(0,TAU), sp=rnd(90,340)*S;
    goo(x,y,rnd(2,5)*S,P.arc,rnd(.3,.6),Math.cos(a)*sp,Math.sin(a)*sp);
  }
  noiseHit(.5,{vol:.17,cut:680,to:3.6,wet:.34});
  pop(90,{vol:.13,wet:.42});
  thud(58,{vol:.22,len:.42});
  haptic([18,30,18]);
  save();
}
function bhStep(dt){
  if(!bhOn()) return;
  const r=bhR();
  if(!BH.init){
    BH.x=W*.5; BH.y=(AR.y0+AR.y1)*.5;
    const a=rnd(0,TAU); BH.vx=Math.cos(a); BH.vy=Math.sin(a);
    BH.init=true;
  }
  BH.ph=(BH.ph+dt)%3600;
  // it travels like a ball: constant speed, reflecting off the dish
  const spd=(70+val("pulse")*14)*S;
  BH.x+=BH.vx*spd*dt; BH.y+=BH.vy*spd*dt;
  if(BH.x<r){ BH.x=r; BH.vx=Math.abs(BH.vx); }
  if(BH.x>W-r){ BH.x=W-r; BH.vx=-Math.abs(BH.vx); }
  if(BH.y<AR.y0+r){ BH.y=AR.y0+r; BH.vy=Math.abs(BH.vy); }
  if(BH.y>AR.y1-r){ BH.y=AR.y1-r; BH.vy=-Math.abs(BH.vy); }
  const shim={x:BH.x,y:BH.y,r,vx:BH.vx,vy:BH.vy,wob:0};
  bounceChrome(shim);
  BH.x=shim.x; BH.y=shim.y;
  const m=Math.hypot(shim.vx,shim.vy)||1;
  BH.vx=shim.vx/m; BH.vy=shim.vy/m;
  BH.fed*=Math.pow(.06,dt);
  const R=bhPull();
  for(const b of balls){
    const dx=BH.x-b.x, dy=BH.y-b.y, d=Math.hypot(dx,dy);
    if(d<R&&d>1){ const f=(1-d/R)*170*dt*S; b.vx+=dx/d*f; b.vy+=dy/d*f; }
  }
  // one at a time, and only what it is big enough for
  BH.eatT-=dt;
  if(BH.eatT<=0){
    const maxT=bhTier(); let best=null, bd=1e9;
    for(const b of balls){
      if(b.tier<maxT||b.gone) continue;          // smaller index = bigger ball
      // its mouth is wider than its body, or a lime-sized hole would need a
      // ball centred inside 9px and would never actually catch anything
      const d=Math.hypot(b.x-BH.x,b.y-BH.y);
      if(d<r*1.9+b.r && d<bd){ bd=d; best=b; }
    }
    if(best){
      BH.eatT=1/Math.max(.6,val("pulse"));
      BH.fed=1.4;
      fuses.push({b:best,t:0,d:best.maxHp*4});   // swallowed whole
    }
  }
}
function drawBH(x){
  if(!bhOn()||!BH.init) return;
  // a newborn hole opens out of nothing over 600ms instead of blinking on
  const born=BH.bornT?clamp((el-BH.bornT)/0.6,0,1):1;
  if(born>=1&&BH.bornT) BH.bornT=0;
  const grow=born<1?easeOut(born):1;
  const r=bhR()*grow, R=bhPull()*born, k=1+BH.fed*.16;
  x.save();
  // its reach, stated faintly — everything inside is fair game
  // inside a rainbow window he runs the same colours the ball did
  const P=pet(), rb=luckOn(), i0=rbBand(0);
  const ARC=rb?RBOW[i0]:P.arc, GLOW=rb?RBOW_RGB[i0]:P.glow;
  x.globalAlpha=.14; x.strokeStyle=ARC; x.lineWidth=1.4;
  const dashLen=12*S;                       // 5 + 7, one full pattern
  x.setLineDash([5*S,7*S]); x.lineDashOffset=-((BH.ph*14*S)%dashLen);
  x.beginPath(); x.arc(BH.x,BH.y,R,0,TAU); x.stroke();
  x.setLineDash([]); x.globalAlpha=1;
  // a soft shadow under him, so he does not vanish into a busy dish
  x.globalAlpha=.20; x.fillStyle="#0B1020";
  x.beginPath(); x.arc(BH.x,BH.y,r*2.5*k,0,TAU); x.fill();
  x.globalAlpha=1;
  const glow=Math.max(r*3.1*k,17*S);
  const g=x.createRadialGradient(BH.x,BH.y,r*.6,BH.x,BH.y,glow);
  g.addColorStop(0,"rgba("+GLOW+",.44)");
  g.addColorStop(.45,"rgba("+(rb?RBOW_RGB[rbBand(2)]:P.glow)+",.20)");
  g.addColorStop(1,"rgba("+GLOW+",0)");
  x.fillStyle=g;
  x.beginPath(); x.arc(BH.x,BH.y,glow,0,TAU); x.fill();
  // accretion: two arcs, opposite sides, spinning
  x.strokeStyle=ARC; x.globalAlpha=.9; x.lineWidth=Math.max(1.1,r*.22);
  x.lineCap="round";
  const a=(BH.ph*3.1)%TAU;
  const ar=Math.max(r*1.42*k,6*S);
  x.beginPath(); x.arc(BH.x,BH.y,ar,a,a+2.2); x.stroke();
  if(rb) x.strokeStyle=RBOW[rbBand(3)];
  x.beginPath(); x.arc(BH.x,BH.y,ar,a+Math.PI,a+Math.PI+1.4); x.stroke();
  // and the hole
  x.globalAlpha=1; x.fillStyle=P.core;
  x.beginPath(); x.arc(BH.x,BH.y,r*k,0,TAU); x.fill();
  x.restore();
}

let camBusy=0;
function goRoom(to){
  if(room===to) return;
  room=to; camBusy=1; obsChanged();
  app.classList.toggle("wizRoom",to==="wiz");
  setTimeout(()=>{ camBusy=0;
