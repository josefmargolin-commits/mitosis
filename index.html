    x,y,vx,vy,r:tierRadius(tier,cls),
    mass:mass===undefined?cls.mass:mass,
    hp:maxHp,maxHp,mate:null,fuseT:0,born:el,rot:rnd(0,TAU),
    wob:.019,wp:rnd(0,TAU),ws:rnd(.5,.9),sq:0,sqA:0,hit:0,pulse:rnd(0,TAU),lastHit:0};
}
function dropKind(){
  const r=Math.random();
  if(r<val("purity")) return "golden";
  if(r<val("purity")+0.06) return "unstable";
  return "plain";
}
function bumpCombo(){
  combo++; comboT=1.05+val("reson")*0.02;
  if(combo>G.stat.bestCombo) G.stat.bestCombo=combo;
  objProg("combo",0,combo);
  const c=document.getElementById("combo");
  c.textContent="×"+comboMul().toFixed(2);
  c.classList.remove("on"); void c.offsetWidth; c.classList.add("on");
}
function earn(base,x,y,col){
  const v=base*yieldMul()*comboMul();
  G.bio+=v; G.earned+=v; G.totalEarned+=v;
  objProg("earn",v);
  if(v>=0.5) pops.push({x,y,t:0,life:.72,txt:"+"+fmt(v),col:col||"#EAF1FA",vy:-44});
}
function goo(x,y,r,c,life,vx,vy){ parts.push({x,y,vx,vy,r,col:c,t:0,life,goo:true,drag:.9}); }
function spark(x,y,c){
  const a=rnd(0,TAU),s=rnd(80,400)*S;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rnd(1.1,3)*S,col:c,t:0,life:rnd(.28,.55),goo:false,drag:.86});
}
function remove(b){ const i=balls.indexOf(b); if(i>=0) balls.splice(i,1); b.gone=true; unmate(b); }
function unmate(b){ if(b.mate){ b.mate.mate=null; b.mate.fuseT=0; b.mate=null; } b.fuseT=0; }
function nearest(x,y,rad,skip){
  let best=null,bd=rad;
  for(const o of balls){
    if(o===skip||o.gone) continue;
    const d=Math.hypot(o.x-x,o.y-y);
    if(d<bd){ bd=d; best=o; }
  }
  return best;
}

/* ---- fusion: 2048, played upward ------------------------------------ */
function canFuse(a,b){
  return a.tier===b.tier && a.tier>0 && !a.gone && !b.gone
      && a.kind!=="unstable" && b.kind!=="unstable"
      && el-a.born>0.25 && el-b.born>0.25;
}
function fuse(a,b){
  const nt=a.tier-1;
  const cls=a.cls.i>=b.cls.i?a.cls:b.cls;
  const x=(a.x+b.x)/2, y=(a.y+b.y)/2;
  const col=PAL()[nt];
  remove(a); remove(b);
  const n=makeBall(nt,x,y,(a.vx+b.vx)*.5,(a.vy+b.vy)*.5,cls,
    a.mass+b.mass, (a.kind==="golden"||b.kind==="golden")?"golden":"plain");
  n.wob=.20; n.sq=.26; n.sqA=Math.atan2(b.y-a.y,b.x-a.x)+Math.PI/2; n.born=el-0.2; n.skinFade=el;
  balls.push(n);

  G.stat.merges++; objProg("merge",1);
  for(let i=0;i<10;i++){
    const ang=rnd(0,TAU),s=rnd(30,150)*S;
    goo(x,y,rnd(2,5)*S,col,rnd(.2,.4),Math.cos(ang)*s,Math.sin(ang)*s);
  }
  for(let i=0;i<8;i++) spark(x,y,"#fff");
  rings.push({x,y,r:n.r*1.5,R:n.r*.6,t:0,life:.34,col:"#fff",w:2.6});
  rings.push({x,y,r:n.r*.5,R:n.r*1.9,t:0,life:.42,col,w:2});
  pops.push({x,y:y-n.r*.7,t:0,life:.7,txt:"◉"+fmt(n.mass),col,vy:-40});
  shake=Math.max(shake,2.2+(DROPT-nt)*1.6);
  flash=Math.max(flash,.10+(DROPT-nt)*.06);
  if(nt<=1) freeze=Math.max(freeze,.045);
  // pitch climbs as the ladder does
  const fp=panAt(x);
  chime(NOTE[nt]*3,{pan:fp,vol:.20,len:.55+(DROPT-nt)*.28});
  chime(NOTE[nt]*4.5,{pan:fp,vol:.09,len:.45,delay:.045});
  noiseHit(.14,{pan:fp,vol:.07,cut:1400,q:4,wet:.2});
  if(nt<=DROPT-1) thud(72,{pan:fp,vol:.22,len:.26});
  haptic(nt<=1?26:14);
}

/* ---- damage & division ---------------------------------------------- */
function strike(b,dmg,src,forced){
  if(!b||b.gone) return;
  if(!forced && el-b.lastHit<0.07) return;
  b.lastHit=el;
  b.sqA=src?Math.atan2(b.y-src.y,b.x-src.x):rnd(0,TAU);
  b.sq=.30; b.wob=.16; b.hit=1;

  if(b.kind==="unstable"){ detonate(b,0); return; }
  if(Math.random()<val("rupture")){ burstWhole(b); return; }

  b.hp-=(dmg===undefined?val("force"):dmg);
  if(b.hp>0){
    // a glancing hit: the membrane snaps back but the ball holds
    shake=Math.max(shake,1.5);
    rings.push({x:b.x,y:b.y,r:b.r*.72,R:b.r*1.22,t:0,life:.24,col:b.col||PAL()[b.tier],w:2});
    for(let i=0;i<4;i++) spark(b.x,b.y,PAL()[b.tier]);
    const hp2=panAt(b.x);
    pop(NOTE[b.tier]*2.6*semi(noteStep()),{pan:hp2,vol:.07,wet:.05});
    noiseHit(.05,{pan:hp2,vol:.05,cut:3200,type:"highpass",to:.5,wet:.03});
    haptic(7);
    return;
  }
  divide(b);
}

function divide(b){
  remove(b);
  const col=PAL()[b.tier];
  const base=NOTE[b.tier];
  G.stat.splits++; objProg("split",1);

  if(b.tier>=LAST){ finish(b,col); return; }

  const hard=val("cap")+22;
  const ct=b.tier+1, cr=tierRadius(ct,b.cls);
  const ax=rnd(0,TAU), kick=52+b.r*2.0;
  const kids=[];
  for(let i=0;i<2;i++){
    if(balls.length>=hard) break;
    const a=ax+i*Math.PI+rnd(-.14,.14), off=(b.r-cr)*.55;
    const nb=makeBall(ct,b.x+Math.cos(a)*off,b.y+Math.sin(a)*off,
      b.vx*.55+Math.cos(a)*kick, b.vy*.55+Math.sin(a)*kick,
      b.cls, b.mass/2, b.kind==="golden"?"golden":"plain");
    nb.wob=.24; nb.sq=.20; nb.sqA=a; nb.lastHit=el;
    balls.push(nb); kids.push(nb);
  }

  for(let i=0;i<7+b.tier*2;i++){
    const a=ax+Math.PI/2+(Math.random()<.5?0:Math.PI)+rnd(-.5,.5), s=rnd(45,230)*S;
    goo(b.x,b.y,rnd(2,5.2)*S,col,rnd(.22,.42),Math.cos(a)*s,Math.sin(a)*s);
  }
  for(let i=0;i<5;i++) spark(b.x,b.y,col);
  rings.push({x:b.x,y:b.y,r:b.r*.4,R:b.r*2.1,t:0,life:.32,col,w:2.3});

  shake=Math.max(shake,1.8+(LAST-b.tier)*1.3);
  flash=Math.max(flash,.12+(LAST-b.tier)*.04);
  if(b.tier===0) freeze=Math.max(freeze,.03);
  bumpCombo();
  earn(b.mass*0.06*(b.kind==="golden"?25:1),b.x,b.y,col);

  const sp=panAt(b.x);
  pop(base*2*semi(noteStep()),{pan:sp,vol:.2});
  noiseHit(.09,{pan:sp,vol:.06,cut:2400,q:3});
  if(b.tier<=1) thud(58,{pan:sp,vol:.16,len:.18});
  haptic(b.tier===0?16:10);

  const casc=val("cascade");
  for(const k of kids){
    if(Math.random()<casc) fuses.push({b:k,t:.05+Math.random()*.04,d:999});
    else if(Math.random()<val("chain")+(timers.chain>0?1:0)){
      const n=nearest(k.x,k.y,b.r*3.4,k);
      if(n) fuses.push({b:n,t:.06+Math.random()*.06,d:999});
    }
  }
}

/* the smallest size does not divide — it goes, and pays out */
function finish(b,col){
  G.stat.pops++; objProg("pop",1);
  if(b.kind==="golden"){ G.stat.gold++; objProg("gold",1); }
  for(let i=0;i<11;i++){
    const a=rnd(0,TAU),s=rnd(35,180)*S;
    goo(b.x,b.y,rnd(2.4,6)*S,col,rnd(.26,.48),Math.cos(a)*s,Math.sin(a)*s);
  }
  for(let i=0;i<9;i++) spark(b.x,b.y,col);
  rings.push({x:b.x,y:b.y,r:b.r*.5,R:b.r*3,t:0,life:.4,col,w:2});
  shake=Math.max(shake,2.8);
  bumpCombo();
  earn(b.mass*(b.kind==="golden"?25:1),b.x,b.y,col);
  const fp2=panAt(b.x);
  pop(NOTE[LAST]*2.4*semi(noteStep()),{pan:fp2,vol:.22,wet:.2});
  noiseHit(.07,{pan:fp2,vol:.05,cut:6000,type:"highpass",to:.6,wet:.12});
  haptic(10);
}

/* rupture: take the whole lineage in one hit */
function burstWhole(b){
  remove(b);
  const col=PAL()[b.tier];
  const n=Math.pow(2,LAST-b.tier);
  G.stat.pops+=n; objProg("pop",n);
  if(b.kind==="golden"){ G.stat.gold++; objProg("gold",1); }
  for(let i=0;i<20;i++){
    const a=rnd(0,TAU),s=rnd(50,320)*S;
    goo(b.x,b.y,rnd(2,6.5)*S,col,rnd(.3,.55),Math.cos(a)*s,Math.sin(a)*s);
  }
  for(let i=0;i<16;i++) spark(b.x,b.y,Math.random()<.4?"#fff":col);
  rings.push({x:b.x,y:b.y,r:b.r*.3,R:b.r*4,t:0,life:.5,col:"#fff",w:3});
  shake=Math.max(shake,7); flash=Math.max(flash,.32); freeze=Math.max(freeze,.045);
  bumpCombo();
  earn(b.mass*(b.kind==="golden"?25:1),b.x,b.y,"#FFFFFF");
  pops.push({x:b.x,y:b.y-24,t:0,life:.8,txt:"RUPTURE",col:"#fff",vy:-30});
  const rp=panAt(b.x);
  chime(NOTE[b.tier]*4,{pan:rp,vol:.17,len:.7});
  pop(NOTE[b.tier]*3*semi(noteStep()),{pan:rp,vol:.2,wet:.28});
  noiseHit(.3,{pan:rp,vol:.12,cut:5200,to:.08,wet:.3});
  thud(80,{pan:rp,vol:.24,len:.3});
  haptic(24);
}

function detonate(b,depth){
  remove(b);
  G.stat.bursts++; objProg("burst",1);
  const HOT="#FFE9A8", R=b.r*4.3;
  rings.push({x:b.x,y:b.y,r:b.r*.4,R:R*1.1,t:0,life:.48,col:HOT,w:4});
  rings.push({x:b.x,y:b.y,r:b.r*.2,R:R*.6,t:0,life:.26,col:"#fff",w:2});
  for(let i=0;i<24;i++){
    const a=rnd(0,TAU),s=rnd(110,520)*S;
    goo(b.x,b.y,rnd(2,6.8)*S,HOT,rnd(.3,.55),Math.cos(a)*s,Math.sin(a)*s);
  }
  for(let i=0;i<20;i++) spark(b.x,b.y,Math.random()<.4?"#fff":HOT);
  shake=Math.max(shake,11); flash=Math.max(flash,.48); freeze=Math.max(freeze,.06);
  bumpCombo(); earn(b.mass*0.5,b.x,b.y,HOT); haptic(28);
  const dp=panAt(b.x);
  thud(96,{pan:dp,vol:.34,len:.4});
  noiseHit(.42,{pan:dp,vol:.22,cut:1100,q:.8,to:.06,wet:.34});
  noiseHit(.1,{pan:dp,vol:.1,cut:7000,type:"highpass",to:.5,wet:.2});

  const caught=[];
  for(const o of balls){
    const dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy);
    if(d<R+o.r){
      const f=1-clamp(d/(R+o.r),0,1);
      o.vx+=(dx/(d||1))*360*S*f; o.vy+=(dy/(d||1))*360*S*f;
      o.wob=Math.max(o.wob,.22);
      caught.push({o,d});
    }
  }
  if(depth<5){
    caught.sort((p,q)=>p.d-q.d);
    for(const c of caught) fuses.push({b:c.o,t:.03+c.d/(R*7),d:999,depth:depth+1});
  }
}

/* ---------------------------------------------------------------- input */
function hitAt(px,py){
  let f=null,bd=Infinity;
  for(const b of balls){
    if(b.gone) continue;
    const d=Math.hypot(b.x-px,b.y-py);
    const grace=b.r+(b.r<26*S?15:5);
    if(d<grace&&d<bd){ bd=d; f=b; }
  }
  return f;
}
function touchAt(px,py){
  Sn.budget=18;
  const b=hitAt(px,py);
  if(b){ G.stat.taps++; strike(b,undefined,{x:px,y:py}); }
  else rings.push({x:px,y:py,r:2,R:30*S,t:0,life:.28,col:trailCol(),w:1.4});
}
function sweep(x0,y0,x1,y1){
  const rad=val("reach")*S+4;
  for(const b of balls){
    if(b.gone||el-b.lastHit<0.09) continue;
    if(segDist(x0,y0,x1,y1,b.x,b.y)<rad+b.r*.85) strike(b,undefined,{x:x0,y:y0});
  }
}
function segDist(x0,y0,x1,y1,px,py){
  const dx=x1-x0,dy=y1-y0,L=dx*dx+dy*dy;
  let t=L?((px-x0)*dx+(py-y0)*dy)/L:0; t=clamp(t,0,1);
  return Math.hypot(px-(x0+dx*t),py-(y0+dy*t));
}
function trailCol(){ return (TRAILS.find(t=>t.id===G.trail)||TRAILS[0]).c; }
function localPt(e){ const r=roomArena.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }

roomArena.addEventListener("pointerdown",e=>{
  if(zoomPhase||room!=="arena") return;
  if(e.target.closest("button,input,#dock,#sheet,#scrim,.rail,.cur")) return;
  e.preventDefault(); actx();
  const p=localPt(e);
  ptrDown=true; ptrId=e.pointerId; ptrX=p.x; ptrY=p.y;
  trail.push({x:p.x,y:p.y,t:0});
  touchAt(p.x,p.y);
  try{ roomArena.setPointerCapture(e.pointerId); }catch(err){}
},{passive:false});
roomArena.addEventListener("pointermove",e=>{
  if(!ptrDown||e.pointerId!==ptrId) return;
  e.preventDefault();
  const p=localPt(e);
  if(Math.hypot(p.x-ptrX,p.y-ptrY)>2){
    sweep(ptrX,ptrY,p.x,p.y);
    trail.push({x:p.x,y:p.y,t:0});
    ptrX=p.x; ptrY=p.y;
  }
},{passive:false});
const endPtr=e=>{ if(e.pointerId===ptrId){ ptrDown=false; ptrId=null; } };
roomArena.addEventListener("pointerup",endPtr);
roomArena.addEventListener("pointercancel",endPtr);

/* ---------------------------------------------------------------- powers */
function pwState(p){ return G.pw[p.id]||(G.pw[p.id]={owned:p.cost===0,cd:0}); }
function firePower(p){
  const s=pwState(p);
  if(!s.owned){
    if(G.spore>=p.cost){ G.spore-=p.cost; s.owned=true; toast(p.nm+" unlocked"); save(); }
    else toast("Needs "+p.cost+" spores");
    return;
  }
  if(s.cd>0){ toast(p.nm+" recharging — "+Math.ceil(s.cd)+"s"); return; }
  s.cd=p.cd; Sn.budget=40;
  if(p.id==="scatter"){
    balls.slice().forEach((b,i)=>fuses.push({b,t:i*0.012,d:999}));
    banner("SCATTER"); shake=Math.max(shake,9);
  }
  if(p.id==="crush"){
    balls.slice().sort((a,b)=>a.tier-b.tier).slice(0,4)
      .forEach((b,i)=>setTimeout(()=>{ if(!b.gone) burstWhole(b); },i*90));
    banner("CRUSH");
  }
  if(p.id==="chain"){ timers.chain=p.dur; banner("CHAIN"); }
  if(p.id==="storm"){ timers.storm=p.dur; timers.stormT=0; banner("STORM"); }
  chime(392,{vol:.16,len:.9,wet:.5});
  chime(588,{vol:.1,len:.8,delay:.06,wet:.5});
  noiseHit(.34,{vol:.1,cut:4200,to:.1,wet:.35});
  thud(70,{vol:.2,len:.3});
  haptic(30);
}
function fireBoost(bo){
  const s=G.boost[bo.id]||(G.boost[bo.id]={cd:0});
  G.boost[bo.id]=s;
  if(s.cd>0){ toast(bo.nm+" recharging — "+Math.ceil(s.cd)+"s"); return; }
  s.cd=bo.cd;
  if(bo.id==="rain"){
    let n=0;
    for(let i=0;i<SLOTS;i++) if(wiz(i)&&n<14){ WZ[i].t=0; WZ[i].held=false; n++; }
    for(let i=0;i<SLOTS;i++) if(wiz(i)) setTimeout(()=>{ if(wiz(i)) WZ[i].t=0; },300+i*90);
    banner("HOPPER DUMP");
  }else{
    let best=-1;
    for(let i=0;i<SLOTS;i++) if(wiz(i)&&(best<0||wiz(i).rank>wiz(best).rank)) best=i;
    if(best>=0){
      const cls=WRANK[wiz(best).rank], t=cls.tier, rr=tierRadius(t,cls);
      balls.push(makeBall(t, clamp(castX(best),rr+2,W-rr-2), AR.y0+rr, rnd(-20,20)*S, 230*S, cls, undefined, "golden"));
      banner("GOLDEN BALL");
    } else toast("No wizards to draw from");
  }
  chime(523,{vol:.15,len:.6,wet:.44}); pop(660,{vol:.14,wet:.3});
  haptic(18);
}

/* ---------------------------------------------------------------- objectives */
function rollObjectives(){
  const tier=Math.min(4,Math.floor(G.objDone/6));
  G.obj=OBJPOOL.slice().sort(()=>Math.random()-.5).slice(0,3)
    .map(o=>({k:o.k,goal:o.goals[tier],prog:0,sp:o.sp+tier,done:false}));
}
function objProg(k,amt,abs){
  if(!G.obj) return;
  for(const o of G.obj){
    if(o.k!==k||o.done) continue;
    o.prog=abs!==undefined?Math.max(o.prog,abs):o.prog+amt;
    if(o.prog>=o.goal){ o.prog=o.goal; o.done=true; alertOrb("obj",true); toast("Objective complete"); }
  }
}
function objLabel(o){ return (OBJPOOL.find(p=>p.k===o.k)||OBJPOOL[0]).t(o.goal); }

/* ---------------------------------------------------------------- prestige */
function canPrestige(){ return G.strain<SCALES.length-1 && G.earned>=nextScaleCost(); }
/* The ascent, in two beats.
   1. COLLAPSE — every ball in the dish is drawn into one, which swells as it
      swallows them. The metaball layer does the melting for free.
   2. PULL BACK — that one ball shrinks to ordinary size while the sky
      crossfades, and a few of its new neighbours fade in around it. What you
      spent the whole scale building is now a single object in a bigger room. */
let core=null;
function doPrestige(){
  if(!canPrestige()||zoomPhase) return;
  zoomPhase=1; zoomT=0;
  ptrDown=false; ptrId=null;
  fuses.length=0; cele.length=0;
  const cx=W/2, cy=(AR.y0+AR.y1)/2;
  // the biggest ball on the table becomes the seed everything else falls into
  let seed=balls[0];
  for(const b of balls) if(!seed||b.r>seed.r) seed=b;
  if(!seed){ seed=makeBall(DROPT,cx,cy,0,0,bestBall(),undefined,"plain"); balls.push(seed); }
  seed.x=cx; seed.y=cy; seed.vx=seed.vy=0; seed.mate=null; seed.maxHp=1; seed.hp=1;
  core=seed; core.area=core.r*core.r;
  for(const b of balls){ b.mate=null; b.fuseT=0; }
  banner("COLLAPSE");
  thud(58,{vol:.26,len:.5});
  noiseHit(1.1,{vol:.10,cut:900,to:.25,wet:.45});
  haptic([18,30,18]);
}
function stepZoom(dt){
  zoomT+=dt;
  const cx=W/2, cy=(AR.y0+AR.y1)/2;

  if(zoomPhase===1){
    if(core){ core.x=cx; core.y=cy; core.vx=core.vy=0; core.mate=null; }
    // pull everything in, and eat what arrives
    for(let i=balls.length-1;i>=0;i--){
      const b=balls[i];
      if(b===core) continue;
      b.mate=null; b.fuseT=0;
      const dx=cx-b.x, dy=cy-b.y, d=Math.hypot(dx,dy)||1;
      const pull=(680+zoomT*1500)*dt;
      b.vx+=dx/d*pull; b.vy+=dy/d*pull;
      b.vx*=Math.pow(.25,dt); b.vy*=Math.pow(.25,dt);
      b.x+=b.vx*dt; b.y+=b.vy*dt;
      b.wob=Math.max(b.wob,.10);
      if(d<core.r*.62){
        core.area+=b.r*b.r;
        core.r=Math.sqrt(core.area);
        core.wob=Math.max(core.wob,.16); core.sq=.16; core.sqA=Math.atan2(dy,dx);
        balls.splice(i,1); b.gone=true;
        for(let k=0;k<5;k++) goo(b.x,b.y,rnd(2,5)*S,PAL()[b.tier],rnd(.2,.4),rnd(-90,90)*S,rnd(-90,90)*S);
        pop(NOTE[b.tier]*2,{pan:panAt(b.x),vol:.11,wet:.22});
        shake=Math.max(shake,2.2);
      }
    }
    zoomFade=clamp((zoomT-0.35)/0.9,0,1)*0.35;
    if(balls.length<=1&&zoomT>0.55||zoomT>2.6){
      zoomPhase=2; zoomT=0;
      coreFrom=core?core.r:80*S;
      fromScale=curScale();
      applyAscent();
      coreTo=0;
    }
    return;
  }

  // pull back
  const k=clamp(zoomT/1.35,0,1), e=easeOut(k);
  if(core){
    core.x=cx; core.y=cy; core.vx=core.vy=0;
    core.r=coreFrom+(coreTo-coreFrom)*e;
  }
  blendBg(fromScale,curScale(),clamp(k*1.5,0,1));
  zoomFade=(1-k)*0.35;
  if(k>=1){
    zoomPhase=0; zoomFade=0;
    if(core) remove(core);
    core=null;
    drawBg();
    for(let i=0;i<SLOTS;i++) if(wiz(i)) WZ[i].t=Math.min(WZ[i].t,.25+i*.14);
  }
}
let coreFrom=0, coreTo=0, fromScale=null;

/* the state reset happens the instant the collapse finishes, so the pull-back
   is already showing the new scale */
function applyAscent(){
  G.strain++; G.stat.strains++;
  G.bio=0; G.earned=0;
  const up={}; for(const k of UPK) up[k]=0;
  up.yield=1; up.cap=1;
  G.up=up;
  parts.length=0; fuses.length=0; rings.length=0; pops.length=0;
  G.wiz=Array(SLOTS).fill(null); G.wlvl=[0,0,0,0,0,0]; G.summons=0;
  G.wiz[5]={id:++G.wizSeq, rank:0};
  WZ=[]; syncWZ(); wizSel=-1;
  combo=0;
  G.spore+=3+G.strain*2;
  const sc=SCALES[G.strain];
  FORM=sc.form;
  banner(sc.n.toUpperCase());
  setTimeout(()=>toast("One ball is now "+sc.ball+" · yield ×"+fmt(sc.mult)),1100);
  thud(42,{vol:.34,len:1.2});
  for(let i=0;i<4;i++) chime(261*semi(LADDER[i]),{vol:.13,len:1.9,delay:i*.11,wet:.66});
  save(); buildTabs();
}
/* ================================================================ wizards
   The board lives in its own room above the arena. Its DOM cells handle
   selection and dragging; one canvas over the top draws the figures, their
   charge rings and the bolts they fire down toward the dish below.        */
let WSW=1, WSH=1;              // wizard stage size
let CELLS=[];                  // cached cell rects, stage-relative
let WZ=[];                     // runtime per-slot: timer, cast anim, bob
let bolts=[];                  // spells falling out of the room
let BRICK={a:"#EFE6D8",b:"#E3D7C4",m:"#C9B99F",t:"#F7F1E7"};
let wizSel=-1, wizDrag=-1, dragX=0, dragY=0, dragOver=-1;
let room="arena";

const wiz=i=>G.wiz&&G.wiz[i];
const wrank=i=>WRANK[wiz(i).rank];
const rlvl=r=>(G.wlvl&&G.wlvl[r])|0;
const rDelay=r=>WRANK[r].delay*Math.pow(0.94,rlvl(r));
const rUpCost=r=>Math.ceil(WRANK[r].upBase*Math.pow(1.19,rlvl(r)));
const rCapped=r=>rDelay(r)<=WRANK[r].delay*0.301;
const wDelay=i=>rDelay(wiz(i).rank);
const wUpCost=i=>rUpCost(wiz(i).rank);
const summonCost=()=>Math.ceil(120*Math.pow(1.42,G.summons|0));
const castX=i=>((i%WCOLS)+0.5)/WCOLS*W;
const wizCount=()=>G.wiz.reduce((n,w)=>n+(w?1:0),0);

function throughput(){
  let t=0;
  for(let i=0;i<SLOTS;i++) if(wiz(i)) t+=wrank(i).mass/wDelay(i);
  return t*yieldMul();
}
function anyMerge(){
  const seen={};
  for(let i=0;i<SLOTS;i++){
    const w=wiz(i); if(!w||w.rank>=TOPRANK) continue;
    if(seen[w.rank]) return true;
    seen[w.rank]=1;
  }
  return false;
}
function syncWZ(){
  if(!G.wiz) G.wiz=Array(SLOTS).fill(null);
  while(WZ.length<SLOTS) WZ.push({t:0,cast:0,held:false,bob:Math.random()*6.28});
  for(let i=0;i<SLOTS;i++){
    if(!WZ[i].ph) WZ[i].ph=Math.random();
    if(wiz(i)&&WZ[i].t<=0&&WZ[i].cast<=0) WZ[i].t=wDelay(i)*(0.1+WZ[i].ph*0.85);
  }
}
function buildWizGrid(){
  wgridEl.innerHTML="";
  for(let i=0;i<SLOTS;i++){
    const c=document.createElement("button");
    c.className="wcell"; c.dataset.i=i;
    c.innerHTML='<span class="plus">+</span><span class="pips"></span><span class="lv"></span>';
    wgridEl.appendChild(c);
  }
  layoutWizards();
}
function layoutWizards(){
  if(!wgridEl||!wgridEl.children.length||camBusy>0) return;
  const root=document.documentElement;
  // square cells: whichever of width or height is tighter decides the size
  const sr=document.getElementById("wizStage").getBoundingClientRect();
  const cell=Math.max(40,Math.floor(Math.min((sr.width-20-15)/4,(sr.height-14-15)/4)));
  root.style.setProperty("--cellH",cell+"px");
  // the canvas backing store must track the stage, or everything it draws is
  // scaled by the mismatch and drifts further the lower down the board it is
  const nw=Math.max(1,Math.round(sr.width)), nh=Math.max(1,Math.round(sr.height));
  if(nw!==WSW||nh!==WSH){
    WSW=nw; WSH=nh;
    cWz.width=Math.round(WSW*DPR); cWz.height=Math.round(WSH*DPR);
    xWz.setTransform(DPR,0,0,DPR,0,0);
  }
  const g=wgridEl.getBoundingClientRect();
  const st=document.getElementById("wizStage").getBoundingClientRect();
  const ox=g.left-st.left, oy=g.top-st.top;
  CELLS=[];
  for(let i=0;i<SLOTS;i++){
    const el=wgridEl.children[i]; if(!el) continue;
    const r=el.getBoundingClientRect();
    CELLS.push({x:r.left-g.left+ox, y:r.top-g.top+oy, w:r.width, h:r.height,
                cx:r.left-g.left+ox+r.width/2, cy:r.top-g.top+oy+r.height/2});
  }
}
function syncWizGrid(){
  if(!wgridEl.children.length) return;
  if(wizDrag>=0){ paintDragHint(wizDrag); return; }
  const hasRoom=wizCount()<SLOTS, can=G.bio>=summonCost();
  for(let i=0;i<SLOTS;i++){
    const el=wgridEl.children[i]; if(!el) continue;
    const w=wiz(i);
    el.classList.toggle("filled",!!w);
    el.classList.toggle("held",!!(w&&WZ[i]&&WZ[i].held));
    el.classList.toggle("sel",wizSel===i);

    el.querySelector(".plus").style.display=w?"none":"";
    const pipEl=el.querySelector(".pips"), lvEl=el.querySelector(".lv");
    if(w){
      pipEl.style.color=PAL()[WRANK[w.rank].tier];
      if(pipEl.childElementCount!==TOPRANK+1||pipEl.dataset.r!==""+w.rank){
        pipEl.dataset.r=""+w.rank;
        pipEl.innerHTML=Array.from({length:TOPRANK+1},(_,k)=>
          '<i class="'+(k<=w.rank?"on":"")+'"></i>').join("");
      }
      const L=rlvl(w.rank);
      lvEl.style.display=L?"":"none";
      lvEl.textContent="Lv "+L;
    } else { pipEl.innerHTML=""; pipEl.dataset.r=""; lvEl.style.display="none"; }
  }
  const up=document.getElementById("goUp");
  if(up) up.classList.toggle("alert",(can&&hasRoom)||anyMerge());
  layoutWizards();
  const fill=clamp(Math.max(balls.length/val("cap"), areaSum()/(arenaArea()*0.42)),0,1);
  const bar=document.getElementById("apBar");
  if(bar){ bar.firstElementChild.style.width=(fill*100).toFixed(0)+"%"; bar.classList.toggle("hot",fill>0.85); }
  const apn=document.getElementById("apN");
  if(apn) apn.textContent=balls.length+"/"+val("cap");
}

/* ---- the loop: every wizard runs whether or not you are watching ---- */
function stepWizards(dt){
  const full=balls.length>=val("cap")||areaSum()>arenaArea()*0.42;
  for(let i=0;i<SLOTS;i++){
    const z=WZ[i]; if(!z) continue;
    z.bob+=dt*1.6;
    if(z.cast>0) z.cast=Math.max(0,z.cast-dt*3.4);
    if(!wiz(i)){ z.t=0; z.held=false; continue; }
    if(z.t>0) z.t-=dt;
    if(z.t<=0){
      if(full){ z.held=true; continue; }
      z.held=false; z.t=wDelay(i); z.cast=1;
      castBall(i);
    }
  }
  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i];
    b.t+=dt;
    if(b.spark){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.vy+=900*dt; if(b.t>.7) bolts.splice(i,1); }
    else { b.y+=b.v*dt; b.v+=2400*dt; if(b.y>WSH+60) bolts.splice(i,1); }
  }
}
function castBall(i){
  const cls=WRANK[wiz(i).rank], t=cls.tier;
  const kind=dropKind();
  const rr=tierRadius(t,cls);
  const x=clamp(castX(i)+rnd(-9,9), rr+2, Math.max(rr+3,W-rr-2));
  const b=makeBall(t, x, AR.y0+rr*0.9, rnd(-22,22)*S, rnd(190,260)*S, cls, undefined, kind);
  balls.push(b);
  const col=b.kind==="golden"?"#FFC93C":(b.kind==="unstable"?"#FF9A3D":PAL()[t]);
  for(let k=0;k<6;k++){
    const a=Math.PI/2+rnd(-1.1,1.1), sp=rnd(60,190)*S;
    parts.push({x:b.x,y:AR.y0+4,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*.5,
      r:rnd(1.3,3)*S,col,t:0,life:rnd(.16,.32),goo:false,drag:.84});
  }
  rings.push({x:b.x,y:AR.y0+6,r:6,R:44*S,t:0,life:.24,col,w:2});
  pop(NOTE[t]*2,{pan:panAt(b.x),vol:.09,wet:.14});
  const c=CELLS[i];
  if(c) bolts.push({x:c.cx, y:c.cy+8, v:210, t:0, col, r:Math.max(4,6+wiz(i).rank*1.2)});
}

/* ---- the board's actions ----
   One gesture, one transaction. Duplicated pointer sequences (and human
   double-taps) must never buy or merge twice. */
let lastAct=0;
const actGate=()=>{
  const t=now();
  if(t-lastAct<260) return false;
  lastAct=t; return true;
};
function summonAt(i){
  if(wiz(i)||!actGate()) return;
  const c=summonCost();
  if(G.bio<c){ toast("Needs "+fmt(c)+" mass"); return; }
  G.bio-=c; G.summons=(G.summons|0)+1;
  G.wiz[i]={id:++G.wizSeq, rank:0};
  WZ[i].ph=Math.random();
  WZ[i].t=wDelay(i)*(0.1+WZ[i].ph*0.85); WZ[i].cast=0; WZ[i].held=false;
  wizSel=i;
  chime(392,{vol:.14,len:.6,wet:.4}); pop(520,{vol:.12});
  haptic(16); save(); syncWizGrid(); syncWizPanel(true);
}
function upgradeWiz(i){
  const w=wiz(i); if(!w||!actGate()) return;
  const r=w.rank;
  if(rCapped(r)){ toast(WRANK[r].nm+" is already at full speed"); return; }
  const c=rUpCost(r);
  if(G.bio<c){ toast("Needs "+fmt(c)+" mass"); return; }
  G.bio-=c; G.wlvl[r]=rlvl(r)+1;
  toast("Every "+WRANK[r].nm+" now casts every "+rDelay(r).toFixed(2)+"s");
  tick(560+rlvl(r)*8,.1); haptic(9);
  save(); syncWizGrid(); syncWizPanel(true);
}
function mergeWiz(from,to){
  const a=wiz(from), b=wiz(to);
  if(!a||!b||a.rank!==b.rank||a.rank>=TOPRANK) return false;
  if(!actGate()) return false;
  const nr=a.rank+1;
  G.wiz[to]={id:++G.wizSeq, rank:nr};
  G.wiz[from]=null;
  WZ[to].ph=Math.random();
  WZ[to].t=wDelay(to)*(0.1+WZ[to].ph*0.7); WZ[to].cast=0; WZ[to].held=false;
  WZ[from].t=0; WZ[from].cast=0; WZ[from].held=false;
  wizSel=to;
  const c=CELLS[to], col=PAL()[WRANK[nr].tier];
  if(c) for(let k=0;k<18;k++){
    const ang=rnd(0,TAU), sp=rnd(70,300);
    bolts.push({x:c.cx,y:c.cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,t:0,col,r:rnd(2,5),spark:true});
  }
  banner(WRANK[nr].nm.toUpperCase());
  const n=NOTE[Math.max(0,Math.min(NOTE.length-1,WRANK[nr].tier))];
  chime(n*3,{vol:.2,len:.9,wet:.5});
  chime(n*4.5,{vol:.1,len:.7,delay:.06,wet:.5});
  thud(70,{vol:.24,len:.3});
  haptic([16,28,16]); save(); syncWizGrid(); syncWizPanel(true);
  return true;
}
function moveWiz(from,to){
  if(wiz(to)||!wiz(from)||!actGate()) return false;
  G.wiz[to]=G.wiz[from]; G.wiz[from]=null;
  const a=WZ[from], b=WZ[to];
  b.t=a.t; b.cast=0; b.held=a.held; a.t=0; a.held=false;
  wizSel=to; tick(420,.07); haptic(8);
  save(); syncWizGrid(); syncWizPanel(true);
  return true;
}

/* ---- the panel under the board: what the selected wizard is and how to make
        it faster, with the buy button always available underneath so you can
        keep stacking Apprentices to merge ---- */
let panelSig="";
function syncWizPanel(force){
  const p=document.getElementById("wizPanel"); if(!p) return;
  const i=wizSel, w=wiz(i);
  const sig=[i,w?w.rank+"/"+rlvl(w.rank):"-",wizCount(),summonCost(),
             G.bio>=summonCost(),w?(G.bio>=wUpCost(i)?1:0):0].join("|");
  if(!force&&sig===panelSig) return;
  panelSig=sig;
  p.innerHTML="";

  if(w){
    const r=WRANK[w.rank], rk=w.rank, L=rlvl(rk);
    const c=rUpCost(rk), can=G.bio>=c;
    const nd=r.delay*Math.pow(0.94,L+1);
    const capped=rCapped(rk);
    const many=G.wiz.filter(x=>x&&x.rank===rk).length;
    const row=document.createElement("div"); row.className="wpRow";
    const sw=wizPortrait(w.rank,44);
    sw.className="portrait";
    row.appendChild(sw);
    const l=document.createElement("div"); l.className="l";
    l.innerHTML='<div class="t">'+r.nm+(L?" · Lv "+L:"")+'</div>'+
      '<div class="s">Every '+rDelay(rk).toFixed(2)+'s · '+fmt(r.mass)+' mass · '+
      r.taps+' tap'+(r.taps>1?"s":"")+(many>1?" · "+many+" on the board":"")+'</div>';
    row.appendChild(l);
    const b=document.createElement("button");
    b.className="wpBtn"+(can&&!capped?"":" no");
    b.innerHTML=capped ? "Maxed<small>fastest it goes</small>"
                       : "Faster<small>◉ "+fmt(c)+" → "+nd.toFixed(2)+"s · all "+r.nm+"s</small>";
    b.onclick=()=>{ if(!capped) upgradeWiz(i); };
    row.appendChild(b);
    p.appendChild(row);
  } else {
    const h=document.createElement("div"); h.className="wpHint";
    h.textContent=wizCount()
      ? "Tap a kind to speed up all of them · drag one onto another of the same kind to merge"
      : "Summon your first wizard to start producing.";
    p.appendChild(h);
  }

  // always buyable: this is how you get a second of something to merge
  const cost=summonCost(), can=G.bio>=cost, full=wizCount()>=SLOTS;
  const sb=document.createElement("button");
  sb.className="wpSummon"+(can&&!full?"":" no");
  sb.innerHTML=full ? "Board full — merge to make room"
                    : "Summon "+WRANK[0].nm+" <small>◉ "+fmt(cost)+"</small>";
  sb.onclick=()=>{
    if(full){ toast("Merge two of a kind to free a slot"); return; }
    const e=G.wiz.indexOf(null);
    if(e>=0) summonAt(e);
  };
  p.appendChild(sb);
}

let lastChromeH=0;
function fitBoard(){
  const ch=document.getElementById("wizChrome");
  if(!ch) return;
  const h=Math.round(ch.offsetHeight);
  if(h===lastChromeH) return;
  lastChromeH=h;
  layoutWizards();
  if(room==="wiz") document.documentElement.style.setProperty("--chrome-b",h+"px");
}

/* the castle: each slot is a length of battlement, drawn course by course so
   a row of them reads as one wall the wizards are standing along */
function drawBattlement(x,c){
  const h=c.h*0.30, top=c.y+c.h-h;
  const w=c.w, L=c.x, R=c.x+w;
  const cren=h*0.34, notch=w*0.19;
  const outline=()=>{
    x.beginPath();
    x.moveTo(L,top+cren);
    x.lineTo(L,top);            x.lineTo(L+notch,top);
    x.lineTo(L+notch,top+cren); x.lineTo(R-notch,top+cren);
    x.lineTo(R-notch,top);      x.lineTo(R,top);
    x.lineTo(R,c.y+c.h);        x.lineTo(L,c.y+c.h);
    x.closePath();
  };
  x.save();
  outline(); x.fillStyle=BRICK.a; x.fill();

  x.save(); outline(); x.clip();
  const ch=h*0.30;
  for(let row=0,y=top;y<c.y+c.h+ch;row++,y+=ch){
    if(row%2){ x.fillStyle=BRICK.b; x.fillRect(L,y,w,ch*0.55); }
    x.strokeStyle=BRICK.m; x.lineWidth=1;
    x.beginPath(); x.moveTo(L,Math.round(y)+.5); x.lineTo(R,Math.round(y)+.5); x.stroke();
    const off=(row%2)?w*0.16:w*-0.06;
    for(let bx=L+off;bx<R;bx+=w*0.32){
      if(bx<=L+1) continue;
      x.beginPath(); x.moveTo(Math.round(bx)+.5,y); x.lineTo(Math.round(bx)+.5,y+ch); x.stroke();
    }
  }
  // the lip you stand on catches the light
  x.fillStyle=BRICK.t;
  x.fillRect(L,top+cren,w,Math.max(1.5,h*0.08));
  x.fillRect(L,top,notch,Math.max(1.5,h*0.07));
  x.fillRect(R-notch,top,notch,Math.max(1.5,h*0.07));
  x.restore();

  outline();
  x.lineJoin="miter"; x.lineWidth=1.6; x.strokeStyle="rgba(16,22,37,.32)"; x.stroke();
  x.restore();
}

/* ---- drawing the room ----------------------------------------------------
   Chunky proportions, one light source at the upper left, a hard shadow side
   and a heavy outline on every part — the shorthand that makes flat vector
   characters read as crafted rather than assembled from primitives.        */
function drawWizards(){
  xWz.setTransform(DPR,0,0,DPR,0,0);
  xWz.clearRect(0,0,WSW,WSH);
  for(let i=0;i<SLOTS;i++){ const c=CELLS[i]; if(c) drawBattlement(xWz,c); }
  for(let i=0;i<SLOTS;i++){
    const c=CELLS[i];
    if(!wiz(i)||!c||i===wizDrag) continue;
    drawWizardFigure(i, c.cx, c.y+c.h*0.775, Math.min(c.w,c.h)*0.243, 1);
  }
  // the one in your hand rides above everything, lifted and a little bigger
  if(wizDrag>=0&&wiz(wizDrag)){
    const c=CELLS[wizDrag]||CELLS[0];
    const sz=Math.min(c.w,c.h)*0.243;
    xWz.save();
    xWz.globalAlpha=.22; xWz.fillStyle="#0F1720";
    xWz.beginPath(); xWz.ellipse(dragX,dragY+sz*.55,sz*.72,sz*.20,0,0,TAU); xWz.fill();
    xWz.restore();
    drawWizardFigure(wizDrag, dragX, dragY-sz*.30, sz*1.16, .96);
  }
  drawBolts();
}
function drawWizardFigure(i,ax,ay,s,alpha){
  {
    const w=wiz(i), pal=PAL();
    const z=WZ[i], r=WRANK[w.rank], col=pal[r.tier];
    const prog=1-clamp(z.t/wDelay(i),0,1);
    const charge=Math.max(0,(prog-0.70)/0.30);
    const kick=z.cast;
    const bob=Math.sin(z.bob)*1.3;
    xWz.globalAlpha=alpha===undefined?1:alpha;

    const lit=shade(col,.26), dim=shade(col,-.24), deep=shade(col,-.42);
    const ink=shade(col,-.62);
    const lw=Math.max(1.3,s*.105);
    xWz.lineJoin="round"; xWz.lineCap="round";

    xWz.save();
    xWz.translate(ax, ay+bob*0.4);

    /* the summoning circle on the flagstones, filling toward the cast */
    xWz.save();
    xWz.scale(1,.34);
    xWz.lineWidth=Math.max(1.6,s*.10);
    xWz.strokeStyle="rgba(16,22,37,.10)";
    xWz.beginPath(); xWz.arc(0,0,s*.92,0,TAU); xWz.stroke();
    xWz.strokeStyle=z.held?"#D9821C":col;
    xWz.globalAlpha=z.held?.85:1;
    xWz.beginPath(); xWz.arc(0,0,s*.92,-Math.PI/2,-Math.PI/2+TAU*Math.max(prog,.001)); xWz.stroke();
    if(charge>0){
      xWz.globalAlpha=charge*.5;
      xWz.lineWidth=Math.max(1,s*.05);
      xWz.beginPath(); xWz.arc(0,0,s*.66,0,TAU); xWz.stroke();
    }
    xWz.restore();

    /* contact shadow */
    xWz.globalAlpha=.16; xWz.fillStyle="#0F1720";
    xWz.beginPath(); xWz.ellipse(s*.06,-s*.02,s*.66,s*.19,0,0,TAU); xWz.fill();
    xWz.globalAlpha=1;

    xWz.translate(0,bob*0.9+kick*s*.12);

    /* ---- robe ---- */
    const robe=()=>{
      xWz.beginPath();
      xWz.moveTo(-s*.76,-s*.05);
      xWz.quadraticCurveTo(-s*.70,-s*.62,-s*.36,-s*1.00);
      xWz.quadraticCurveTo(0,-s*1.22,s*.36,-s*1.00);
      xWz.quadraticCurveTo(s*.70,-s*.62,s*.76,-s*.05);
      xWz.quadraticCurveTo(0,s*.16,-s*.76,-s*.05);
      xWz.closePath();
    };
    robe(); xWz.fillStyle=col; xWz.fill();
    xWz.save(); robe(); xWz.clip();                    // hard shadow side
    xWz.fillStyle=dim; xWz.fillRect(s*.18,-s*1.4,s*1.2,s*1.7);
    xWz.fillStyle=lit; xWz.fillRect(-s*1.2,-s*1.4,s*.52,s*1.7);
    xWz.fillStyle=deep;                                 // hem band
    xWz.fillRect(-s*.9,-s*.20,s*1.8,s*.40);
    xWz.restore();
    robe(); xWz.lineWidth=lw; xWz.strokeStyle=ink; xWz.stroke();

    /* ---- belt + buckle ---- */
    xWz.fillStyle=deep;
    xWz.beginPath();
    xWz.moveTo(-s*.50,-s*.60); xWz.lineTo(s*.50,-s*.60);
    xWz.lineTo(s*.54,-s*.42); xWz.lineTo(-s*.54,-s*.42); xWz.closePath();
    xWz.fill(); xWz.lineWidth=lw*.7; xWz.strokeStyle=ink; xWz.stroke();
    xWz.fillStyle="#E8B21B";
    xWz.beginPath(); xWz.rect(-s*.11,-s*.585,s*.22,s*.15); xWz.fill();
    xWz.lineWidth=lw*.55; xWz.strokeStyle="#7A5A08"; xWz.stroke();

    /* ---- sleeves ---- */
    for(const sx of [-1,1]){
      xWz.beginPath();
      xWz.ellipse(sx*s*.60,-s*.72,s*.17,s*.24,sx*0.22,0,TAU);
      xWz.fillStyle=sx<0?lit:dim; xWz.fill();
      xWz.lineWidth=lw*.8; xWz.strokeStyle=ink; xWz.stroke();
    }

    /* ---- staff, planted, with a gem that wakes as the cast builds ---- */
    const gl=charge*.85+kick;
    xWz.lineWidth=Math.max(1.6,s*.13);
    xWz.strokeStyle="#8A6440";
    xWz.beginPath(); xWz.moveTo(s*.80,s*.02); xWz.lineTo(s*.66,-s*1.72); xWz.stroke();
    xWz.lineWidth=Math.max(1,s*.05); xWz.strokeStyle="#5E4227";
    xWz.beginPath(); xWz.moveTo(s*.80,s*.02); xWz.lineTo(s*.66,-s*1.72); xWz.stroke();
    if(gl>.04){
      xWz.globalAlpha=gl*.42; xWz.fillStyle=col;
      xWz.beginPath(); xWz.arc(s*.65,-s*1.80,s*(.30+gl*.22),0,TAU); xWz.fill();
      xWz.globalAlpha=1;
    }
    xWz.beginPath(); xWz.arc(s*.65,-s*1.80,s*.155,0,TAU);
    xWz.fillStyle=lit; xWz.fill();
    xWz.lineWidth=lw*.7; xWz.strokeStyle=ink; xWz.stroke();
    xWz.beginPath(); xWz.arc(s*.61,-s*1.845,s*.055,0,TAU);
    xWz.fillStyle="rgba(255,255,255,"+(.55+gl*.45)+")"; xWz.fill();

    /* ---- head ---- */
    xWz.beginPath(); xWz.arc(0,-s*1.36,s*.36,0,TAU);
    xWz.fillStyle="#F3DFC6"; xWz.fill();
    xWz.save(); xWz.beginPath(); xWz.arc(0,-s*1.36,s*.36,0,TAU); xWz.clip();
    xWz.fillStyle="#DCC0A0"; xWz.fillRect(s*.10,-s*1.9,s*.7,s*1.1);
    xWz.restore();
    xWz.lineWidth=lw; xWz.strokeStyle=ink; xWz.stroke();

    /* eyes sit low, which is what makes the forehead read as a big hat brim */
    xWz.fillStyle="#2A2118";
    xWz.beginPath(); xWz.ellipse(-s*.13,-s*1.30,s*.052,s*.068,0,0,TAU); xWz.fill();
    xWz.beginPath(); xWz.ellipse(s*.13,-s*1.30,s*.052,s*.068,0,0,TAU); xWz.fill();

    /* ---- beard ---- */
    xWz.beginPath();
    xWz.moveTo(-s*.30,-s*1.26);
    xWz.quadraticCurveTo(-s*.34,-s*.86,-s*.13,-s*.72);
    xWz.quadraticCurveTo(0,-s*.62,s*.13,-s*.72);
    xWz.quadraticCurveTo(s*.34,-s*.86,s*.30,-s*1.26);
    xWz.quadraticCurveTo(0,-s*1.08,-s*.30,-s*1.26);
    xWz.closePath();
    xWz.fillStyle="#F7F3EC"; xWz.fill();
    xWz.save(); xWz.clip();
    xWz.fillStyle="#DAD3C8"; xWz.fillRect(s*.06,-s*1.4,s*.6,s*.9);
    xWz.restore();
    xWz.lineWidth=lw*.8; xWz.strokeStyle=ink; xWz.stroke();

    /* ---- hat ---- */
    xWz.beginPath();
    xWz.moveTo(-s*.46,-s*1.62);
    xWz.quadraticCurveTo(-s*.30,-s*2.30,s*.16,-s*2.72);
    xWz.quadraticCurveTo(s*.20,-s*2.10,s*.46,-s*1.62);
    xWz.closePath();
    xWz.fillStyle=col; xWz.fill();
    xWz.save(); xWz.clip();
    xWz.fillStyle=dim; xWz.fillRect(s*.06,-s*2.9,s*.9,s*1.5);
    xWz.fillStyle=lit; xWz.fillRect(-s*.9,-s*2.9,s*.30,s*1.5);
    xWz.restore();
    xWz.lineWidth=lw; xWz.strokeStyle=ink; xWz.stroke();

    /* brim */
    xWz.beginPath(); xWz.ellipse(0,-s*1.60,s*.70,s*.17,0,0,TAU);
    xWz.fillStyle=col; xWz.fill();
    xWz.save(); xWz.beginPath(); xWz.ellipse(0,-s*1.60,s*.70,s*.17,0,0,TAU); xWz.clip();
    xWz.fillStyle=dim; xWz.fillRect(s*.06,-s*1.9,s*1,s*.7);
    xWz.restore();
    xWz.lineWidth=lw; xWz.strokeStyle=ink; xWz.stroke();

    /* hat band + a small gold star, the bit that reads as "made" */
    xWz.beginPath();
    xWz.moveTo(-s*.455,-s*1.68);
    xWz.quadraticCurveTo(0,-s*1.60,s*.455,-s*1.68);
    xWz.lineTo(s*.42,-s*1.86);
    xWz.quadraticCurveTo(0,-s*1.78,-s*.42,-s*1.86);
    xWz.closePath();
    xWz.fillStyle="#E8B21B"; xWz.fill();
    xWz.lineWidth=lw*.6; xWz.strokeStyle="#7A5A08"; xWz.stroke();
    star(xWz,s*.06,-s*2.16,s*.15,"#FFE9A8","#7A5A08",lw*.5);

    xWz.restore();
  }
  xWz.globalAlpha=1;
}
function drawBolts(){
  for(const b of bolts){
    xWz.save();
    xWz.globalAlpha=b.spark?Math.max(0,1-b.t*1.5):.95;
    if(!b.spark){
      xWz.globalAlpha=.26; xWz.fillStyle=b.col;
      xWz.beginPath(); xWz.ellipse(b.x,b.y-b.r*2.5,b.r*.72,b.r*2.7,0,0,TAU); xWz.fill();
      xWz.globalAlpha=.95;
    }
    xWz.fillStyle=b.col;
    xWz.beginPath(); xWz.arc(b.x,b.y,b.r,0,TAU); xWz.fill();
    if(!b.spark){
      xWz.fillStyle="rgba(255,255,255,.75)";
      xWz.beginPath(); xWz.arc(b.x-b.r*.28,b.y-b.r*.28,b.r*.34,0,TAU); xWz.fill();
    }
    xWz.restore();
  }
}
function star(x,cx,cy,r,fill,line,lw){
  x.beginPath();
  for(let k=0;k<10;k++){
    const a=-Math.PI/2+k*Math.PI/5, rr=k%2?r*.44:r;
    const px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr;
    k?x.lineTo(px,py):x.moveTo(px,py);
  }
  x.closePath();
  x.fillStyle=fill; x.fill();
  x.lineWidth=lw; x.strokeStyle=line; x.stroke();
}

function wizPortrait(rank,size){

  const d=Math.min(devicePixelRatio||1,2);
  c.width=size*d; c.height=size*d;
  c.style.width=size+"px"; c.style.height=size+"px";
  const x=c.getContext("2d"); x.scale(d,d);
  const col=PAL()[WRANK[rank].tier];
  const lit=shade(col,.26), dim=shade(col,-.24), ink=shade(col,-.62);
  const s=size*0.21, lw=Math.max(1,s*.11);
  x.save(); x.translate(size/2, size*0.80);
  x.lineJoin="round"; x.lineCap="round";
  // robe
  x.beginPath();
  x.moveTo(-s*.76,-s*.05);
  x.quadraticCurveTo(-s*.70,-s*.62,-s*.36,-s*1.00);
  x.quadraticCurveTo(0,-s*1.22,s*.36,-s*1.00);
  x.quadraticCurveTo(s*.70,-s*.62,s*.76,-s*.05);
  x.quadraticCurveTo(0,s*.16,-s*.76,-s*.05);
  x.closePath();
  x.fillStyle=col; x.fill();
  x.save(); x.clip(); x.fillStyle=dim; x.fillRect(s*.18,-s*1.4,s*1.2,s*1.7);
  x.fillStyle=lit; x.fillRect(-s*1.2,-s*1.4,s*.5,s*1.7); x.restore();
  x.lineWidth=lw; x.strokeStyle=ink; x.stroke();
  // face
  x.beginPath(); x.arc(0,-s*1.36,s*.36,0,TAU);
  x.fillStyle="#F3DFC6"; x.fill(); x.lineWidth=lw; x.strokeStyle=ink; x.stroke();
  x.fillStyle="#2A2118";
  x.beginPath(); x.ellipse(-s*.13,-s*1.30,s*.05,s*.065,0,0,TAU); x.fill();
  x.beginPath(); x.ellipse(s*.13,-s*1.30,s*.05,s*.065,0,0,TAU); x.fill();
  // beard
  x.beginPath();
  x.moveTo(-s*.30,-s*1.26);
  x.quadraticCurveTo(-s*.34,-s*.86,0,-s*.66);
  x.quadraticCurveTo(s*.34,-s*.86,s*.30,-s*1.26);
  x.quadraticCurveTo(0,-s*1.08,-s*.30,-s*1.26);
  x.closePath();
  x.fillStyle="#F7F3EC"; x.fill(); x.lineWidth=lw*.8; x.strokeStyle=ink; x.stroke();
  // hat
  x.beginPath();
  x.moveTo(-s*.46,-s*1.62);
  x.quadraticCurveTo(-s*.30,-s*2.30,s*.16,-s*2.72);
  x.quadraticCurveTo(s*.20,-s*2.10,s*.46,-s*1.62);
  x.closePath();
  x.fillStyle=col; x.fill();
  x.save(); x.clip(); x.fillStyle=dim; x.fillRect(s*.06,-s*2.9,s*.9,s*1.5); x.restore();
  x.lineWidth=lw; x.strokeStyle=ink; x.stroke();
  x.beginPath(); x.ellipse(0,-s*1.60,s*.70,s*.17,0,0,TAU);
  x.fillStyle=col; x.fill(); x.lineWidth=lw; x.strokeStyle=ink; x.stroke();
  x.beginPath();
  x.moveTo(-s*.455,-s*1.68); x.quadraticCurveTo(0,-s*1.60,s*.455,-s*1.68);
  x.lineTo(s*.42,-s*1.86); x.quadraticCurveTo(0,-s*1.78,-s*.42,-s*1.86);
  x.closePath();
  x.fillStyle="#E8B21B"; x.fill(); x.lineWidth=lw*.6; x.strokeStyle="#7A5A08"; x.stroke();
  x.restore();
  return c;
}

/* ---------------------------------------------------------------- sim */
function areaSum(){ let a=0; for(const b of balls) a+=b.r*b.r*Math.PI; return a; }
function arenaArea(){ return W*Math.max(1,AR.y1-AR.y0); }

function step(dt){
  el+=dt; G.stat.play+=dt;
  if(zoomPhase){ stepZoom(dt); return; }

  for(const p of POWERS){ const s=pwState(p); if(s.cd>0) s.cd=Math.max(0,s.cd-dt); }
  for(const b of BOOSTS){ const s=G.boost[b.id]; if(s&&s.cd>0) s.cd=Math.max(0,s.cd-dt); }
  if(timers.chain>0) timers.chain-=dt;
  if(timers.storm>0){
    timers.storm-=dt; timers.stormT-=dt;
    if(timers.stormT<=0&&balls.length){
      timers.stormT=1/9;
      fuses.push({b:balls[(Math.random()*balls.length)|0],t:0,d:999});
    }
  }

  for(let i=fuses.length-1;i>=0;i--){
    const f=fuses[i]; f.t-=dt;
    if(f.t<=0){ fuses.splice(i,1); if(!f.b.gone) strike(f.b,f.d,null,true); }
  }

  stepWizards(dt);

  // lysis, the autonomous hitter
  const pr=val("pulse");
  if(pr>0){
    pulseT-=dt;
    if(pulseT<=0&&balls.length){
      pulseT=1/pr;
      balls.slice().sort((a,b)=>a.tier-b.tier).slice(0,Math.min(val("spread"),balls.length))
        .forEach((b,i)=>fuses.push({b,t:i*.03,d:val("depth")}));
    }
  }

  // motion
  const mag=val("magnet")*S;
  for(const b of balls){
    if(ptrDown&&mag>0){
      const dx=ptrX-b.x, dy=ptrY-b.y, d=Math.hypot(dx,dy);
      if(d<mag&&d>1){ const f=(1-d/mag)*260*dt; b.vx+=dx/d*f; b.vy+=dy/d*f; }
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    const k=Math.pow(.42,dt); b.vx*=k; b.vy*=k;
    const t=TIER[b.tier].spd*S*curScale().spd, sp=Math.hypot(b.vx,b.vy);
    if(sp<t*.5){
      const a=sp<1?rnd(0,TAU):Math.atan2(b.vy,b.vx);
      b.vx+=Math.cos(a)*t*dt*1.6; b.vy+=Math.sin(a)*t*dt*1.6;
    }
    if(b.x<b.r){ b.x=b.r; b.vx=Math.abs(b.vx)*.92; b.wob=Math.max(b.wob,.1); }
    if(b.x>W-b.r){ b.x=W-b.r; b.vx=-Math.abs(b.vx)*.92; b.wob=Math.max(b.wob,.1); }
    if(b.y<AR.y0+b.r){ b.y=AR.y0+b.r; b.vy=Math.abs(b.vy)*.92; b.wob=Math.max(b.wob,.1); }
    if(b.y>AR.y1-b.r){ b.y=AR.y1-b.r; b.vy=-Math.abs(b.vy)*.92; b.wob=Math.max(b.wob,.1); }
    b.wob=.019+(b.wob-.019)*Math.pow(.02,dt);
    b.sq*=Math.pow(.0009,dt); b.hit*=Math.pow(.004,dt);
    b.wp+=dt*b.ws*(1+b.wob*10); b.pulse+=dt*3.2;
  }

  // one pass for both jobs: same-colour balls reach for each other and fuse,
  // everything else just bumps
  const seek=val("attract")*S, seek2=seek*seek;
  // sweep and prune on x: with a dish full of small balls the old all-pairs
  // loop was the frame budget. sorted order also means we can stop early.
  balls.sort((p,q)=>(p.x-p.r)-(q.x-q.r));
  for(let i=0;i<balls.length;i++){
    const a=balls[i];
    const reach=a.x+a.r+seek;
    for(let j=i+1;j<balls.length;j++){
      const b=balls[j];
      if(b.x-b.r>reach) break;
      const dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy, rr=a.r+b.r;
      const same=canFuse(a,b);

      if(same && d2<seek2 && d2>1){
        const d=Math.sqrt(d2), f=(1-d/seek)*46*dt;
        a.vx+=dx/d*f; a.vy+=dy/d*f;
        b.vx-=dx/d*f; b.vy-=dy/d*f;
      }
      if(d2>=rr*rr||d2===0) continue;
      const d=Math.sqrt(d2), nx=dx/d, ny=dy/d, ov=rr-d;

      if(same && (!a.mate||a.mate===b) && (!b.mate||b.mate===a)){
        // locked together — let them sink into one another instead of bouncing
        a.mate=b; b.mate=a;
        const pull=120*dt;
        a.vx+=nx*pull; a.vy+=ny*pull;
        b.vx-=nx*pull; b.vy-=ny*pull;
        a.wob=Math.max(a.wob,.05); b.wob=Math.max(b.wob,.05);
        continue;
      }

      const ma=a.r*a.r, mb=b.r*b.r, mt=ma+mb;
      a.x-=nx*ov*(mb/mt); a.y-=ny*ov*(mb/mt);
      b.x+=nx*ov*(ma/mt); b.y+=ny*ov*(ma/mt);
      const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(vn<0){
        const imp=-1.7*vn/mt;
        a.vx-=imp*mb*nx; a.vy-=imp*mb*ny;
        b.vx+=imp*ma*nx; b.vy+=imp*ma*ny;
        const j2=Math.min(Math.abs(vn)/500,.09);
        a.wob=Math.max(a.wob,j2); b.wob=Math.max(b.wob,j2);
      }
    }
  }

  // resolve the locks: hold contact long enough and they become one
  for(let i=balls.length-1;i>=0;i--){
    const a=balls[i], b=a.mate;
    if(!b) continue;
    if(b.gone||b.mate!==a){ unmate(a); continue; }
    const gap=Math.hypot(b.x-a.x,b.y-a.y)-(a.r+b.r);
    if(gap>Math.min(a.r,b.r)*0.34){ unmate(a); continue; }
    if(a.id>b.id) continue;             // only one of the pair drives the clock
    a.fuseT+=dt; b.fuseT=a.fuseT;
    if(a.fuseT>=fuseTime()) fuse(a,b);
  }

  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=dt;
    if(p.t>=p.life){ parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    const k=Math.pow(p.drag,dt*60); p.vx*=k; p.vy*=k;
    if(!p.goo) p.vy+=320*S*dt;
  }
  for(let i=rings.length-1;i>=0;i--){ const r=rings[i]; r.t+=dt; if(r.t>=r.life) rings.splice(i,1); }
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i]; p.t+=dt; p.y+=p.vy*dt; p.vy*=Math.pow(.2,dt);
    if(p.t>=p.life) pops.splice(i,1);
  }
  for(let i=trail.length-1;i>=0;i--){ trail[i].t+=dt; if(trail[i].t>.34) trail.splice(i,1); }

  if(comboT>0){ comboT-=dt; if(comboT<=0){ combo=0; document.getElementById("combo").classList.remove("on"); } }
  shake*=Math.pow(.02,dt); flash*=Math.pow(.004,dt);
}

/* ------------------------------------------------------------ celebration
   Claiming something should feel like being paid. Reward spills out of the
   button, arcs, then a handful of it flies up and lands in the counter,
   which pops when each piece arrives.                                     */
let cele=[], pipPop=0;
const CONF=["#FF3B57","#2F6BFF","#F5B301","#0FB981","#9B3DFF","#FF6B2C","#FFFFFF"];
function appPt(el){
  const a=app.getBoundingClientRect(), r=el.getBoundingClientRect();
  return {x:r.left-a.left+r.width/2, y:r.top-a.top+r.height/2};
}
function celebrate(src,n,col,homeEl){
  const p=appPt(src);
  const home=homeEl?appPt(homeEl):null;
  // ribbons: thin rectangles tumbling on two axes, which is what sells confetti
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+rnd(-.95,.95), sp=rnd(420,980);
    cele.push({
      kind:"ribbon",
      x:p.x, y:p.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      w:rnd(5,9), h:rnd(9,16),
      t:0, life:rnd(1.5,2.4),
      col:CONF[(Math.random()*CONF.length)|0],
      ang:rnd(0,TAU), spin:rnd(-13,13),
      flip:rnd(0,TAU), flipV:rnd(5,13),
      drag:rnd(.86,.94),
    });
  }
  // the reward itself: sparkles that arc, then fly home to the counter
  const homers=home?Math.min(9,Math.max(4,Math.round(n*.3))):0;
  for(let i=0;i<homers;i++){
    const a=-Math.PI/2+rnd(-.7,.7), sp=rnd(300,560);
    cele.push({
      kind:"spark",
      x:p.x, y:p.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      r:rnd(7,10), t:0, life:2.4,
      col:col||"#F5B301",
      ang:rnd(0,TAU), spin:rnd(-4,4),
      home, hop:0, wait:.16+i*.055, trail:[],
    });
  }
  rings.push({x:p.x,y:p.y,r:8,R:150,t:0,life:.44,col:col||"#F5B301",w:3.5});
}
function stepCele(dt){
  for(let i=cele.length-1;i>=0;i--){
    const c=cele[i];
    c.t+=dt; c.ang+=c.spin*dt;
    if(c.t>=c.life){ cele.splice(i,1); continue; }
    if(c.kind==="ribbon"){
      c.flip+=c.flipV*dt;
      c.x+=c.vx*dt; c.y+=c.vy*dt;
      c.vy+=1450*dt;
      const k=Math.pow(c.drag,dt*60); c.vx*=k; c.vy*=k;
      c.vx+=Math.sin(c.t*3.1+c.flip)*26*dt;      // flutter
      continue;
    }
    // spark
    if(c.home&&c.t>c.wait){
      c.hop=Math.min(1,c.hop+dt*1.5);
      const k=easeOut(c.hop)*.30;
      c.x+=(c.home.x-c.x)*k; c.y+=(c.home.y-c.y)*k;
      c.trail.push({x:c.x,y:c.y}); if(c.trail.length>7) c.trail.shift();
      if(Math.hypot(c.home.x-c.x,c.home.y-c.y)<10){
        cele.splice(i,1); pipPop=1;
        tick(720+Math.random()*260,.075);
        continue;
      }
    } else {
      c.x+=c.vx*dt; c.y+=c.vy*dt; c.vy+=900*dt;
      const k=Math.pow(.9,dt*60); c.vx*=k; c.vy*=k;
    }
  }
  if(pipPop>0){
    pipPop-=dt*4;
    const pip=document.querySelector("#sporeWrap .pip");
    if(pip&&!pip._busy){
      pip._busy=1;
      pip.animate([{transform:"scale(1)"},{transform:"scale(1.5)"},{transform:"scale(1)"}],
        {duration:250,easing:"cubic-bezier(.2,1.6,.4,1)"}).onfinish=()=>{pip._busy=0;};
    }
  }
}
function drawCele(){
  xBu.setTransform(DPR,0,0,DPR,0,0);
  xBu.clearRect(0,0,W,H);
  if(!cele.length) return;
  for(const c of cele){
    const k=1-c.t/c.life, fade=Math.min(1,k*3.2);
    if(c.kind==="ribbon"){
      // width breathes with the tumble, so each piece reads as a flat strip
      const t=Math.cos(c.flip), wf=Math.abs(t);
      xBu.save();
      xBu.globalAlpha=fade;
      xBu.translate(c.x,c.y); xBu.rotate(c.ang);
      xBu.fillStyle=wf<.42?shade(c.col,-.30):c.col;   // edge-on faces darken
      xBu.fillRect(-c.w*wf*.5,-c.h*.5,Math.max(1,c.w*wf),c.h);
      xBu.restore();
    } else {
      xBu.save();
      xBu.globalAlpha=fade*.5;
      xBu.strokeStyle=c.col; xBu.lineWidth=3; xBu.lineCap="round";
      if(c.trail.length>1){
        xBu.beginPath(); xBu.moveTo(c.trail[0].x,c.trail[0].y);
        for(const p of c.trail) xBu.lineTo(p.x,p.y);
        xBu.stroke();
      }
      xBu.globalAlpha=fade;
      xBu.translate(c.x,c.y); xBu.rotate(c.ang);
      const r=c.r*(1+c.hop*.35);
      xBu.fillStyle=c.col;
      xBu.beginPath();                               // four-point sparkle
      xBu.moveTo(0,-r);
      xBu.quadraticCurveTo(r*.16,-r*.16,r,0);
      xBu.quadraticCurveTo(r*.16,r*.16,0,r);
      xBu.quadraticCurveTo(-r*.16,r*.16,-r,0);
      xBu.quadraticCurveTo(-r*.16,-r*.16,0,-r);
      xBu.fill();
      xBu.restore();
    }
  }
}
/* ---------------------------------------------------------------- render */
function shade(hex,amt){
  let r,g,b;
  if(hex[0]==="#"){ const n=parseInt(hex.slice(1),16); r=(n>>16)&255; g=(n>>8)&255; b=n&255; }
  else { const m=hex.match(/[0-9.]+/g)||[0,0,0]; r=+m[0]; g=+m[1]; b=+m[2]; }
  if(amt>0){ r+=(255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt; }
  else { r*=1+amt; g*=1+amt; b*=1+amt; }
  return "rgb("+(r|0)+","+(g|0)+","+(b|0)+")";
}
const easeOut=k=>1-Math.pow(1-k,2.6);
function ballXform(x,b){
  x.translate(b.x,b.y);
  x.rotate(b.sqA); x.scale(1-b.sq*.5,1+b.sq*.45); x.rotate(-b.sqA);
  if(FORM.oval!==1){ x.rotate(b.rot); x.scale(1,1/FORM.oval); }
}

/* the agar membrane: many points, a slow low-amplitude undulation */
function membrane(x,b,r){
  x.beginPath();
  const N=44, L=FORM.lobes;
  const amp=(b.wob+FORM.rough)*clamp(r/(26*S),.25,1);
  for(let i=0;i<=N;i++){
    const a=i/N*TAU;
    const w=1+amp*(Math.sin(a*L+b.wp)*.46+Math.sin(a*(L*2+1)-b.wp*1.3)*.27+Math.sin(a*(L*3+2)+b.wp*.6)*.15);
    const rr=r*w, px=Math.cos(a)*rr, py=Math.sin(a)*rr;
    i?x.lineTo(px,py):x.moveTo(px,py);
  }
  x.closePath();
}
/* Eight ball designs. Each paints inside the membrane clip, in tints of the
   ball's own colour so the size ladder still reads at a glance. */
/* One paint routine per scale. Each stays inside a flat rim band so a neck
   between two fusing balls always blends into the colour around it. */
function scalePaint(x,r,col,rot,b){
  const l1=shade(col,.20), l2=shade(col,.42), l3=shade(col,.66);
  const d1=shade(col,-.16), d2=shade(col,-.32), d3=shade(col,-.48);
  const A=x.globalAlpha;
  x.save(); x.rotate(rot||0);
  switch(FORM.paint){

    case "core":{                        // a particle: hard bright centre
      const g=x.createRadialGradient(0,0,r*.02,0,0,r*.95);
      g.addColorStop(0,"#fff"); g.addColorStop(.22,l3);
      g.addColorStop(.55,l1); g.addColorStop(1,col);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.globalAlpha=A*.5; x.lineWidth=r*.045; x.strokeStyle=l3;
      x.beginPath(); x.arc(0,0,r*.62,0,TAU); x.stroke();
      x.globalAlpha=A;
      break; }

    case "shell":{                       // a molecule: bonded lobes
      const g=x.createRadialGradient(-r*.3,-r*.34,r*.04,0,0,r*1.1);
      g.addColorStop(0,l3); g.addColorStop(.4,l1); g.addColorStop(1,col);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.fillStyle=d2; x.globalAlpha=A*.55;
      for(let i=0;i<3;i++){
        const a=i/3*TAU+.4;
        x.beginPath(); x.arc(Math.cos(a)*r*.44,Math.sin(a)*r*.44,r*.17,0,TAU); x.fill();
      }
      x.globalAlpha=A;
      break; }

    case "nucleus":{                     // a cell: nucleus and vacuoles
      const g=x.createRadialGradient(-r*.26,-r*.3,r*.05,0,0,r*1.05);
      g.addColorStop(0,l2); g.addColorStop(.6,col); g.addColorStop(1,d1);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.fillStyle=d2; x.globalAlpha=A*.7;
      x.beginPath(); x.ellipse(-r*.08,-r*.05,r*.32,r*.27,.4,0,TAU); x.fill();
      x.globalAlpha=A*.4; x.fillStyle=l3;
      x.beginPath(); x.arc(r*.34,r*.24,r*.13,0,TAU); x.fill();
      x.beginPath(); x.arc(r*.16,-r*.40,r*.09,0,TAU); x.fill();
      x.globalAlpha=A;
      break; }

    case "grain":{                       // sand: flecked and matte
      x.fillStyle=d1; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      const g=x.createLinearGradient(-r,-r,r*.4,r);
      g.addColorStop(0,l2); g.addColorStop(.5,col); g.addColorStop(1,d2);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.globalAlpha=A*.5;
      for(let i=0;i<9;i++){
        const a=i*2.399, rr=r*.72*Math.sqrt(i/9);
        x.fillStyle=i%2?d3:l3;
        x.beginPath(); x.arc(Math.cos(a)*rr,Math.sin(a)*rr,r*.075,0,TAU); x.fill();
      }
      x.globalAlpha=A;
      break; }

    case "rock":{                        // a boulder: hard facets
      const g=x.createLinearGradient(-r*.8,-r*.8,r*.6,r*.9);
      g.addColorStop(0,l2); g.addColorStop(.45,col); g.addColorStop(1,d3);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.globalAlpha=A*.55; x.fillStyle=l3;
      x.beginPath();
      x.moveTo(-r*.7,-r*.15); x.lineTo(-r*.1,-r*.72); x.lineTo(r*.22,-r*.2);
      x.lineTo(-r*.3,r*.2); x.closePath(); x.fill();
      x.fillStyle=d3; x.globalAlpha=A*.5;
      x.beginPath();
      x.moveTo(r*.14,r*.05); x.lineTo(r*.78,r*.2); x.lineTo(r*.3,r*.78); x.closePath(); x.fill();
      x.globalAlpha=A;
      break; }

    case "planet":{                      // a moon: lit limb and a shadow
      const g=x.createRadialGradient(-r*.36,-r*.38,r*.05,0,0,r*1.12);
      g.addColorStop(0,l3); g.addColorStop(.34,l1); g.addColorStop(.8,col); g.addColorStop(1,d2);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.globalAlpha=A*.42; x.fillStyle=d3;
      x.beginPath(); x.arc(r*.62,r*.42,r*1.02,0,TAU); x.fill();
      x.globalAlpha=A*.35; x.fillStyle=d2;
      x.beginPath(); x.ellipse(0,-r*.34,r*.72,r*.14,0,0,TAU); x.fill();
      x.beginPath(); x.ellipse(0,r*.30,r*.60,r*.11,0,0,TAU); x.fill();
      x.globalAlpha=A;
      break; }

    case "star":{                        // a sun: white core, corona
      const g=x.createRadialGradient(0,0,r*.03,0,0,r*1.0);
      g.addColorStop(0,"#fff"); g.addColorStop(.28,l3);
      g.addColorStop(.62,l1); g.addColorStop(1,col);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.globalAlpha=A*.55; x.strokeStyle=l3; x.lineWidth=r*.05; x.lineCap="round";
      for(let i=0;i<12;i++){
        const a=i/12*TAU+(b?b.wp*.3:0), o=(i%2?.62:.74);
        x.beginPath();
        x.moveTo(Math.cos(a)*r*o,Math.sin(a)*r*o);
        x.lineTo(Math.cos(a)*r*.86,Math.sin(a)*r*.86);
        x.stroke();
      }
      x.globalAlpha=A;
      break; }

    case "spiral":{                       // a galaxy: bar and arms
      const g=x.createRadialGradient(0,0,r*.04,0,0,r*1.0);
      g.addColorStop(0,l3); g.addColorStop(.3,l1); g.addColorStop(1,col);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.globalAlpha=A*.6; x.strokeStyle=l3;
      for(let k=0;k<2;k++){
        x.lineWidth=r*.16; x.lineCap="round";
        x.beginPath();
        for(let i=0;i<=16;i++){
          const t=i/16, a=k*Math.PI+t*2.5, rr=r*(.12+t*.72);
          const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
          i?x.lineTo(px,py):x.moveTo(px,py);
        }
        x.stroke();
      }
      x.globalAlpha=A; x.fillStyle="#fff";
      x.beginPath(); x.arc(0,0,r*.13,0,TAU); x.fill();
      break; }

    case "halo":{                         // the widest view: luminous shells
      const g=x.createRadialGradient(0,0,r*.04,0,0,r*1.05);
      g.addColorStop(0,"#fff"); g.addColorStop(.18,l3);
      g.addColorStop(.55,l1); g.addColorStop(1,col);
      x.fillStyle=g; x.beginPath(); x.arc(0,0,r*1.2,0,TAU); x.fill();
      x.globalAlpha=A*.4; x.strokeStyle=l3;
      for(let i=1;i<=3;i++){
        x.lineWidth=r*(.10-i*.018);
        x.beginPath(); x.arc(0,0,r*.24*i,0,TAU); x.stroke();
      }
      x.globalAlpha=A;
      break; }
  }
  x.restore();
}function drawTrail(x,widthMul,alpha){
  if(trail.length<2) return;
  const col=trailCol(), wid=(val("reach")*S+4)*widthMul;
  x.save();
  x.lineCap="round"; x.lineJoin="round";
  for(let pass=0;pass<2;pass++){
    for(let i=1;i<trail.length;i++){
      const a=trail[i-1], b=trail[i], k=1-b.t/.34;
      x.globalAlpha=k*k*alpha*(pass?.75:1);
      x.lineWidth=wid*k*(pass?.42:1);
      x.strokeStyle=pass?"#fff":col;
      x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke();
    }
  }
  x.restore();
}

function draw(){
  const sh=(G.opt.shake&&!REDUCED)?shake:0;
  const ox=sh?rnd(-sh,sh):0, oy=sh?rnd(-sh,sh):0;
  const pal=PAL();

  /* goo layer — the magnetised silhouette */
  xGoo.setTransform(GS,0,0,GS,0,0);
  xGoo.clearRect(0,0,W,H);
  xGoo.translate(ox,oy);
  if(zoom!==1){ const cy=(AR.y0+AR.y1)/2; xGoo.translate(W/2,cy); xGoo.scale(zoom,zoom); xGoo.translate(-W/2,-cy); }
  for(const b of balls){
    xGoo.save();
    ballXform(xGoo,b);
    const gc=b.kind==="golden"?"#FFC93C":(b.kind==="unstable"?"#FF9A3D":pal[b.tier]);
    // a floor on the goo radius: below it the blur spreads a small ball so
    // thin that the alpha threshold drops it, and it flickers
    const gr=Math.max(b.r,11*S);
    membrane(xGoo,b,gr*1.02);
    xGoo.fillStyle=RIM(gc); xGoo.fill();
    membrane(xGoo,b,gr*.90);
    xGoo.fillStyle=gc; xGoo.fill();
    xGoo.restore();
  }
  for(const p of parts){
    if(!p.goo) continue;
    const k=1-p.t/p.life;
    xGoo.beginPath(); xGoo.arc(p.x,p.y,p.r*(.4+k*.9),0,TAU);
    xGoo.fillStyle=p.col; xGoo.fill();
  }
  drawTrail(xGoo,.55,.9);

  /* fx layer — crisp agar bodies, labels, particles */
  xFx.setTransform(DPR,0,0,DPR,0,0);
  xFx.clearRect(0,0,W,H);
  xFx.translate(ox,oy);

  if(zoom!==1){ const cy=(AR.y0+AR.y1)/2; xFx.translate(W/2,cy); xFx.scale(zoom,zoom); xFx.translate(-W/2,-cy); }

  for(const b of balls){
    const r=b.r;
    const col=b.kind==="golden"?"#FFC93C":(b.kind==="unstable"?"#FFE9A8":pal[b.tier]);
    xFx.save();
    ballXform(xFx,b);
    membrane(xFx,b,r);
    xFx.fillStyle=col; xFx.fill();
    // the design stops short of the rim, leaving a flat band of the ball's own
    // colour — that band is what a neck is made of, so merges read seamlessly.
    // While a pair is locked the design dissolves so they finish as one shape.
    const lock=b.mate?clamp(b.fuseT/fuseTime(),0,1):0;
    const grow=b.skinFade===undefined?1:clamp((el-b.skinFade)/.34,0,1);
    const skinA=(1-lock)*grow;
    if(skinA>.01){
      xFx.save();
      xFx.beginPath(); xFx.arc(0,0,r*.87,0,TAU); xFx.clip();
      xFx.globalAlpha=skinA;
      scalePaint(xFx,r,col,b.rot*.5+b.wp*.10,b);
      xFx.restore();
    }
    membrane(xFx,b,r);
    xFx.lineWidth=Math.max(1.4,r*.075);
    xFx.globalAlpha=1-lock*.85;
    xFx.strokeStyle=RIM(col);
    xFx.stroke();
    xFx.globalAlpha=1;
    if(b.hit>.02){
      xFx.lineWidth=Math.max(1.4,r*.075);
      xFx.strokeStyle="rgba(255,255,255,"+(b.hit*.8)+")";
      xFx.stroke();
    }
    if(b.kind==="unstable"){
      const p=.5+.5*Math.sin(b.pulse*2.6);
      xFx.lineWidth=Math.max(1,r*.05);
      xFx.strokeStyle="rgba(255,120,60,"+(.35+p*.5)+")";
      for(let i=0;i<10;i++){
        const a=i/10*TAU+b.pulse*.2;
        xFx.beginPath();
        xFx.moveTo(Math.cos(a)*r*.78,Math.sin(a)*r*.78);
        xFx.lineTo(Math.cos(a)*r*(1.02+p*.07),Math.sin(a)*r*(1.02+p*.07));
        xFx.stroke();
      }
    }
    if(b.kind==="golden"){
      const p=.5+.5*Math.sin(b.pulse*1.7);
      xFx.lineWidth=Math.max(1.4,r*.06);
      xFx.strokeStyle="rgba(255,255,255,"+(.35+p*.45)+")";
      xFx.beginPath(); xFx.arc(0,0,r*.74,0,TAU); xFx.stroke();
    }
    xFx.restore();

    // toughness, read as pips around the rim — one segment per remaining hit
    if(b.maxHp>1 && r>10*S){
      const segs=Math.min(b.maxHp,14);
      const left=Math.ceil(b.hp/b.maxHp*segs);
      const arc=TAU/segs, gap=Math.min(arc*.34,.30);
      xFx.save();
      xFx.lineWidth=Math.max(1.6,r*.055); xFx.lineCap="butt";
      for(let i=0;i<segs;i++){
        const a0=-Math.PI/2+i*arc+gap/2, a1=a0+arc-gap;
        xFx.strokeStyle=i<left?RIM(col):(curScale().dark?"rgba(255,255,255,.14)":"rgba(15,23,32,.08)");
        xFx.beginPath(); xFx.arc(b.x,b.y,r*1.13,a0,a1); xFx.stroke();
      }
      xFx.restore();
    }

    // the fusion lock: a closing bracket while two of a colour pull together
    if(b.mate && b.id<b.mate.id){
      const m=b.mate, k=clamp(b.fuseT/fuseTime(),0,1);
      const mx=(b.x+m.x)/2, my=(b.y+m.y)/2;
      xFx.save();
      xFx.globalAlpha=.35+k*.65;
      xFx.strokeStyle=col; xFx.lineWidth=Math.max(2,r*.10); xFx.lineCap="round";
      xFx.beginPath(); xFx.arc(mx,my,Math.max(b.r,m.r)*(1.5-k*.72),0,TAU*k); xFx.stroke();
      xFx.restore();
    }
  }

  drawTrail(xFx,1,.55);

  xFx.save();
  for(const p of parts){
    if(p.goo) continue;
    const k=1-p.t/p.life;
    xFx.globalAlpha=k*.9;
    xFx.beginPath(); xFx.arc(p.x,p.y,p.r*k,0,TAU);
    xFx.fillStyle=p.col; xFx.fill();
  }
  for(const r of rings){
    const k=r.t/r.life;
    xFx.globalAlpha=(1-k)*.6;
    xFx.lineWidth=r.w*(1-k)+.4; xFx.strokeStyle=r.col;
    xFx.beginPath(); xFx.arc(r.x,r.y,r.r+(r.R-r.r)*easeOut(k),0,TAU); xFx.stroke();
  }
  xFx.restore();

  for(const p of pops){
    const k=p.t/p.life;
    xFx.save(); xFx.globalAlpha=(1-k)*(1-k);
    xFx.font="800 "+Math.round(15*S+7)+"px 'Archivo',system-ui,sans-serif";
    xFx.textAlign="center"; xFx.textBaseline="middle";
    xFx.lineWidth=4; xFx.lineJoin="round";
    xFx.strokeStyle=curScale().dark?"rgba(3,5,12,.85)":"rgba(255,255,255,.95)";
    xFx.strokeText(p.txt,p.x,p.y);
    xFx.fillStyle=p.col; xFx.fillText(p.txt,p.x,p.y);
    xFx.restore();
  }

  xFx.setTransform(DPR,0,0,DPR,0,0);

  // the ascent overlay: distance rings, and the name of where you are going
  if(zoomPhase){
    const cy=(AR.y0+AR.y1)/2, sc=curScale();
    xFx.save();
    xFx.beginPath(); xFx.rect(0,AR.y0,W,AR.y1-AR.y0); xFx.clip();
    const t=zoomPhase===1?zoomT/2.6:zoomT/1.35;
    for(let i=0;i<6;i++){
      const p=((t*1.35)+i/6)%1;
      xFx.globalAlpha=Math.sin(p*Math.PI)*(sc.dark?.30:.20);
      xFx.lineWidth=1+p*2.2;
      xFx.strokeStyle=sc.dark?"#9FB6DA":"#5C6979";
      xFx.beginPath(); xFx.arc(W/2,cy,26+p*Math.max(W,H)*0.85,0,TAU); xFx.stroke();
    }
    if(zoomFade>.01){
      xFx.globalAlpha=zoomFade;
      xFx.fillStyle=sc.bg[0]; xFx.fillRect(0,AR.y0,W,AR.y1-AR.y0);
    }
    xFx.restore();

    const show=zoomPhase===2 && zoomT<1.05;
    if(show){
      const a=Math.min(1,Math.min(zoomT/.22,(1.05-zoomT)/.3));
      xFx.save();
      xFx.globalAlpha=clamp(a,0,1);
      xFx.textAlign="center"; xFx.textBaseline="middle"; xFx.lineJoin="round";
      const halo=sc.dark?"rgba(3,5,12,.85)":"rgba(255,255,255,.92)";
      xFx.font="600 "+Math.round(9+2*S)+"px 'Chivo Mono',monospace";
      xFx.lineWidth=6; xFx.strokeStyle=halo;
      xFx.strokeText("ONE BALL IS NOW "+sc.ball.toUpperCase(),W/2,cy+Math.round(30+16*S));
      xFx.fillStyle=sc.dark?"#93A7C4":"#5C6979";
      xFx.fillText("ONE BALL IS NOW "+sc.ball.toUpperCase(),W/2,cy+Math.round(30+16*S));
      xFx.restore();
    }
  }

  if(flash>.01){
    xFx.save();
    xFx.fillStyle="rgba(255,196,64,"+(flash*.13)+")";
    xFx.fillRect(0,AR.y0,W,AR.y1-AR.y0); xFx.restore();
  }
  const fill=Math.max(balls.length/val("cap"), areaSum()/(arenaArea()*0.44));
  if(fill>.88){
    const g=xFx.createLinearGradient(0,AR.y1,0,AR.y1-90);
    g.addColorStop(0,"rgba(255,75,92,"+((fill-.88)/.12*.20)+")");
    g.addColorStop(1,"rgba(255,75,92,0)");
    xFx.fillStyle=g; xFx.fillRect(0,AR.y1-90,W,90);
  }
}

/* ---------------------------------------------------------------- loop */
let last=0,slowN=0;
function frame(t){
  requestAnimationFrame(frame);
  if(!last){ last=t; return; }
  let dt=(t-last)/1000; last=t;
  if(dt>.05) dt=.05;
  if(dt>.028){ if(++slowN>60&&G.opt.goo){ app.classList.add("lowfx"); slowN=-1e9; } }
  else if(slowN>0) slowN--;
  stepCele(dt); drawCele();
  const showArena = room==="arena" || camBusy>0;
  if(freeze>0){ freeze-=dt; if(showArena) draw(); drawWizards(); return; }
  step(dt);
  if(showArena) draw();
  drawWizards();
}

/* ---------------------------------------------------------------- UI */
let uiT=0;

function toast(msg){
  const t=$("toast"); t.textContent=msg;
  t.classList.add("on"); clearTimeout(t._h);
  t._h=setTimeout(()=>t.classList.remove("on"),1900);
}

function syncRails(){
  for(const p of POWERS){
    const s=pwState(p), b=$("pw-"+p.id); if(!b) continue;
    const cd=b.querySelector(".cd"), lab=b.querySelector(".l");
    b.classList.toggle("locked",!s.owned);
    b.classList.toggle("ready",s.owned&&s.cd<=0);
    b.classList.toggle("active",(p.id==="chain"&&timers.chain>0)||(p.id==="storm"&&timers.storm>0));
    if(!s.owned){ cd.style.display="none"; lab.textContent="◆"+p.cost; }
    else if(s.cd>0){ cd.style.display="grid"; cd.textContent=Math.ceil(s.cd); lab.textContent=p.nm; }
    else { cd.style.display="none"; lab.textContent=p.nm; }
  }
  for(const bo of BOOSTS){
    const s=G.boost[bo.id]||{cd:0}, b=$("bo-"+bo.id); if(!b) continue;
    const cd=b.querySelector(".cd");
    b.classList.toggle("ready",s.cd<=0);
    if(s.cd>0){ cd.style.display="grid"; cd.textContent=Math.ceil(s.cd); }
    else cd.style.display="none";
  }
  alertOrb("obj",!!(G.obj&&G.obj.some(o=>o.done)));
}

function buildCards(){
  const c=$("cards"); c.innerHTML="";
  if(G.tab==="strain"){ buildStrainCard(c); return; }
  for(const k of UPK){
    if(UP[k].tab!==G.tab) continue;
    const u=UP[k];
    const b=document.createElement("button");
    b.className="card"; b.dataset.k=k;
    b.innerHTML=
      '<span class="lv">'+(maxed(k)?"MAX":lv(k))+'</span>'+
      '<span class="g">'+u.g+'</span>'+
      '<span class="nm">'+u.nm+'</span>'+
      '<span class="ef">'+u.fmt(lv(k))+'</span>'+
      '<span class="ct"></span>';
    b.onclick=()=>buy(k);
    b.oncontextmenu=e=>{ e.preventDefault(); toast(u.nm+" — "+u.d); };
    c.appendChild(b);
  }
  syncCards();
}
function syncCards(){
  const c=$("cards");
  for(const b of c.children){
    const k=b.dataset.k;
    if(k){
      const u=UP[k], m=maxed(k), af=!m&&G.bio>=cost(k);
      b.classList.toggle("afford",af); b.classList.toggle("maxed",m);
      b.querySelector(".lv").textContent=m?"MAX":lv(k);
      b.querySelector(".ef").textContent=u.fmt(lv(k));
      b.querySelector(".ct").innerHTML=m?"MAXED":'<i></i>'+fmt(cost(k));
    }
  }
}
function buy(k){
  if(maxed(k)){ toast(UP[k].nm+" is fully developed"); return; }
  const c=cost(k);
  if(G.bio<c){ toast("Needs "+fmt(c)+" mass"); return; }
  G.bio-=c; G.up[k]++;
  tick(520+lv(k)*9,.1);
  haptic(9); save(); syncCards();
  if(k==="pulse"&&lv(k)===1) toast("Lysis online — it keeps hitting while you are away");
}
let PC=null;   // refs into the scale card, so it updates without rebuilding
/* A preview of what a ball looks like at another scale: swap FORM for the
   render and put it straight back, so the arena is never affected. */
function scaleBallPreview(idx, size){
  const sc = SCALES[Math.min(idx, SCALES.length - 1)];
  const c = document.createElement("canvas");
  const d = Math.min(devicePixelRatio || 1, 2);
  c.width = size * d; c.height = size * d;
  c.style.width = size + "px"; c.style.height = size + "px";
  const x = c.getContext("2d");
  x.scale(d, d);

  const keep = FORM;
  FORM = sc.form;
  try {
    const col = PAL()[sc.form.paint === "core" ? 5 : 3];
    const r = size * 0.36;
    const fake = { wob: 0.02, wp: 1.1, sq: 0, sqA: 0, rot: 0.5 };
    x.save();
    x.translate(size / 2, size / 2);
    if (FORM.oval !== 1) { x.rotate(0.4); x.scale(1, 1 / FORM.oval); }
    membrane(x, fake, r);
    x.fillStyle = col; x.fill();
    x.save();
    x.beginPath(); x.arc(0, 0, r * 0.87, 0, TAU); x.clip();
    scalePaint(x, r, col, -0.35, null);
    x.restore();
    membrane(x, fake, r);
    x.lineWidth = Math.max(1.2, r * 0.075);
    x.strokeStyle = sc.dark ? shade(col, 0.46) : shade(col, -0.34);
    x.stroke();
    x.restore();
  } finally { FORM = keep; }
  return c;
}

function buildStrainCard(c){
  const d=document.createElement("div");
  d.className="pcard";
  d.innerHTML=
    '<div class="prev"></div>'+
    '<div class="l">'+
      '<div class="k"></div>'+
      '<div class="t"></div>'+
      '<div class="m"></div>'+
      '<div class="pgw"><div class="pg"><i></i></div><span class="pgn"></span></div>'+
    '</div>';
  const btn=document.createElement("button");
  btn.className="pbtn";
  btn.onclick=()=>{
    if(canPrestige()) doPrestige();
    else toast("Bank "+fmt(nextScaleCost()-G.earned)+" more before the camera can pull back");
  };
  d.appendChild(btn); c.appendChild(d);
  PC={card:d, btn, prev:d.querySelector(".prev"),
      k:d.querySelector(".k"), t:d.querySelector(".t"), m:d.querySelector(".m"),
      bar:d.querySelector(".pg i"), num:d.querySelector(".pgn")};
  PC.shown=-1;
  syncStrainCard();
}
function syncStrainCard(){
  if(!PC||!PC.card.isConnected) return;
  const cur=curScale(), at=G.strain>=SCALES.length-1;
  const nxi=Math.min(G.strain+1,SCALES.length-1), nx=SCALES[nxi];
  const need=nextScaleCost(), ok=canPrestige();
  const pct=at?1:clamp(G.earned/need,0,1);

  if(PC.shown!==nxi){                     // only redraw the ball when it changes
    PC.shown=nxi;
    PC.prev.innerHTML="";
    PC.prev.appendChild(scaleBallPreview(at?G.strain:nxi,46));
  }
  PC.k.textContent=at?"Widest view":"Go up to";
  PC.t.textContent=at?cur.n:nx.n;
  PC.m.innerHTML=at
    ? "One ball is "+cur.ball+". Nothing further out."
    : "One ball becomes <b>"+nx.ball+"</b> · yield <b>×"+fmt(nx.mult)+"</b>";
  PC.bar.style.width=(pct*100).toFixed(1)+"%";
  PC.num.textContent=at?"complete":(fmt(Math.min(G.earned,need))+" / "+fmt(need));
  PC.card.classList.toggle("ready",ok);
  PC.btn.className="pbtn"+(ok?"":" no");
  PC.btn.innerHTML=at ? "Complete"
    : (ok ? "Go up<small>ready</small>" : "Go up<small>◉ "+fmt(need)+"</small>");
}

function row(o){
  const d=document.createElement("div");
  d.className="row"+(o.sel?" sel":"");
  d.innerHTML=
    (o.swatch?'<span class="ic" style="background:'+o.swatch+'"></span>':'<span class="ic">'+(o.ic||"◆")+'</span>')+
    '<div class="l"><div class="t">'+o.t+'</div>'+(o.s?'<div class="s">'+o.s+'</div>':'')+
    (o.bar!==undefined?'<div class="pbar"><i style="width:'+clamp(o.bar*100,0,100)+'%"></i></div>':'')+
    '</div>';
  if(o.v!==undefined){ const v=document.createElement("div"); v.className="v"; v.innerHTML=o.v; d.appendChild(v); }
  if(o.sw!==undefined){
    const s=document.createElement("span"); s.className="sw"+(o.sw?" on":"");
    d.appendChild(s); d.onclick=()=>{ o.fn(); sheetSync&&sheetSync(); };
  } else if(o.btn){
    const b=document.createElement("button");
    b.className="claim"+(o.btnOn?"":" no"); b.textContent=o.btn;
    b.onclick=e=>{ e.stopPropagation(); if(o.fn) o.fn.call(b,e); sheetSync&&sheetSync(); };
    d.appendChild(b);
  } else if(o.fn){ d.onclick=()=>{ o.fn(); sheetSync&&sheetSync(); }; }
  return d;
}

function sheetObjectives(){
  if(!G.obj) rollObjectives();
  openSheet("⚑","Objectives","Three at a time",b=>{
    for(const o of G.obj){
      b.appendChild(row({
        ic:o.done?"✓":"○", t:objLabel(o),
        s:fmt(Math.min(o.prog,o.goal))+" / "+fmt(o.goal),
        bar:o.prog/o.goal,
        btn:o.done?"Claim ◆"+o.sp:"…", btnOn:o.done,
        fn:function(){
          if(!o.done) return;
          G.spore+=o.sp; G.bio+=180*yieldMul()*(1+G.objDone*0.6);
          G.objDone++;
          G.obj.splice(G.obj.indexOf(o),1);
          const tier=Math.min(4,Math.floor(G.objDone/6));
          const used=G.obj.map(x=>x.k);
          const pool=OBJPOOL.filter(p=>!used.includes(p.k));
          const p=pool[(Math.random()*pool.length)|0]||OBJPOOL[0];
          G.obj.push({k:p.k,goal:p.goals[tier],prog:0,sp:p.sp+tier,done:false});
          celebrate(this, 46+o.sp*5, "#F5B301", document.querySelector("#sporeWrap .pip"));
          banner("+"+o.sp+" SPORES");
          chime(523,{vol:.16,len:.9,wet:.5});
          chime(659,{vol:.13,len:.85,delay:.07,wet:.5});
          chime(784,{vol:.11,len:.9,delay:.14,wet:.55});
          noiseHit(.4,{vol:.09,cut:6000,type:"highpass",to:.4,wet:.4});
          thud(78,{vol:.2,len:.26});
          haptic([14,26,14,40]);
          save();
        }
      }));
    }
    b.appendChild(lbl("Completed"));
    b.appendChild(row({ic:"✓",t:"Objectives cleared",s:"Goals scale every six",v:fmt(G.objDone)}));
  });
}
function sheetCustomise(){
  openSheet("◑","Your Balls","Palette and trail",b=>{
    b.appendChild(lbl("Palette"));
    const chips=document.createElement("div"); chips.className="chips";
    for(const p of PALETTES){
      const own=G.ownPal.includes(p.id), sel=G.pal===p.id;
      const d=document.createElement("button");
      d.className="chip"+(sel?" sel":"");
      d.innerHTML='<span class="sw4">'+p.c.map(c=>'<i style="background:'+c+'"></i>').join("")+'</span>'+
        p.nm+(own?"":" ◆"+p.cost);
      d.onclick=()=>{
        if(sel) return;
        if(own) G.pal=p.id;
        else if(G.spore>=p.cost){ G.spore-=p.cost; G.ownPal.push(p.id); G.pal=p.id; toast(p.nm+" unlocked"); }
        else { toast("Needs "+p.cost+" spores"); return; }
        save(); sheetSync&&sheetSync();
      };
      chips.appendChild(d);
    }
    b.appendChild(chips);

    b.appendChild(lbl("Cleave trail"));
    for(const t of TRAILS){
      const own=G.ownTrail.includes(t.id), sel=G.trail===t.id;
      b.appendChild(row({
        swatch:t.c, t:t.nm, s:t.d, sel,
        btn:sel?"Equipped":(own?"Equip":"◆"+t.cost), btnOn:!sel,
        fn:()=>{
          if(sel) return;
          if(own){ G.trail=t.id; save(); }
          else if(G.spore>=t.cost){ G.spore-=t.cost; G.ownTrail.push(t.id); G.trail=t.id; toast(t.nm+" unlocked"); save(); }
          else toast("Needs "+t.cost+" spores");
        }
      }));
    }

    b.appendChild(lbl("Powers"));
    for(const p of POWERS){
      const s=pwState(p);
      b.appendChild(row({ic:p.g,t:p.nm,s:p.d,
        btn:s.owned?"Owned":"◆"+p.cost, btnOn:!s.owned,
        fn:()=>{ if(!s.owned) firePower(p); }}));
    }
  });
}

function passiveRate(){ return throughput()*0.55; }
function passiveRateOld(){
  const rate=val("pulse"); if(rate<=0) return 0;
  const cls=bestBall();
  const hitsPerBreak=cls.taps*2.6/Math.max(1,val("depth"));
  return rate*val("spread")/Math.max(1,hitsPerBreak)*cls.mass*0.34*yieldMul();
}

/* ---------------------------------------------------------------- boot */
function tickUI(dt){
  uiT-=dt;
  if(uiT<=0){
    uiT=0.1;
    if(G.opt.sandbox){
      if(G.bio<1e9) G.bio=1e12;
      if(G.spore<60) G.spore=60;
      const nd=nextScaleCost(); if(G.earned<nd) G.earned=nd;
    }
    syncTop(); syncCards(); syncRails();
    if(room==="wiz"){ syncWizGrid(); syncWizPanel(); }
    else { const up=$("goUp"); if(up) up.classList.toggle("alert",(G.bio>=summonCost()&&wizCount()<SLOTS)||anyMerge()); }
    if(G.tab==="strain"){
      if(!PC||!PC.card.isConnected){ const cc=$("cards"); cc.innerHTML=""; buildStrainCard(cc); }
      else syncStrainCard();
    }
    const t=$("tabs").children[5]; if(t) t.classList.toggle("hot",canPrestige());

  }
}
let saveT=0;
(function uiLoop(){
  requestAnimationFrame(uiLoop);
  const t=now(), dt=(t-(uiLoop.l||t))/1000; uiLoop.l=t;
  if(!G) return;
  tickUI(dt);
  saveT+=dt; if(ready&&saveT>5){ saveT=0; save(); }
})();

function offlineCatchUp(){
  if(!G.t) return;
  const secs=clamp((Date.now()-G.t)/1000,0,8*3600);
  if(secs<90) return;
  const gain=passiveRate()*secs*val("dorm");
  if(gain<1) return;
  G.bio+=gain; G.earned+=gain; G.totalEarned+=gain;
  setTimeout(()=>sheetWelcome(secs,gain),700);
}
