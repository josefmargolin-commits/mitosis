<title>Mitosis</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,minimum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mitosis">
<meta name="description" content="Split balls for mass, let matching colours fuse, and send your wizards to work.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Syne:wght@700;800&family=Chivo+Mono:wght@300;400;500;600&display=swap">

<style>
:root{
  --ground:#FFFFFF;
  --shell:#E7ECF3;
  --surface:#F4F7FA;
  --panel:#FFFFFF;
  --ink:#0F1720;
  --ink-2:#5C6979;
  --ink-3:#95A2B2;
  --edge:rgba(15,23,32,.10);
  --edge-2:rgba(15,23,32,.20);
  --blue:#2F6BFF;
  --purple:#9B3DFF;
  --red:#FF3B57;
  --yellow:#E8A200;
  --mint:#0FB981;
  --orange:#FF6B2C;
  --shadow:0 1px 2px rgba(15,23,32,.05), 0 4px 14px rgba(15,23,32,.07);
  --shadow-up:0 -2px 10px rgba(15,23,32,.05), 0 -16px 44px rgba(15,23,32,.09);
  --dock-h:152px;
  --top-h:calc(58px + env(safe-area-inset-top));
  --sym:"Segoe UI Symbol","Apple Symbols";
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{
  height:100%;width:100%;overflow:hidden;position:fixed;
  overscroll-behavior:none;touch-action:none;-webkit-text-size-adjust:100%;
}
body{
  background:var(--shell);
  color:var(--ink);
  font-family:"Chivo Mono",ui-monospace,SFMono-Regular,Menlo,var(--sym),monospace;
  font-size:13px;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  touch-action:none;overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
.mono-n{font-variant-numeric:tabular-nums}

/* ============ frame ============ */
#app{
  position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:min(100vw,560px);overflow:hidden;
  background:var(--ground);
  box-shadow:0 0 60px rgba(15,23,32,.14);
}
#bg,#goo,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
.skin canvas,.bcard canvas{position:static;display:block}
#bg{z-index:1}
/* true metaballs: blur, then threshold ALPHA so touching balls fuse and
   pull a neck between them — the magnetised look */
#goo{z-index:2;filter:url(#gooF)}
#app.lowfx #goo{filter:none;opacity:.9}
#fx{z-index:3}
#burst{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:26;pointer-events:none}

/* ============ the camera ============ */
#world{
  position:absolute;left:0;right:0;top:0;height:200%;
  transform:translateY(var(--cam,-50%));
  will-change:transform;
}
#world.slide{transition:transform .38s cubic-bezier(.32,.72,.24,1)}
.room{position:absolute;left:0;right:0;height:50%;overflow:hidden}
#roomWiz{top:0}
#roomArena{top:50%}
/* ============ room arrows ============ */
#goUp,#goDown{
  position:absolute;left:50%;transform:translateX(-50%);z-index:6;
  display:flex;align-items:center;gap:6px;
  padding:7px 15px 7px 12px;border-radius:999px;
  background:var(--panel);border:1px solid var(--edge);box-shadow:var(--shadow);
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);
  white-space:nowrap;
}
#goUp{top:calc(var(--top-h) + 6px)}
#goDown{position:relative;left:auto;transform:none;margin:0 auto}
#goUp svg,#goDown svg{width:14px;height:14px;flex:none;stroke:var(--ink);fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#goUp:active{transform:translateX(-50%) scale(.94)}
#goDown:active{transform:scale(.94)}
#goUp .dot{
  position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;
  background:var(--red);border:2px solid var(--panel);display:none;
}
#goUp.alert .dot{display:block}

/* ============ wizard stage ============ */
#wizStage{
  position:absolute;left:0;right:0;
  top:calc(var(--top-h) + 2px);bottom:calc(178px + env(safe-area-inset-bottom));
  display:grid;place-items:center;padding:6px 10px;z-index:2;
}
#wgrid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:5px;
  width:100%;max-width:min(100%, calc((var(--cellH,84px) + 5px) * 4));
}
#wfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

/* ============ the tower ============ */
/* White, like the rest of the game. The castle is the brickwork the wizards
   stand on, drawn on the canvas so it can have real courses and crenels. */
#roomWiz{background:var(--wizBg,#FFFFFF)}
#roomWiz::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:16px;
  background:linear-gradient(180deg,rgba(16,22,37,0),rgba(16,22,37,.10));
  pointer-events:none;z-index:3;
}

/* the cell is mostly an invisible hit target — the brick does the work */
.wcell{
  aspect-ratio:1/1;
  border-radius:14px;border:0;background:transparent;
  position:relative;display:block;overflow:visible;padding:0;
  transition:transform .12s, box-shadow .16s;
}
.wcell.sel{box-shadow:inset 0 0 0 2.5px #E8B21B, 0 0 0 3px rgba(232,178,27,.22);background:rgba(232,178,27,.06)}
.wcell.tgt{box-shadow:inset 0 0 0 2.5px var(--mint), 0 0 0 3px rgba(15,185,129,.20);background:rgba(15,185,129,.07)}
.wcell.move{box-shadow:inset 0 0 0 2px rgba(16,22,37,.22)}
.wcell.held{box-shadow:inset 0 0 0 2px rgba(217,130,28,.42)}
.wcell.drag{box-shadow:inset 0 0 0 2px rgba(16,22,37,.16)}
.wcell.over{box-shadow:inset 0 0 0 3px var(--mint), 0 0 0 4px rgba(15,185,129,.24);background:rgba(15,185,129,.10)}
.wcell.overbad{box-shadow:inset 0 0 0 2.5px rgba(224,59,84,.5);background:rgba(224,59,84,.07)}
.wcell:active{transform:scale(.97)}

.wcell .plus{
  position:absolute;left:0;right:0;top:16%;height:46%;
  display:grid;place-items:center;
  font-size:21px;color:rgba(16,22,37,.20);line-height:1;pointer-events:none;
}
.wcell .pips{position:absolute;top:5px;left:6px;display:flex;gap:2.5px;pointer-events:none;z-index:2}
.wcell .pips i{width:4px;height:4px;border-radius:50%;display:block;background:currentColor;opacity:.28}
.wcell .pips i.on{opacity:1}
.wcell .lv{
  position:absolute;top:4px;right:5px;pointer-events:none;z-index:2;
  font-family:"Archivo",system-ui,sans-serif;
  font-size:8.5px;font-weight:800;line-height:1;padding:3.5px 7px;border-radius:99px;
  background:linear-gradient(180deg,#FFE79A 0%,#F5C53A 42%,#D99B0E 100%);
  color:#3B2A02;letter-spacing:.02em;
  border:1px solid #A9760A;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),
             inset 0 -1px 0 rgba(120,84,6,.35),
             0 1px 2px rgba(16,22,37,.28);
  font-variant-numeric:tabular-nums;
  text-shadow:0 1px 0 rgba(255,255,255,.45);
}

#wizChrome{
  position:absolute;left:0;right:0;bottom:0;
  height:calc(178px + env(safe-area-inset-bottom));
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;
  background:var(--panel);border-top:1px solid var(--edge);box-shadow:var(--shadow-up);
}
#arenaStrip{display:flex;align-items:center;gap:9px;font-size:9px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
#apBar{flex:1;height:5px;border-radius:99px;background:#E4E9F1;overflow:hidden}
#apBar i{display:block;height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,var(--mint),var(--yellow));transition:width .2s}
#apBar.hot i{background:linear-gradient(90deg,var(--orange),var(--red))}
#arenaStrip .v{font-variant-numeric:tabular-nums;color:var(--ink-2);letter-spacing:0}

#wizPanel{display:flex;flex-direction:column;gap:7px;height:104px;justify-content:center}
.wpRow{height:44px}
.wpHint{height:44px;display:flex;align-items:center;justify-content:center}
.wpSummon{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:11px 14px;border-radius:12px;
  background:linear-gradient(180deg,#F7D45B,#E0A81A);color:#3D2B02;
  border:1px solid rgba(122,90,8,.45);
  font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;
}
.wpSummon small{font-weight:600;font-size:11px;opacity:.8;letter-spacing:.02em;text-transform:none}
.wpSummon.no{background:var(--surface);color:var(--ink-3);border-color:var(--edge)}
.wpSummon:active{transform:scale(.985)}
.wpHint{font-size:10.5px;color:var(--ink-3);line-height:1.5;text-align:center;padding:2px 0 1px}
.wpEmpty{font-size:11px;color:var(--ink-3);text-align:center;line-height:1.6}
.wpRow{display:flex;align-items:center;gap:11px}
.wpRow .portrait{
  width:44px!important;height:44px!important;flex:none;display:block;
  position:static;border-radius:11px;background:var(--surface);
}
.wpRow .l{flex:1;min-width:0}
.wpRow .t{font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-size:14px;line-height:1.15}
.wpRow .s{font-size:9.5px;color:var(--ink-3);line-height:1.5;margin-top:1px}
.wpBtn{
  padding:10px 14px;border-radius:11px;background:var(--ink);color:#fff;flex:none;
  font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-size:11px;
  letter-spacing:.05em;text-transform:uppercase;text-align:center;line-height:1.25;
}
.wpBtn.no{background:var(--surface);color:var(--ink-3)}
.wpBtn small{display:block;font-size:9px;font-weight:500;opacity:.78;letter-spacing:.02em;text-transform:none}
.wpBtn:active{transform:scale(.96)}

/* ============ top bar ============ */
#top{
  position:absolute;z-index:8;top:0;left:0;right:0;height:var(--top-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:env(safe-area-inset-top) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));
  gap:10px;pointer-events:none;
  background:linear-gradient(180deg,var(--dishTop,#fff) 0%,var(--dishTop,#fff) 46%,transparent 100%);
  color:var(--topInk,#0F1720);
}
.cur{display:flex;align-items:center;gap:7px;pointer-events:auto}
.pip{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none;color:#fff}
.pip.bio{background:linear-gradient(140deg,#16C98D,#0A9E6C)}
.pip.spore{background:linear-gradient(140deg,var(--blue),var(--purple))}
.cur .n{font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
#sporeWrap .n{font-size:16px}
.pip svg{width:13px;height:13px;display:block;fill:#fff}
#sporeWrap .pip svg{width:12px;height:12px}

/* ============ rails ============ */
.rail{position:absolute;z-index:5;display:flex;flex-direction:column;gap:9px}
#railL{left:calc(10px + env(safe-area-inset-left));top:calc(var(--top-h) + 8px)}
#railR{right:calc(10px + env(safe-area-inset-right));top:calc(var(--top-h) + 8px);align-items:flex-end}
.orb{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:var(--panel);border:1px solid var(--edge);box-shadow:var(--shadow);
  transition:transform .12s cubic-bezier(.2,1.7,.4,1);
}
.orb:active{transform:scale(.9)}
.orb svg{width:19px;height:19px;stroke:var(--ink-2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.orb .dot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;
  background:var(--red);border:2px solid #fff;display:none}
.orb.alert .dot{display:block}
.pw{
  width:44px;height:44px;border-radius:14px;position:relative;overflow:hidden;
  background:var(--panel);border:1px solid var(--edge);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:transform .12s cubic-bezier(.2,1.7,.4,1);
}
.pw:active{transform:scale(.9)}
.pw .g{font-size:15px;line-height:1;color:var(--ink)}
.pw .l{font-size:7px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.pw .cd{position:absolute;inset:0;background:rgba(244,247,250,.88);display:grid;place-items:center;
  font-size:10px;color:var(--ink-2)}
.pw.ready{border-color:rgba(232,162,0,.55);box-shadow:0 0 0 2px rgba(232,162,0,.12),var(--shadow)}
.pw.ready .l{color:var(--yellow)}
.pw.active{border-color:var(--mint);box-shadow:0 0 0 2px rgba(15,185,129,.18),var(--shadow)}
.pw.locked{opacity:.7}
.pw.locked .l{color:var(--yellow);font-size:8px;letter-spacing:.02em}
.pw.locked .g{opacity:.4}

/* ============ hud text ============ */
#combo{
  position:absolute;z-index:5;left:50%;top:calc(var(--top-h) + 62px);
  transform:translateX(-50%) scale(.8);
  font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:27px;letter-spacing:-.03em;
  color:var(--yellow);opacity:0;pointer-events:none;
  font-variant-numeric:tabular-nums;
  text-shadow:0 2px 10px rgba(255,255,255,.9);
}
#combo.on{opacity:1;transform:translateX(-50%) scale(1);
  transition:transform .1s cubic-bezier(.2,1.7,.4,1),opacity .1s}
#banner{
  position:absolute;z-index:6;left:50%;top:38%;transform:translate(-50%,-50%);
  font-family:"Syne",var(--sym),sans-serif;font-weight:800;font-size:clamp(26px,8vw,44px);
  opacity:0;pointer-events:none;white-space:nowrap;text-align:center;color:var(--topInk,#0F1720);
  text-shadow:0 3px 22px rgba(255,255,255,.95);
}
#toast{
  position:absolute;z-index:9;left:50%;bottom:calc(var(--chrome-b,152px) + 14px);
  transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:999px;font-size:11px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ dock ============ */
#dockHandle{
  position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  width:60px;height:30px;border-radius:15px 15px 0 0;
  background:var(--panel);border:1px solid var(--edge);border-bottom:0;
  box-shadow:0 -3px 10px rgba(16,22,37,.07);
  display:grid;place-items:center;z-index:2;padding-bottom:2px;
}
#dockHandle svg{width:18px;height:18px;stroke:var(--ink-2);fill:none;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .26s cubic-bezier(.3,.8,.3,1)}
#dock.min #dockHandle svg{transform:rotate(180deg)}
#dockHandle:active{transform:translateX(-50%) scale(.94)}
#dock{
  position:absolute;z-index:5;left:0;right:0;bottom:0;
  height:calc(var(--dock-h) + env(safe-area-inset-bottom));
  transition:height .26s cubic-bezier(.3,.8,.3,1);
  background:var(--panel);border-top:1px solid var(--edge);box-shadow:var(--shadow-up);
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);
}
#tabs{display:flex;height:38px;flex:none;border-bottom:1px solid var(--edge);
  overflow-x:auto;scrollbar-width:none;transition:opacity .16s}
#dock.min{height:calc(16px + env(safe-area-inset-bottom))}
#dock.min #tabs,#dock.min #cards{opacity:0;visibility:hidden;pointer-events:none}
#cards{transition:opacity .16s}
#tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 auto;min-width:0;padding:0 8px;
  display:flex;align-items:center;justify-content:center;gap:4px;
  font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap;
}
.tab .g{font-size:11px;opacity:.7}
.tab.on{color:var(--ink);border-bottom-color:var(--accent,var(--blue))}
.tab.on .g{opacity:1}
.tab.hot{color:var(--yellow)}
#cards{flex:1;display:flex;gap:8px;padding:9px 10px;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;align-items:stretch}
#cards::-webkit-scrollbar{display:none}
.card{
  flex:0 0 84px;border-radius:13px;padding:8px 6px 7px;
  background:var(--panel);border:1px solid var(--edge);box-shadow:0 1px 2px rgba(15,23,32,.05);
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;
  transition:transform .1s,border-color .15s,background .15s;text-align:center;
}
.card:active{transform:scale(.95)}
.card.afford{border-color:rgba(232,162,0,.6);background:#FFFBF0}
.card.maxed{border-color:rgba(15,185,129,.5);background:#F0FCF8}
.card .lv{position:absolute;top:5px;right:6px;font-size:8px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.card .g{font-size:17px;line-height:1.1;margin-top:2px;color:var(--ink)}
.card .nm{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);line-height:1.2}
.card .ef{font-size:9px;color:var(--ink);line-height:1.2;font-variant-numeric:tabular-nums}
.card .ct{margin-top:auto;font-size:10px;font-weight:500;color:var(--ink-3);
  font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px}
.card.afford .ct{color:var(--yellow)}
.card.maxed .ct{color:var(--mint)}
.card .ct i{width:7px;height:7px;border-radius:50%;background:#16C98D;display:block;font-style:normal}

/* ball-shop cards */
.bcard{flex:0 0 96px}
.bcard .orbimg{width:30px!important;height:30px!important;margin:3px auto 1px;align-self:center;flex:none;display:block}
.bcard .taps{position:absolute;top:5px;left:6px;font-size:8px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bcard.dropping{border-color:rgba(15,185,129,.6);background:#F0FCF8}
.bcard.locked .orbimg{filter:grayscale(1) opacity(.4)}

/* prestige card */
.pcard{
  flex:1 1 auto;border-radius:15px;padding:11px 13px;
  background:linear-gradient(125deg,#F4F6FF 0%,#FBF3FF 55%,#FFF6F2 100%);
  border:1px solid rgba(47,107,255,.22);
  box-shadow:0 1px 2px rgba(16,22,37,.05);
  display:flex;align-items:center;gap:12px;text-align:left;min-width:0;
  transition:box-shadow .25s,border-color .25s;
}
.pcard.ready{
  border-color:rgba(232,178,27,.55);
  box-shadow:0 0 0 2px rgba(232,178,27,.16), 0 2px 10px rgba(232,178,27,.16);
  animation:readyGlow 2.2s ease-in-out infinite;
}
@keyframes readyGlow{50%{box-shadow:0 0 0 4px rgba(232,178,27,.10), 0 2px 14px rgba(232,178,27,.24)}}
.pcard .prev{
  flex:none;width:46px;height:46px;border-radius:13px;
  display:grid;place-items:center;
  background:rgba(255,255,255,.72);border:1px solid rgba(16,22,37,.07);
}
.pcard .prev canvas{position:static;display:block}
.pcard .l{flex:1;min-width:0}
.pcard .k{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.pcard .t{font-family:"Archivo",var(--sym),sans-serif;font-weight:800;font-size:20px;
  line-height:1.1;letter-spacing:-.02em;margin-top:1px}
.pcard .m{font-size:9.5px;color:var(--ink-2);line-height:1.45;margin-top:2px}
.pcard .m b{color:var(--orange);font-weight:400}
.pcard .pgw{display:flex;align-items:center;gap:8px;margin-top:6px}
.pcard .pg{flex:1;height:5px;border-radius:99px;background:rgba(16,22,37,.09);overflow:hidden;min-width:0}
.pcard .pg i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .3s}
.pcard.ready .pg i{background:linear-gradient(90deg,#F5C53A,#E8901B)}
.pcard .pgn{font-size:8.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
  white-space:nowrap;letter-spacing:.02em}
.pbtn{flex:none;padding:9px 16px;border-radius:11px;background:var(--ink);color:#fff;
  font-family:"Archivo",var(--sym),sans-serif;font-weight:800;font-size:12px;

.pbtn.no{background:var(--surface);color:var(--ink-3)}

/* ============ sheet ============ */
#scrim{position:absolute;inset:0;z-index:20;background:rgba(15,23,32,.34);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .22s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:absolute;z-index:21;left:0;right:0;bottom:0;max-height:88%;
  display:flex;flex-direction:column;background:var(--panel);
  border-radius:22px 22px 0 0;box-shadow:var(--shadow-up);
  transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.9,.25,1);
  padding-bottom:env(safe-area-inset-bottom);
}
#sheet.on{transform:translateY(0)}
#sheetHead{display:flex;align-items:center;gap:11px;padding:16px 16px 12px;flex:none;
  border-bottom:1px solid var(--edge)}
#sheetHead .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:var(--surface);font-size:15px;flex:none}
#sheetHead .tx{flex:1;min-width:0}
#sheetTitle{font-family:"Syne",var(--sym),sans-serif;font-weight:800;font-size:19px;line-height:1.1}
#sheetSub{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
#sheetClose{width:30px;height:30px;border-radius:50%;background:var(--surface);
  display:grid;place-items:center;flex:none;font-size:14px;color:var(--ink-2)}
#sheetBody::-webkit-scrollbar{width:4px}
#sheetBody::-webkit-scrollbar-thumb{background:rgba(15,23,32,.16);border-radius:9px}
#sheetBody::-webkit-scrollbar-track{background:transparent}
#sheetBody{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(15,23,32,.16) transparent;
  padding:14px 16px 22px;display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch}

#sheetBody > *{flex:0 0 auto}
.row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:13px;
  background:var(--panel);border:1px solid var(--edge);box-shadow:0 1px 2px rgba(15,23,32,.04)}
.row .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;
  background:var(--surface);flex:none}
.row .l{flex:1;min-width:0}
.row .t{font-size:12px;line-height:1.35}
.row .s{font-size:9.5px;color:var(--ink-3);line-height:1.45;margin-top:2px}
.row .v{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;flex:none}
.sw{width:42px;height:24px;border-radius:99px;background:#DCE3EC;position:relative;
  flex:none;transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(15,23,32,.25);transition:transform .18s}
.sw.on{background:#16C98D}
.sw.on::after{transform:translateX(18px)}
.pbar{height:5px;border-radius:99px;background:#E6EBF2;overflow:hidden;margin-top:7px}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .25s}
.claim{padding:8px 13px;border-radius:9px;background:#F5B301;color:#231A00;
  font-family:"Syne",var(--sym),sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;flex:none}
.claim.no{background:var(--surface);color:var(--ink-3)}
.secLbl{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin:10px 2px 1px}
.row.sel{border-color:var(--mint);background:#F0FCF8}
.dangerBtn{padding:12px;border-radius:12px;border:1px solid rgba(255,59,87,.4);color:var(--red);
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:center;background:#FFF5F6}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:7px 11px;border-radius:9px;border:1px solid var(--edge);background:var(--panel);
  font-size:10px;letter-spacing:.06em;display:flex;align-items:center;gap:7px;
}
.chip.sel{border-color:var(--mint);background:#F0FCF8}
.chip .sw4{display:flex;gap:2px}
.chip .sw4 i{width:8px;height:8px;border-radius:50%;display:block}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.skin{
  border-radius:12px;border:1px solid var(--edge);background:var(--panel);
  padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:5px;
}
.skin.sel{border-color:var(--mint);background:#F0FCF8}
.skin canvas{width:44px;height:44px;display:block}
.skin .n{font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.skin .c{font-size:9px;color:var(--yellow);font-variant-numeric:tabular-nums}
.skin.own .c{color:var(--ink-3)}

/* ============ intro ============ */
#intro{
  position:absolute;inset:0;z-index:30;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;
  justify-content:safe center;   /* never push Begin off the bottom */
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  gap:22px;padding:30px;text-align:center;
  background:radial-gradient(115% 80% at 50% 46%,rgba(255,255,255,.82),rgba(255,255,255,.96) 55%,#fff);
  transition:opacity .4s;
}
#intro.hide{opacity:0}
#intro .eb{font-size:9px;letter-spacing:.36em;text-transform:uppercase;color:var(--ink-3)}
#intro h1{
  font-family:"Syne",var(--sym),sans-serif;font-weight:800;
  font-size:clamp(52px,16vw,86px);line-height:.85;letter-spacing:-.04em;
  background:linear-gradient(96deg,var(--blue),var(--purple) 38%,var(--red) 68%,#F5B301);

}
#intro p{max-width:27ch;font-size:12px;line-height:1.7;color:var(--ink-2)}
#intro p b{color:var(--ink);font-weight:400}
#begin{
  pointer-events:auto;padding:15px 44px;border-radius:999px;background:var(--ink);color:#fff;
  font-family:"Syne",var(--sym),sans-serif;font-weight:700;font-size:16px;letter-spacing:.07em;
  text-transform:uppercase;box-shadow:var(--shadow);
  transition:transform .12s cubic-bezier(.2,1.7,.4,1);
}
#begin:active{transform:scale(.95)}
#introHint{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
#intro > *{flex:0 0 auto}
/* short windows: landscape phones, small browser panes */
@media (max-height:600px){
  #intro{gap:12px;padding:18px 24px}
  #intro h1{font-size:clamp(34px,12vw,54px)}
  #intro p{font-size:11px;line-height:1.55;max-width:34ch}
  #begin{padding:12px 34px;font-size:14px}
}
@media (max-height:420px){
  #intro .eb,#introHint{display:none}
  #intro{gap:9px}
  #intro h1{font-size:clamp(26px,10vw,38px)}
  #intro p{font-size:10.5px;line-height:1.45}
}

@media (prefers-reduced-motion:reduce){ *{animation:none!important} }
@media (max-height:680px){ :root{--dock-h:140px} .card{flex-basis:78px} }
/* short windows still need a playable dish, so the dock gives ground */
@media (max-height:540px){

  #tabs{height:32px}
  .tab{font-size:8px;padding:0 6px}

  #wizChrome{padding:6px 12px calc(6px + env(safe-area-inset-bottom));gap:6px}
  #wizPanel{min-height:62px}
}

<script>
"use strict";
/* =====================================================================
   MITOSIS — tap the balls until there is nothing left but mass
   ===================================================================== */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const now=()=>performance.now();
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------------------------------------------------------- data */
// Radii fall faster than 1/sqrt(2), so breaking a ball all the way down
// REMOVES area from the dish. Splitting is how you make room.
/* The size ladder runs both ways. The dropper releases at DROPT; touching a
   ball splits it DOWN the ladder, while two balls of the same size that stay
   in contact fuse UP it — 2048, played against your own splitting. */
const TIER=[
  {r:88,spd:16,hp:3.4},   // 0 — three fusions above the drop
  {r:72,spd:20,hp:2.3},
  {r:58,spd:24,hp:1.6},
  {r:46,spd:30,hp:1.0},   // 3 — the drop size
  {r:31,spd:40,hp:.62},
  {r:20,spd:52,hp:.40},
  {r:13,spd:66,hp:.26},
  {r:9, spd:76,hp:.20},   // 7 — the smallest, where wizards start
];
const LAST=TIER.length-1;
const DROPT=4;
const NOTE=[92,118,150,190,240,300,380,470];
const fuseTime=()=>val("fusion");

/* the balls you buy. taps = hits to break the whole ball at its top size;
   lower tiers need proportionally fewer. mass = total yield of the lineage. */
/* The producers. A rank is cls-shaped on purpose — taps / mass / size are
   exactly what makeBall() already reads, so a wizard drops straight into the
   slot the old ball classes occupied. Rank r spawns ball tier 5-r, so tier 6
   (the rung that cashes out) and tier 0 (the top) are always earned by hand. */
const WRANK=[
  {nm:"Apprentice", tier:7, taps:1, mass:16,   size:1.00, delay:1.7, upBase:90},
  {nm:"Adept",      tier:6, taps:1, mass:58,   size:1.05, delay:2.4, upBase:630},
  {nm:"Magus",      tier:5, taps:2, mass:208,  size:1.10, delay:3.2, upBase:4410},
  {nm:"Archon",     tier:4, taps:3, mass:750,  size:1.15, delay:4.3, upBase:30870},
  {nm:"Sovereign",  tier:3, taps:4, mass:2700, size:1.20, delay:5.7, upBase:216090},
  {nm:"Ascendant",  tier:2, taps:6, mass:9700, size:1.25, delay:7.6, upBase:1512630},
];
WRANK.forEach((w,i)=>w.i=i);
const SLOTS=16, WCOLS=4, TOPRANK=WRANK.length-1;

/* one colour per rung, biggest first — so "two of the same colour" is
   something you read instantly across the dish */
const PALETTES=[
  {id:"classic",nm:"Classic",cost:0, c:["#FFE24B","#FF8F3D","#FF4B6E","#B44BFF","#3B6FFF","#2ED8E8","#4BE36E","#B6F03C"]},
  {id:"neon",   nm:"Neon",   cost:8, c:["#FFF23D","#B6FF3D","#3DFF8A","#3DFFE8","#3DC2FF","#7A6BFF","#FF3DCB","#FF7ADF"]},
  {id:"toxic",  nm:"Toxic",  cost:12,c:["#EFFF3D","#B6FF00","#6FFF1F","#2AFF7A","#00E8B4","#00B6D8","#0A82C4","#5AA8E8"]},
  {id:"ice",    nm:"Ice",    cost:16,c:["#FFFFFF","#DCEBFF","#B4D4FF","#8FBAFF","#6D9CF5","#5A7FD8","#4B63B0","#3E5296"]},
  {id:"sunset", nm:"Sunset", cost:22,c:["#FFE85C","#FFB03D","#FF7A3D","#FF4B6E","#E03D8F","#B03DB8","#7A3DCC","#5C3DB8"]},
  {id:"mono",   nm:"Mono",   cost:30,c:["#FFFFFF","#DDE4EE","#B9C4D4","#94A1B4","#717E92","#525E71","#3A4454","#2A323E"]},
];
const SKINS=[
  {id:"solid",  nm:"Sphere",  cost:0},
  {id:"yolk",   nm:"Yolk",    cost:6},
  {id:"eclipse",nm:"Eclipse", cost:10},
  {id:"bloom",  nm:"Bloom",   cost:14},
  {id:"orbit",  nm:"Orbit",   cost:19},
  {id:"prism",  nm:"Prism",   cost:24},
  {id:"circuit",nm:"Circuit", cost:30},
  {id:"vortex", nm:"Vortex",  cost:38},
];
const TRAILS=[
  {id:"gold",  nm:"Golden Path",  c:"#FFD23F", cost:0,  d:"The default cleave."},
  {id:"plasma",nm:"Plasma Wave",  c:"#FF3DCB", cost:6,  d:"Swirling magenta energy."},
  {id:"cryo",  nm:"Ice Crystal",  c:"#7FE8FF", cost:10, d:"Frozen particles in the wake."},
  {id:"arc",   nm:"Lightning Arc",c:"#B69BFF", cost:16, d:"Electric sparks that crackle."},
  {id:"ember", nm:"Fire Trail",   c:"#FF7A3D", cost:24, d:"Blazing fire behind each cut."},
  {id:"chloro",nm:"Chlorophyll",  c:"#4BE3B0", cost:34, d:"A living green filament."},
];

/* Prestige is a zoom-out. Every ascent pulls the camera back an order of
   magnitude or several, and the same game is playing at the next scale up. */
/* Prestige is a zoom-out. Every ascent pulls the camera back an order of
   magnitude or several, and the same game is playing at the next scale up —
   with matter that looks like it belongs there. */
/* Prestige is a zoom-out. Every ascent pulls the camera back, and the whole
   world changes with it: the matter looks different, and so does the space it
   sits in — from a brightly lit slide, out through rock and sky, into the
   dark. */
/* Six scales, and the ascent has to read as one continuous pull-back: every
   ball in the dish collapses into a single one, and that single ball is what
   you are looking at when the camera settles at the next scale up. */
const SCALES=[
  {n:"Atomic",    ball:"a proton",       mult:1,      spd:1.00,
   form:{lobes:4, rough:.000, oval:1.00, paint:"core"},
   bg:["#FFFFFF","#F1F5FE"], stars:0,   neb:false, dark:false},
  {n:"Cellular",  ball:"a living cell",  mult:8,      spd:1.14,
   form:{lobes:3, rough:.055, oval:1.22, paint:"nucleus"},
   bg:["#FFFCFB","#F5E8EE"], stars:0,   neb:false, dark:false},
  {n:"Planetary", ball:"a moon",         mult:70,     spd:1.30,
   form:{lobes:2, rough:.008, oval:1.02, paint:"planet"},
   bg:["#CFE0F4","#7B99C2"], stars:0,   neb:false, dark:false},
  {n:"Stellar",   ball:"a star",         mult:800,    spd:1.46,
   form:{lobes:6, rough:.030, oval:1.00, paint:"star"},
   bg:["#1A2236","#080C16"], stars:110, neb:false, dark:true},
  {n:"Galactic",  ball:"a galaxy",       mult:12000,  spd:1.62,
   form:{lobes:3, rough:.030, oval:1.42, paint:"spiral"},
   bg:["#0A0E1B","#02040A"], stars:260, neb:false, dark:true},
  {n:"Cosmic",    ball:"a supercluster", mult:250000, spd:1.80,
   form:{lobes:4, rough:.020, oval:1.30, paint:"halo"},
   bg:["#06040F","#010103"], stars:360, neb:true,  dark:true},
];
let FORM=SCALES[0].form;
const RIM=c=>curScale().dark?shade(c,.46):shade(c,-.34);
const ROMAN=["I","II","III","IV","V","VI"];

const TABS=[
  {id:"touch",  lbl:"Touch",   g:"✥", accent:"#B44BFF"},
  {id:"arena",  lbl:"Arena",   g:"⬢", accent:"#3B6FFF"},
  {id:"lysis",  lbl:"Lysis",   g:"◍", accent:"#4BE3B0"},
  {id:"field",  lbl:"Field",   g:"◆", accent:"#FFD23F"},
  {id:"strain", lbl:"Scale",   g:"⌾", accent:"#FF7A3D"},

const UP={
  force:  {tab:"touch",g:"✥",nm:"Force", base:26, gr:1.42, max:24,
           d:"Damage every touch deals. Tougher balls need more of it.",
           v:l=>1+Math.floor(l/4), fmt:l=>(1+Math.floor(l/4))+" dmg"},
  reach:  {tab:"touch",g:"◜",nm:"Reach", base:14, gr:1.16, max:60,
           d:"Radius of the swipe cleave.",
           v:l=>11+l*2.1, fmt:l=>Math.round(11+l*2.1)+"px"},
  cascade:{tab:"touch",g:"⁘",nm:"Cascade",base:90,gr:1.24, max:50,
           d:"Chance a split immediately splits its halves too. Chains all the way down.",
           v:l=>Math.min(.92,l*.02), fmt:l=>(Math.min(92,l*2)).toFixed(0)+"%"},
  rupture:{tab:"touch",g:"✷",nm:"Rupture",base:60,gr:1.21, max:45,
           d:"Chance a touch bursts the whole ball at once, whatever its size.",
           v:l=>Math.min(.4,l*.009), fmt:l=>(Math.min(40,l*.9)).toFixed(1)+"%"},

  cap:    {tab:"arena",g:"⬢",nm:"Capacity",base:46,gr:1.20,max:46,

           v:l=>16+l*3, fmt:l=>(16+l*3)+" max"},
  purity: {tab:"arena",g:"✦",nm:"Purity",base:130,gr:1.24, max:40,
           d:"Chance a released ball is golden — worth twenty-five times over.",
           v:l=>Math.min(.14,l*.0035), fmt:l=>(Math.min(14,l*.35)).toFixed(1)+"%"},

  pulse:  {tab:"lysis",g:"◍",nm:"Pulse", base:70, gr:1.175,max:80,
           d:"Autonomous hits per second. Keeps working while you are away.",
           v:l=>l*0.16, fmt:l=>(l*0.16).toFixed(2)+"/s"},
  depth:  {tab:"lysis",g:"◎",nm:"Depth", base:300,gr:1.30, max:40,
           d:"Damage each autonomous hit deals.",
           v:l=>1+Math.floor(l/8), fmt:l=>(1+Math.floor(l/8))+" dmg"},
  spread: {tab:"lysis",g:"⁙",nm:"Spread",base:480,gr:1.32, max:36,
           d:"Balls caught per pulse.",
           v:l=>1+Math.floor(l/6), fmt:l=>(1+Math.floor(l/6))+" balls"},
  dorm:   {tab:"lysis",g:"☾",nm:"Dormancy",base:560,gr:1.36,max:20,
           d:"Share of lysis yield banked while closed. Caps at eight hours.",
           v:l=>Math.min(1,.2+l*.04), fmt:l=>Math.round(Math.min(1,.2+l*.04)*100)+"%"},

  fusion: {tab:"field",g:"⊕",nm:"Bond",  base:60, gr:1.20, max:40,
           d:"How long two balls of the same colour must touch before they fuse.",
           v:l=>Math.max(0.12,0.42*Math.pow(0.955,l)), fmt:l=>Math.max(0.12,0.42*Math.pow(0.955,l)).toFixed(2)+"s"},
  attract:{tab:"field",g:"◑",nm:"Attraction",base:75,gr:1.19, max:44,
           d:"How far balls of the same colour reach for each other.",

/* The sky is just a gradient, and stars once it gets dark. No fussy texture —
   the ball forms carry the identity of a scale, the sky only has to say how

function srnd(seed){ let x=seed>>>0; return ()=>{ x=(x*1664525+1013904223)>>>0; return x/4294967296; }; }
function paintSky(x,sc,alpha){
  x.save();
  if(alpha!==undefined) x.globalAlpha=alpha;
  const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,sc.bg[0]); g.addColorStop(1,sc.bg[1]);
  x.fillStyle=g; x.fillRect(0,0,W,H);
  const R=srnd(4517+SCALES.indexOf(sc)*7919);
  if(sc.neb){
    for(let i=0;i<6;i++){
      const px=R()*W, py=R()*H, r=90+R()*200;
      const hue=["124,96,224","220,96,168","96,152,224"][(R()*3)|0];
      const ng=x.createRadialGradient(px,py,0,px,py,r);
      ng.addColorStop(0,"rgba("+hue+",.20)"); ng.addColorStop(1,"rgba("+hue+",0)");
      x.fillStyle=ng; x.beginPath(); x.arc(px,py,r,0,TAU); x.fill();
    }
  }
  for(let i=0;i<sc.stars;i++){
    const b=R();
    x.globalAlpha=(alpha===undefined?1:alpha)*(.18+b*.8);
    x.fillStyle=b>.92?"#DCE7FF":"#FFFFFF";
    const sz=b>.965?2.2:1.15;
    x.fillRect(R()*W,R()*H,sz,sz);
  }
  x.restore();
}

/* ---------------------------------------------------------------- audio */
/* ---------------------------------------------------------------- audio
   Every sound is layered: a transient click so it lands, a pitched body
   that sweeps UPWARD (a falling pitch reads as deflating, a rising one
   reads as a pop), and a short tail into a shared plate. Everything is
   panned to where it happened and rides a limiter, so a fifty-ball
   cascade stays punchy instead of turning to mush.                     */
const Sn={ctx:null,master:null,verb:null,noise:null,budget:26,dead:false,pan:true};
function makeIR(c,dur,decay){
  const n=Math.max(1,Math.floor(c.sampleRate*dur));
  const b=c.createBuffer(2,n,c.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch);
    for(let i=0;i<n;i++){
      const t=i/n;
      d[i]=(Math.random()*2-1)*Math.pow(1-t,decay)*(1-t*0.2);
    }
  }
  return b;
}
function actx(){
  if(!Sn.ctx){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    const c=Sn.ctx=new AC();

    const comp=c.createDynamicsCompressor();
    comp.threshold.value=-13; comp.knee.value=24; comp.ratio.value=8;
    comp.attack.value=0.003; comp.release.value=0.16;
    comp.connect(c.destination);

    Sn.master=c.createGain(); Sn.master.gain.value=0.5;
    Sn.master.connect(comp);

    try{
      const cv=c.createConvolver(); cv.buffer=makeIR(c,0.9,3.4);
      const vg=c.createGain(); vg.gain.value=0.85;
      const damp=c.createBiquadFilter(); damp.type="highpass"; damp.frequency.value=380;
      cv.connect(damp); damp.connect(vg); vg.connect(comp);
      Sn.verb=cv;
    }catch(e){ Sn.verb=null; }

    const len=Math.floor(c.sampleRate*0.5), b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    Sn.noise=b;
    Sn.pan=typeof c.createStereoPanner==="function";
  }
  if(Sn.ctx.state==="suspended") Sn.ctx.resume();
  return Sn.ctx;
}
/* an output bus for one sound: panned, with its own send into the plate */
function bus(c,pan,wet){
  const out=c.createGain(); out.gain.value=1;
  let tail=out;
  if(Sn.pan){
    const p=c.createStereoPanner();
    p.pan.value=clamp(pan||0,-.85,.85);
    out.connect(p); tail=p;
  }
  tail.connect(Sn.master);
  if(Sn.verb&&wet>0){
    const s=c.createGain(); s.gain.value=wet;
    tail.connect(s); s.connect(Sn.verb);
  }
  return out;
}
const panAt=x=>W?clamp((x/W)*2-1,-1,1)*0.8:0;
function audioOK(){ return G.opt.sound&&!Sn.dead&&Sn.budget>0; }

/* the core pop — a bubble surfacing */
function pop(f,o){ try{
  o=o||{}; if(!audioOK()) return;
  const c=actx(); if(!c) return;
  const t=c.currentTime+(o.delay||0), vol=o.vol===undefined?.24:o.vol;
  const out=bus(c,o.pan,o.wet===undefined?.13:o.wet);

  const o1=c.createOscillator(); o1.type="sine";
  o1.frequency.setValueAtTime(f*.40,t);
  o1.frequency.exponentialRampToValueAtTime(f*1.55,t+.055);
  const g1=c.createGain();
  g1.gain.setValueAtTime(.0001,t);
  g1.gain.exponentialRampToValueAtTime(vol,t+.006);
  g1.gain.exponentialRampToValueAtTime(.0001,t+.17);
  o1.connect(g1); g1.connect(out); o1.start(t); o1.stop(t+.2);

  const o2=c.createOscillator(); o2.type="triangle";
  o2.frequency.setValueAtTime(f*1.05,t);
  o2.frequency.exponentialRampToValueAtTime(f*2.7,t+.045);
  const g2=c.createGain();
  g2.gain.setValueAtTime(.0001,t);
  g2.gain.exponentialRampToValueAtTime(vol*.3,t+.004);
  g2.gain.exponentialRampToValueAtTime(.0001,t+.075);
  o2.connect(g2); g2.connect(out); o2.start(t); o2.stop(t+.11);

  const s=c.createBufferSource(); s.buffer=Sn.noise;
  s.playbackRate.value=rnd(.9,1.15);
  const bp=c.createBiquadFilter(); bp.type="bandpass";
  bp.frequency.value=clamp(f*3.4,200,9000); bp.Q.value=1.1;
  const g3=c.createGain();
  g3.gain.setValueAtTime(vol*.42,t);
  g3.gain.exponentialRampToValueAtTime(.0001,t+.02);
  s.connect(bp); bp.connect(g3); g3.connect(out); s.start(t); s.stop(t+.05);

  Sn.budget--;
}catch(e){ Sn.dead=true; } }

/* fusion — an FM bell that rings out over the plate */
function chime(f,o){ try{
  o=o||{}; if(!audioOK()) return;
  const c=actx(); if(!c) return;
  const t=c.currentTime+(o.delay||0), vol=o.vol===undefined?.2:o.vol;
  const out=bus(c,o.pan,o.wet===undefined?.42:o.wet);

  const car=c.createOscillator(); car.type="sine"; car.frequency.setValueAtTime(f,t);
  const mod=c.createOscillator(); mod.type="sine"; mod.frequency.setValueAtTime(f*2.01,t);
  const mg=c.createGain();
  mg.gain.setValueAtTime(f*3.4,t);
  mg.gain.exponentialRampToValueAtTime(f*.12,t+.34);
  mod.connect(mg); mg.connect(car.frequency);
  const g=c.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+(o.len||.85));
  car.connect(g); g.connect(out);
  mod.start(t); car.start(t);
  mod.stop(t+(o.len||.85)+.05); car.stop(t+(o.len||.85)+.05);

  const s=c.createBufferSource(); s.buffer=Sn.noise;
  const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=clamp(f*4,300,11000); bp.Q.value=2;
  const g3=c.createGain();
  g3.gain.setValueAtTime(vol*.3,t);
  g3.gain.exponentialRampToValueAtTime(.0001,t+.03);
  s.connect(bp); bp.connect(g3); g3.connect(out); s.start(t); s.stop(t+.06);

  Sn.budget--;
}catch(e){ Sn.dead=true; } }

/* weight under the big events */
function thud(f,o){ try{
  o=o||{}; if(!audioOK()) return;
  const c=actx(); if(!c) return;
  const t=c.currentTime+(o.delay||0), vol=o.vol===undefined?.3:o.vol;
  const out=bus(c,o.pan,.05);
  const osc=c.createOscillator(); osc.type="sine";
  osc.frequency.setValueAtTime(f||64,t);
  osc.frequency.exponentialRampToValueAtTime((f||64)*.45,t+(o.len||.22));
  const g=c.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+.005);
  g.gain.exponentialRampToValueAtTime(.0001,t+(o.len||.22));
  osc.connect(g); g.connect(out); osc.start(t); osc.stop(t+(o.len||.22)+.03);
  Sn.budget--;
}catch(e){ Sn.dead=true; } }

/* filtered noise: splashes, bursts, mechanism */
function noiseHit(dur,o){ try{
  o=o||{}; if(!audioOK()) return;
  const c=actx(); if(!c) return;
  const t=c.currentTime+(o.delay||0), cut=o.cut===undefined?1800:o.cut;
  const out=bus(c,o.pan,o.wet===undefined?.10:o.wet);
  const s=c.createBufferSource(); s.buffer=Sn.noise;
  s.playbackRate.value=rnd(.85,1.2);
  const f=c.createBiquadFilter(); f.type=o.type||"lowpass"; f.Q.value=o.q===undefined?1:o.q;
  f.frequency.setValueAtTime(cut,t);
  f.frequency.exponentialRampToValueAtTime(Math.max(70,cut*(o.to===undefined?.15:o.to)),t+dur);
  const g=c.createGain();
  g.gain.setValueAtTime(o.vol===undefined?.12:o.vol,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t+dur+.02);
  Sn.budget--;
}catch(e){ Sn.dead=true; } }

/* the pump: a pneumatic chunk with a click on the front */
function pumpSound(pan){ try{
  if(!audioOK()) return;
  const c=actx(); if(!c) return;
  const t=c.currentTime;
  const out=bus(c,pan,.10);
  const s=c.createBufferSource(); s.buffer=Sn.noise;
  const f=c.createBiquadFilter(); f.type="lowpass"; f.Q.value=6;
  f.frequency.setValueAtTime(2400,t);
  f.frequency.exponentialRampToValueAtTime(190,t+.07);
  const g=c.createGain();
  g.gain.setValueAtTime(.16,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+.09);
  s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t+.12);
  const o1=c.createOscillator(); o1.type="sine";
  o1.frequency.setValueAtTime(150,t);
  o1.frequency.exponentialRampToValueAtTime(58,t+.09);
  const g1=c.createGain();
  g1.gain.setValueAtTime(.0001,t);
  g1.gain.exponentialRampToValueAtTime(.14,t+.004);
  g1.gain.exponentialRampToValueAtTime(.0001,t+.11);
  o1.connect(g1); g1.connect(out); o1.start(t); o1.stop(t+.14);
  Sn.budget--;
}catch(e){ Sn.dead=true; } }

/* a dry tick for the interface */
function tick(f,vol){ try{
  if(!audioOK()) return;
  const c=actx(); if(!c) return;
  const t=c.currentTime;
  const out=bus(c,0,.04);
  const o1=c.createOscillator(); o1.type="triangle";
  o1.frequency.setValueAtTime(f||620,t);
  o1.frequency.exponentialRampToValueAtTime((f||620)*1.5,t+.03);
  const g=c.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||.09,t+.003);
  g.gain.exponentialRampToValueAtTime(.0001,t+.06);
  o1.connect(g); g.connect(out); o1.start(t); o1.stop(t+.08);
  Sn.budget--;
}catch(e){ Sn.dead=true; } }

/* every voice lands on a pentatonic step, so a cascade plays a run */
let audioPrimed=false;
function unlockAudio(){
  const c=actx(); if(!c) return;
  if(c.state!=="running"){ try{ c.resume(); }catch(e){} }
  if(!audioPrimed){
    // iOS only really wakes up once a buffer has actually been played
    try{
      const b=c.createBuffer(1,1,22050);
      const src=c.createBufferSource();
      src.buffer=b; src.connect(Sn.master||c.destination); src.start(0);
      audioPrimed=true;
    }catch(e){}
  }
}

addEventListener("touchstart",unlockAudio,{passive:true,capture:true});
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) unlockAudio(); });
